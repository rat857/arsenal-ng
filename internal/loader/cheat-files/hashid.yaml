tool: hashid
tags: [security, pentest, cryptography, hashing, forensics, reconnaissance]

actions:
# === IDENTIFICATION ===
 - title: hashid - 识别单个哈希
   desc: |
     识别作为输入提供的特定哈希字符串所使用的算法。当你在数据库或捕获数据中遇到未知哈希时，这是该工具的主要功能。它有助于缩小接下来使用哪些破解工具或参数进行密码恢复的范围。
   command: "hashid {{hash_string}}"

 - title: hashid - 扩展识别（含加盐哈希）
   desc: |
     使用扩展模式列出所有可能的哈希算法，包括通常使用盐值的算法。当标准扫描未给出明确结果，或当你怀疑是 vBulletin 或 IPB 等 Web 应用哈希时非常有用。请注意，这会显著增加潜在匹配的数量，需要手动验证。
   command: "hashid -e {{hash_string}}"

# === INTEGRATION ===
 - title: hashid - 显示 Hashcat 模式
   desc: |
     识别哈希类型，并为每个结果显示对应的 Hashcat 模式编号。对于准备使用 Hashcat 进行暴力破解的安全专业人员非常有帮助。它省去了在 Hashcat 文档或帮助菜单中手动查找模式编号的工作。
   command: "hashid -m {{hash_string}}"

 - title: hashid - 显示 JohnTheRipper 格式
   desc: |
     识别哈希类型，并显示对应的 JohnTheRipper 格式字符串。当你打算使用 JohnTheRipper 进行密码恢复或安全审计时使用此命令。它确保你在破解过程中使用正确的格式参数，避免出错。
   command: "hashid -j {{hash_string}}"

 - title: hashid - 同时显示 Hashcat 和 John 格式
   desc: |
     识别哈希，同时显示 Hashcat 模式编号和 JohnTheRipper 格式名称。为环境中使用多个破解工具的用户提供全面概览。这是为利用和审计识别未知哈希的最详细方式。
   command: "hashid -m -j {{hash_string}}"

# === FILE OPERATIONS ===
 - title: hashid - 从文件识别哈希
   desc: |
     处理存储在文本文件中的哈希列表，而非在命令行手动提供。这是分析从目标系统或数据库提取的多个未知哈希的最有效方式。请确保文件每行包含一个哈希，以便工具准确识别。
   command: "hashid {{input_file|hashes.txt}}"

 - title: hashid - 将结果保存到文件
   desc: |
     执行哈希识别，并将详细结果直接保存到指定的输出文件。这对于文档目的或将工具集成到更大的自动化渗透测试工作流中非常有用。它可以防止终端输出丢失，并便于之后对结果进行 grep。
   command: "hashid -o {{output_file|results.txt}} {{hash_string}}"

 - title: hashid - 处理文件并输出工具格式
   desc: |
     从文件读取多个哈希，并将其对应的破解工具格式（Hashcat 和 John）输出到外部文件。此命令将文件输入、工具映射和文件输出结合起来，实现流线化的侦察工作流。在处理评估中的大型密码转储时强烈推荐。
   command: "hashid -m -j -o {{output_file|cracking_refs.txt}} {{input_file|hashes.txt}}"
