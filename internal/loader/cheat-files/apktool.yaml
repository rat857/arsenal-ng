tool: apktool
tags: [android, reverse-engineering, security, pentest, mobile, exploitation, decompiler]

actions:
  # === DECODING ACTIONS ===
  - title: apktool - 反编译 APK 文件
    desc: |
      该命令用于将 Android APK 文件反汇编为接近原始的形式，包括资源与 smali 代码。
      它是在重新构建之前进行静态分析或修改应用行为的主要步骤。
      工具会创建一个包含 AndroidManifest.xml、assets、resources 与 smali 文件夹的目录。
      注意这不会生成 Java 源代码，而是 smali（dex 的一种类汇编表示）。
    command: "apktool d {{apk_file}}"

  - title: apktool - 反编译到指定目录
    desc: |
      当你需要为反编译文件指定目标文件夹、而非使用默认目录名时使用此命令。
      这对于组织多个项目或防止工具使用从 APK 派生的默认文件夹名特别有用。
      如果目标目录已存在，可能需要添加 force 标志来覆盖它。
      它确保所有资源与源文件都解压到用户提供的路径。
    command: "apktool d {{apk_file}} -o {{output_directory}}"

  - title: apktool - 不反编译资源
    desc: |
      该选项阻止工具反编译资源（如布局、字符串与可绘制对象），使其保持编译后的 "resources.arsc" 格式。
      它比完整反编译快得多，适用于分析人员只关心检查 smali 代码或清单文件的场景。
      此方法有助于避免在重度混淆或非标准 APK 中出现的常见资源反汇编错误。
      如果你不打算修改 UI 元素或 XML 资源值，请使用此选项。
    command: "apktool d -r {{apk_file}}"

  - title: apktool - 不反编译源码
    desc: |
      该命令跳过将 "classes.dex" 文件反汇编为 smali 文件，仅聚焦于资源。
      当你的主要目标是提取资源、图片或分析应用的 UI 结构与 XML 配置时，它是理想选择。
      由于跳过源代码转换，处理速度更快，输出目录也更小。
      它常用于 UI/UX 研究或资源提取，这些场景不需要底层逻辑。
    command: "apktool d -s {{apk_file}}"

  - title: apktool - 反编译时强制删除目标目录
    desc: |
      在开始反编译前强制删除目标目录。
      这在自动化脚本或重复测试环境中很有用，否则已存在的输出文件夹会导致工具停止。
      使用此标志时请小心，因为它会永久删除目标文件夹中任何先前的修改。
      它确保为新的反汇编过程提供干净的状态。
    command: "apktool d -f {{apk_file}} -o {{output_directory}}"

  # === BUILDING ACTIONS ===
  - title: apktool - 从目录构建 APK
    desc: |
      在对反编译文件进行修改后，此命令将目录重新组装为 APK 文件。
      它处理 smali 代码并将资源重新编译为 Android 所需的二进制格式。
      除非指定输出路径，生成的 APK 通常放在项目目录内的 "dist" 文件夹中。
      请记住生成的 APK 未签名且未对齐；安装到设备前必须使用 jarsigner 或 apksigner 等工具签名。
    command: "apktool b {{project_folder}}"

  - title: apktool - 使用自定义输出名构建 APK
    desc: |
      此命令将项目目录构建为 APK，并允许你指定生成文件的确切名称与路径。
      它通过避免查看 "dist" 文件夹并手动重命名文件来简化工作流。
      这是创建应用“修改版”的标准做法。
      请确保项目文件夹包含有效的 "apktool.yml" 文件，该文件在初始反编译时生成。
    command: "apktool b {{project_folder}} -o {{output_apk|modified.apk}}"

  # === FRAMEWORK MANAGEMENT ===
  - title: apktool - 安装框架
    desc: |
      某些系统应用依赖设备制造商（如 Samsung、LG 或 Huawei）提供的特定框架文件。
      该命令将必要的 "framework-res.apk" 安装到本地 Apktool 仓库中，使依赖应用能被正确反编译与构建。
      未安装正确的厂商框架时，反编译系统应用常导致资源解析错误或 "Resource ID" 缺失异常。
      框架文件通常位于物理 Android 设备的 "/system/framework/" 目录中。
    command: "apktool if {{framework_apk}}"

  - title: apktool - 使用自定义路径安装框架
    desc: |
      将框架文件安装到特定目录，而非默认的全系统 Apktool 文件夹。
      这对于对默认文件夹无写权限、或希望为不同项目维护独立框架环境的用户很有用。
      之后反编译或构建时，必须使用 -p 标志提供相同路径，以确保 Apktool 找到已安装的框架。
      它为复杂的逆向工程环境提供了更好的隔离。
    command: "apktool if {{framework_apk}} -p {{custom_framework_path}}"

  # === ADVANCED OPTIONS ===
  - title: apktool - 反编译时使用自定义框架路径
    desc: |
      指示 Apktool 在反编译过程中到特定目录查找框架文件。
      它与之前通过 "if" 命令以自定义路径安装的框架配合使用。
      在需要隔离环境的多个 Android 版本或厂商特定应用上工作时至关重要。
      未能指向正确的框架路径将导致资源反汇编失败。
    command: "apktool d -p {{custom_framework_path}} {{apk_file}}"

  - title: apktool - 显示版本信息
    desc: |
      显示 Apktool 的当前版本及其内部组件（如 smali 与 baksmali）的版本。
      这对于排查兼容性问题很重要，因为不同版本的 Apktool 处理新 Android 特性的方式可能不同。
      报告错误或遵循网上的特定教程时，请务必检查版本。
      它有助于确保你的环境与目标 APK 的要求匹配。
    command: "apktool -version"
