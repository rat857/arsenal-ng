tool: naabu
tags: [network, scanner, security, pentest, enumeration, reconnaissance, port-scanning]

actions:
# === BASIC SCANNING ===

 - title: naabu - 单主机基础扫描
   desc: |
     对单个目标主机执行基础端口扫描。默认扫描前 100 个最常见端口。这是快速检查目标常见服务的最直接方式。
     非常适合快速的初步侦察阶段。
   command: "naabu -host {{target}}"

 - title: naabu - 从列表扫描多个主机
   desc: |
     从文件读取目标列表并对其全部执行端口扫描。输入文件每行应包含一个主机、IP 或 CIDR。
     这对大规模基础设施扫描项目非常高效。
   command: "naabu -list {{file|targets.txt}}"

 - title: naabu - 扫描特定端口或范围
   desc: |
     扫描用户定义的特定端口或端口范围。你可以提供以逗号分隔的单个端口，或用短横线定义范围。
     当你在寻找 Web 服务器（80、443）或数据库（3306、5432）等特定服务时很有用。
   command: "naabu -p {{ports|80,443,1000-2000}}"

 - title: naabu - 扫描常用端口
   desc: |
     按频率扫描最常见的端口。支持的值有 100、1000 或 full（全部 65535 个端口）。
     使用 full 耗时显著更长，但确保不遗漏任何隐藏服务。
   command: "naabu -top-ports {{count|1000}}"

# === DISCOVERY & TYPES ===

 - title: naabu - 被动端口扫描
   desc: |
     使用 Shodan InternetDB API 获取端口信息，而不是向目标发送数据包。这是完全隐蔽的方法，因为不与目标基础设施建立直接连接。
     速度极快，但根据 Shodan 上次抓取时间，信息可能略有滞后。
   command: "naabu -host {{target}} -passive"

 - title: naabu - 连接扫描（TCP）
   desc: |
     强制使用 TCP Connect 扫描而非默认的 SYN 扫描。Connect 扫描完成三次握手，通常更慢且在日志中更显眼。
     若你没有原始套接字权限（非 root 用户）或 SYN 扫描被防火墙丢弃，使用此模式。
   command: "naabu -host {{target}} -scan-type c"

 - title: naabu - 服务发现与版本识别
   desc: |
     尝试识别开放端口上运行的服务并确定其版本。这在快速端口扫描基础上增加一层指纹识别。
     有助于在发现开放端口后立即识别存在漏洞的软件版本。
   command: "naabu -host {{target}} -sV"

 - title: naabu - 跳过主机发现（Pn）
   desc: |
     将所有主机视为在线，跳过初始主机发现阶段。当目标受阻止 ICMP（ping）请求的防火墙保护时很有用。
     确保即使主机不响应 ping，工具也会尝试扫描端口。
   command: "naabu -host {{target}} -Pn"

# === OPTIMIZATION & PERFORMANCE ===

 - title: naabu - 限速扫描
   desc: |
     通过限制每秒发送的数据包数来控制扫描速度。设置较低的速率有助于避免网络拥塞并绕过一些基本的限速 IDS/IPS。
     默认为 1000，但可根据目标网络的稳定性调整。
   command: "naabu -host {{target}} -rate {{rate|500}}"

 - title: naabu - 排除 CDN 和 WAF 端口
   desc: |
     自动跳过对识别为属于 CDN 或 WAF 的主机的全端口扫描。启用后，对这些主机通常只扫描 80 和 443 端口以节省时间。
     这避免在 Cloudflare 或 Akamai 等基础设施上浪费资源，因为这些地方大多数端口是关闭或过滤的。
   command: "naabu -host {{target}} -exclude-cdn"

 - title: naabu - 扫描与 DNS 关联的所有 IP
   desc: |
     扫描与单个主机名关联的每个 IP 地址。许多大型网站使用多个 IP 地址进行负载均衡。
     这确保你检查集群中每个底层服务器的安全态势。
   command: "naabu -host {{target}} -scan-all-ips"

# === INTEGRATION & OUTPUT ===

 - title: naabu - 管道到 nmap 进行高级分析
   desc: |
     使用 naabu 进行快速端口发现，然后自动触发 nmap 进行详细版本识别和脚本扫描。这是两全其美的方法：Go 扫描的速度结合 Nmap 强大的 NSE 引擎。
     要求本地系统已安装 nmap。
   command: "naabu -host {{target}} -nmap-cli 'nmap -sV -sC -oN nmap_output.txt'"

 - title: naabu - 用于自动化的 JSON 输出
   desc: |
     以 JSON lines 格式保存扫描结果。适合将 naabu 集成到自动化流水线或自定义脚本中。
     输出文件的每一行都是一个包含主机、端口和协议信息的有效 JSON 对象。
   command: "naabu -host {{target}} -json -o {{output_file|results.json}}"

 - title: naabu - 排除特定主机或端口
   desc: |
     从当前扫描中排除某些主机或端口。用于避开敏感生产系统或已调查过的噪音端口。
     主机和端口都支持以逗号分隔的列表。
   command: "naabu -list {{file}} -exclude-hosts {{bad_ips}} -exclude-ports {{noisy_ports|80,443}}"