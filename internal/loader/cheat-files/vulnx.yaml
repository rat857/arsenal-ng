tool: vulnx
tags: [vulnerability-scanner, cve, reconnaissance, pentest, security, exploitation, enumeration]

actions:
# === CONFIGURATION AND DISCOVERY ===

 - title: vulnx - 认证 API
   desc: |
     配置你的 API key 以访问 ProjectDiscovery 漏洞数据库。强烈建议执行此步骤，以绕过匿名搜索相关的限速。
     你可以从 ProjectDiscovery Cloud 网站获取免费 API key。
   command: "vulnx auth"

 - title: vulnx - 列出可用过滤器
   desc: |
     显示工具中所有可搜索字段和过滤选项。这有助于用户理解复杂查询所允许的具体语法和数据类型。
     它提供 severity 或 CVSS 分数等字段的描述、示例和枚举值。
   command: "vulnx filters"

 - title: vulnx - 健康检查
   desc: |
     测试与漏洞数据库后端的连通性。此命令确保你的网络环境允许与 API 通信，且你的凭据有效。
     当搜索失败或返回意外错误时，用它进行故障排查。
   command: "vulnx healthcheck"

# === BASIC SEARCHING ===

 - title: vulnx - 简单关键字搜索
   desc: |
     执行与特定产品或技术相关的漏洞基础搜索。这是查找与 apache 或 nginx 等关键字关联的 CVE 的最快方式。
     输出提供相关漏洞的摘要，包括其 ID 和严重性级别。
   command: "vulnx search {{keyword|apache}}"

 - title: vulnx - 特定 CVE 查询
   desc: |
     使用 CVE 标识符检索单个漏洞的详细信息。此命令提供全面分解，包括技术描述、受影响产品和参考链接。
     这是分析特定已知漏洞的影响和要求的最佳方式。
   command: "vulnx id {{cve_id|CVE-2021-44228}}"

 - title: vulnx - 带结果限制的搜索
   desc: |
     搜索漏洞并限制返回结果的数量。搜索宽泛术语时使用，以防止终端被数据淹没。
     它有助于首先聚焦最相关或最新的条目。
   command: "vulnx search {{keyword|nginx}} --limit {{count|10}}"

# === ADVANCED FILTERING ===

 - title: vulnx - 按严重性和分数搜索
   desc: |
     查找匹配特定严重性级别或超过 CVSS 分数阈值的漏洞。这对于优先修复最危险的缺陷至关重要。
     你可以使用大于等比较运算符查找高于某一点的分数。
   command: "vulnx search \"severity:{{severity|critical}} && cvss_score:>{{score|8.0}}\""

 - title: vulnx - 按可利用特征过滤
   desc: |
     过滤已知在野利用或具有公开概念验证的漏洞。此命令专门针对已知被利用漏洞（KEV）列表或具有 Nuclei 模板的漏洞。
     它对于基于风险的漏洞管理和渗透测试至关重要。
   command: "vulnx search \"is_kev:{{kev_status|true}} && is_poc:{{poc_status|true}}\" --template"

 - title: vulnx - 按厂商和产品搜索
   desc: |
     将搜索结果缩小到特定软件厂商或产品名称。这有助于识别特定技术栈中的漏洞，如 Microsoft Windows 或 Oracle Database。
     你可以使用 --product 或 --vendor 参数在结果中实现高精度。
   command: "vulnx search --vendor {{vendor|microsoft}} --product {{product|windows}}"

 - title: vulnx - 基于时间的搜索
   desc: |
     搜索在特定时间范围内发布或按天数计算的漏洞。这对于识别最近发现的零日漏洞或特定年份的漏洞很有用。
     日期格式可以包括年份、月份或特定日期范围。
   command: "vulnx search \"cve_created_at:>={{year|2024}} && age_in_days:<{{days|30}}\""

# === ANALYSIS AND OUTPUT ===

 - title: vulnx - 聚合数据分析
   desc: |
     通过按特定字段聚合数据来分析漏洞模式。此命令帮助你了解给定搜索集中哪些厂商或严重性最普遍。
     它是生成高层安全态势报告的绝佳工具。
   command: "vulnx analyze --fields {{field|severity}}"

 - title: vulnx - 导出结果为 JSON
   desc: |
     将搜索结果保存为机器可读的 JSON 格式，供进一步处理或自动化。这允许与 DevSecOps 流水线中的其他工具集成或用于自定义脚本。
     --output 参数确保数据直接保存到磁盘上的文件。
   command: "vulnx search {{query|log4j}} --json --output {{filename|results.json}}"

 - title: vulnx - 详细多 ID 查询
   desc: |
     同时查询多个 CVE ID，并检索每个的详细信息。你可以提供逗号分隔的 ID 列表以获取组合报告。
     这比为发现列表多次运行 id 命令快得多。
   command: "vulnx id {{cve_list|CVE-2024-1234,CVE-2024-5678}} --detailed"

 - title: vulnx - 排序搜索结果
   desc: |
     搜索漏洞并根据 CVSS 分数或创建日期等特定字段对输出排序。排序有助于快速识别最高风险项或最近更新。
     使用 --sort-desc 按降序排列，可在顶部看到最高分。
   command: "vulnx search {{keyword|cms}} --sort-desc {{field|cvss_score}}"