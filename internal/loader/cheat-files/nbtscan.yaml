tool: nbtscan
tags: [network, pentest, enumeration, netbios, reconnaissance, scanner]

actions:
  # === ENUMERATION AND SCANNING ===
  - title: nbtscan - 基础网络扫描
    desc: |
      扫描指定 IP 地址范围的 NetBIOS 信息。它识别本地网络上响应主机的 NetBIOS 名称、IP 地址和 MAC 地址。
      这是侦察阶段识别基于 Windows 的机器及其关联工作组或域的标准方式。
    command: "nbtscan {{target_range}}"

  - title: nbtscan - 详细服务枚举
    desc: |
      执行详细扫描，列出从每台主机收到的所有 NetBIOS 名称。结合 -h 标志时，它会将十六进制服务代码翻译为 Workstation 或 File Server 等人类可读描述。
      这提供对目标机器上特定角色和服务的重要洞察。
    command: "nbtscan -v -h {{target}}"

  - title: nbtscan - 使用短横线表示法扫描范围
    desc: |
      扫描由起始和结束地址定义的特定 IP 地址范围。当你想针对网络的特定子集而不扫描整个子网时很有用。
      结果将包含该范围内每个响应主机的 NetBIOS 名称、用户和 MAC 地址。
    command: "nbtscan {{start_ip}}-{{end_ip}}"

  # === ADVANCED CONFIGURATION ===
  - title: nbtscan - Win95 兼容扫描
    desc: |
      强制扫描从本地 UDP 端口 137 发起，这是标准 NetBIOS 名称服务端口。扫描较旧的 Windows 95 机器时需要此选项，因为它们通常只响应来自此特定端口的查询。
      注意在类 Unix 系统上绑定端口 137 通常需要 root 或管理权限。
    command: "sudo nbtscan -r {{target_range}}"

  - title: nbtscan - 调整性能与重传
    desc: |
      修改每次查询的超时和重传次数。扫描高延迟网络或存在丢包的网段时，主机可能响应缓慢，提高这些值会有帮助。
      在快速可靠的局域网上降低超时可以显著加快扫描。
    command: "nbtscan -t {{timeout_ms|1000}} -m {{retransmits|2}} {{target_range}}"

  # === OUTPUT FORMATTING ===
  - title: nbtscan - 脚本友好输出
    desc: |
      使用特定字符作为字段分隔符格式化扫描结果，使输出易于解析。它会抑制横幅和列标题，非常适合将数据管道传给 grep、awk 或自定义自动化脚本。
      这允许将 NetBIOS 数据无缝集成到更大的安全报告流水线中。
    command: "nbtscan -s {{separator|:}} {{target_range}}"

  - title: nbtscan - 生成 hosts 文件格式
    desc: |
      以标准 /etc/hosts 文件格式输出发现的主机信息。这在渗透测试期间快速填充本地名称解析文件时很有用。
      它将发现的 IP 地址直接映射到其 NetBIOS 名称，便于导航。
    command: "nbtscan -e {{target_range}}"

  - title: nbtscan - 生成 lmhosts 格式
    desc: |
      以 LMHOSTS 格式生成输出，这是一种遗留的 Windows 名称解析格式。对仍依赖或与遗留 NetBIOS 名称解析机制交互的环境很有用。
      生成的列表可保存到文件，帮助 Windows 系统在没有 DNS 的情况下找到特定主机。
    command: "nbtscan -l {{target_range}}"

  # === INPUT MANAGEMENT ===
  - title: nbtscan - 从文件扫描目标
    desc: |
      从指定文本文件读取目标 IP 地址或网络范围列表。当你已通过其他工具识别出相关目标并想执行批量 NetBIOS 扫描时，此功能非常宝贵。
      文件每行应包含一个 IP 地址或 CIDR 范围。
    command: "nbtscan -f {{input_file}}"