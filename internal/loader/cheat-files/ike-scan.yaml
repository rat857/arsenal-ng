tool: ike-scan
tags: [network, scanner, security, pentest, enumeration, vpn, ipsec]

actions:
  # === HOST DISCOVERY & BASIC RECONNAISSANCE ===

  - title: ike-scan - 基础主模式发现扫描
    desc: |
      对单个 VPN 网关目标执行默认的主模式扫描。这是识别监听 UDP 500 端口的 IPsec/ISAKMP 服务的主要起点。该命令发送标准 IKE 第一阶段提议，并显示返回的厂商 ID 和握手参数。如果绑定到默认特权源端口 500，可能需要 root 权限。
    command: "ike-scan {{target}}"

  - title: ike-scan - 扫描目标网络范围并多行解码
    desc: |
      扫描整个 CIDR 子网范围，并启用格式化的多行载荷解码。多行模式将每个返回的 ISAKMP 载荷格式化到单独缩进的行上，便于浏览。它帮助渗透测试者系统性地记录内部或外部地址块中活跃的 VPN 网关。扫描非常宽的 CIDR 表示时要注意网络带宽消耗。
    command: "ike-scan -M {{network_cidr|192.168.1.0/24}}"

  - title: ike-scan - 从文件扫描目标列表
    desc: |
      从外部文本文件读取并扫描预定义的目标主机名或 IP 地址列表。这种方法非常适合批量评估和动态生成目标的自动化流水线。目标文件必须每行包含一个 IP 地址或主机名，且不带额外的分隔符。你也可以使用连字符代替文件名，直接从标准输入流式读取目标主机。
    command: "ike-scan --file={{targets_file|targets.txt}}"

  # === AGGRESSIVE MODE & PSK HARVESTING ===

  - title: ike-scan - 激进模式枚举
    desc: |
      使用 IKE 激进模式而非默认的主模式查询目标。激进模式将第一阶段协商压缩为更少的往返，并经常暴露网关标识载荷。这允许测试者评估远程端点是否允许潜在不安全的预共享密钥握手。你可以结合特定的 Diffie-Hellman 组来匹配遗留或现代的集中器配置。
    command: "ike-scan -A {{target}}"

  - title: ike-scan - 捕获激进模式 PSK 哈希以供破解
    desc: |
      发起激进模式握手，指定组 ID，将预共享密钥哈希转储到离线文件中。捕获的输出以配套的 psk-crack 工具或 Hashcat 模式 5400 可解析的格式化语法保存。这种技术在不访问内部网络的情况下将 PSK 材料暴露给字典攻击。请注意，企业 VPN 端点通常需要有效的组 ID（ID_USER_FQDN）才会返回认证数据。
    command: "ike-scan -A -P{{output_file|ike_psk.txt}} --id={{group_id|vpn}} {{target}}"

  - title: ike-scan - 使用自定义 DH 组和 ID 类型的激进模式
    desc: |
      使用特定的 Diffie-Hellman 组和标识类型编号发送激进模式探测。某些 VPN 集中器会拒绝标准提议，除非 DH 组和标识类型与其策略完全匹配。这允许深入枚举遗留设置（如组 1 或 2）与加固的现代部署（如组 14 或 19）。请参考 RFC 2407 第 4.6.2 节了解 FQDN、KEY_ID 或 USER_FQDN 等数值 ID 类型。
    command: "ike-scan -A --dhgroup={{dhgroup|2}} --id={{group_id|vpn}} --idtype={{idtype|3}} {{target}}"

  # === FINGERPRINTING & TRANSFORMS ===

  - title: ike-scan - 通过退避分析进行实现指纹识别
    desc: |
      使用数据包重传退避时序对底层操作系统和 IKE 软件栈进行指纹识别。该命令跟踪未确认数据包之间的精确毫秒延迟，并将其与已知厂商签名匹配。扫描器收集足够的退避样本时，等待时间通常可达 60 秒。请确保防火墙不会丢弃后续探测，以防止时序签名失真。
    command: "ike-scan --showbackoff={{wait_time|60}} {{target}}"

  - title: ike-scan - 使用自定义转换套件扫描
    desc: |
      使用转换语法注入特定的加密、哈希、认证和 Diffie-Hellman 参数。这允许对静默忽略默认转换包的遗留或加固端点进行有针对性的探测。简写格式遵循 enc[/len],hash,auth,group（例如 AES-256 搭配 SHA1、PSK 和 DH 组 5）。重复该参数可同时通告多个自定义提议。
    command: "ike-scan --trans={{transform|7/256,2,1,5}} {{target}}"

  - title: ike-scan - 基于属性的自定义转换规范
    desc: |
      提供细粒度的属性-值对，构造高度自定义的第一阶段提议载荷。属性键遵循 RFC 2409 规范，允许对模糊的密码组合进行细粒度测试。方括号必须仔细转义或加引号，以避免被本地 shell 环境提前解释。这可用于测试特定密码漏洞和异常的密钥长度协商缺陷。
    command: "ike-scan --trans=\"(1=7,14=128,2=1,3=1,4=2)\" {{target}}"

  # === PROTOCOL VARIATIONS & TRANSPORT ===

  - title: ike-scan - 实验性 IKEv2 协议扫描
    desc: |
      发送 IKEv2 格式的初始化数据包，而非遗留的 IKEv1 数据包。现代 VPN 网关越来越多地禁用 IKEv1，因此需要 IKEv2 探测进行检测和验证。扫描器解码返回的 IKEv2 响应载荷并显示协商的能力。此参数目前发送默认提议，不支持任意自定义转换。
    command: "ike-scan --ikev2 {{target}}"

  - title: ike-scan - 在 4500 端口进行 NAT 穿越扫描
    desc: |
      发送使用 RFC 3947 NAT 穿越非 ESP 标记封装、针对 4500 端口的探测。这会将默认的源和目标 UDP 端口都改为 4500，模拟位于 NAT 之后的端点。当边缘防火墙阻止直接的 UDP 500 端口流量但允许 NAT-T 穿透时特别有用。若在此参数之后放置 --sport 和 --dport，可进一步调整源和目标端口。
    command: "ike-scan --nat-t {{target}}"

  - title: ike-scan - 通过 TCP 封装扫描 IKE
    desc: |
      测试将 IKE 第一阶段交换封装在有状态 TCP 连接内的 VPN 网关。某些厂商在专有端口上支持 TCP 传输，以绕过限制性的客户防火墙。将传输选项设置为 1 测试原始 Checkpoint 的 TCP 上的 IKE，而模式 2 评估 Cisco TCP 封装。启用 TCP 传输模式时，一次只能评估单个目标主机。
    command: "ike-scan --tcp={{tcp_type|1}} --dport={{port|500}} {{target}}"

  # === NETWORK & TIMING TUNING ===

  - title: ike-scan - 带带宽和时序控制的节流隐蔽扫描
    desc: |
      通过约束出站带宽和每主机重试行为对目标执行限速扫描。限制带宽可防止网络拥塞，并有助于绕过简单的限流和基于阈值的 IDS 告警。初始超时、退避乘数和重试限制可以一起配置，以在丢包链路上获得最大可靠性。带宽可以以每秒比特、千比特（K）或兆比特（M）指定。
    command: "ike-scan -B {{bandwidth|64K}} --retry={{retries|2}} --timeout={{timeout_ms|800}} {{target}}"

  - title: ike-scan - 使用非特权源端口的大规模随机扫描
    desc: |
      打乱目标主机列表并绑定到临时高位源端口，以便无需特权执行。打乱目标顺序可缓解在被检查网络范围内的顺序端口扫描检测。使用非特权源端口可避免需要 root 权限，但某些严格的网关只响应源端口 500。通过 nodns 参数禁用 DNS 名称解析，可加快跨广泛网络范围的扫描速度。
    command: "ike-scan -R -N --sport={{source_port|0}} {{network_cidr|10.0.0.0/16}}"
