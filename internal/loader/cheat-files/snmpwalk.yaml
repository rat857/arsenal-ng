tool: snmpwalk
tags: [network, enumeration, security, pentest, monitoring, snmp]

actions:
# === BASIC ENUMERATION (SNMP v1/v2c) ===

 - title: snmpwalk - 基础 v2c 遍历
   desc: |
     使用 SNMP 版本 2c 从根 OID 开始执行递归 SNMP 查询。
     这是枚举设备系统信息、网络接口和运行进程的最常见方法。
     确保你拥有正确的团体字符串，因为 public 是最常见的默认值，但可能被限制或禁用。
   command: "snmpwalk -v 2c -c {{community|public}} {{target}}"

 - title: snmpwalk - 基础 v1 遍历
   desc: |
     使用版本 1 协议执行 SNMP 遍历。
     对于不支持较新 v2c 或 v3 功能的遗留设备使用此命令。
     虽然效率不如 v2c，但在侦察期间对较旧的工业或网络硬件通常能成功。
   command: "snmpwalk -v 1 -c {{community|public}} {{target}}"

 - title: snmpwalk - 数字 OID
   desc: |
     使用数字 OID 显示输出，而不是将它们转换为人类可读的名称。
     当本地系统缺少转换数据所需的 MIB 文件时很有用。
     它提供数据结构的原始视图，这对脚本编写或手动 OID 分析至关重要。
   command: "snmpwalk -v 2c -c {{community|public}} -n {{target}}"

# === SNMP VERSION 3 (AUTHENTICATED) ===

 - title: snmpwalk - v3 认证（无隐私）
   desc: |
     使用 authNoPriv 安全级别查询目标。
     此级别通过用户名和认证口令提供身份验证，但不加密数据。
     它通常用于需要用户问责但不承担完整加密 CPU 开销的环境。
   command: "snmpwalk -v 3 -l authNoPriv -u {{username}} -a {{auth_proto|SHA}} -A {{auth_passphrase}} {{target}}"

 - title: snmpwalk - v3 认证和隐私
   desc: |
     使用 SNMPv3 中可用的最高安全级别（authPriv）查询目标。
     通过同时使用认证和加密，确保 SNMP 流量免受欺骗和窃听。
     你必须指定认证协议（MD5/SHA）和隐私协议（DES/AES）及其各自的口令。
   command: "snmpwalk -v 3 -l authPriv -u {{username}} -a {{auth_proto|SHA}} -A {{auth_passphrase}} -x {{priv_proto|AES}} -X {{priv_passphrase}} {{target}}"

# === TARGETED QUERIES AND MIB HANDLING ===

 - title: snmpwalk - 遍历特定 OID
   desc: |
     从特定 OID 分支开始 SNMP 遍历，而不是整个树。
     当你只对特定类别的数据（如接口统计或进程列表）感兴趣时，这非常高效。
     它减少了完成遍历所需的时间，并最小化发往目标代理的不必要网络流量。
   command: "snmpwalk -v 2c -c {{community|public}} {{target}} {{oid}}"

 - title: snmpwalk - 加载所有 MIB
   desc: |
     在遍历期间强制工具加载系统目录中所有可用的 MIB 文件。
     这确保输出包含尽可能多的对象的人类可读标签。
     当标准输出包含太多难以手动解释的数字字符串时使用。
   command: "snmpwalk -v 2c -c {{community|public}} -m ALL {{target}}"

 - title: snmpwalk - 枚举系统信息
   desc: |
     专门针对系统 MIB 组（OID 1.3.6.1.2.1.1）以收集基本主机详情。
     结果输出通常包括设备描述、系统运行时间、管理员联系人和主机名。
     这是通过 SNMP 对未知网络设备进行指纹识别的标准第一步。
   command: "snmpwalk -v 2c -c {{community|public}} {{target}} 1.3.6.1.2.1.1"

# === OUTPUT FORMATTING ===

 - title: snmpwalk - 快速打印格式
   desc: |
     通过从显示中移除不必要的信息来格式化输出，以便于解析。
     使用 -Oq 标志剥离 OID 类型和其他元数据，留下更干净的 OID = value 格式。
     当你打算将输出管道传给 grep、awk 或 sed 等其他命令行工具时，这特别有帮助。
   command: "snmpwalk -v 2c -c {{community|public}} -Oq {{target}}"

 - title: snmpwalk - 十六进制字符串输出
   desc: |
     强制所有字符串值以十六进制格式显示。
     当代理返回不可打印字符或被误解为标准 ASCII 的数据时很有用。
     它常用于调试自定义 MIB 或检查嵌入在 SNMP 字符串中的二进制数据。
   command: "snmpwalk -v 2c -c {{community|public}} -Ox {{target}}"