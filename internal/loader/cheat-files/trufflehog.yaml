tool: trufflehog
tags: [security, secrets-scanning, pentest, reconnaissance, credentials, git, devops, cloud]

actions:
# === REPOSITORY SCANNING ===

  - title: trufflehog - 基础 Git 扫描
    desc: |
      扫描本地或远程 Git 仓库的提交历史中的密钥。这是识别意外提交的凭据（如 API key 或密码）最常见的用例。
      该工具分析每一次提交，确保版本控制系统中不残留任何敏感数据。
    command: "trufflehog git {{repo_url}}"

  - title: trufflehog - GitHub 组织扫描
    desc: |
      扫描属于特定 GitHub 组织的所有仓库。此命令需要有效的 GitHub Personal Access Token 来进行认证并列出仓库。
      这是安全团队对整个公司代码库执行批量审计的必备命令。
    command: "trufflehog github --token={{github_token}} --org={{org_name}}"

  - title: trufflehog - GitLab 仓库扫描
    desc: |
      使用 GitLab 访问令牌在 GitLab 仓库中搜索密钥。这对于审计内部 GitLab 实例或非 GitHub 托管的私有项目很有用。
      确保提供的令牌具有读取仓库及其历史所需的权限。
    command: "trufflehog gitlab --token={{gitlab_token}} --repo={{repo_url}}"

# === CLOUD AND INFRASTRUCTURE ===

  - title: trufflehog - 文件系统扫描
    desc: |
      扫描本地目录或特定文件，查找 Git 上下文之外的潜在密钥。这非常适合检查本机或服务器上的配置文件、脚本或备份。
      它有助于识别不使用版本控制的环境或已忽略文件中的硬编码密钥。
    command: "trufflehog filesystem {{path|./}}"

  - title: trufflehog - S3 存储桶扫描
    desc: |
      扫描 Amazon S3 存储桶，查找公开可访问或配置错误且包含凭据的文件。此操作对于云安全评估至关重要，可防止开放存储导致的数据泄露。
      工具会遍历存储桶对象，并将其与各种密钥检测器匹配。
    command: "trufflehog s3 --bucket {{bucket_name}}"

  - title: trufflehog - Docker 镜像扫描
    desc: |
      扫描 Docker 镜像，查找隐藏在其文件系统层中的密钥。这是 DevSecOps 中的关键步骤，可确保构建过程中凭据未被烘焙进容器镜像。
      它可以识别容器内环境变量或配置文件中残留的敏感信息。
    command: "trufflehog docker --image {{image_name|ubuntu:latest}}"

# === ADVANCED FILTERING AND OUTPUT ===

  - title: trufflehog - JSON 输出用于自动化
    desc: |
      以结构化 JSON 格式生成扫描结果，供自动化处理。强烈建议将此格式用于将 TruffleHog 集成到自定义安全流水线或 SOC 仪表盘。
      它提供发现结果的详细元数据，包括检测器类型和具体文件位置。
    command: "trufflehog git {{repo_url}} --json"

  - title: trufflehog - 不验证扫描
    desc: |
      执行扫描而不根据相应服务 API 验证已发现的凭据。在隔离环境扫描或想避免进行外部网络调用时使用此参数。
      请注意这可能会增加误报数量，因为密钥的有效性未得到确认。
    command: "trufflehog git {{repo_url}} --no-verification"

  - title: trufflehog - CI/CD 中命中即失败
    desc: |
      强制工具在扫描期间发现任何密钥时以非零状态码退出。这专门用于 CI/CD 流水线，自动拦截包含泄露密钥的拉取请求或构建。
      它作为硬性关卡，防止敏感信息进入主分支或生产环境。
    command: "trufflehog git {{repo_url}} --fail"

  - title: trufflehog - 按特定检测器过滤
    desc: |
      通过仅包含特定检测器，将扫描限制在特定类型的密钥。这有助于将扫描聚焦于 AWS 密钥或 SSH 私钥等高优先级目标，减少扫描时间和噪声。
      你可以提供逗号分隔的检测器 ID 或名称列表来细化搜索参数。
    command: "trufflehog git {{repo_url}} --include-detectors={{detectors|aws,ssh,github}}"

  - title: trufflehog - 从标准输入扫描
    desc: |
      将数据直接管道传入 TruffleHog，实时扫描密钥。这对于扫描其他命令的输出或检查文本片段而无需保存到文件很有用。
      它是将密钥检测集成到各种命令行工作流的灵活方式。
    command: "cat {{file_name}} | trufflehog stdin"