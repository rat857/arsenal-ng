tool: fping
tags: [network, scanner, discovery, icmp, security, pentest, enumeration]

actions:
# === BASIC CONNECTIVITY ===
 - title: fping - ping 单个目标
   desc: |
     向单个指定的目标主机或 IP 地址发送基本的 ICMP 回显请求。
     这是验证特定主机是否可达的基本用法，可快速提供目标是否存活的状态更新，注意 ICMP 流量可能被本地或网络防火墙过滤。
   command: "fping {{target}}"

 - title: fping - ping 多个目标
   desc: |
     通过将多个目标列为命令行参数来同时 ping 它们。
     可用于检查一组已知服务器或工作站的状态，与标准 ping 不同，fping 不会等待一个目标超时后再 ping 下一个。
   command: "fping {{target_1}} {{target_2}} {{target_3}}"

 - title: fping - 仅显示存活主机
   desc: |
     过滤输出，仅显示响应 ICMP 回显请求的主机。
     在扫描大型网络以快速识别活动系统时尤为有用，可抑制通常扰乱终端输出的不可达消息，当你需要一份活跃 IP 地址的干净列表以供进一步处理时使用。
   command: "fping -a {{target_network}}"

 - title: fping - 仅显示不可达主机
   desc: |
     过滤输出，仅显示未响应 ping 的主机。
     此命令有助于识别网络范围内的缺口或检测宕机的系统，是存活标志的反向操作，有助于聚焦排查无响应的节点。
   command: "fping -u {{target_network}}"

# === NETWORK ENUMERATION ===
 - title: fping - 使用 CIDR 扫描网络范围
   desc: |
     根据指定的 CIDR 网络表示法生成并 ping 目标列表。
     这是扫描整个子网（如 /24 或 /23）以查找活动主机的有效方式，-g 标志允许工具自动计算 IP 地址范围。
   command: "fping -g {{network_cidr|192.168.1.0/24}}"

 - title: fping - 按起止地址扫描 IP 范围
   desc: |
     通过提供起止值来 ping 特定的 IP 地址范围。
     当只想扫描更大网络的特定子集时非常有用，使用 generate 标志填充两个边界之间的中间 IP 地址，当目标范围与标准子网掩码不一致时通常比 CIDR 更受欢迎。
   command: "fping -g {{start_ip}} {{end_ip}}"

 - title: fping - 反向 DNS 查询
   desc: |
     对每个目标 IP 地址执行反向 DNS 查询并显示主机名。
     为发现的 IP 地址提供背景，便于识别特定服务器，-n 标志用于解析目标列表中提供的 IP 地址名称，此命令的速度在很大程度上取决于所配置 DNS 服务器的响应情况。
   command: "fping -n {{target_network}}"

# === FILE AND INPUT HANDLING ===
 - title: fping - 从文件读取目标
   desc: |
     从指定的文本文件读取目标 IP 地址或主机名列表。
     这是扫描其他工具生成的特定资产列表的标准方法，输入文件中每个目标应单独占一行，使用文件输入比通过命令行传递数百个参数更整洁。
   command: "fping -f {{input_file|targets.txt}}"

 - title: fping - 从标准输入读取目标
   desc: |
     使用管道运算符直接从标准输入（stdin）接受目标列表。
     允许你将 grep 或 awk 等其他工具的输出直接管道传递给 fping，传给 -f 标志的连字符（-）告诉 fping 从流中查找输入。
   command: "cat {{input_file}} | fping -f -"

# === PERFORMANCE AND ANALYSIS ===
 - title: fping - 带统计的计数模式
   desc: |
     向每个目标发送特定数量的 ping 并提供结果摘要。
     -c 标志决定每台主机发送多少个数据包，-s 提供最终统计，非常适合测量一段时间内的丢包率和平均延迟。
   command: "fping -c {{count|4}} -s {{target}}"

 - title: fping - 持续循环模式
   desc: |
     无限期地 ping 指定目标，直到用户手动停止进程。
     对长期监控主机可用性或测试间歇性问题非常有用，输出会持续更新每个返回数据包的延迟。
   command: "fping -l {{target}}"

 - title: fping - 自定义 ping 间隔
   desc: |
     调整发送数据包之间的时机以控制扫描的速度和强度。
     -i 标志设置 ping 不同目标之间的间隔，-p 设置同一目标的间隔，减小这些值会大幅加快扫描，但会增加被封禁或造成拥塞的风险。
   command: "fping -i {{interval_ms|10}} -p {{period_ms|500}} {{target_network}}"

 - title: fping - 强制 IPv4 或 IPv6
   desc: |
     将工具限制为仅使用特定版本的互联网协议。
     扫描双栈主机时，使用 -4 强制 IPv4 连接或 -6 强制 IPv6 连接，有助于排查可能特定于协议的连接问题。
   command: "fping -{{version|4}} {{target}}"
