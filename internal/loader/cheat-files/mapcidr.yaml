tool: mapcidr
tags: [network, enumeration, ip-manipulation, cidr, recon, pentest, infrastructure]

actions:
# === EXPANSION AND AGGREGATION ===
 - title: mapcidr - 将 CIDR 展开为 IP 列表
   desc: |
     将给定的 CIDR 范围或包含多个范围的文件展开为完整的单个 IP 地址列表。这是为 nmap 或 httpx 等其他安全工具生成目标列表的最常见用例。
     它有效地将网络表示转换为逐行格式，便于管道输入其他工具。
   command: "mapcidr -cidr {{cidr_range|192.168.1.0/24}}"

 - title: mapcidr - 将 IP 聚合为 CIDR
   desc: |
     将单个 IP 地址列表或稀疏子网聚合为最小可能的 CIDR 块集合。这对简化防火墙规则或识别目标的整体网络足迹非常有用。
     它接收碎片化的 IP 列表，并找到高效涵盖它们的数学边界。
   command: "mapcidr -cidr {{ip_list_file|ips.txt}} -aggregate"

 - title: mapcidr - 近似聚合
   desc: |
     将稀疏 IP 地址聚合为近似的最小子网，即使范围并非完全填满。当你想基于发现的少量 IP 获得目标基础设施的更广泛网络视图时使用。
     注意这可能包含不在原始输入列表中的 IP 地址以填补子网空隙。
   command: "mapcidr -cidr {{ip_list_file|ips.txt}} -aggregate-approx"

# === NETWORK SLICING ===
 - title: mapcidr - 按主机数切分 CIDR
   desc: |
     根据每块的最大主机数将大型 CIDR 块划分为多个较小子网。适合在多个 VPS 实例或不同时间窗口之间并行化扫描任务。
     它确保每个结果块都可管理，并符合预期操作的规模。
   command: "mapcidr -cidr {{cidr_range|10.0.0.0/16}} -sbh {{host_count|256}}"

 - title: mapcidr - 切分为固定数量的子网
   desc: |
     将大型 CIDR 范围切分为特定数量的等大小子网。当你有固定数量的工作线程或扫描器并希望均匀分配 IP 空间时使用。
     工具会自动计算合适的位掩码以满足请求的切片数量。
   command: "mapcidr -cidr {{cidr_range|172.16.0.0/12}} -sbc {{slice_count|10}}"

# === FILTERING AND FORMATTING ===
 - title: mapcidr - 过滤特殊 IP
   desc: |
     展开 CIDR 范围时自动跳过网络基地址（.0）和广播地址（.255）。这避免向通常不承载标准服务的地址发送不必要的数据包。
     这是生成特定网段内可用主机 IP 列表的干净方式。
   command: "mapcidr -cidr {{cidr_range|192.168.50.0/24}} -skip-base -skip-broadcast"

 - title: mapcidr - 使用排除列表过滤 IP
   desc: |
     根据提供的排除列表或文件，从输入中过滤掉特定 IP 或 CIDR 范围。在测试中确保不扫描范围外资产或医疗设备等敏感基础设施至关重要。
     工具会将输入与过滤列表匹配，并在输出前移除任何重叠地址。
   command: "mapcidr -cidr {{input_list|targets.txt}} -filter-ip {{exclude_list|out_of_scope.txt}}"

 - title: mapcidr - 转换 IP 格式以绕过
   desc: |
     将标准点分 IP 地址转换为十进制、十六进制或八进制（0-11）等各种替代格式。这是测试 SSRF 漏洞或绕过配置不当的 WAF 过滤器的强大技术。
     尝试不同的数字表示形式往往可以规避简单的字符串匹配安全规则。
   command: "mapcidr -cidr {{ip_address|127.0.0.1}} -ip-format {{format_index|1}}"

# === UTILITIES AND RECON ===
 - title: mapcidr - 统计范围内的 IP 数量
   desc: |
     快速统计指定 CIDR 或范围内包含的 IP 地址总数。这是被动的侦察步骤，帮助在不与目标交互的情况下估计评估规模。
     它比展开列表并对结果运行 wc -l 快得多。
   command: "mapcidr -cidr {{cidr_range|10.0.0.0/8}} -count"

 - title: mapcidr - 打乱 IP 顺序以隐蔽
   desc: |
     将输出列表中的 IP 地址顺序随机化。打乱顺序是避免触发基于阈值的入侵检测系统（IDS）的关键安全最佳实践。
     不按顺序扫描 IP 可降低被识别为全网扫描的可能性。
   command: "mapcidr -cidr {{input_file|ips.txt}} -shuffle-ip"

 - title: mapcidr - 排序 IP 列表
   desc: |
     将输入的 IP 或 CIDR 按升序排序，形成干净有序的列表。这对报告或需要去重并比较不同发现结果集时很有帮助。
     标准化输出使跟踪整个定义网络范围的进度更加容易。
   command: "mapcidr -cidr {{input_file|unsorted_ips.txt}} -sort"