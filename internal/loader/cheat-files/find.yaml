tool: find
tags: [linux, file-system, enumeration, forensics, utility, security, pentest]

actions:
# === BASIC SEARCH ===
 - title: find - 按名称搜索文件
   desc: |
     在目录树中定位匹配特定文件名模式的文件。
     这是识别特定配置或源文件存储位置的最常见用例，从根目录搜索可能需要提权才能访问所有文件夹，搜索默认递归遍历所有子目录。
   command: "find {{search_path|/}} -name \"{{filename}}\""

 - title: find - 不区分大小写搜索
   desc: |
     使用 iname 标志搜索文件而不考虑其大小写。
     当你不确定文件使用驼峰、小写还是大写命名约定时尤为有用，有助于避免因类 Unix 环境中严格的字符匹配而错过目标。
   command: "find {{search_path|/}} -iname \"{{filename}}\""

 - title: find - 按类型过滤
   desc: |
     使用 type 标志将搜索结果限制为文件或目录。
     在系统枚举期间，使用 f 表示普通文件或 d 表示目录以缩小结果范围，可减少只寻找可执行二进制文件或特定配置目录时的杂乱。
   command: "find {{search_path|.}} -type {{type|f}} -name \"{{pattern|*.txt}}\""

# === SIZE AND TIME ===
 - title: find - 按文件大小搜索
   desc: |
     查找大于或小于特定大小阈值的文件。
     可用于识别占用磁盘空间的大型日志文件或异常小的配置文件，k、M 和 G 后缀分别表示千字节、兆字节和吉字节，前缀 + 查找大于该值的文件，- 查找小于该值的文件。
   command: "find {{search_path|.}} -size {{size|+100M}}"

 - title: find - 按修改时间搜索
   desc: |
     定位在特定天数内被修改的文件。
     这是取证分析或入侵后查找最近更新系统文件的基本技术，使用减号（如 -7）搜索少于指定天数前修改的文件。
   command: "find {{search_path|.}} -mtime {{days|-7}}"

# === PERMISSIONS AND OWNERSHIP ===
 - title: find - 按权限搜索
   desc: |
     查找具有特定数字或符号权限集的文件。
     在安全审计中常用于识别全局可写文件或设置了 SUID 位的文件，识别配置不当的权限是权限提升的关键步骤。
   command: "find {{search_path|/}} -perm {{permissions|0777}}"

 - title: find - 查找 SUID 文件
   desc: |
     定位启用了设置用户 ID（SUID）位的文件。
     这些文件以文件属主而非执行用户的权限运行，是权限提升的主要目标，权限 4000 专门针对 SUID 位，请始终对照已知二进制文件验证这些文件以检测潜在后门。
   command: "find {{search_path|/}} -perm -4000 -type f"

 - title: find - 按属主查找文件
   desc: |
     搜索由特定用户或组拥有的文件。
     有助于审计敏感数据访问或识别特定服务账户遗留的文件，可与其他标志结合查找由某用户拥有且同时具有危险权限的文件。
   command: "find {{search_path|/}} -user {{username|root}}"

# === EXECUTION AND CLEANUP ===
 - title: find - 对结果执行命令
   desc: |
     对每个匹配搜索条件的文件执行特定的 shell 操作。
     花括号 {} 是当前正在处理文件的占位符，执行 rm 或 chmod 等破坏性命令时请格外谨慎，命令必须以分号（转义为 \\;）或加号结尾以进行批量执行。
   command: "find {{search_path|.}} -name \"{{pattern|*.log}}\" -exec {{action|ls -l}} {} \\;"

 - title: find - 查找空文件或目录
   desc: |
     搜索不含数据或子项的文件或目录。
     有助于系统清理或识别创建了空占位符的失败进程，是审计目录结构中未使用资源的快速方式，可与 -delete 标志结合自动删除空结果。
   command: "find {{search_path|.}} -type {{type|f}} -empty"

 - title: find - 限制搜索深度
   desc: |
     将搜索限制在最大目录深度。
     防止工具深入复杂的文件系统或网络挂载，深度 1 只搜索当前目录，搜索大型卷时强烈建议使用以节省时间和系统资源。
   command: "find {{search_path|.}} -maxdepth {{depth|2}} -name \"{{pattern|*.conf}}\""
