tool: smbmap
tags: [network, security, pentest, enumeration, exploitation, authentication, smb]

# === BASIC ENUMERATION & AUTHENTICATION ===

actions:
 - title: smbmap - 空会话枚举
   desc: |
     在未提供任何凭据的情况下尝试枚举 SMB 共享。
     这是内部渗透测试中识别允许来宾访问的错误配置服务器的常见第一步。
     该工具会返回共享列表以及与空会话关联的权限（READ/WRITE）。
   command: "smbmap -H {{target}}"

 - title: smbmap - 认证枚举
   desc: |
     使用有效的域或本地凭据执行共享枚举。
     此命令提供该特定用户在目标主机上可访问内容的清晰视图。
     它对于在获得初始用户凭据后映射攻击面至关重要。
   command: "smbmap -u {{username}} -p {{password}} -d {{domain|WORKGROUP}} -H {{target}}"

 - title: smbmap - Pass-the-Hash 认证
   desc: |
     使用 NTLM 哈希而不是明文密码进行认证。
     哈希应以 LMHASH:NTHASH 格式提供。
     这在仅从内存或 SAM 数据库收集到哈希的横向移动场景中极为有用。
   command: "smbmap -u {{username}} -p {{hash}} -H {{target}}"

 - title: smbmap - 检查管理员权限
   desc: |
     专门检查提供的凭据是否在目标系统上具有管理员权限。
     此标志通过返回关于管理员状态的简单布尔式结果来简化流程。
     了解用户是否为管理员是远程命令执行和敏感文件访问的前提。
   command: "smbmap -u {{username}} -p {{password}} -H {{target}} --admin"

# === DIRECTORY & FILE DISCOVERY ===

 - title: smbmap - 递归目录列表
   desc: |
     递归列出目标主机共享中的所有文件和目录。
     此操作有助于识别深藏在文件夹结构中的敏感文件，如配置文件、备份或脚本。
     请注意，在非常大的文件共享上这可能产生大量网络流量。
   command: "smbmap -u {{username}} -p {{password}} -H {{target}} -r"

 - title: smbmap - 特定共享的递归列表
   desc: |
     将递归搜索聚焦在用户提供的特定共享名称上。
     当你已经识别出感兴趣的目标（例如 Backups 或 Finance）时，这比扫描所有共享更高效。
     它减少噪声并显著加快发现过程。
   command: "smbmap -u {{username}} -p {{password}} -H {{target}} -r {{share|C$}}"

 - title: smbmap - 限定深度的枚举
   desc: |
     仅遍历目录树到指定的深度级别。
     这对于获得文件夹结构的广泛概览而不会陷入数千个子目录很有用。
     默认深度为 1，只显示共享的根目录。
   command: "smbmap -u {{username}} -p {{password}} -H {{target}} -r --depth {{depth|3}}"

# === FILE OPERATIONS ===

 - title: smbmap - 下载远程文件
   desc: |
     将特定文件从目标 SMB 共享下载到本地机器。
     远程路径必须包含共享名称（例如 C$\Windows\win.ini）。
     确认访问权限后，这是外带敏感数据的主要方法。
   command: "smbmap -u {{username}} -p {{password}} -H {{target}} --download '{{remote_path}}'"

 - title: smbmap - 上传本地文件
   desc: |
     将本地文件上传到远程 SMB 共享上的特定目标位置。
     这需要用户对目标共享具有 WRITE 权限。
     常用于向受控主机传输工具、脚本或横向移动载荷。
   command: "smbmap -u {{username}} -p {{password}} -H {{target}} --upload '{{local_path}}' '{{remote_path}}'"

 - title: smbmap - 删除远程文件
   desc: |
     从远程系统删除指定文件。
     此操作具有破坏性，可能影响系统稳定性或证据，应极其谨慎使用。
     可以添加 --skip 标志以跳过确认提示，从而加快操作速度。
   command: "smbmap -u {{username}} -p {{password}} -H {{target}} --delete '{{remote_path}}'"

# === ADVANCED SEARCH & RECON ===

 - title: smbmap - 按模式自动下载文件
   desc: |
     搜索匹配特定正则表达式的文件，并在找到匹配时自动下载。
     这对于在整个主机上搜寻 password 文件、config 文件或 private keys 非常有效。
     它结合了递归列表（-r）与自动化外带逻辑。
   command: "smbmap -u {{username}} -p {{password}} -H {{target}} -r -A '{{pattern|(?i)pass|secret}}'"

 - title: smbmap - 搜索文件内容
   desc: |
     在目标上文件的内容中搜索特定字符串模式。
     此功能通常需要管理员权限，并在目标主机上使用 PowerShell。
     它对于在文档中查找凭据或 PII（个人身份信息）极其强大。
   command: "smbmap -u {{username}} -p {{password}} -H {{target}} -F '{{pattern|[Pp]assword}}' --search-path '{{share_path|C$}}'"

 - title: smbmap - 检查 SMB 签名和操作系统版本
   desc: |
     检测 SMB 签名是必需的、已启用还是已禁用，并识别操作系统版本。
     检查 SMB 签名是判断是否可能进行 NTLM 中继攻击的关键步骤。
     操作系统版本信息有助于选择合适的漏洞利用或后渗透技术。
   command: "smbmap -H {{target}} --signing -v"

# === REMOTE COMMAND EXECUTION ===

 - title: smbmap - 执行远程命令（WMI）
   desc: |
     默认通过 WMI 在远程主机上执行操作系统命令。
     这需要管理员权限，常用于运行 ipconfig、net user 或触发反向 shell。
     命令执行是通过 SMB 利用的最后阶段之一。
   command: "smbmap -u {{username}} -p {{password}} -H {{target}} -x '{{command|whoami}}'"

 - title: smbmap - 执行远程命令（PsExec）
   desc: |
     使用 PsExec 方法在远程主机上执行命令。
     你可以根据目标安全策略的允许情况在 WMI 和 PsExec 模式之间切换。
     与 WMI 相比，PsExec 模式可能噪声更大并在目标系统上留下更多痕迹。
   command: "smbmap -u {{username}} -p {{password}} -H {{target}} -x '{{command}}' --mode psexec"