tool: scp
tags: [file-transfer, network, security, ssh, linux, sysadmin, pentest, authentication]

actions:
# === BASIC FILE TRANSFERS ===
 - title: scp - 复制本地文件到远程
   desc: |
     通过加密的 SSH 连接安全地将文件从本地机器传输到远程服务器。
     这是通过加密 SSH 连接移动文件的最常见方式。
     你必须在远程主机的目标目录上拥有写入权限。
   command: "scp {{local_file}} {{user}}@{{remote_host}}:{{remote_path}}"

 - title: scp - 下载远程文件到本地
   desc: |
     将特定文件从远程服务器拉取到本地文件系统。
     它需要有效凭据或 SSH 密钥来对远程主机进行认证。
     提供远程机器上的完整路径以确保获取正确的文件。
   command: "scp {{user}}@{{remote_host}}:{{remote_path}} {{local_destination|.}}"

 - title: scp - 递归复制目录
   desc: |
     将整个目录及其所有子内容传输到远程位置。
     目录结构必须使用 -r 标志，否则命令会失败。
     大型目录要谨慎，因为这会消耗大量带宽。
   command: "scp -r {{local_directory}} {{user}}@{{remote_host}}:{{remote_path}}"

# === AUTHENTICATION AND CONNECTION ===
 - title: scp - 使用自定义端口传输
   desc: |
     连接到监听非标准 SSH 端口的远程服务器。
     当服务器将 SSH 隐藏在另一个端口以缓解自动化暴力破解攻击时，经常使用此方式。
     请注意，-P 标志必须大写，以区别于 ssh 中使用的小写 -p。
   command: "scp -P {{port|2222}} {{local_file}} {{user}}@{{remote_host}}:{{remote_path}}"

 - title: scp - 使用身份文件认证
   desc: |
     使用特定的 SSH 私钥文件进行认证，而不是标准密码。
     这对于自动化脚本或连接到禁用密码认证的服务器至关重要。
     确保私钥文件具有安全权限（chmod 600）。
   command: "scp -i {{identity_file|~/.ssh/id_rsa}} {{local_file}} {{user}}@{{remote_host}}:{{remote_path}}"

 - title: scp - 通过跳板主机传输
   desc: |
     将文件传输到只能通过中间跳板服务器访问的目标服务器。
     -J 标志自动通过堡垒主机建立安全隧道。
     这在内部服务器不直接暴露的企业环境中很常见。
   command: "scp -J {{jump_user}}@{{jump_host}} {{local_file}} {{user}}@{{remote_host}}:{{remote_path}}"

# === ADVANCED OPERATIONS ===
 - title: scp - 在两个远程主机之间复制
   desc: |
     通过你的本地机器路由流量，在两个不同的远程服务器之间传输文件。
     使用 -3 标志启用此「三方」传输行为。
     当两个远程服务器无法直接相互通信时很有用。
   command: "scp -3 {{user1}}@{{host1}}:{{path1}} {{user2}}@{{host2}}:{{path2}}"

 - title: scp - 保留文件属性
   desc: |
     确保保留原始文件的修改时间、访问时间和权限模式。
     没有此标志，目标文件将被赋予传输时间的时间戳。
     这对于在备份或系统迁移期间保持完整性至关重要。
   command: "scp -p {{local_file}} {{user}}@{{remote_host}}:{{remote_path}}"

 - title: scp - 限制传输带宽
   desc: |
     将 scp 命令使用的带宽限制在指定上限（以 Kbit/s 为单位）。
     用它来防止大型文件传输占满网络影响其他用户。
     设置合理的默认值有助于在大型数据迁移期间保持网络稳定。
   command: "scp -l {{limit_kbits|1000}} {{local_file}} {{user}}@{{remote_host}}:{{remote_path}}"

 - title: scp - 传输期间压缩数据
   desc: |
     为文件传输过程启用 GZIP 压缩，以加速慢速链路上的数据移动。
     -C 标志对基于文本的文件或未压缩的数据格式最有效。
     请注意，对于已压缩的文件（如 .zip 或 .jpg），这实际上可能增加 CPU 使用率。
   command: "scp -C {{local_file}} {{user}}@{{remote_host}}:{{remote_path}}"

 - title: scp - 使用特定加密算法
   desc: |
     强制数据传输会话使用特定的加密算法。
     可用于在具有特定加速的硬件上提高性能，或遵守安全策略。
     使用 ssh -Q cipher 检查你系统上支持的算法。
   command: "scp -c {{cipher|aes128-ctr}} {{local_file}} {{user}}@{{remote_host}}:{{remote_path}}"