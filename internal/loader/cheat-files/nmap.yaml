tool: nmap
tags: [network, scanner, reconnaissance, security, pentest, enumeration, discovery]

actions:
# === HOST DISCOVERY ===
 - title: nmap - Ping 扫描
   desc: |
     识别网络范围内哪些主机存活，而不扫描任何端口。这是梳理网络的最快方法，通常是侦察的第一步。
     它发送 ICMP echo 请求和 TCP ACK 数据包来确定主机可用性，同时最大限度减少网络流量。
   command: "nmap -sn {{target_range|192.168.1.0/24}}"

 - title: nmap - 列表扫描
   desc: |
     简单列出指定网络的每个主机，不向目标发送任何数据包。用于在开始重量级扫描前验证你有正确的 IP 地址或主机名。
     它执行 DNS 解析以提供主机名，有助于根据命名约定识别有趣的目标。
   command: "nmap -sL {{target_range}}"

# === SCANNING TECHNIQUES ===
 - title: nmap - SYN 半开扫描
   desc: |
     执行半开 TCP 连接扫描，这是最流行且高效的扫描技术。它发送 SYN 数据包并等待响应；若收到 SYN/ACK，端口就是开放的，但连接永远不会完成。
     此方法需要 root/管理员权限，但不太可能被简单的应用层过滤器记录。
   command: "nmap -sS {{target}}"

 - title: nmap - UDP 扫描
   desc: |
     扫描目标机器上的开放 UDP 端口。UDP 扫描通常比 TCP 慢得多，因为它常依赖等待超时或接收 ICMP 不可达消息。
     DNS（53）、SNMP（161）和 DHCP（67/68）等常见 UDP 服务经常被忽视，使这在完整审计中成为关键一步。
   command: "nmap -sU {{target}}"

 - title: nmap - 特定端口扫描
   desc: |
     将扫描限制在用户定义的特定端口集或端口范围。默认情况下，Nmap 扫描前 1,000 个最常见端口；使用此标志可以扫描全部 65,535 个端口或针对自定义服务。
     同时扫描两种协议时，用 T: 表示 TCP 端口，U: 表示 UDP 端口。
   command: "nmap -p {{ports|1-65535}} {{target}}"

# === ENUMERATION & DETECTION ===
 - title: nmap - 服务与版本检测
   desc: |
     探测开放端口以确定运行的软件及其具体版本号。这对漏洞研究至关重要，因为它让测试人员能为识别出的版本查找特定 exploit。
     强度级别可在 0 到 9 之间调整，以平衡速度与准确性。
   command: "nmap -sV --version-intensity {{level|5}} {{target}}"

 - title: nmap - 操作系统检测
   desc: |
     通过分析 TCP/IP 协议栈指纹尝试识别目标的操作系统。它检查对窗口大小、TCP 选项和序列号等各种探测的响应。
     了解 OS 有助于缩小潜在攻击面并确定使用哪些后利用工具。
   command: "nmap -O {{target}}"

 - title: nmap - 激进扫描
   desc: |
     一种综合扫描模式，启用 OS 检测（-O）、版本检测（-sV）、脚本扫描（-sC）和路由追踪。它在单个命令中提供大量信息，是 CTF 和内部测试的最爱。
     警告：此扫描非常吵闹，容易被入侵检测系统（IDS）发现。
   command: "nmap -A {{target}}"

# === NMAP SCRIPTING ENGINE (NSE) ===
 - title: nmap - 默认脚本扫描
   desc: |
     对检测到的服务运行一组归类为 default 的安全、非侵入式脚本。它可以揭示 SSH 主机密钥、HTTP header 或匿名 FTP 访问等常见信息。
     通常与版本检测结合使用，以更深入了解目标服务。
   command: "nmap -sC {{target}}"

 - title: nmap - 漏洞扫描
   desc: |
     执行 vuln 类别中的脚本，检查目标上的已知漏洞。这些脚本查找 Heartbleed、SMB 漏洞（EternalBlue）和弱配置等特定缺陷。
     在生产环境中始终谨慎使用，因为某些脚本可能导致服务不稳定。
   command: "nmap --script=vuln {{target}}"

 - title: nmap - 暴力破解脚本
   desc: |
     使用 NSE 脚本尝试猜测 FTP、SSH 或 MySQL 等服务的凭据。它使用内置或自定义字典来识别弱密码和默认账户。
     使用此命令要小心，因为它可能触发目标系统上的账户锁定或安全告警。
   command: "nmap --script=brute {{target}}"

# === EVASION & TIMING ===
 - title: nmap - 时序模板
   desc: |
     使用从 T0（Paranoid）到 T5（Insane）的模板控制扫描速度和激进程度。T3 是默认值，T4 推荐用于相当快且可靠的网络。
     使用 T0 或 T1 可以通过显著增加数据包之间的延迟来帮助规避 IDS 检测。
   command: "nmap -T{{level|4}} {{target}}"

 - title: nmap - 分片与诱饵
   desc: |
     使用数据包分片（-f）和诱饵（-D）绕过防火墙并隐藏扫描器的真实 IP。诱饵从多个伪造的 IP 地址发送数据包，使管理员难以识别真实来源。
     这是绕过简单数据包过滤和有状态检测防火墙的经典技术。
   command: "nmap -f -D {{decoy1,decoy2,ME}} {{target}}"

# === OUTPUT & MAINTENANCE ===
 - title: nmap - 保存所有格式
   desc: |
     将扫描结果导出为三种主要格式：normal（.nmap）、XML（.xml）和 grepable（.gnmap）。XML 格式特别重要，因为它可以导入 Metasploit、Zenmap 或自定义解析器等工具。
     使用 -oA 确保你拥有易于日后搜索和分析的永久扫描记录。
   command: "nmap -oA {{filename|output_results}} {{target}}"

 - title: ndiff - 比较扫描结果
   desc: |
     用于比较两个 Nmap XML 输出文件并高亮差异的工具。它显示端口状态的变化、发现的新服务或两次扫描之间消失的主机。
     这对基线监控和识别环境随时间的变化至关重要。
   command: "ndiff {{yesterday.xml}} {{today.xml}}"

# === SUPPLEMENTARY TOOLS (NCAT & NPING) ===
 - title: ncat - 启动监听器
   desc: |
     在指定端口上启动 TCP 监听器，可用于文件传输或接收反向 shell。--keep-open 标志允许监听器顺序接受多个连接而不终止。
     Ncat 是原始 Netcat（nc）的现代、功能丰富的替代品。
   command: "ncat -lvp {{port|4444}} --keep-open"

 - title: nping - 自定义 TCP 探测
   desc: |
     一个强大的数据包生成工具，允许用户构造自定义 TCP、UDP、ICMP 和 ARP 数据包。在此示例中，它发送一个带自定义 TTL 的 TCP SYN 数据包到特定端口以测试网络路径。
     用于排查网络连通性或测试防火墙如何处理特定标志组合。
   command: "nping --tcp -p {{port|80}} --flags syn --ttl {{ttl|2}} {{target}}"