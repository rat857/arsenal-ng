tool: brew
tags: [macos, linux, package-manager, software, installation, maintenance, development]

actions:
# === SEARCH AND DISCOVERY ===
 - title: brew - 搜索软件包
   desc: |
     该命令允许你在 Homebrew 仓库中搜索可用的 formula（CLI 工具）与 cask（GUI 应用）。
     它接受纯文本或正则表达式来过滤结果。
     当你不确定想安装的软件包确切名称时使用。
   command: "brew search {{query|wget}}"

 - title: brew - 显示软件包信息
   desc: |
     使用此命令检索特定 formula 或 cask 的详细元数据。
     它提供当前版本、依赖、冲突与官方项目 URL 等信息。
     这对于在决定安装前验证工具的要求很有帮助。
   command: "brew info {{formula_or_cask|nmap}}"

# === INSTALLATION AND REMOVAL ===
 - title: brew - 安装软件包
   desc: |
     这是通过 Homebrew 安装新软件的主要命令。
     它下载源代码或预编译的 "bottle"，自动处理依赖，并将二进制文件链接到你的路径。
     注意某些安装可能需要在安装后脚本中使用 sudo 权限，尽管 Homebrew 本身以标准用户运行。
   command: "brew install {{formula_or_cask|git}}"

 - title: brew - 卸载软件包
   desc: |
     该命令从系统中移除已安装的 formula 或 cask。
     它删除安装过程中创建的二进制文件与关联符号链接。
     使用它来清理不再需要的工具并释放 Homebrew cellar 中的空间。
   command: "brew uninstall {{formula_or_cask|wget}}"

 - title: brew - 列出已安装软件包
   desc: |
     该命令显示本地系统上当前安装的所有 formula 与 cask 列表。
     它对于审计环境或检查特定工具是否已存在很有用。
     不带参数运行会列出所有内容，你也可以提供名称来检查特定软件包。
   command: "brew list"

# === MAINTENANCE AND UPDATES ===
 - title: brew - 更新 Homebrew
   desc: |
     运行此命令会更新 Homebrew 本身以及本地的可用 formula 列表。
     它不会更新你已安装的软件，但确保你拥有来自 GitHub 仓库的最新定义。
     建议在安装新工具或执行升级之前运行此命令。
   command: "brew update"

 - title: brew - 升级已安装软件包
   desc: |
     该命令将所有已安装的 formula 与 cask 更新到最新可用版本。
     如果提供特定软件包名称，则仅升级该工具。
     这是保持命令行环境与应用安全且最新的标准方式。
   command: "brew upgrade {{formula_or_cask}}"

 - title: brew - 检查过时软件包
   desc: |
     该命令识别哪些已安装软件包在仓库中有更新版本。
     它提供可升级内容的简明列表，而不会实际执行升级过程。
     使用它快速检查系统软件的健康状态。
   command: "brew outdated"

 - title: brew - 清理旧版本
   desc: |
     Homebrew 常保留旧版本软件包与临时下载文件，这会占用大量磁盘空间。
     该命令删除所有 formula 与 cask 的过时锁文件与陈旧下载。
     这是一种不影响当前软件安装即可回收存储空间的安全方式。
   command: "brew cleanup"

# === TROUBLESHOOTING ===
 - title: brew - 检查系统健康状况
   desc: |
     doctor 命令对系统执行诊断检查，以发现常见配置问题。
     它识别损坏的符号链接、未链接的 keg 以及路径中冲突的软件等问题。
     如果你在安装或更新过程中遇到错误，这应是你的首个排障步骤。
   command: "brew doctor"

 - title: brew - 显示配置
   desc: |
     该命令输出 Homebrew 安装的当前配置。
     它包括环境变量、cellar 与 prefix 的路径，以及关于操作系统的详细信息。
     在调试问题或向 Homebrew 维护者报告错误时，这些信息非常有价值。
   command: "brew config"
