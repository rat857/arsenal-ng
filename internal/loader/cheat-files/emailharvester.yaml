tool: emailharvester
tags: [osint, reconnaissance, email, enumeration, pentest, gathering]

actions:
  # === RECONNAISSANCE & DISCOVERY ===
  - title: emailharvester - 列出插件
    desc: |
      列出工具当前支持的所有搜索引擎插件。
      此命令可让用户查看哪些平台（如 Google、Bing、LinkedIn 等）可用于收集，建议在扫描前运行以确保所需插件已激活并就绪。
    command: "emailharvester -p"

  - title: emailharvester - 使用指定引擎搜索域名
    desc: |
      使用单个定向引擎搜索与特定域名关联的电子邮件地址。
      当你想将侦察集中在特定来源以避免检测或速率限制时非常理想，会返回该特定插件逻辑发现的电子邮件列表。
    command: "emailharvester -d {{domain}} -e {{engine|google}}"

  - title: emailharvester - 使用所有引擎搜索域名
    desc: |
      对指定域名在所有可用的搜索引擎插件中执行全面搜索。
      这是初始 OSINT 阶段最大程度收集数据的最常见方法，注意同时查询所有引擎可能增加你的 IP 被某些提供商临时标记的可能性。
    command: "emailharvester -d {{domain}} -e all"

  - title: emailharvester - 带结果数量限制搜索
    desc: |
      在搜索电子邮件的同时限制引擎返回的结果数量。
      对快速抽查或在时间受限、无需完整抓取的情况下非常有用，限制结果也有助于保持在自动化机器人检测系统的监控范围之外。
    command: "emailharvester -d {{domain}} -e all -l {{limit|50}}"

  # === OUTPUT MANAGEMENT ===
  - title: emailharvester - 搜索并保存输出
    desc: |
      执行搜索并将发现自动保存为 TXT 和 XML 两种文件格式。
      对报告生成以及在专业任务期间维护发现记录至关重要，工具会使用提供的文件名前缀在当前目录创建文件。
    command: "emailharvester -d {{domain}} -e all -s {{output_name|harvested_results}}"

  - title: emailharvester - 静默搜索
    desc: |
      运行收集过程而不将发现的电子邮件打印到终端。
      当工具作为自动化管道或脚本的一部分、你只关心保存的输出文件时尤为有用，可在工具后台工作时保持终端干净。
    command: "emailharvester -d {{domain}} -e all --noprint -s {{output_name|silent_results}}"

  # === ADVANCED CONFIGURATION ===
  - title: emailharvester - 使用代理搜索
    desc: |
      将所有搜索请求经由指定的代理服务器转发。
      这是隐藏研究人员来源 IP、绕过基于 IP 的封禁或区域限制的关键安全措施，确保代理服务器可达并支持连接所需协议（如 HTTP/SOCKS）。
    command: "emailharvester -d {{domain}} -e all -x {{proxy_url|http://127.0.0.1:8080}}"

  - title: emailharvester - 使用自定义 User-Agent 搜索
    desc: |
      为收集过程中发出的 HTTP 请求定义自定义 User-Agent 字符串。
      使用真实的浏览器 User-Agent 有助于混入合法流量并绕过简单的反抓取过滤，这是提高基于 Web 的 OSINT 工具成功率的常见做法。
    command: "emailharvester -d {{domain}} -e all -u \"{{user_agent|Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36}}\""

  - title: emailharvester - 排除特定插件
    desc: |
      使用除指定排除插件列表之外的所有引擎执行搜索。
      当已知某些插件损坏、缓慢或对特定目标产生过多误报时非常有用，多个引擎应以逗号分隔且不含空格。
    command: "emailharvester -d {{domain}} -e all -r {{excluded_engines|google,twitter}}"
