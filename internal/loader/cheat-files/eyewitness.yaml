tool: eyewitness
tags: [web, reconnaissance, enumeration, scanner, pentest, osint, security, automation]

actions:
  # === BASIC USAGE ===
  - title: eyewitness - 从文件扫描 URL
    desc: |
      对逐行分隔的文本文件中提供的多个 URL 进行截图。
      这是渗透测试初始发现阶段可视化攻击面时使用该工具的最常见方式，headless 标志用于在后台运行而不打开可见的浏览器窗口。
    command: "eyewitness -f {{url_file}} -d {{output_dir|screens}} --headless"

  - title: eyewitness - 扫描单个 URL
    desc: |
      捕获单个特定目标 URL 的截图、服务器响应头和基本信息。
      当你只想快速记录特定 Web 应用的状态而不处理完整列表时使用，可快速验证站点是否活跃及其可能运行的技术栈。
    command: "eyewitness --single {{url}} -d {{output_dir|single_scan}}"

  # === INTEGRATION & INPUTS ===
  - title: eyewitness - 从 Nmap XML 扫描
    desc: |
      解析 Nmap XML 输出文件以识别并截取端口扫描期间发现的 Web 服务。
      网络扫描与 Web 侦察之间的这种衔接可自动瞄准发现的 HTTP/HTTPS 服务，从而节省时间，对可能存在隐藏 Web 界面的大型内部网络范围非常有效。
    command: "eyewitness -x {{nmap_xml_file}} -d {{output_dir|nmap_results}} --web"

  - title: eyewitness - 从 Nessus 文件扫描
    desc: |
      导入并处理 .nessus 扫描文件，以对识别出的 Web 应用进行截图。
      这让安全专业人员可以直观地对 Nessus 报告的漏洞进行分类，并优先进行手动验证，工具会直接从 Nessus XML 结构中提取主机和端口信息。
    command: "eyewitness -x {{nessus_file}} -d {{output_dir|nessus_results}} --web"

  # === PERFORMANCE & TIMING ===
  - title: eyewitness - 高性能扫描
    desc: |
      增加并发线程数并调整超时，以更快处理大型 URL 列表。
      增加线程可显著加快扫描，但可能导致本地机器或目标网络不稳定，调整超时在处理响应缓慢的应用或高延迟网络连接时很有用。
    command: "eyewitness -f {{url_file}} --threads {{thread_count|10}} --timeout {{timeout_seconds|15}} -d {{output_dir|fast_scan}}"

  - title: eyewitness - 带抖动的隐蔽扫描
    desc: |
      在请求之间添加随机延迟（抖动），以模仿人类行为并避免检测。
      在红队演练中，避免自动化检测系统和 WAF 告警是优先事项时必不可少，抖动标志会为延迟增加随机秒数，使流量模式更不可预测。
    command: "eyewitness -f {{url_file}} --jitter {{jitter_seconds|5}} --delay {{delay_seconds|2}} -d {{output_dir|stealth_scan}}"

  # === ADVANCED CONFIGURATION ===
  - title: eyewitness - 通过代理扫描
    desc: |
      将所有 Web 请求经由 Burp Suite、Zap 或 SOCKS5 代理等指定代理服务器转发。
      当目标只能通过特定网关访问，或你想捕获流量以供进一步分析时必不可少，可根据代理配置将类型指定为 socks5 或 http。
    command: "eyewitness -f {{url_file}} --proxy-ip {{proxy_host|127.0.0.1}} --proxy-port {{proxy_port|8080}} --proxy-type {{proxy_type|socks5}} -d {{output_dir|proxy_scan}}"

  - title: eyewitness - 自定义 User-Agent 和 Cookie
    desc: |
      为请求使用自定义 User-Agent 字符串和会话 Cookie。
      提供自定义 User-Agent 可帮助绕过屏蔽默认自动化请求头或模拟特定浏览器版本的过滤，添加 Cookie 让 EyeWitness 能对需要认证或特定会话状态的页面进行截图。
    command: "eyewitness -f {{url_file}} --user-agent \"{{user_agent|Mozilla/5.0}}\" --cookies \"{{cookie_string|sessionid=12345}}\" -d {{output_dir|authenticated_scan}}"

  - title: eyewitness - 扫描自定义 Web 端口
    desc: |
      指示 EyeWitness 将特定的非标准端口视为 HTTP 或 HTTPS 服务。
      默认情况下工具只查找 80、443、8080 等常见端口，此选项可确保你不会错过运行在 8443 或 9000 等不寻常端口上的管理界面或开发环境。
    command: "eyewitness -f {{url_file}} --add-http-ports {{http_ports|8001,8002}} --add-https-ports {{https_ports|9443}} -d {{output_dir|custom_ports}}"

  # === MAINTENANCE & RESUME ===
  - title: eyewitness - 恢复中断的扫描
    desc: |
      使用初始运行期间生成的本地数据库文件恢复之前中断或崩溃的扫描。
      EyeWitness 会自动创建数据库（通常为 ew.db）来跟踪进度，从而避免从零重新启动大型扫描，只需将工具指向现有 .db 文件的路径即可从中断处继续。
    command: "eyewitness --resume {{db_file|ew.db}}"

  - title: eyewitness - 自动添加协议前缀
    desc: |
      自动为原始域名或 IP 地址列表添加 http:// 和 https:// 前缀。
      无需手动格式化从其他工具导出且未指定协议的目标列表，确保 EyeWitness 尝试连接目标的安全和不安全两种版本以找到活跃的 Web 服务。
    command: "eyewitness -f {{domain_file}} --prepend-https -d {{output_dir|prepended_scan}}"
