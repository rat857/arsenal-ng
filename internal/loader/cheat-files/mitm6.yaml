tool: mitm6
tags: [network, pentest, security, exploitation, mitm, ipv6, active-directory, dns]

actions:
  # === BASIC EXPLOITATION ===
  - title: mitm6 - 基础网络接管
    desc: |
      在指定接口上发起基础 IPv6 DNS 接管攻击。此命令开始监听 DHCPv6 请求并回复它们，使攻击者的机器成为受害者的主 DNS 服务器。
      这是 IPv6 已启用但未配置的内部网络渗透测试最常见的起点。确保以 root 或 sudo 权限运行以管理网络接口。
    command: "mitm6 -i {{interface|eth0}}"

  - title: mitm6 - 针对特定域
    desc: |
      过滤攻击，只响应来自特定域的 DHCPv6 和 DNS 请求。在企业环境中强烈推荐，以避免影响访客网络或无关机器。
      使用 -d 标志可减少工具产生的噪音，并将利用工作聚焦于目标 AD 域，防止对评估范围外系统产生意外影响。
    command: "mitm6 -i {{interface|eth0}} -d {{domain_name}}"

  # === ADVANCED RELAYING & AUTHENTICATION ===
  - title: mitm6 - 设置中继目标以捕获凭据
    desc: |
      配置一个中继目标主机名以触发认证尝试。通常与 ntlmrelayx 结合使用以捕获或中继 NTLM/Kerberos 凭据。
      工具会把这个伪造主机名作为 DNS 服务器提供，迫使受害者在尝试连接时进行认证。这是在无现有凭据的情况下提升权限的最有效方式之一。
    command: "mitm6 -i {{interface|eth0}} -d {{domain_name}} -r {{relay_target_hostname}}"

  - title: mitm6 - 使用本地域搜索后缀攻击
    desc: |
      设置一个自定义本地域名作为受害者的 DNS 搜索域。可用于通过追加搜索后缀劫持短名称解析（如 wpad 或 fileserver）。
      默认情况下 mitm6 使用它遇到的第一个 DNS 域，但手动设置可提高可靠性。当你想确保受害者在受控命名空间内查找资源时特别有用。
    command: "mitm6 -i {{interface|eth0}} -l {{local_domain|corp.local}}"

  # === STEALTH AND FILTERING ===
  - title: mitm6 - 隐蔽模式（不发送路由器通告）
    desc: |
      在攻击期间禁用路由器通告（RA）的发送。一些网络安全方案或恶意 RA 防护在看到线路上的未授权 RA 时可能触发告警。
      此模式仅依靠 DHCPv6 响应来分配 DNS 设置，这对 Windows 目标通常已足够。当你需要保持较低姿态同时仍执行 DNS 劫持时使用。
    command: "mitm6 -i {{interface|eth0}} -a"

  - title: mitm6 - 白名单指定主机
    desc: |
      通过允许列表将攻击限制为仅针对特定主机名。当你被分配特定目标并希望确保不影响其他生产机器时至关重要。
      -hw 标志接受 FQDN，并会忽略列表中不存在的主机发出的任何 DHCPv6 查询。它提供对网络子集进行测试的安全方式。
    command: "mitm6 -i {{interface|eth0}} -hw {{target_hostname}}"

  - title: mitm6 - 黑名单敏感主机
    desc: |
      阻止工具响应来自特定敏感主机的请求。最适合用于保护域控或关键服务器不被 DNS 更改意外中断。
      -hb 标志确保指定机器继续使用其合法 DNS 设置。开始大规模 mitm6 攻击前务必核实关键基础设施主机名。
    command: "mitm6 -i {{interface|eth0}} -hb {{sensitive_hostname}}"

  - title: mitm6 - 忽略非 FQDN 查询
    desc: |
      配置工具忽略不含完全限定域名（FQDN）的 DHCPv6 查询。此过滤器有助于减少处理开销，并忽略未加入域的设备发出的嘈杂或不相关流量。
      它确保工具聚焦于可能提供有用凭据的专业工作站和服务器。这是长时间会话常见的清理选项。
    command: "mitm6 -i {{interface|eth0}} --ignore-nofqdn"

  # === DEBUGGING ===
  - title: mitm6 - 详细调试输出
    desc: |
      以最大详细程度和调试信息运行工具。当你怀疑攻击未按预期工作或客户端没有收到 IPv6 地址时使用。
      它会显示详细的数据包信息和工具做出的内部逻辑决策。注意在繁忙网络中这会生成大量终端输出。
    command: "mitm6 -i {{interface|eth0}} -v --debug"