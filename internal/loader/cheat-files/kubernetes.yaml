tool: kubernetes
tags: [orchestration, cloud, containers, security, devops, administration, pentest]

actions:
  # === CONFIGURATION AND CONTEXT ===
  - title: kubectl - 列出所有上下文
    desc: |
      获取 kubeconfig 文件中定义的所有上下文列表。这对于识别本机上当前配置了哪些集群、用户和命名空间可访问至关重要。
      它让操作者能看到生产、staging 或开发等可用环境。
    command: "kubectl config get-contexts"

  - title: kubectl - 显示当前上下文
    desc: |
      显示 kubectl CLI 当前使用的上下文名称。这有助于避免误对错误的集群运行命令，这是运维错误的常见来源。
      在执行破坏性操作或部署前务必验证当前上下文。
    command: "kubectl config current-context"

  - title: kubectl - 切换活动上下文
    desc: |
      将 kubeconfig 文件中的 current-context 设置为指定的上下文名。此命令有效切换你正在交互的活动环境。
      确保你对目标上下文有正确的凭据和网络连通性，以避免连接超时或认证错误。
    command: "kubectl config use-context {{context_name}}"

  - title: kubectl - 解释资源 Schema
    desc: |
      直接从 API 服务器显示各种 Kubernetes 资源及其字段的文档。这对于理解 YAML 清单结构或在终端内查找特定字段名非常有帮助。
      它充当资源 schema 和可用版本的内置手册。
    command: "kubectl explain {{resource|pod}}"

  # === ENUMERATION AND RECONNAISSANCE ===
  - title: kubectl - 获取所有节点
    desc: |
      列出集群中的所有节点及其状态、角色和版本。添加 -o wide 标志可提供内/外网 IP 地址和 OS 镜像等额外细节。
      这是理解集群底层物理或虚拟基础设施的基本步骤。
    command: "kubectl get nodes -o {{output|wide}}"

  - title: kubectl - 列出所有命名空间
    desc: |
      获取当前 Kubernetes 集群内所有可用的命名空间。命名空间用于在多个用户或项目之间划分集群资源。
      此命令通常是侦察的第一步，用于识别不同应用和服务所在的位置。
    command: "kubectl get namespaces"

  - title: kubectl - 获取命名空间内的 Pod
    desc: |
      列出特定命名空间内的所有 Pod，检查其状态、IP 地址和节点位置。使用 -o wide 标志查看更细的细节，如哪个节点托管哪个 Pod。
      这对于排查应用健康状态并验证 Pod 是否按预期运行至关重要。
    command: "kubectl get pods -n {{namespace|default}} -o {{output|wide}}"

  - title: kubectl - 获取所有命名空间的 Pod
    desc: |
      同时列出集群所有命名空间中的全部 Pod。这提供所有运行工作负载的整体视图，对集群范围审计或识别流氓进程非常有用。
      注意此命令需要较多权限，在大型集群中可能返回大量数据。
    command: "kubectl get pods --all-namespaces"

  - title: kubectl - 列出服务
    desc: |
      列出特定命名空间内的所有服务，显示其类型、cluster-IP 和 external-IP。服务是对内或对外暴露应用的主要方式。
      检查服务有助于识别内部负载均衡器和不同应用的网络入口。
    command: "kubectl get services -n {{namespace|default}}"

  - title: kubectl - 列出 Deployment
    desc: |
      显示给定命名空间内的所有 Deployment，展示副本的期望状态与当前状态。Deployment 管理 Pod 的生命周期并提供声明式更新。
      此命令有助于理解应用如何扩缩以及其预期的可用性配置。
    command: "kubectl get deployments -n {{namespace|default}}"

  # === DETAILED INSPECTION AND TROUBLESHOOTING ===
  - title: kubectl - 描述资源
    desc: |
      提供特定 Kubernetes 资源的详细信息，包括其配置、当前状态和最近事件。它是调试资源失败原因的最常用命令，会显示错误消息和拉取失败或重启等生命周期事件。
      当资源处于 Pending 或 CrashLoopBackOff 状态时使用。
    command: "kubectl describe {{resource_type|pod}}/{{resource_name}} -n {{namespace|default}}"

  - title: kubectl - 流式查看 Pod 日志
    desc: |
      获取并流式输出特定 Pod 的日志，实时监控应用输出和错误。-f（follow）标志在部署期间或复现 bug 时对观看实时日志至关重要。
      若 Pod 包含多个容器，必须使用 -c 标志指定容器名。
    command: "kubectl logs -f pods/{{pod_name}} -n {{namespace|default}}"

  - title: kubectl - 在 Pod 中执行命令
    desc: |
      允许直接在 Pod 内的特定容器中运行命令，提供交互式 shell。这是调试、探索内部文件系统或检查环境变量的强大工具。
      使用 -it 标志确保建立交互式终端会话。
    command: "kubectl exec -it {{pod_name}} -n {{namespace|default}} -- {{command|/bin/bash}}"

  # === CLUSTER MANAGEMENT AND MAINTENANCE ===
  - title: kubectl - 编辑资源
    desc: |
      在默认系统编辑器中打开特定资源的配置进行实时修改。保存后，Kubernetes 会自动尝试将更改应用到集群。
      这是在无需本地 YAML 文件的情况下快速更改副本数、镜像标签或环境变量的方法。
    command: "kubectl edit {{resource_type|deployment}}/{{resource_name}} -n {{namespace|default}}"

  - title: kubectl - 排空节点以进行维护
    desc: |
      通过安全驱逐节点上当前运行的所有 Pod，为节点维护做准备。此命令确保工作负载被重新调度到其他可用节点以保持应用可用性。
      在对物理节点执行 OS 升级或硬件维修前使用。
    command: "kubectl drain {{node_name}} --ignore-daemonsets"

  - title: kubectl - 封锁节点
    desc: |
      将节点标记为不可调度，阻止调度器将任何新 Pod 放置到该节点。节点上现有的 Pod 会继续运行而不受影响。
      当你希望在最终排空节点或执行诊断前阻止其增长时很有用。
    command: "kubectl cordon {{node_name}}"

  - title: kubectl - 解除封锁节点
    desc: |
      将之前封锁的节点重新标记为可调度。这允许 Kubernetes 调度器开始在该节点上放置新 Pod。
      维护完成后使用此命令，使节点重新全面投入集群服务。
    command: "kubectl uncordon {{node_name}}"

  - title: kubectl - 监控资源使用情况
    desc: |
      显示节点或 Pod 的 CPU 和内存使用情况，提供资源消耗的快速视图。此命令要求集群中已正确安装并运行 Metrics Server。
      它对于识别占用资源过多的 Pod 或接近容量上限的节点非常有效。
    command: "kubectl top {{type|pod}} -n {{namespace|default}}"