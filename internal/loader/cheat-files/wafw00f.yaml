tool: wafw00f
tags: [web, security, pentest, enumeration, reconnaissance, waf, firewall]

actions:
  # === RECONNAISSANCE & IDENTIFICATION ===
  - title: wafw00f - 基础 WAF 检测
    desc: |
      识别保护特定 URL 的 Web 应用防火墙（WAF）。此命令发送一系列探针来分析 HTTP 响应和请求头指纹。
      它是 Web 评估侦察阶段最常见的起点。
    command: "wafw00f {{url}}"

  - title: wafw00f - 列出支持的 WAF
    desc: |
      显示该工具当前能够检测的所有 WAF 产品。这有助于验证工具数据库中是否包含特定厂商的签名。
      在执行针对性测试前运行此命令，确保所需 WAF 受支持。
    command: "wafw00f -l"

  - title: wafw00f - 详细检测
    desc: |
      提高输出详细程度，查看检测过程的技术细节。这有助于理解哪些具体响应特征触发了 WAF 识别。
      你可以使用多个 v 参数（如 -vv 或 -vvv）获得更细粒度的请求和响应日志。
    command: "wafw00f {{url}} -v"

  - title: wafw00f - 穷尽搜索
    desc: |
      在识别到 WAF 后继续测试，查看是否存在多层防护。默认情况下 wafw00f 在第一次成功匹配后停止以节省时间。
      这在复杂企业环境中特别有用，因为基于 CDN 的 WAF 可能位于本地设备之前。
    command: "wafw00f {{url}} -a"

  - title: wafw00f - 测试特定 WAF
    desc: |
      直接针对特定 WAF 产品签名，查看它是否存在于目标服务器上。当你事先了解目标基础设施或怀疑特定技术时，这种方式很高效。
      它跳过通用自动发现序列，仅专注于指定签名。
    command: "wafw00f {{url}} -t {{waf_name|Cloudflare}}"

  # === BATCH OPERATIONS & OUTPUT ===
  - title: wafw00f - 从文件批量扫描
    desc: |
      从本地文件读取多个目标 URL 进行自动化批量处理。输入文件可以是文本、CSV 或 JSON 格式，便于与其他工具输出集成。
      这是扫描大型 IP 范围或大量子域名列表的首选方法。
    command: "wafw00f -i {{input_file|targets.txt}}"

  - title: wafw00f - 将结果保存到文件
    desc: |
      将检测结果写入结构化文件，供后续分析或报告。工具根据提供的文件扩展名确定输出格式（CSV、JSON 或 Text）。
      这对于维护审计轨迹并与安全团队分享发现至关重要。
    command: "wafw00f {{url}} -o {{output_file|results.json}}"

  # === ADVANCED CONFIGURATION ===
  - title: wafw00f - 通过代理扫描
    desc: |
      将所有检测请求路由到 HTTP 或 SOCKS 代理服务器。这可用于绕过基于 IP 的限速或掩盖扫描活动的来源。
      工具支持各种代理字符串，包括 socks5:// 和带认证的 http:// 代理。
    command: "wafw00f {{url}} -p {{proxy_url|http://127.0.0.1:8080}}"

  - title: wafw00f - 使用自定义请求头
    desc: |
      传入包含自定义 HTTP 请求头的文本文件，随每个请求探针一起发送。当目标应用需要特定的 User-Agent、Cookie 或 Authorization 请求头才能正常响应时很有用。
      使用自定义请求头有助于绕过可能阻止工具流量的简单访问控制。
    command: "wafw00f {{url}} -H {{headers_file|headers.txt}}"

  - title: wafw00f - 禁用重定向并设置超时
    desc: |
      阻止工具跟随 HTTP 3xx 重定向，并定义自定义网络超时。当你想专门分析入口点的安全性而不被发送到外部域名时，禁用重定向很重要。
      扫描高延迟目标或不稳定网络环境时，调整超时很有帮助。
    command: "wafw00f {{url}} -r -T {{seconds|15}}"