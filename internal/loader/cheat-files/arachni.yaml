tool: arachni
tags: [web, scanner, security, pentest, vulnerability, enumeration]

actions:
# === BASIC SCANS & OUTPUT ===
 - title: arachni - 基础扫描
   desc: |
     使用默认设置对目标 URL 执行标准扫描。
     该命令将审计表单、链接与 Cookie，同时加载所有默认安全检查。
     这是对单个 Web 应用开始漏洞评估的最快方式。
     注意默认扫描可能会遗漏子域或特定的复杂输入向量。
   command: "arachni {{url}}"

 - title: arachni - 详细扫描并保存报告
   desc: |
     以详细输出运行扫描，并将最终结果保存到 Arachni 框架报告（.afr）文件。
     详细输出有助于实时监控扫描器进度并识别任何连接问题。
     生成的 .afr 文件至关重要，因为之后可将其转换为 HTML、JSON 或 XML 报告。
     当你需要为专业渗透测试报告记录发现时，请始终使用此方式。
   command: "arachni --output-verbose --report-save-path={{report_name|scan_results.afr}} {{url}}"

 - title: arachni - 仅输出阳性结果
   desc: |
     过滤控制台输出，仅显示成功识别的漏洞与安全问题。
     这对于大规模扫描非常有用，你可以忽略噪音并专注于可操作的发现。
     它不影响实际扫描深度，只影响扫描过程中打印到终端的内容。
     在后台终端或 CI/CD 管道中运行工具时使用此方式。
   command: "arachni --output-only-positives {{url}}"

# === SCOPE & DEPTH CONTROL ===
 - title: arachni - 扫描中包含子域
   desc: |
     指示扫描器跟踪并审计指向目标子域的链接。
     默认情况下 Arachni 将自身限制在所提供的域名内，以防止“范围蔓延”及意外扫描第三方。
     启用此功能对于企业 Web 基础设施的全表面侦察至关重要。
     请谨慎，因为这会显著增加扫描时间与资源消耗。
   command: "arachni --scope-include-subdomains {{url}}"

 - title: arachni - 限制爬取深度与页面数
   desc: |
     将扫描器限制在最大目录深度与特定的总页面数内。
     这是对超大型网站执行“冒烟测试”或快速扫描而不陷入死循环的有效方法。
     目录深度限制可防止爬虫深入嵌套的文件夹结构。
     页面限制确保扫描在达到定义的唯一 URL 阈值后终止。
   command: "arachni --scope-directory-depth-limit {{depth|3}} --scope-page-limit {{page_limit|100}} {{url}}"

 - title: arachni - 排除特定 URL 模式
   desc: |
     使用正则表达式排除某些路径或操作，使其不被爬取或审计。
     这对于避开注销按钮、“删除账户”页面或管理面板等敏感区域至关重要。
     防止扫描器命中注销链接可确保已认证会话在整个扫描期间保持活跃。
     你可以多次使用此选项以排除应用中的各种敏感模式。
   command: "arachni --scope-exclude-pattern {{regex_pattern}} {{url}}"

# === TARGETED AUDITING ===
 - title: arachni - 审计特定元素（链接、表单、Cookie）
   desc: |
     明确告诉扫描器测试哪些类型的 Web 元素是否存在漏洞。
     通过仅聚焦于 Cookie 或请求头等特定向量，你可以执行高度定向的安全检查。
     这常用于先前扫描显示某区域存在问题、而你想快速验证修复效果时。
     广泛审计请求头与 Cookie 会显著增加发送到服务器的请求数量。
   command: "arachni --audit-links --audit-forms --audit-cookies --audit-headers {{url}}"

 - title: arachni - 审计 JSON 与 XML 输入
   desc: |
     为通过 JSON 或 XML 载荷传递数据的现代 Web 应用启用专门的审计。
     若不设置这些标志，标准扫描器常会遗漏隐藏在 API 调用或 AJAX 请求中的漏洞。
     强烈建议用于审计 RESTful API 与单页应用（SPA）。
     请确保目标 URL 指向 API 端点或发起这些请求的页面。
   command: "arachni --audit-jsons --audit-xmls {{url}}"

# === VULNERABILITY CHECK SELECTION ===
 - title: arachni - 运行特定的漏洞检查
   desc: |
     使用通配符仅加载指定的安全检查，例如 XSS 或 SQL 注入。
     当你只对某一类漏洞感兴趣时，这可实现更快、更聚焦的扫描。
     使用 'xss*' 将加载所有与跨站脚本相关的模块。
     它是通过禁用与目标环境无关的检查来降低服务器负载的好方法。
   command: "arachni --checks={{check_pattern|xss*}} {{url}}"

 - title: arachni - 排除特定检查
   desc: |
     加载除明确以减号前缀列出的检查之外的所有默认检查。
     当某些检查导致应用崩溃或触发入侵检测系统（IDS）时很有用。
     例如，如果 'csrf' 检查产生过多误报或日志，你可能希望排除它。
     它在全面扫描与稳定测试环境之间提供了平衡。
   command: "arachni --checks=*,-{{excluded_check|csrf}} {{url}}"

# === AUTHENTICATION & HTTP CONFIGURATION ===
 - title: arachni - 使用 HTTP 基本认证扫描
   desc: |
     配置扫描器使用 HTTP Basic Auth 凭据对 Web 服务器进行认证。
     这对于扫描暂存环境或受保护的管理目录是必要的。
     扫描器会在其发送的每个请求中包含 'Authorization' 请求头。
     请确保提供的凭据具有查看整个应用的足够权限。
   command: "arachni --http-authentication-username {{username}} --http-authentication-password {{password}} {{url}}"

 - title: arachni - 使用会话 Cookie 扫描
   desc: |
     向扫描器提供预认证的 Cookie 字符串，用于基于会话的测试。
     这是在浏览器中手动登录后扫描应用受保护区域的最常用方式。
     通过在服务器上设置较长的超时或使用持久会话，确保会话在扫描期间不会过期。
     格式应与标准 'Cookie' HTTP 头一致（如 "session_id=123; user=admin"）。
   command: "arachni --http-cookie-string \"{{cookie_string}}\" {{url}}"

 - title: arachni - 通过代理扫描
   desc: |
     将扫描器的所有流量路由到指定代理服务器，例如 Burp Suite 或 SOCKS5 代理。
     这对于监控扫描器请求或通过跳板主机绕过网络限制很有用。
     如果不是标准 HTTP 代理，你也可以指定代理类型（如 socks5）。
     请注意通过代理扫描可能会降低整体扫描速度。
   command: "arachni --http-proxy {{proxy_address|127.0.0.1:8080}} {{url}}"

# === ADVANCED BROWSER CLUSTER ===
 - title: arachni - 带 JavaScript/DOM 支持扫描
   desc: |
     使用浏览器集群分析 DOM 并在目标页面上执行 JavaScript。
     这对于内容动态渲染的现代 Web 应用（如 React、Angular 或 Vue）至关重要。
     否则 Arachni 只会看到初始的静态 HTML，可能遗漏许多输入与链接。
     增大池大小可以加快扫描，但需要显著更多的 RAM 与 CPU。
   command: "arachni --browser-cluster-pool-size {{pool_size|6}} --scope-dom-depth-limit {{dom_depth|5}} {{url}}"

# === REPORTING & SNAPSHOTS ===
 - title: arachni - 设置扫描超时与挂起
   desc: |
     在指定时长后自动停止扫描，并保存当前状态的快照。
     该快照之后可使用 'arachni_restore' 用于从断点处恢复扫描。
     这是时间窗口严格或需处理意外系统重启的渗透测试的关键特性。
     时长格式为 HOURS:MINUTES:SECONDS。
   command: "arachni --timeout {{duration|01:00:00}} --timeout-suspend --snapshot-save-path {{snapshot_path|scan.snapshot}} {{url}}"
