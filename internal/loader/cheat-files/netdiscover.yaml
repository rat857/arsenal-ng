tool: netdiscover
tags: [network, reconnaissance, arp, scanner, pentest, sniffing, security]

actions:
  # === RECONNAISSANCE & SCANNING ===

  - title: netdiscover - 基础自动扫描
    desc: |
      对常见私有网络范围（192.168.0.0/16、172.16.0.0/12、10.0.0.0/8）执行自动扫描。当你连接到网络但不知道本地 IP 编址方案时非常有效。
      注意此工具需要 root 或 sudo 权限，因为它利用原始套接字构造并发送 ARP 数据包。它会持续运行并更新列表，直到手动停止。
    command: "netdiscover"

  - title: netdiscover - 扫描特定 IP 范围
    desc: |
      扫描用户提供的特定 CIDR 范围以识别活动主机。这是在 192.168.1.0/24 等已知子网内进行定向发现的最常见方式。
      使用特定范围比默认自动扫描模式快得多，且在网络上产生的噪音更少。结果将显示 IP 地址、MAC 地址、MAC 厂商以及接收的数据包数量。
    command: "netdiscover -r {{range}}"

  - title: netdiscover - 被动监听模式
    desc: |
      启用被动模式，工具不向网络发送任何 ARP 请求。它充当静默嗅探器，仅通过监控其他设备生成的 ARP 流量来识别主机。
      这是最隐蔽的侦察方法，因为它不留痕迹且无法被基本 IDS 检测到。在主动扫描可能触发安全告警的红队场景中特别有用。
    command: "netdiscover -p"

  - title: netdiscover - 指定网络接口
    desc: |
      强制 netdiscover 使用特定网络接口进行操作。当你的机器有多张网卡（如有线以太网连接和无线适配器）时有必要。
      指定接口确保 ARP 请求通过正确的物理或虚拟网关发送。常见接口名包括 eth0、wlan0 或 tap0。
    command: "netdiscover -i {{interface|eth0}}"

  # === PERFORMANCE & OPTIMIZATION ===

  - title: netdiscover - 启用快速模式
    desc: |
      以快速模式运行 ARP 扫描，显著减少总扫描时间。推荐用于速度优先于彻底性的初步侦察。
      快速模式通过优化发现过程中数据包传输的内部时序来工作。注意在非常大或拥塞的网络中，高速可能导致漏掉一些响应缓慢的主机。
    command: "netdiscover -r {{range}} -f"

  - title: netdiscover - 自定义时序与重试
    desc: |
      通过设置自定义休眠时间和重试次数，微调扫描速度和可靠性。-s 标志设置每个 ARP 请求之间的延迟（毫秒），而 -c 设置每个请求重复的次数。
      增加次数（默认为 1）有助于在丢包严重、不可靠的网络上发现主机。减少休眠时间可使扫描更快，但可能压垮小型网络设备或触发泛洪防护。
    command: "netdiscover -r {{range}} -s {{sleep_ms|100}} -c {{count|3}}"

  - title: netdiscover - 极限免休眠
    desc: |
      通过抑制每个 ARP 请求之间的休眠时间启用 hardcore 模式。这会以系统和网络接口能承受的最快速度发送数据包。
      请谨慎使用，因为它噪音极大，可能被一些网络监控器解释为拒绝服务（DoS）尝试。主要用于受控环境中的压力测试或极快速的发现。
    command: "netdiscover -r {{range}} -S"

  # === INPUT & OUTPUT MANAGEMENT ===

  - title: netdiscover - 从文件扫描范围
    desc: |
      从文本文件读取目标 IP 范围列表并逐一扫描。文件每行应包含一个标准 CIDR 表示法或范围格式的范围。
      适合需要自动扫描多个不连续子网的大规模评估。它通过将目标列表组织在外部文件中来帮助保持结构化的工作流程。
    command: "netdiscover -l {{file_path}}"

  - title: netdiscover - 用于脚本的可解析输出
    desc: |
      将扫描结果格式化为简化的机器可读输出，便于用 grep、awk 或自定义脚本等其他工具解析。-P 标志确保工具打印结果并在活动扫描完成后立即退出。
      这对于自动化和将 netdiscover 集成到更大的侦察流水线中至关重要。添加 -N 标志可通过移除头部信息进一步简化输出。
    command: "netdiscover -r {{range}} -P"

  - title: netdiscover - 使用已知 MAC 列表扫描
    desc: |
      使用包含已知 MAC 地址和主机名的文件来帮助在扫描期间识别设备。这允许工具将发现的硬件地址映射到特定的用户定义标签。
      在需要区分已知资产和流氓设备的企业环境中非常有帮助。映射文件应遵循 netdiscover 要求的格式，以确保正确识别。
    command: "netdiscover -r {{range}} -m {{mac_file}}"