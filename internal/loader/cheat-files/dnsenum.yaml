tool: dnsenum
tags: [dns, enumeration, reconnaissance, pentest, network, information-gathering, security]

# === BASIC ENUMERATION ===

actions:
 - title: dnsenum - 基本 DNS 枚举
   desc: |
     对目标域名执行标准的 DNS 枚举。
     此命令识别主机地址（A）、域名服务器（NS）和邮件交换（MX）记录，是收集目标基础设施技术信息的最常见起点。
   command: "dnsenum {{domain}}"

 - title: dnsenum - 跳过反向查询
   desc: |
     运行标准枚举但跳过反向查询操作。
     当你想加快扫描速度，或反向 DNS 与当前目标无关时非常有用，可减少发送到 DNS 服务器的查询数量，使扫描略微更隐蔽。
   command: "dnsenum --noreverse {{domain}}"

# === BRUTE FORCE & DICTIONARY ATTACKS ===

 - title: dnsenum - 子域名暴力破解
   desc: |
     通过测试提供的字典文件中的条目来发现子域名。
     如果未指定文件，通常默认使用工具自带的内部 dns.txt 列表，对于发现 dev、staging 或内部门户等未被索引或隐藏的子域名至关重要。
   command: "dnsenum -f {{wordlist|/usr/share/dnsenum/dns.txt}} {{domain}}"

 - title: dnsenum - 递归暴力破解
   desc: |
     对被发现且拥有自身 NS 记录的子域名启用递归。
     这允许工具自动转向并对嵌套子域名执行暴力破解，对拥有复杂委派 DNS 结构的大型组织非常有效。
   command: "dnsenum -f {{wordlist|/usr/share/dnsenum/dns.txt}} -r {{domain}}"

# === NETWORK & WHOIS ANALYSIS ===

 - title: dnsenum - Whois 查询与反向查询
   desc: |
     对枚举期间发现的 C 类网络范围执行 Whois 查询，并运行反向查询。
     这有助于识别目标 IP 空间的完整范围以及同一网络上的其他主机，注意此操作会产生大量流量并可能耗时较长。
   command: "dnsenum -w {{domain}}"

 - title: dnsenum - 综合枚举快捷方式
   desc: |
     使用 --enum 标志，它是更激进、更彻底扫描的快捷方式。
     自动将线程设为 5、启用 Whois 查询（-w）并设置抓取限制，是用一条命令运行完整扫描的最有效方式。
   command: "dnsenum --enum {{domain}}"

# === ADVANCED CONFIGURATION ===

 - title: dnsenum - 使用指定 DNS 服务器
   desc: |
     强制工具对全部 A、NS 和 MX 查询使用特定的 DNS 服务器。
     当你想直接查询内部 DNS 服务器或绕过特定递归解析器时尤为有用，也可用于测试不同 DNS 提供商之间的不一致。
   command: "dnsenum --dnsserver {{dns_server}} {{domain}}"

 - title: dnsenum - 配置线程数和超时
   desc: |
     允许手动调整并发线程数和查询超时值。
     增加线程可加快暴力破解，但可能导致速率限制或不稳定连接上的漏报，超时值（秒）应根据目标 DNS 服务器的延迟调整。
   command: "dnsenum --threads {{thread_count|5}} -t {{timeout_seconds|10}} {{domain}}"

# === OUTPUT & DATA MANAGEMENT ===

 - title: dnsenum - 保存结果为 XML
   desc: |
     将枚举结果导出为 XML 格式，以便与其他安全工具集成。
     生成的 XML 文件可导入 MagicTree 等平台进行可视化和报告，对在专业渗透测试中维护结构化的发现记录至关重要。
   command: "dnsenum -o {{output_file|results.xml}} {{domain}}"

 - title: dnsenum - 将有效子域名写入文件
   desc: |
     仅将扫描期间发现的有效子域名写入纯文本文件。
     对将结果管道传递给 HTTP 探测工具（httpx）或漏洞扫描器极为有用，有助于为评估的后续阶段创建干净的攻击面列表。
   command: "dnsenum --subfile {{subdomain_file|subdomains.txt}} {{domain}}"
