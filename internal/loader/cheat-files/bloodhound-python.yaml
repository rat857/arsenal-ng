tool: bloodhound-python
tags: [active-directory, enumeration, pentest, security, reconnaissance, windows, ldap]

actions:
  # === BASIC ENUMERATION ===
  - title: bloodhound-python - 基础域枚举
    desc: |
      执行标准收集，包括 Group、LocalAdmin、Session 与 Trusts。
      当你拥有有效域凭据时，这是最常见的起点。
      生成的 JSON 文件位于当前目录，可上传到 BloodHound GUI。
    command: "bloodhound-python -u {{username}} -p {{password}} -d {{domain}}  -dc {{dc_ip}}  -c Default"

  - title: bloodhound-python - 收集包括 ACL 在内的所有数据
    desc: |
      收集包括详细访问控制列表（ACL）在内的所有可用信息。
      此方法提供对环境的全面视图，可发现 GenericAll 或 WriteDacl 等复杂攻击路径。
      注意这会生成更大的文件，且比默认扫描耗时更长。
    command: "bloodhound-python -u {{username}} -p {{password}} -d {{domain}}  -c All"

  - title: bloodhound-python - 仅收集域控制器
    desc: |
      将枚举限制为仅查询域控制器，而不连接各台计算机。
      这是一种更隐蔽、更快速的收集方法，可避免在工作站上触发告警。
      它非常适合以速度与低可见性优先于会话数据的初始侦察。
    command: "bloodhound-python -u {{username}} -p {{password}} -d {{domain}}  -c DCOnly"

  # === AUTHENTICATION VARIATIONS ===
  - title: bloodhound-python - 使用 NTLM 哈希枚举
    desc: |
      使用 NTLM 哈希而非明文密码对域进行认证。
      这在 Pass-the-Hash 场景或你已从本地数据库提取哈希时特别有用。
      哈希应以 LM:NTLM 格式提供，或仅 NTLM 部分并以冒号开头。
    command: "bloodhound-python -u {{username}} --hashes {{ntlm_hash}} -d {{domain}}"

  - title: bloodhound-python - 通过 Kerberos 票据认证
    desc: |
      使用现有的 Kerberos 票据（ccache 文件）进行认证。
      运行命令前，必须确保 KRB5CCNAME 环境变量指向你的票据文件。
      在横向移动或从通过 SSSD 加入领域的 Linux 机器操作时，通常首选此方法。
    command: "bloodhound-python -k -no-pass -d {{domain}}  -dc {{dc_hostname}} "

  - title: bloodhound-python - 使用 AES 密钥认证
    desc: |
      提供 AES 密钥（128 或 256 位）用于 Kerberos 认证。
      当你已捕获或计算出用户密钥时，它是使用密码或哈希的替代方案。
      它有助于绕过某些仅监控 NTLM 的控制措施。
    command: "bloodhound-python -u {{username}} -aesKey {{hex_key}}  -d {{domain}} "

  # === ADVANCED COLLECTION & NETWORK ===
  - title: bloodhound-python - 收集已登录用户
    desc: |
      专门尝试从远程计算机收集会话信息。
      该操作通常需要对目标机器具有本地管理员权限才能成功。
      它对于识别域管理员或其他高权限用户当前登录的位置非常有效。
    command: "bloodhound-python -u {{username}} -p {{password}} -d {{domain}}  -c LoggedOn"

  - title: bloodhound-python - 使用 LDAPS 与自定义名称服务器
    desc: |
      强制收集器使用 SSL/TLS 上的 LDAP（LDAPS，端口 636），并指定自定义 DNS 服务器。
      在强制执行 LDAP 签名或阻止明文 LDAP 的环境中，必须使用 LDAPS。
      指定名称服务器可确保当本地 DNS 未配置目标域时，工具仍能解析内部域名。
    command: "bloodhound-python -u {{username}} -p {{password}} -d {{domain}}  --use-ldaps -ns {{dns_ip}} "

  - title: bloodhound-python - 定义目标计算机列表
    desc: |
      指定一个文本文件，其中包含要枚举的目标计算机 FQDN 列表。
      这使你能将枚举范围限定在特定机器子集，而非整个域。
      它对于保持在特定任务范围内很有用。
    command: "bloodhound-python -u {{username}} -p {{password}} -d {{domain}}  --computerfile {{file_path}} "

  # === PERFORMANCE & OUTPUT ===
  - title: bloodhound-python - 带压缩的优化收集
    desc: |
      增加工作线程数以加快大型环境中的枚举过程。
      --zip 标志自动将所有生成的 JSON 文件打包到单个压缩归档中，便于下载。
      添加输出前缀有助于区分不同域或不同测试阶段的结果。
    command: "bloodhound-python -u {{username}} -p {{password}} -d {{domain}}  -w {{workers|20}} --zip -op {{prefix_name}} "
