tool: qsfuzz
tags: [web, security, pentest, fuzzer, bugbounty, reconnaissance, automation]

actions:
  # === BASIC USAGE ===
  - title: qsfuzz - 基础查询字符串模糊测试
    desc: |
      对通过标准输入提供的 URL 列表执行基础模糊测试。
      这是使用该工具的主要方式，通常通过管道传入 gau 或 waybackurls 等发现工具的输出。
      它会根据内置或默认规则检查参数，以发现潜在漏洞。
    command: "cat {{url_list}} | qsfuzz"

  - title: qsfuzz - 使用自定义配置进行模糊测试
    desc: |
      使用包含自定义规则的特定配置文件执行模糊测试。
      配置文件允许你为 XSS、SQLi 或 SSRF 等漏洞定义特定载荷和匹配模式。
      这对于默认规则可能不足以覆盖特定技术栈的有针对性测试至关重要。
    command: "cat {{url_list}} | qsfuzz -c {{config_path|~/.config/qsfuzz/config.yaml}}"

  # === AUTHENTICATION & HEADERS ===
  - title: qsfuzz - 使用头进行认证模糊测试
    desc: |
      向工具发送的所有模糊测试请求添加自定义 HTTP 头。
      这对于测试需要授权令牌或自定义标识头的端点至关重要。
      可以通过在字符串内用分号分隔来包含多个头。
    command: "cat {{url_list}} | qsfuzz -H \"{{headers|Authorization: Bearer token; X-Custom-Header: value}}\""

  - title: qsfuzz - 使用 Cookie 进行认证模糊测试
    desc: |
      在每个请求中包含会话 Cookie，以模糊测试 Web 应用受保护或需认证的区域。
      这使模糊测试器能够触达未认证用户无法访问的内部逻辑和参数。
      在开始长时间扫描之前，确保 Cookie 有效且会话处于活动状态。
    command: "cat {{url_list}} | qsfuzz -cookies \"{{cookies|session=abc123xyz}}\""

  # === PERFORMANCE & OPTIMIZATION ===
  - title: qsfuzz - 高并发模糊测试
    desc: |
      设置并发工作线程数并调整请求超时以加快处理速度。
      增加工作线程数可以显著加快大型 URL 列表的扫描速度，但可能导致速率限制。
      设置较低的超时有助于工具快速跳过无响应的服务器，从而保持整体扫描进度。
    command: "cat {{url_list}} | qsfuzz -w {{workers|50}} -t {{timeout|10}}"

  - title: qsfuzz - 用于自动化的静默模式
    desc: |
      静音所有状态更新，只向终端打印成功的评估结果或正匹配。
      此模式专为自动化流水线和 shell 脚本设计，只有发现结果才重要。
      它可以防止终端或日志文件被进度指示器和非关键信息淹没。
    command: "cat {{url_list}} | qsfuzz -s"

  # === ADVANCED BEHAVIOR ===
  - title: qsfuzz - 使用解码参数进行模糊测试
    desc: |
      发送使用解码后的查询字符串和参数的模糊测试请求，而不是 URL 编码的请求。
      此技术有时可以绕过仅检查编码输入的安全过滤器或 WAF。
      请谨慎，因为这可能导致某些 Web 服务器在期望标准编码时返回 400 Bad Request 错误。
    command: "cat {{url_list}} | qsfuzz -d"

  - title: qsfuzz - 禁用重定向跟随
    desc: |
      防止工具在模糊测试过程中跟随 HTTP 重定向（3xx 状态码）。
      默认情况下 qsfuzz 会跟随重定向，但当你想分析目标 URL 的即时响应时，禁用它很有用。
      这有助于识别 Open Redirect 漏洞或初始着陆页上的特定服务器行为。
    command: "cat {{url_list}} | qsfuzz -nr"

  # === INTEGRATION ===
  - title: qsfuzz - Slack 通知集成
    desc: |
      通过 webhook 将所有正匹配和发现的漏洞直接发送到 Slack 频道。
      Slack API 密钥和目标详情必须事先在 qsfuzz 配置文件中正确配置。
      这对于持续监控或长时间扫描非常出色，你可以在手机或桌面上接收实时告警。
    command: "cat {{url_list}} | qsfuzz -ts"

  - title: qsfuzz - 用于排查问题的调试模式
    desc: |
      启用详细调试模式，提供关于失败或格式错误请求的更详细信息。
      当工具行为异常或你在调试连接问题时，这非常有帮助。
      它会为每个处理失败的 URL 打印详细错误消息，帮助你优化输入列表或配置。
    command: "cat {{url_list}} | qsfuzz -debug"