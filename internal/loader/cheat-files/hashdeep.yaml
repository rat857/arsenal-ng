tool: hashdeep
tags: [forensics, security, hashing, integrity, checksum, incident-response]

actions:
  # === BASIC HASHING ===
  - title: hashdeep - 计算单个文件的哈希
    desc: |
      使用默认算法 MD5 和 SHA-256 为特定文件生成数字签名。这是快速获取文件哈希以确保其完整性或对照已知值进行验证的最常见方式。它以格式化字符串输出文件大小、哈希值和文件路径。
    command: "hashdeep {{file_path}}"

  - title: hashdeep - 递归目录哈希
    desc: |
      从指定路径开始遍历所有子目录，并为找到的每个文件计算哈希。这是取证镜像或系统审计期间建立目录状态基线的标准流程。它提供所有文件及其对应哈希的完整列表，可重定向到文件保存。
    command: "hashdeep -r {{directory_path}}"

  - title: hashdeep - 使用指定算法哈希
    desc: |
      仅使用指定的算法计算哈希，而非默认的 MD5/SHA-256 组合。支持的算法包括 md5、sha1、sha256、tiger 和 whirlpool，可以逗号分隔列表提供。当特定合规标准或工具要求指定特定哈希方法时使用。
    command: "hashdeep -c {{algorithms|sha256,sha1}} {{file_path}}"

  # === AUDITING AND MATCHING ===
  - title: hashdeep - 生成用于审计的哈希列表
    desc: |
      创建哈希列表并将其保存到文件，以供后续审计或匹配场景使用。生成的基线文件作为跨不同系统或时间点验证文件完整性的“事实来源”。执行此命令前，用户应确保对目标路径具有写入权限。
    command: "hashdeep -r {{directory_path}} > {{hash_list|known_hashes.txt}}"

  - title: hashdeep - 对照已知哈希审计文件
    desc: |
      将目标目录中的文件与先前生成的已知良好哈希列表进行比较。此模式会报告任何被修改、删除或移动的文件，以及不在原始列表中的任何新文件。它是检测未授权文件修改或识别文件系统上恶意软件持久化的重要工具。
    command: "hashdeep -a -k {{hash_list|known_hashes.txt}} -r {{directory_path}}"

  - title: hashdeep - 识别已知文件（匹配模式）
    desc: |
      在目标目录中搜索与已知哈希文件中提供的任何哈希匹配的文件。这在取证中特别有用，可用于查找已知恶意软件、特定系统二进制文件或已重命名的敏感文档。与审计模式不同，匹配模式专注于识别签名而非查找差异。
    command: "hashdeep -m -k {{hash_list|known_hashes.txt}} -r {{directory_path}}"

  - title: hashdeep - 查找未知或已修改的文件（反向匹配）
    desc: |
      识别与所提供的已知哈希列表中任何哈希都不匹配的文件。这对于在系统中查找“异常”文件非常有效，例如可疑二进制文件、脚本或未授权的配置更改。它帮助调查人员过滤掉数千个已知良好的系统文件，只聚焦异常。
    command: "hashdeep -x -k {{hash_list|known_hashes.txt}} -r {{directory_path}}"

  # === ADVANCED FEATURES ===
  - title: hashdeep - 大文件的分块哈希
    desc: |
      将文件拆分为指定大小的较小块，并对每个块单独计算哈希。这对于识别大型文件或取证镜像中的部分匹配非常有用，这些地方可能只有特定扇区发生了变化。与标准的整文件哈希技术相比，它提供更细粒度的文件内容视图。
    command: "hashdeep -p {{block_size|1024}} {{file_path}}"

  - title: hashdeep - 多线程哈希计算
    desc: |
      利用多个 CPU 线程加快大量文件的哈希处理速度。默认情况下 hashdeep 使用 6 个线程，但可以根据工作站的硬件能力调整。增加线程可显著减少处理大型数据集或大容量存储驱动器所需的时间。
    command: "hashdeep -j {{thread_count|8}} -r {{directory_path}}"

  - title: hashdeep - 以 DFXML 格式输出
    desc: |
      以数字取证 XML（DFXML）格式生成输出，这是取证工具互操作性的标准。此格式机器可读，可轻松被其他取证分析平台或自定义脚本摄取。它包含有关文件以及生成哈希时环境的广泛元数据。
    command: "hashdeep -d -r {{directory_path}}"

  - title: hashdeep - 显示相对路径和裸文件名
    desc: |
      更改输出格式，仅显示相对路径或不带任何路径信息的裸文件名。当需要跨绝对路径可能不同的系统比较文件时，这很有帮助。-b 参数对于创建直接处理文件名而无需剥离目录字符串的脚本特别有用。
    command: "hashdeep -r -l -b {{directory_path}}"
