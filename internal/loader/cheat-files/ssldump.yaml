tool: ssldump
tags: [network, security, pentest, tls, ssl, analyzer, sniffing, decryption]

actions:
  # === CAPTURE AND ANALYSIS ===
  - title: ssldump - 在接口上实时捕获
    desc: |
      从特定网络接口实时嗅探 SSL/TLS 流量。
      这是实时监控握手并识别客户端和服务器所用协议版本的最基本用法。
      请注意，通常需要 root 或管理权限才能直接从硬件接口捕获流量。
    command: "ssldump -i {{interface|eth0}}"

  - title: ssldump - 分析捕获文件
    desc: |
      分析存储在之前捕获的 pcap 文件中的 SSL/TLS 流量。
      这允许在未主动连接到目标环境的情况下进行离线流量分析。
      它对于调查来自 tcpdump 或 Wireshark 等工具的捕获日志以识别握手细节特别有用。
    command: "ssldump -r {{dumpfile}}"

  - title: ssldump - 详细握手分析
    desc: |
      显示完整的 SSL/TLS 握手过程，并以详细输出包含证书详情。
      详细标志可提供对扩展、加密套件协商和证书链的深入了解。
      在调试连接失败或验证 Web 服务器的安全配置时使用此命令。
    command: "ssldump -i {{interface|eth0}} -v"

  # === DECRYPTION ===
  - title: ssldump - 使用私钥解密流量
    desc: |
      通过提供服务器的 RSA 私钥文件来解密 SSL/TLS 应用数据。
      此功能仅适用于 RSA 密钥交换，不适用于使用 Diffie-Hellman（PFS）的加密套件，因为仅凭私钥无法导出会话密钥。
      确保密钥文件可访问，如果密钥已加密，请提供密码。
    command: "ssldump -r {{dumpfile}} -k {{keyfile}} -p {{password}}"

  - title: ssldump - 使用 keylog 文件解密
    desc: |
      使用标准 SSL 密钥日志文件格式提供的机密解密流量。
      此方法对于解密使用完美前向保密（PFS）的现代加密套件（如现代浏览器使用的）非常有效。
      日志文件必须包含捕获会话期间导出的预主密钥或会话密钥。
    command: "ssldump -r {{dumpfile}} -l {{sslkeylogfile}}"

  # === FILTERING AND OUTPUT ===
  - title: ssldump - 使用 BPF 过滤器捕获
    desc: |
      应用伯克利包过滤器（BPF）将处理的流量限制到特定主机或端口。
      在高流量环境中，过滤对于减少 CPU 负载并聚焦相关数据至关重要。
      过滤器语法与 tcpdump 相同，允许针对特定 IP 和端口组合等复杂逻辑。
    command: "ssldump -i {{interface|eth0}} host {{target}} and port {{port|443}}"

  - title: ssldump - 带时间戳的输出
    desc: |
      显示带有绝对或相对时间戳的捕获数据包，用于按时间顺序分析。
      -t 标志打印每个数据包的时间，这有助于将网络事件与应用日志关联。
      在调查握手延迟或基于时序的连接问题时至关重要。
    command: "ssldump -i {{interface|eth0}} -t"

  - title: ssldump - 将过滤后的流量写入 pcap
    desc: |
      将捕获的流量保存为 pcap 格式文件，同时进行分析。
      这对于归档可疑流量以供后续取证分析或与其他团队成员分享很有用。
      使用 -w 标志后跟所需文件名，以确保原始数据包数据被保留。
    command: "ssldump -i {{interface|eth0}} -w {{outpcapfile|output.pcap}}"