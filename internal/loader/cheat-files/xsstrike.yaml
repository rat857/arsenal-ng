tool: xsstrike
tags: [web-security, xss, scanner, pentest, reconnaissance, vulnerability-assessment]

actions:
  # === BASIC SCANNING ===
  - title: xsstrike - 基础 GET 扫描
    desc: |
      使用 GET 参数对目标 URL 执行基础反射型 XSS 扫描。这是检查搜索查询或页面 ID 中漏洞的主要方式。
      工具分析响应以检测反射点和上下文，从而生成优化后的 payload。
    command: "xsstrike.py -u \"{{url}}\""

  - title: xsstrike - POST 数据扫描
    desc: |
      扫描需要 POST 数据而非 URL 参数处理的目标。适用于测试登录表单、联系表单或不暴露 URI 参数的数据提交模块。
      确保数据字符串遵循标准的 key=value 格式以便正确解析。
    command: "xsstrike.py -u \"{{url}}\" --data \"{{post_data}}\""

  - title: xsstrike - URL 路径注入
    desc: |
      将 payload 直接注入 URL 路径组件，而非标准参数。这对于使用 RESTful 路由的现代 Web 应用至关重要，其中路径部分（如 /user/profile/name）可能反映在页面中。
      它有助于识别传统扫描器可能遗漏的 SEO 友好 URL 中的漏洞。
    command: "xsstrike.py -u \"{{url_with_path}}\" --path"

  - title: xsstrike - JSON POST 扫描
    desc: |
      将提供的 POST 数据视为 JSON 对象进行漏洞测试。现代 API 和单页应用（SPA）通常使用 JSON payload 通信，此开关确保 payload 在 JSON 结构内得到正确处理。
      这可以防止在尝试注入脚本时破坏 JSON 语法。
    command: "xsstrike.py -u \"{{url}}\" --data '{{json_payload}}' --json"

  # === AUTOMATION AND CRAWLING ===
  - title: xsstrike - 爬取并扫描
    desc: |
      从目标页面开始爬取以查找内部链接，并自动测试它们的 XSS。这是无需手动发现 URL 即可测绘整个应用攻击面的高效方式。
      它将发现和利用阶段合并到单个自动化工作流中。
    command: "xsstrike.py -u \"{{url}}\" --crawl"

  - title: xsstrike - 带自定义深度的爬取
    desc: |
      指定爬虫进入网站目录结构的深度。更高级别允许更广泛的发现，但会增加扫描时间和资源消耗。
      默认深度为 2，通常对中型网站足够。
    command: "xsstrike.py -u \"{{url}}\" --crawl -l {{depth|3}}"

  - title: xsstrike - 从文件扫描种子
    desc: |
      从文件加载多个 URL，用作爬取或直接测试的种子。这在侦察阶段发现多个子域名或端点后进行批量处理时非常理想。
      工具会按顺序处理文件中的每个条目。
    command: "xsstrike.py --seeds {{seeds_file}}"

  # === ADVANCED TESTING ===
  - title: xsstrike - 盲 XSS 测试
    desc: |
      在爬取期间将盲 XSS payload 注入发现的每个表单的每个参数。当 payload 被存储并在不同上下文中执行（如管理仪表盘或日志查看器）时，就会发生盲 XSS。
      运行前你必须在 core/config.py 文件中配置回调/interactsh URL。
    command: "xsstrike.py -u \"{{url}}\" --crawl --blind"

  - title: xsstrike - WAF 和过滤器模糊测试
    desc: |
      使用内置模糊器测试 Web 应用防火墙（WAF）和复杂过滤器。此模式故意较慢，因为它使用随机延迟以避免触发限速或 IP 封禁。
      它在识别哪些字符或关键字被安全机制拦截方面非常有效。
    command: "xsstrike.py -u \"{{url}}\" --fuzzer"

  - title: xsstrike - 跳过 DOM 扫描
    desc: |
      跳过基于 DOM 的 XSS 扫描阶段以加快整体执行。当你只对反射型 XSS 感兴趣，或目标环境有大量客户端脚本拖慢分析时使用。
      它有助于对大规模目标进行快速分诊。
    command: "xsstrike.py -u \"{{url}}\" --skip-dom"

  # === EVASION AND PERFORMANCE ===
  - title: xsstrike - 多线程爬取
    desc: |
      指定爬取和测试期间使用的并发线程数。增加线程可显著加快扫描，但可能压垮小型服务器或触发安全告警。
      请谨慎使用并监控目标响应，防止潜在停机。
    command: "xsstrike.py -u \"{{url}}\" --crawl -t {{threads|10}}"

  - title: xsstrike - 带延迟的隐蔽扫描
    desc: |
      在 HTTP 请求之间添加指定延迟，以绕过限速并保持隐蔽。扫描生产环境或具有激进安全监控的站点时推荐使用。
      延迟值以秒为单位。
    command: "xsstrike.py -u \"{{url}}\" -d {{delay|2}}"

  - title: xsstrike - 自定义请求头和 Cookie
    desc: |
      向出站请求添加自定义 HTTP 请求头或认证 Cookie。扫描登录墙后或需要特定 User-Agent 的页面时是必需的。
      使用 \n 换行符分隔多个请求头。
    command: "xsstrike.py -u \"{{url}}\" --headers \"{{headers|Cookie: session=xyz}}\""

  - title: xsstrike - 代理配置
    desc: |
      将所有流量路由到指定代理服务器。这对于匿名化你的 IP 地址或在 Burp Suite 等工具中拦截流量进行进一步手动分析很有用。
      为获得最佳效果，应在 core/config.py 文件中预先配置代理。
    command: "xsstrike.py -u \"{{url}}\" --proxy"

  # === CUSTOMIZATION ===
  - title: xsstrike - 暴力 payload 文件
    desc: |
      从本地文件加载自定义 payload 列表，并对目标进行测试。在此模式下 XSStrike 跳过其智能分析，简单地尝试列表中的每个条目。
      当你有一个想跨多个参数验证的特定绕过 payload 时很有用。
    command: "xsstrike.py -u \"{{url}}\" -f {{payload_file}}"

  - title: xsstrike - payload 编码
    desc: |
      自动对生成的 payload 进行编码，以绕过基础基于签名的过滤器。目前支持 base64 编码，这对特定 WAF 配置有用。
      它有助于测试应用是否在处理输入前先解码。
    command: "xsstrike.py -u \"{{url}}\" -e {{encoding|base64}}"