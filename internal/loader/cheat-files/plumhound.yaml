tool: plumhound
tags: [active-directory, bloodhound, security, pentest, blue-team, purple-team, enumeration, reporting]

actions:
  # === CONNECTIVITY & BASIC OPERATIONS ===
  - title: PlumHound - 基础连通性测试
    desc: |
      使用简易模式测试与 Neo4j 数据库的连接。
      它会将所有 Active Directory 用户对象直接输出到标准输出。
      这是在运行复杂任务之前验证凭据和服务器地址是否正确的最快方式。
    command: "PlumHound.py --easy"

  - title: PlumHound - 使用自定义凭据连接
    desc: |
      指定自定义的 Neo4j 服务器 URI、用户名和密码进行数据库交互。
      当数据库未运行在默认 localhost 或使用非标准凭据时，这是必需的。
      确保服务器字符串遵循 bolt 协议格式，以便与 Neo4j 实例正确通信。
    command: "PlumHound.py -s {{server|bolt://127.0.0.1:7687}} -u {{username|neo4j}} -p {{password|neo4jneo4j}}"

  # === TASK-BASED REPORTING ===
  - title: PlumHound - 执行任务列表
    desc: |
      从文件运行预定义的任务列表，以自动化多个 Cypher 查询和报告步骤。
      任务文件允许在单条命令中执行复杂的审计工作流，并生成 HTML 或 CSV 等多种输出格式。
      这在 SharpHound 导入数据后生成综合安全报告时非常有用。
    command: "PlumHound.py -x {{task_file|tasks/default.tasks}}"

  - title: PlumHound - 静默输出执行任务
    desc: |
      执行任务文件，同时通过将详细级别设为零来抑制标准输出。
      这非常适合自动化环境或后台作业，你只关心生成的报告文件。
      它可以防止终端被进度条和查询日志淹没。
    command: "PlumHound.py -x {{task_file|tasks/default.tasks}} -v 0"

  # === SINGLE QUERIES & EXPORTS ===
  - title: PlumHound - 单条 Cypher 查询输出到 stdout
    desc: |
      对 Neo4j 数据库执行单条自定义 Cypher 查询，并在终端显示结果。
      此模式非常适合快速查询特定对象、关系或 AD 属性，而无需生成完整报告。
      它允许研究人员直接从 CLI 与 BloodHound 数据进行交互。
    command: "PlumHound.py -q \"{{query|MATCH (n:User) RETURN n.name, n.displayname LIMIT 10}}\""

  - title: PlumHound - 单条查询生成 HTML 报告
    desc: |
      运行特定的 Cypher 查询并生成格式化的 HTML 报告，以便于可视化和分享。
      你可以指定报告标题、输出文件名以及目标目录路径。
      这有助于向利益相关方呈现具体发现，或记录红队/紫队行动中发现的攻击路径。
    command: "PlumHound.py -q \"{{query}}\" --title \"{{title}}\" --of \"{{outfile|report.html}}\" --op \"{{outpath|reports/}}\" --ox HTML"

  - title: PlumHound - 单条查询导出 CSV
    desc: |
      执行 Cypher 查询并将结果数据导出到 CSV 文件，以便在 Excel 或其他工具中进一步分析。
      这对于数据操作很有用，例如过滤大量易受攻击的用户或配置错误的计算机。
      确保使用 --ox 标志将输出格式明确设置为 CSV。
    command: "PlumHound.py -q \"{{query}}\" --of \"{{outfile|data_export}}\" --ox CSV"

  # === ADVANCED PATH ANALYSIS (BLUEHOUND MODULES) ===
  - title: PlumHound - 按标签分析路径
    desc: |
      基于 User、Group、Computer、OU 或 GPO 等对象标签分析攻击路径。
      该功能会识别必须修复哪些特定关系（例如 HasSession、AdminTo）才能切断通往敏感目标的路径。
      它为蓝队提供具体、可操作的步骤，以改善整体 AD 安全态势。
    command: "PlumHound.py -ap {{label|user}}"

  - title: PlumHound - 分析特定节点之间的路径
    desc: |
      识别并分析特定起始节点（源）与目标终点节点之间的所有可能攻击路径。
      输出会详细说明需要移除哪些关系才能有效切断整条攻击链。
      这对于验证特定用户或计算机能否获得 Domain Admin 权限特别有用。
    command: "PlumHound.py -ap \"{{start_node|domain users@example.com}}\" \"{{end_node|domain admins@example.com}}\""

  - title: PlumHound - 查找最繁忙的最短路径
    desc: |
      查找为最多用户提供通往 Domain Admin 权限路线的「最繁忙」最短路径。
      该命令接受算法类型（short 或 all）以及要返回的顶部结果数量。
      这有助于安全团队识别网络中最关键的「咽喉点」，即攻击者可能利用的位置。
    command: "PlumHound.py -bp {{algorithm|short}} {{limit|5}}"

  # === HTML CUSTOMIZATION ===
  - title: PlumHound - 使用自定义 CSS 生成报告
    desc: |
      将自定义 CSS 模板应用于生成的 HTML 报告，以匹配企业品牌或特定设计需求。
      这可以得到适合高管演示的专业外观报告。
      如果未指定此路径，工具会使用默认模板。
    command: "PlumHound.py -x {{task_file}} --HTMLCSS {{css_file|templates/custom.css}}"