tool: git
tags: [vcs, version-control, development, collaboration, devops, workflow]

actions:
  # === CONFIGURATION ===
  - title: git - 设置全局用户身份
    desc: |
      为本地系统上所有 git 仓库设置全局用户名和邮箱地址。此身份用于签署你的提交，对于追踪是谁做出的具体更改至关重要。请确保与你的 GitHub/GitLab 个人资料一致，以正确归属贡献。
    command: "git config --global user.name {{name|Your Name}} && git config --global user.email {{email|user@example.com}}"

  # === INITIALIZATION & CLONING ===
  - title: git - 初始化新仓库
    desc: |
      在当前工作目录中初始化一个全新的 Git 仓库。这会创建一个隐藏的 .git 目录，用于存储所有项目历史与元数据。在新项目开始时使用此命令即可启用版本控制。
    command: "git init"

  - title: git - 克隆仓库
    desc: |
      从 URL 创建远程仓库的本地副本。它会自动设置一个名为 origin 的远程连接，指回源仓库。你还可以指定目标目录名或要克隆的特定分支。
    command: "git clone -b {{branch_name|main}} {{repository_url}} {{clone_directory|repo-dir}}"

  # === BASIC WORKFLOW ===
  - title: git - 查看仓库状态
    desc: |
      显示工作目录和暂存区的状态。你可以看到哪些更改已暂存、哪些未暂存，以及哪些文件未被 Git 跟踪。这是验证下一次提交将包含什么内容时最常用的命令。
    command: "git status"

  - title: git - 暂存更改
    desc: |
      将文件内容添加到暂存区（索引），为下一次提交做准备。你可以添加特定文件，或使用句点添加当前目录中所有已修改和新文件。暂存允许你通过仅选择相关更改来构造精确的提交。
    command: "git add {{changed_files|.}}"

  - title: git - 提交已暂存的更改
    desc: |
      将已暂存的快照连同描述性信息保存到项目历史中。提交最好保持小而集中，只针对单个逻辑更改。如需绕过 pre-commit 钩子，可使用 --no-verify 参数，但通常不鼓励这样做。
    command: "git commit -m {{message|Commit description}}"

  # === REMOTE MANAGEMENT ===
  - title: git - 管理远程仓库
    desc: |
      列出、添加或移除与远程仓库的连接。verbose 参数会显示每个远程别名（如 origin）对应的 URL。在与他人协作或将代码部署到不同服务器时必不可少。
    command: "git remote {{action|--verbose}}"

  - title: git - 添加新的远程仓库
    desc: |
      在特定短名称下注册新的远程仓库 URL。标准做法是将主远程命名为 origin。这允许你向 GitHub 或 Bitbucket 等托管服务推送和拉取代码。
    command: "git remote add {{remote_name|origin}} {{remote_url}}"

  # === PUSH & PULL ===
  - title: git - 推送更改到远程仓库
    desc: |
      将本地仓库内容上传到远程仓库。-u 参数设置上游跟踪，使该分支未来的推送和拉取更加简单。使用 -f（强制）参数时要谨慎，因为它会覆盖远程服务器上的历史并干扰队友。
    command: "git push -u {{remote_name|origin}} {{branch_name|main}}"

  - title: git - 拉取最新更改
    desc: |
      从远程服务器获取更改并立即将其合并到当前本地分支。--ff-only 参数确保仅当能以快进方式解决时才拉取成功。这可以防止产生不必要的合并提交，保持历史线性。
    command: "git pull --ff-only {{remote_name|origin}} {{branch_name|main}}"

  # === BRANCHING & MERGING ===
  - title: git - 创建并切换分支
    desc: |
      创建一个新分支并立即将工作目录切换到该分支。分支用于与主代码库隔离地开发功能或修复缺陷。新分支将从当前的 HEAD 位置开始。
    command: "git checkout -b {{new_branch_name|feature-task}}"

  - title: git - 合并分支
    desc: |
      将指定分支的更改集成到当前活动分支中。Git 会尝试自动合并更改，但可能需要手动解决冲突。如果过程过于复杂，可使用 git merge --abort 返回到合并前的状态。
    command: "git merge {{source_branch|feature-branch}}"

  # === LOGGING & HISTORY ===
  - title: git - 查看提交历史
    desc: |
      显示当前分支历史中的提交列表。格式化版本提供可视化图形，展示分支随时间分叉与合并的情况。对于审计更改和理解项目演变至关重要。
    command: "git log --all --decorate --oneline --graph"

  - title: git - 显示未暂存的差异
    desc: |
      逐行显示工作目录与暂存区之间的差异。它帮助你在决定 git add 之前审查具体修改了哪些代码。如果提供了文件名，则只显示该文件的更改。
    command: "git diff {{file_path}}"

  # === CLEANUP & MAINTENANCE ===
  - title: git - 清理未跟踪的文件
    desc: |
      从工作树中删除未跟踪的文件和目录。-d 参数删除目录，-f 强制删除（出于安全考虑默认需要）。对于清除未被 .gitignore 忽略的构建产物或临时文件非常有用。
    command: "git clean -dxf"

  - title: git - 更新子模块
    desc: |
      初始化并更新嵌套的 git 仓库（子模块）。--recursive 参数确保如果子模块还有自己的子模块，也会一并更新。克隆依赖其他仓库作为依赖项的项目时这是必需的。
    command: "git submodule update --init --recursive"

  # === ADVANCED OPERATIONS ===
  - title: git - 交互式变基
    desc: |
      通过将提交重新应用到另一个基底之上来重写提交历史。常用于在合并前将多个小提交“压缩”为单个干净的提交。请注意，变基已共享的公共历史是危险的，通常应避免。
    command: "git rebase {{base_branch|main}} -i"

  - title: git - 从远程检出 Pull Request
    desc: |
      从远程（通常是 origin）获取特定 Pull Request（PR），并为其创建本地分支。这允许你在本地测试和审查贡献者的代码。请将 PR 编号替换为托管平台（GitHub/GitLab）上显示的 ID。
    command: "git fetch origin pull/{{pr_number}}/head:pr/{{pr_number}} && git checkout pr/{{pr_number}}"
