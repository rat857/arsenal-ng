tool: subfinder
tags: [subdomain, enumeration, reconnaissance, passive, osint, security, pentest]

actions:
  # === BASIC ENUMERATION ===
  - title: subfinder - 基础域名扫描
    desc: |
      对单个目标域名执行被动子域名发现。这是侦察和攻击面测绘最常见的起点。它会查询各种被动在线数据源，而不直接向目标发送流量。
      结果以默认格式显示在终端中。
    command: "subfinder -d {{domain}}"

  - title: subfinder - 多域名扫描
    desc: |
      为文件中列出的多个目标发现子域名。当你需要同时分析大量域名范围时使用。输入文件应每行包含一个域名。
      这种方式对漏洞赏金猎人和企业安全审计非常高效。
    command: "subfinder -dL {{file|domains.txt}}"

  - title: subfinder - 主动解析
    desc: |
      识别子域名并验证它们当前是否处于活跃状态。-active 参数指示工具解析发现的子域名，确保它们指向某个 IP。
      这有助于从被动结果中过滤掉过期或不存在的 DNS 记录。注意该步骤涉及主动 DNS 查询，不同于标准的纯被动模式。
    command: "subfinder -d {{domain}} -active"

  # === SOURCE MANAGEMENT ===
  - title: subfinder - 列出可用数据源
    desc: |
      显示 subfinder 当前支持的所有被动数据源。部分数据源需要在 provider-config.yaml 文件中配置 API key。
      查看此列表有助于了解数据的来源。它也会显示哪些数据源无需额外配置即可使用。
    command: "subfinder -ls -active"

  - title: subfinder - 使用全部数据源
    desc: |
      使用库中所有可用数据源触发一次全面扫描。此模式比默认扫描慢，因为它需要等待所有提供方的响应。
      当全面性比速度更重要时推荐使用。使用此参数时请确保已配置 API key 以获得最高效率。
    command: "subfinder -d {{domain}} -all"

  - title: subfinder - 指定数据源选择
    desc: |
      将发现过程限制在特定的数据源集合。用它专注于 crtsh 或 virustotal 等高度可靠的数据源。多个数据源可以通过逗号分隔的列表提供。
      这对于绕过慢速数据源或聚焦特定数据类型很有用。
    command: "subfinder -d {{domain}} -s {{sources|crtsh,github,censys}}"

  - title: subfinder - 排除特定数据源
    desc: |
      执行扫描时忽略在你的地区可能较慢或不可靠的特定数据源。这有助于通过移除有问题的提供方来优化扫描时间。
      当某个数据源当前宕机或对你的 IP 限速时尤为有用。以逗号分隔字符串的形式提供要跳过的数据源名称。
    command: "subfinder -d {{domain}} -es {{exclude_sources|google,bing}}"

  # === FILTERING & OUTPUT ===
  - title: subfinder - 静默输出用于管道
    desc: |
      仅将发现的子域名输出到控制台，不显示任何横幅或元数据。这在将输出管道传递给 httpx、nuclei 或 naabu 等工具时必不可少。
      它免去了手动清理工具输出的需要。非常适合自动化脚本和命令行单行命令。
    command: "subfinder -d {{domain}} -silent"

  - title: subfinder - 将输出保存到文件
    desc: |
      将发现结果写入指定文本文件，供后续分析。这可以防止数据丢失，并便于记录发现结果。如果文件不存在，subfinder 会自动创建。
      在渗透测试不同阶段记录子域名时很有用。
    command: "subfinder -d {{domain}} -o {{output|results.txt}}"

  - title: subfinder - JSON 格式输出
    desc: |
      生成 JSONL（JSON Lines）格式的输出，其中包含丰富的元数据。输出不仅包含子域名，还包含发现它的数据源。
      这是将 subfinder 与数据库或自定义解析器集成的首选格式。如果你需要对结果进行复杂数据分析，请使用此格式。
    command: "subfinder -d {{domain}} -oJ"

  - title: subfinder - 包含 IP 地址
    desc: |
      显示与发现的子域名关联的 IP 地址。该命令会自动启用 -active 参数，因为查找 IP 需要解析。
      它能更完整地呈现目标基础设施。只有成功解析到 IP 的子域名才会包含在输出中。
    command: "subfinder -d {{domain}} -active -oI"

  # === PERFORMANCE & ADVANCED ===
  - title: subfinder - 限速
    desc: |
      通过限制每秒发送的 HTTP 请求数来控制扫描速度。这对于避免被动数据源提供方的限速或封禁非常重要。
      如果你使用大量 API key，可能需要提高该值。反之，如果频繁遇到超时或连接重置，则应降低该值。
    command: "subfinder -d {{domain}} -rl {{limit|10}}"

  - title: subfinder - 自定义解析器
    desc: |
      指定用于 -active 解析阶段的自定义 DNS 解析器列表。默认情况下 subfinder 使用系统解析器，但自定义解析器（如 Google 或 Cloudflare）可能更快。
      你可以提供单个解析器，也可以提供包含解析器列表的文件。这有助于绕过本地 DNS 限制并提高解析准确性。
    command: "subfinder -d {{domain}} -active -r {{resolvers|8.8.8.8,1.1.1.1}}"

  - title: subfinder - 递归发现
    desc: |
      在支持的数据源上启用递归子域名发现。这使工具能够找到子子域名（例如 dev.api.example.com）。
      虽然更全面，但可能显著增加扫描时间。只有部分数据源能有效处理递归查询。
    command: "subfinder -d {{domain}} -recursive"

  # === SYSTEM ===
  - title: subfinder - 更新工具
    desc: |
      自动检查并从 GitHub 安装最新版本的 subfinder。保持工具更新可确保你拥有最新的数据源提供方和漏洞修复。
      这需要有效的网络连接以及对二进制路径的写权限。建议定期运行以保持工具效率。
    command: "subfinder -up"