tool: wfuzz
tags: [web, pentest, enumeration, bruteforce, fuzzing, security]

actions:
  # === BASIC ENUMERATION ===
  - title: wfuzz - 基础目录发现
    desc: |
      使用指定字典对目标 URL 执行简单的目录和文件搜索。FUZZ 关键字被字典中的条目替换，以查找隐藏资源。
      这是使用 Wfuzz 对 Web 服务器进行初步侦察的主要方式。
    command: "wfuzz -c -w {{wordlist|/usr/share/wordlists/dirb/common.txt}} {{url}}/FUZZ"

  - title: wfuzz - 按状态码过滤
    desc: |
      从输出中隐藏特定 HTTP 响应码以减少噪声。使用 --hc（Hide Code）后跟 404 是忽略“Not Found”响应的标准做法。
      这使识别有效路径和受限区域（如 200 OK 或 403 Forbidden）更加容易。
    command: "wfuzz -c -w {{wordlist|/usr/share/wordlists/dirb/common.txt}} --hc {{code|404}} {{url}}/FUZZ"

  - title: wfuzz - 多位置模糊测试
    desc: |
      利用多个字典同时模糊请求的不同部分。FUZZ 由第一个字典替换，FUZ2Z 由第二个替换。
      这对于查找具有特定扩展名的文件或测试多个参数特别有用。
    command: "wfuzz -c -w {{wordlist}} -w {{ext_list|/usr/share/wordlists/dirb/extensions_common.txt}} {{url}}/FUZZ.FUZ2Z"

  # === ADVANCED DISCOVERY ===
  - title: wfuzz - 子域名枚举
    desc: |
      通过模糊 HTTP 请求中的 Host 请求头来发现子域名。此技术对于发现未被 DNS 收录但存在于服务器上的虚拟主机很有效。
      注意你通常应过滤主域名的默认响应大小（字符/单词）才能看到有效子域名。
    command: "wfuzz -c -w {{wordlist|/usr/share/wordlists/dnsutils/subdomains-top1mil.txt}} -H \"Host: FUZZ.{{domain}}\" {{url}}"

  - title: wfuzz - 递归目录发现
    desc: |
      自动对初始扫描中发现的子目录执行发现。-R 参数定义递归深度（如 -R 2 扫描两层深）。
      在大型站点上谨慎使用，因为它可能产生大量流量并耗费很长时间。
    command: "wfuzz -c -w {{wordlist}} -R {{depth|2}} --hc 404 {{url}}/FUZZ"

  # === PARAMETER AND DATA FUZZING ===
  - title: wfuzz - POST 数据模糊测试
    desc: |
      在 POST 请求体中发送模糊数据，测试漏洞或隐藏参数。-d 参数指定 post 数据，FUZZ 关键字标记注入点。
      这对于测试登录表单、搜索字段和 API 端点的注入至关重要。
    command: "wfuzz -c -w {{wordlist}} -d \"{{param}}=FUZZ&submit=true\" {{url}}"

  - title: wfuzz - URL 参数模糊测试
    desc: |
      模糊 URL 中的 GET 参数，查找隐藏变量或测试 IDOR 和注入。当你怀疑某个端点接受的参数比 UI 中可见的更多时很有用。
      它有助于发现调试模式（如 ?debug=true）或管理覆盖。
    command: "wfuzz -c -w {{wordlist}} \"{{url}}/page.php?FUZZ=test\""

  # === AUTHENTICATION AND SESSIONS ===
  - title: wfuzz - 认证模糊测试
    desc: |
      对需要 HTTP Basic、NTLM 或 Digest 认证的资源启用模糊测试。格式为 user:pass，你甚至可以使用 FUZZ 关键字模糊凭据本身。
      这允许对管理控制台或内部开发工具进行安全测试。
    command: "wfuzz -c -w {{wordlist}} --basic \"{{user|admin}}:{{pass|admin}}\" {{url}}/FUZZ"

  - title: wfuzz - Cookie 模糊测试
    desc: |
      使用 -b 参数将模糊值注入 HTTP Cookie，测试会话管理问题。它对于发现不安全的直接对象引用（IDOR）或通过 Cookie 提权很有用。
      可以通过重复 -b 参数或使用分号设置多个 Cookie。
    command: "wfuzz -c -w {{wordlist}} -b \"sessionid=FUZZ\" -b \"user=admin\" {{url}}"

  # === PROXIES AND FILTERS ===
  - title: wfuzz - 通过代理路由
    desc: |
      将所有 Wfuzz 流量路由到指定代理，如 Burp Suite 或 Tor 监听器。格式为 ip:port:type（type 可以是 HTTP、SOCKS4 或 SOCKS5）。
      这对于在代理中分析模糊器流量或绕过基于 IP 的限制至关重要。
    command: "wfuzz -c -w {{wordlist}} -p {{proxy|127.0.0.1:8080}} {{url}}/FUZZ"

  - title: wfuzz - 按响应内容过滤（正则）
    desc: |
      基于匹配内容的正则表达式过滤或高亮响应。--ss 参数显示包含指定正则的响应，而 --hs 隐藏它们。
      这对于识别特定错误消息或成功利用的指标非常有效。
    command: "wfuzz -c -w {{wordlist}} --ss \"{{regex|root:x:0:0}}\" {{url}}/FUZZ"

  - title: wfuzz - 按响应大小过滤
    desc: |
      根据字符数（--hh）、单词数（--hw）或行数（--hl）隐藏响应。当服务器对一切都返回 200 OK（自定义 404 页面）时，这是过滤误报的最常用方法。
      先检查不存在页面的基线响应大小，然后用该值过滤。
    command: "wfuzz -c -w {{wordlist}} --hh {{char_count}} {{url}}/FUZZ"