tool: cariddi
tags: [recon, web, scanner, pentest, enumeration, security, crawling, osint]

actions:
  # === BASIC COMMANDS ===
  - title: cariddi - 打印帮助与示例
    desc: |
      显示工具的帮助菜单与用法示例。
      这对于在任务期间快速检查标志与命令语法很有用。
      它提供所有可用搜索与配置选项的简明摘要。
    command: "cariddi -h"

  - title: cariddi - 版本检查
    desc: |
      显示当前 cariddi 安装的版本。
      使用它确保你运行的是最新版本，拥有最新的正则表达式模式。
      定期更新很重要，因为新的密钥与漏洞模式会频繁添加。
    command: "cariddi -version"

  # === HUNTING AND DISCOVERY ===
  - title: cariddi - 强化爬取
    desc: |
      通过搜索匹配二级域的资源执行强化爬取。
      该模式对于发现可能未直接链接的子域与相关资产很有效。
      它通过识别同一组织范围内的其他主机来帮助扩大攻击面。
    command: "cariddi -intensive < {{input_file|urls.txt}}"

  - title: cariddi - 搜索密钥
    desc: |
      扫描目标 URL 以查找 API 密钥、令牌与硬编码凭据等敏感信息。
      该操作使用预定义的正则表达式模式集识别 JavaScript 文件与 HTML 源代码中的泄露。
      这是在侦察阶段发现未授权访问向量的关键步骤。
    command: "cariddi -s < {{input_file|urls.txt}}"

  - title: cariddi - 搜索端点
    desc: |
      自动发现爬取页面中的诱人端点与 URL 参数。
      这有助于识别潜在的 API 路由、管理面板或隐藏功能。
      结果可用作进一步模糊测试或人工漏洞评估的输入。
    command: "cariddi -e < {{input_file|urls.txt}}"

  - title: cariddi - 查找有用信息与错误
    desc: |
      扫描有用信息（如邮箱或版本）以及服务器端错误消息。
      错误消息常暴露后端技术栈、数据库查询或文件路径，有助于利用。
      组合 -info 与 -err 标志可提供对目标技术足迹的全面概览。
    command: "cariddi -info -err < {{input_file|urls.txt}}"

  - title: cariddi - 搜索诱人文件扩展名
    desc: |
      根据 1 到 7 的特定 "juiciness"（诱人程度）级别搜索敏感文件扩展名。
      较低级别（如 1 或 2）聚焦 .bak、.conf 或 .sql 等高敏感文件，较高级别则更宽松。
      这对于在 Web 服务器上查找被遗忘的备份或配置文件非常有效。
    command: "cariddi -ext {{level|2}} < {{input_file|urls.txt}}"

  - title: cariddi - 自定义密钥与端点搜索
    desc: |
      使用包含密钥自定义正则表达式与端点自定义关键字的外部文件。
      这使你能针对特定组织模式或专有技术定制扫描。
      在针对使用非标准命名约定的特定框架时特别有用。
    command: "cariddi -sf {{secrets_regex_file|secrets.txt}} -ef {{endpoints_file|endpoints.txt}} < {{input_file|urls.txt}}"

  # === CONFIGURATION AND STEALTH ===
  - title: cariddi - 并发与延迟控制
    desc: |
      通过设置并发级别与请求间隔来调整扫描速度。
      高并发可提高速度，但可能触发限速或 WAF 封锁。
      添加延迟有助于通过模拟更人性化的流量模式绕过基础反机器人防护。
    command: "cariddi -c {{concurrency|20}} -d {{delay_seconds|1}} < {{input_file|urls.txt}}"

  - title: cariddi - 代理与超时配置
    desc: |
      将全部流量路由到指定代理服务器（HTTP 或 SOCKS5），并设置请求超时。
      这对于保持匿名或通过 Burp Suite 等工具路由流量以便进一步分析至关重要。
      设置适当的超时可确保扫描器不会在无响应或缓慢的目标上挂起。
    command: "cariddi -proxy {{proxy_url|http://127.0.0.1:8080}} -t {{timeout|10}} < {{input_file|urls.txt}}"

  - title: cariddi - 自定义请求头与 User-Agent
    desc: |
      为每个请求注入自定义 HTTP 头或使用随机浏览器 User-Agent。
      自定义头对于扫描网站的认证区域是必要的（如使用 Cookie 或 Authorization 头）。
      随机化 User-Agent 有助于规避基于签名的检测机制。
    command: "cariddi -headers {{headers_string|'Cookie: session=123'}} -rua < {{input_file|urls.txt}}"

  - title: cariddi - 忽略特定 URL 或扩展名
    desc: |
      从扫描中排除特定扩展名或包含某些关键字的 URL。
      这可防止工具在二进制文件（如图片/字体）或超出范围路径（如 /blog 或 /forum）上浪费资源。
      过滤有助于保持结果干净并聚焦于应用最相关的部分。
    command: "cariddi -ie {{ignored_exts|pdf,png,jpg}} -i {{ignored_keywords|logout,signout}} < {{input_file|urls.txt}}"

  # === OUTPUT MANAGEMENT ===
  - title: cariddi - 将结果保存到文件
    desc: |
      将扫描结果写入结构化的 TXT 或 HTML 文件，以供后续报告与分析。
      HTML 输出提供用户友好的界面来浏览发现的密钥与端点。
      保存为文本文件非常适合将输出管道到管道中的其他命令行工具。
    command: "cariddi -ot {{text_output|results.txt}} -oh {{html_output|results_html}} < {{input_file|urls.txt}}"

  - title: cariddi - JSON 输出与响应存储
    desc: |
      以 JSON 格式将结果输出到 stdout，并在本地存储所有 HTTP 响应。
      JSON 格式非常适合与自定义脚本、数据库或 ELK 栈集成。
      存储响应允许离线分析应用行为，而无需重新扫描目标。
    command: "cariddi -json -sr < {{input_file|urls.txt}}"

  - title: cariddi - 深度控制与调试模式
    desc: |
      设置最大爬取深度并启用调试模式以查看详细执行日志。
      控制深度可防止爬虫陷入"死循环"或过于复杂的目录结构。
      调试模式对于排查连接问题或理解为何某些页面被跳过很有用。
    command: "cariddi -md {{max_depth|3}} -debug < {{input_file|urls.txt}}"
