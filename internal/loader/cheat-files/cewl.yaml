tool: cewl
tags: [wordlist, password-cracking, reconnaissance, security, pentest, enumeration, web]

actions:
  # === BASIC USAGE ===
  - title: cewl - 基础字典生成
    desc: |
      通过爬取提供的 URL 生成自定义字典。
      默认情况下它爬取 2 层深度，并将结果输出到终端。
      这对于基于站点特定术语创建用于密码破解的定向字典非常有效。
    command: "cewl {{url}}"

  - title: cewl - 将输出保存到文件
    desc: |
      将生成的字典直接保存到指定的文本文件。
      对于大型站点，建议写入文件，以避免终端缓冲区丢失数据。
      输出文件将每行包含爬取过程中发现的一个唯一单词。
    command: "cewl -w {{output_file|wordlist.txt}} {{url}}"

  - title: cewl - 设置爬取深度
    desc: |
      控制爬虫从初始页面跟踪链接的深度。
      增大深度（默认为 2）会产生更大的字典，但耗时显著增加。
      深度值过高时请谨慎，可能导致爬取到 Web 应用的意外区域。
    command: "cewl -d {{depth|3}} {{url}}"

  # === WORD FILTERING & TRANSFORMATION ===
  - title: cewl - 最小单词长度
    desc: |
      过滤字典，仅包含满足最小字符长度的单词。
      在针对具有特定密码复杂度要求的系统（如最少 8 个字符）时很有用。
      它通过移除不太可能作为密码的短常见单词来减小字典大小。
    command: "cewl -m {{min_length|8}} {{url}}"

  - title: cewl - 最大单词长度
    desc: |
      限制爬虫捕获单词的长度。
      当你已知目标系统对密码有最大字符限制时使用。
      这可防止字典被极长字符串或拼接文本块弄得杂乱。
    command: "cewl -x {{max_length|15}} {{url}}"

  - title: cewl - 将所有单词转为小写
    desc: |
      将爬取过程中找到的每个单词转换为小写。
      这有助于在将列表传递给 Hashcat 或 John the Ripper 等工具前进行规范化。
      它确保唯一单词不会仅因大小写不同而重复。
    command: "cewl --lowercase {{url}}"

  - title: cewl - 包含带数字的单词
    desc: |
      包含除字母外还带有数字的单词。
      默认情况下 CeWL 聚焦于字母字符串；此标志将搜索扩展到字母数字字符串。
      这对于捕获经常包含数字的现代密码至关重要。
    command: "cewl --with-numbers {{url}}"

  # === DATA EXTRACTION ===
  - title: cewl - 提取邮箱地址
    desc: |
      搜索并提取目标网站内容中的邮箱地址。
      提取的邮箱可保存到单独文件，用于用户名列表或社会工程活动。
      注意这常会找到有价值的管理员或支持邮箱。
    command: "cewl -e --email_file {{email_file|emails.txt}} {{url}}"

  - title: cewl - 提取文档元数据
    desc: |
      下载站点上找到的文件（如 PDF、DOCX），并使用 exiftool 提取元数据。
      这可以揭示内部用户名、软件版本、打印机路径与创建日期。
      结果写入元数据文件，提供另一层侦察信息。
    command: "cewl -a --meta_file {{meta_file|metadata.txt}} {{url}}"

  - title: cewl - 显示单词频率计数
    desc: |
      统计每个单词在爬取页面中出现的次数。
      了解单词频率可让你按概率对字典排序。
      在公司网站上出现更频繁的单词往往更可能成为密码的一部分。
    command: "cewl -c {{url}}"

  # === ADVANCED CONFIGURATION ===
  - title: cewl - 认证爬取
    desc: |
      使用 Basic 或 Digest 认证执行爬取，以访问站点的受保护区域。
      认证通常是访问内部仪表盘或用户特定内容所必需的。
      请确保你有权爬取这些区域，因为认证扫描的侵入性更强。
    command: "cewl --auth_type {{auth_type|basic}} --auth_user {{username}} --auth_pass {{password}} {{url}}"

  - title: cewl - 使用代理发起请求
    desc: |
      将所有爬取流量路由到指定代理服务器。
      这对于绕过基于 IP 的限制或在 Burp Suite 等工具中监控 CeWL 流量很有用。
      请确保代理主机与端口配置正确，以避免连接错误。
    command: "cewl --proxy_host {{proxy_ip}} --proxy_port {{proxy_port|8080}} {{url}}"

  - title: cewl - 自定义 User-Agent
    desc: |
      为爬虫的 HTTP 请求指定自定义 User-Agent 字符串。
      许多 Web 服务器或 WAF 会阻止默认的 Ruby/CeWL User-Agent 以防止抓取。
      使用标准浏览器 User-Agent 有助于工具融入合法流量。
    command: "cewl -u \"{{user_agent|Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36}}\" {{url}}"

  - title: cewl - 自定义请求头
    desc: |
      向爬虫发送的每个请求添加自定义 HTTP 头。
      这可用于绕过某些安全控制或提供会话 Cookie。
      如有必要，可通过重复该标志提供多个请求头。
    command: "cewl -H \"{{header_name|X-Forwarded-For}}: {{header_value|127.0.0.1}}\" {{url}}"
