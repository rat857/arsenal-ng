tool: drupwn
tags: [security, pentest, enumeration, drupal, cms, web, vulnerability]

actions:
  # === RECONNAISSANCE AND ENUMERATION ===
  - title: drupwn - 基本枚举
    desc: |
      对目标 Drupal 网站执行基本的发现扫描。
      此命令识别 Drupal 核心版本并检查常见文件是否存在，是任何 Drupal 特定评估建立目标环境基线的推荐起点。
    command: "drupwn --mode enum --target {{target}}"

  - title: drupwn - 完整组件枚举
    desc: |
      同时扫描已安装的模块、主题和默认 Drupal 文件。
      对识别可能存在已知漏洞的第三方组件至关重要，注意此过程会根据字典大小和服务器响应情况产生可观的 Web 流量。
    command: "drupwn --mode enum --target {{target}} --modules --themes --dfiles"

  - title: drupwn - 用户与节点发现
    desc: |
      使用定义的数值范围尝试枚举有效的用户名和已发布的节点/内容。
      这有助于映射站点的内容结构，并识别潜在的用于暴力破解攻击的管理员用户名，range 参数定义工具将探测多少个 ID。
    command: "drupwn --mode enum --target {{target}} --users --nodes --range {{range|1-100}}"

  # === AUTHENTICATION AND STEALTH ===
  - title: drupwn - 认证枚举
    desc: |
      在提供会话 Cookie 或基本认证凭据的情况下执行枚举。
      这允许工具访问仅限注册用户或管理员访问的页面和模块，当你已获得凭据执行灰盒安全评估时使用。
    command: "drupwn --mode enum --target {{target}} --cookies {{cookies}} --bauth {{user:pass}}"

  - title: drupwn - 带延迟的隐蔽扫描
    desc: |
      配置请求延迟和自定义 User-Agent 以避免被 Web 应用防火墙（WAF）或速率限制脚本检测。
      添加延迟可确保服务器不会被快速请求压垮，对在有主动监控的生产环境上进行评估尤为有用。
    command: "drupwn --mode enum --target {{target}} --delay {{delay|0.5}} --ua {{user_agent|Mozilla/5.0}}"

  - title: drupwn - 代理枚举
    desc: |
      将所有扫描流量经由指定的 HTTP、HTTPS 或 SOCKS 代理转发。
      可用于匿名化扫描来源，或通过网络中已沦陷的主机进行跳板，也可提供包含代理列表的文件在扫描期间轮换使用。
    command: "drupwn --mode enum --target {{target}} --proxy {{proxy_url|http://127.0.0.1:8080}}"

  # === ADVANCED OPERATIONS ===
  - title: drupwn - 利用模式
    desc: |
      将工具从信息收集切换到利用阶段。
      在此模式下，工具会根据识别出的 Drupal 版本和模块尝试利用已知漏洞，请格外谨慎并确保已获授权，因为利用可能影响服务稳定性。
    command: "drupwn --mode exploit --target {{target}}"

  - title: drupwn - 带日志的多线程扫描
    desc: |
      使用多个线程执行枚举扫描以提高性能，并将输出保存到日志文件以供后续分析。
      增加线程数可加快进程，但可能导致目标服务器不稳定或封禁扫描 IP，强烈建议记录日志以维护评估的审计轨迹。
    command: "drupwn --mode enum --target {{target}} --thread {{threads|10}} --log"

  - title: drupwn - 更新本地数据库
    desc: |
      更新工具使用的本地插件、主题和指纹数据库。
      定期更新可确保工具识别最新的 Drupal 版本和最新的社区模块，应定期运行此命令以维持枚举引擎的有效性。
    command: "drupwn --update"
