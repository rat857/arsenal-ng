tool: caido-cli
tags: [web, security, proxy, pentest, interception, enumeration]

actions:
# === BASIC SERVICE MANAGEMENT ===
 - title: caido-cli - 基础启动
   desc: |
     使用默认设置启动 Caido 实例。该命令初始化后端，
     并通常在默认浏览器中打开 Web 界面。它是开始 Web 安全审计会话的最快方式。
   command: "caido-cli"

 - title: caido-cli - 监听特定地址
   desc: |
     配置 Caido 服务的主监听地址与端口。当你需要服务在特定网络接口上可访问时使用，
     例如 VPN 或本地网络 IP。请确保所选端口未被其他代理工具占用。
   command: "caido-cli --listen {{listen_address|127.0.0.1:8080}}"

 - title: caido-cli - 无头模式
   desc: |
     启动 Caido 服务而不自动打开浏览器窗口。这对于远程服务器部署
     或希望手动导航到 UI 的环境很理想。它避免主机上不必要的浏览器进程开销。
   command: "caido-cli --no-open"

# === NETWORK & PROXY CONFIGURATION ===
 - title: caido-cli - 分离代理与 UI 监听器
   desc: |
     为拦截代理与管理 UI 定义不同的地址。此设置对于
     将管理流量与被分析流量隔离很有用。它提供对网络路由与访问限制的更好控制。
   command: "caido-cli --proxy-listen {{proxy_address|127.0.0.1:8081}} --ui-listen {{ui_address|127.0.0.1:8082}}"

 - title: caido-cli - 隐形模式
   desc: |
     为所有已配置的监听器启用隐形模式。当拦截不具备代理感知能力的应用流量时，
     需要此设置。它使 Caido 能作为透明代理用于厚客户端测试。
   command: "caido-cli --invisible"

 - title: caido-cli - 限制 UI 域
   desc: |
     将对 Caido UI 的访问限制在特定允许域内。这是一项安全特性，
     有助于防止对审计工具集的未授权访问。在共享或公共服务器上运行 Caido 时尤为重要。
   command: "caido-cli --ui-domain {{allowed_domain|localhost}}"

# === DATA & STORAGE MANAGEMENT ===
 - title: caido-cli - 自定义数据路径
   desc: |
     指定用于存储项目数据、日志与配置的自定义目录。
     这使你能够将安全研究数据保存在特定分区或加密驱动器上。
     请确保运行命令的用户对该路径具有完整的读写权限。
   command: "caido-cli --data-path {{storage_path|./caido_projects}}"

 - title: caido-cli - 禁用同步
   desc: |
     禁用与 Caido 云服务器的同步特性。在高度敏感的项目上工作时使用此选项，
     数据必须严格保存在本地。它确保没有任何项目元数据或历史记录离开机器。
   command: "caido-cli --no-sync"

 - title: caido-cli - 导入自定义 CA 证书
   desc: |
     将现有的证书颁发机构（CA）证书导入 Caido 以用于
     SSL/TLS 解密。如果你的实验室中有集中的证书管理系统，这很有用。
     如果证书文件受保护，你也可以提供密码。
   command: "caido-cli --import-ca-cert {{cert_path}} --import-ca-cert-pass {{password}}"

# === SECURITY & MAINTENANCE ===
 - title: caido-cli - 重置凭据
   desc: |
     重置用于登录 Caido 仪表盘的实例凭据。这是一项高风险命令，
     仅应在忘记密码时使用。请注意若处理不当，这可能影响你访问现有数据的能力。
   command: "caido-cli --reset-credentials"

 - title: caido-cli - 启用安全模式
   desc: |
     以安全模式启动工具集，该模式限制某些特性以防止
     不稳定或崩溃。这对于排查应用内的性能问题很有用。
     它可以帮助隔离问题是自定义插件还是核心功能引起的。
   command: "caido-cli --safe"

 - title: caido-cli - 调试日志
   desc: |
     启用详细调试日志的记录与终端显示。在审计期间遇到意外行为或错误时使用。
     日志提供关于网络连接与内部进程的详细信息。
   command: "caido-cli --debug"

 - title: caido-cli - 允许访客访问
   desc: |
     配置实例允许以访客用户身份登录。这对于快速演示
     或临时协作而无需创建完整账户很有帮助。请谨慎，因为这会降低 Caido 实例的安全态势。
   command: "caido-cli --allow-guests"
