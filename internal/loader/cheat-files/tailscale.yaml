tool: tailscale
tags: [network, security, vpn, wireguard, connectivity, pentest, mesh]

actions:
  # === AUTHENTICATION AND CONNECTION ===
  - title: tailscale - 连接到 tailnet
    desc: |
      将当前机器连接到 Tailscale 网络，并在必要时执行登录。这是初始化 Tailscale 守护进程并加入私有网状网络的主要命令。
      用户可以提供一个 auth key，以在无头服务器或 CI/CD 流水线上自动完成登录。
    command: "tailscale up --authkey {{auth_key}}"

  - title: tailscale - 断开 tailnet
    desc: |
      将机器从 Tailscale 网络断开，而不注销。这会停止所有由 Tailscale 管理的流量并移除虚拟网络接口。
      适用于在不丢失节点身份的情况下临时恢复标准网络状态。
    command: "tailscale down"

  - title: tailscale - 注销并使节点失效
    desc: |
      断开 tailnet 并使当前节点的认证密钥失效。之后重新连接设备需要完整重新认证（通常通过浏览器）。
      在停用机器或切换到完全不同的 Tailscale 账户时使用。
    command: "tailscale logout"

  # === INFORMATION AND ENUMERATION ===
  - title: tailscale - 查看连接状态
    desc: |
      显示 tailnet 中所有对等节点及其当前连接状态的完整列表。它提供详细信息，如 Tailscale IP 地址、对等节点的操作系统，以及连接是直连还是中继。
      这是验证某台远程机器是否可达的最佳方式。
    command: "tailscale status"

  - title: tailscale - 显示 IP 地址
    desc: |
      获取分配给本机的内部 Tailscale IPv4 和 IPv6 地址。这些地址在 tailnet 内是静态的，可用于内部服务配置。
      指定 version 参数可仅返回脚本所需的特定协议地址。
    command: "tailscale ip -{{version|4}}"

  - title: tailscale - 识别对等节点信息
    desc: |
      提供与特定 Tailscale IP 关联的用户和机器的详细信息。此命令对于审计流量以及识别某个节点属于哪个人员或服务很有用。
      它适用于内部 100.x.y.z 范围或 Tailscale IPv6 范围中的任何 IP 地址。
    command: "tailscale whois {{peer_ip}}"

  # === NETWORK DIAGNOSTICS ===
  - title: tailscale - 二层连通性测试
    desc: |
      在 Tailscale 网络层对特定主机执行连通性测试。与标准系统 ping 不同，它揭示了路径是通过直接 WireGuard 连接建立还是通过 DERP 中继建立。
      它是排查高延迟或对等节点发现问题的必备工具。
    command: "tailscale ping {{target_host}}"

  - title: tailscale - 诊断网络状况
    desc: |
      分析本地网络环境，检测 NAT 类型和防火墙限制。输出显示最近的 Tailscale 中继（DERP）服务器，以及节点能否建立直接 UDP 连接。
      当你遇到速度慢或连接状态为“中继”时使用。
    command: "tailscale netcheck"

  # === REMOTE ACCESS AND FILE OPERATIONS ===
  - title: tailscale - 安全远程 Shell
    desc: |
      使用 Tailscale 内置 SSH 功能向远程节点发起 SSH 会话。它利用 Tailscale 基于身份而非传统 SSH 密钥的访问控制进行认证。
      目标机器必须在配置中启用 Tailscale SSH 才能使用此功能。
    command: "tailscale ssh {{user|root}}@{{host}}"

  - title: tailscale - 向对等节点发送文件
    desc: |
      使用 Taildrop 协议将文件传输到 tailnet 上的另一台机器。文件将存储在接收设备默认的 Taildrop 接收文件夹中。
      这提供了一种安全加密的方式在设备之间移动数据，而无需使用外部云存储。
    command: "tailscale file cp {{file_path}} {{target_node_name}}:"

  - title: tailscale - 接收待接收文件
    desc: |
      检查并下载通过 Taildrop 发送到当前机器的任何文件。默认情况下除非指定路径，否则文件将保存到当前工作目录。
      这是在无法使用 GUI 的 Linux 系统上手动获取传入传输的方式。
    command: "tailscale file get {{destination_directory|.}}"

  # === SERVICE EXPOSURE ===
  - title: tailscale - 托管本地 Web 服务
    desc: |
      将本地端口作为 Web 服务暴露给你的私有 tailnet。这使 tailnet 中的其他机器可以通过你的 Tailscale 节点名访问本地开发服务器。
      它还可以为该服务自动生成和终止 HTTPS 证书。
    command: "tailscale serve --https {{port|443}} {{local_target|http://127.0.0.1:8080}}"

  - title: tailscale - 将服务暴露到互联网（Funnel）
    desc: |
      通过 Tailscale Funnel 使本地服务可以从公共互联网访问。这会将公共流量经 Tailscale 边缘节点路由到你的私有机器。
      使用时需格外谨慎，因为它会绕过指定端口的 tailnet 私有性。
    command: "tailscale funnel {{port|443}} on"

  # === ADVANCED ROUTING ===
  - title: tailscale - 启用出口节点路由
    desc: |
      配置本机，使其所有非内部互联网流量都通过特定出口节点路由。其功能类似于传统 VPN，用出口节点的 IP 掩盖你的本地公网 IP。
      目标节点必须在 Tailscale 管理控制台中配置并被授权作为出口节点。
    command: "tailscale up --exit-node={{exit_node_ip_or_name}}"

  - title: tailscale - 列出可用出口节点
    desc: |
      显示当前 tailnet 中所有已配置为出口节点的机器。这有助于识别哪些节点可用于路由你的互联网流量。
      输出包含每个潜在出口节点的位置和状态。
    command: "tailscale exit-node list"