tool: dnsrecon
tags: [network, reconnaissance, dns, pentest, enumeration, security, information-gathering]

actions:
  # === BASIC ENUMERATION ===
  - title: dnsrecon - 标准枚举
    desc: |
      执行标准的 DNS 枚举，收集目标的一般信息。
      查询常见记录，包括 SOA、NS、A、AAAA、MX 和 SRV，通常是识别目标主要基础设施和邮件服务器的第一步。
    command: "dnsrecon -d {{domain}} -t std"

  - title: dnsrecon - 区域传送尝试
    desc: |
      对目标域名的所有已识别域名服务器尝试 AXFR 区域传送。
      成功的区域传送可让攻击者无需暴力破解即可看到 DNS 区域中的每条记录，这是每次渗透测试都应检查的关键安全错误配置。
    command: "dnsrecon -d {{domain}} -a"

  - title: dnsrecon - 综合扫描
    desc: |
      将标准枚举与区域传送尝试和证书透明度检查相结合。
      用一条命令即可提供目标域名的广泛概览，对初始数据收集非常高效，但可能比单项扫描噪声更大。
    command: "dnsrecon -d {{domain}} -t std,crt -a"

  # === BRUTE FORCE & DISCOVERY ===
  - title: dnsrecon - 字典暴力破解
    desc: |
      使用字典文件通过尝试常见名称来发现子域名和主机名。
      当管理员禁用 DNS 区域传送时此技术必不可少，可增加线程数以加快更大字典上的发现进程。
    command: "dnsrecon -d {{domain}} -D {{wordlist|/usr/share/wordlists/dnsmap.txt}} -t brt --threads {{threads|10}}"

  - title: dnsrecon - 带通配符过滤的暴力破解
    desc: |
      执行暴力破解攻击，同时过滤掉解析到通配符 IP 地址的记录。
      通配符 DNS 会导致子域名枚举中出现大量误报，使用 -f 标志可确保结果只包含唯一且有效的主机条目。
    command: "dnsrecon -d {{domain}} -D {{wordlist}} -t brt -f"

  # === REVERSE & NETWORK MAPPING ===
  - title: dnsrecon - 反向查询范围
    desc: |
      对特定 IP 范围或 CIDR 块执行反向 DNS 查询，以识别关联的主机名。
      对映射内部网络或识别属于目标的云托管资产非常有用，使用 PTR 记录将 IP 地址转换回可读的域名。
    command: "dnsrecon -r {{ip_range}} -t rvl"

  - title: dnsrecon - 从 SPF 反向查询
    desc: |
      从 SPF（发件人策略框架）记录中提取 IP 范围，并对其执行反向查询。
      SPF 记录通常包含授权邮件服务器及相关网络的 IP 地址，可提供一种聚焦方式来发现目标组织直接拥有或使用的基础设施。
    command: "dnsrecon -d {{domain}} -s"

  # === OSINT & EXTERNAL SOURCES ===
  - title: dnsrecon - 证书透明度搜索
    desc: |
      使用 crt.sh 证书透明度日志搜索子域名和主机。
      这是一种不直接与目标 DNS 服务器交互的被动侦察技术，对查找过去签发过 SSL 证书的隐藏子域名非常出色。
    command: "dnsrecon -d {{domain}} -t crt"

  - title: dnsrecon - 搜索引擎枚举
    desc: |
      查询 Bing 或 Yandex 等搜索引擎，以发现被公开索引的子域名和主机。
      可揭示标准字典中不存在的开发或测试环境，注意频繁使用可能触发搜索引擎的验证码或临时封禁。
    command: "dnsrecon -d {{domain}} -t {{search_engine|bing}}"

  # === ADVANCED TECHNIQUES ===
  - title: dnsrecon - DNSSEC 区域遍历
    desc: |
      通过利用 NSEC 记录尝试 DNSSEC 区域遍历，以枚举整个 DNS 区域。
      如果目标使用 NSEC 而非 NSEC3，就有可能重建完整的主机列表，这是枚举严格访问控制区域的强大方法。
    command: "dnsrecon -d {{domain}} -z"

  - title: dnsrecon - 缓存探测
    desc: |
      对特定域名服务器执行 DNS 缓存探测，查看某些域名最近是否被解析过。
      可提供关于该 DNS 服务器背后用户浏览习惯或软件更新的洞察，此攻击需指定字典文件（-D）和目标域名服务器（-n）。
    command: "dnsrecon -t snoop -D {{wordlist}} -n {{nameserver}}"

  - title: dnsrecon - TLD 扩展
    desc: |
      将目标域名与 IANA 注册的所有顶级域名（TLD）进行比对检查。
      有助于识别相关域名、品牌保护问题或潜在的钓鱼网站，它会剥离原始扩展名并暴力破解所有其他可能的 TLD。
    command: "dnsrecon -d {{domain}} -t tld"

  # === DATA MANAGEMENT ===
  - title: dnsrecon - 导出为 JSON 和 XML
    desc: |
      运行标准枚举，并将输出同时保存为 JSON 和 XML 格式。
      将结果保存为结构化文件对文档记录和其他工具的自动化解析至关重要，可防止数据丢失并便于比较不同扫描会话。
    command: "dnsrecon -d {{domain}} -t std --json {{json_file|results.json}} --xml {{xml_file|results.xml}}"

  - title: dnsrecon - 保存到 SQLite 数据库
    desc: |
      执行扫描并将所有发现的记录直接存储到 SQLite 数据库文件。
      使用数据库非常适合需要之后查询结果的大规模侦察项目，可保持工作区井然有序并持久存储收集到的情报。
    command: "dnsrecon -d {{domain}} -t std --db {{db_name|recon.db}}"
