tool: findomain
tags: [subdomain-enumeration, reconnaissance, pentest, osint, security, network-security]

actions:
  # === BASIC ENUMERATION ===
  - title: findomain - 基本枚举
    desc: |
      对单个目标域名执行基本的子域名发现。
      此命令使用公共 API 快速查找子域名，默认不执行任何主动解析，是开始收集目标基础设施信息的主要方式，默认操作无需特殊权限或 API 密钥。
    command: "findomain -t {{target}}"

  - title: findomain - 仅已解析的子域名
    desc: |
      过滤发现结果，仅显示成功解析到 IP 地址的子域名。
      可用于消除过期的 DNS 记录并专注于活跃基础设施，对每个发现的子域名执行 DNS 查询以验证其存在。
    command: "findomain -t {{target}} -r"

  - title: findomain - 显示 IP 地址
    desc: |
      发现子域名并在输出中显示其关联的 IP 地址。
      可立即了解目标使用的网络映射和托管提供商，将枚举与 DNS 解析相结合以提供更详细的概览，注意这会比简单的 API 搜索增加扫描时间。
    command: "findomain -t {{target}} -i"

  # === OUTPUT MANAGEMENT ===
  - title: findomain - 自动输出文件
    desc: |
      运行扫描并自动将结果保存到以目标命名的文本文件。
      确保你对发现结果有持久记录以供日后分析，文件在当前工作目录中创建，是渗透测试侦察阶段的标准做法。
    command: "findomain -t {{target}} -o"

  - title: findomain - 自定义输出文件名
    desc: |
      将发现结果保存到你选择的特定文件名。
      当你想整理项目文件或将结果追加到特定日志时非常有用，与自动命名约定相比，可对输出管理提供更多控制。
    command: "findomain -t {{target}} -u {{output_file|results.txt}}"

  # === ADVANCED DISCOVERY ===
  - title: findomain - 暴力破解模式
    desc: |
      使用提供的字典执行子域名暴力破解攻击。
      用于查找未被公共搜索引擎或证书透明度日志索引的隐藏子域名，使用此选项会自动启用主动解析，注意这会产生大量 DNS 流量并可能被目标 DNS 基础设施记录。
    command: "findomain -t {{target}} -w {{wordlist|/usr/share/wordlists/dirb/common.txt}}"

  - title: findomain - 外部工具集成
    desc: |
      通过集成 Amass 和 Subfinder 的结果来扩展搜索能力。
      此命令需要这些工具已安装并可在系统路径中访问，结合多个工具可实现对目标攻击面更全面的覆盖。
    command: "findomain -t {{target}} --external-subdomains"

  - title: findomain - 排除特定数据源
    desc: |
      从搜索中排除特定数据源以避免速率限制或不可靠的数据。
      当某个 API 较慢，或你想跳过已经查询过的来源时很有帮助，可提供逗号分隔的来源列表进行排除。
    command: "findomain -t {{target}} --exclude-sources {{sources|facebook,virustotalapikey}}"

  # === ANALYSIS & PROBING ===
  - title: findomain - 检查 HTTP 状态
    desc: |
      检查每个已发现子域名的 HTTP 响应状态码。
      有助于识别哪些子域名正在运行 Web 服务器及其当前状态（如 200 OK、403 Forbidden），对优先处理具有活跃 Web 界面的目标至关重要。
    command: "findomain -t {{target}} --http-status"

  - title: findomain - 端口扫描
    desc: |
      启用内置端口扫描器以识别已发现子域名上的开放端口。
      默认扫描常见端口范围以查找活动服务，是从侦察转向服务识别的关键步骤，可用 --iport 和 --lport 等额外标志定义端口范围。
    command: "findomain -t {{target}} --pscan --iport {{start_port|0}} --lport {{end_port|1000}}"

  - title: findomain - 捕获截图
    desc: |
      自动对发现过程中找到的活跃 Web 服务进行截图。
      提供目标 Web 资产的可视化表示，便于识别有趣的页面或登录面板，需要系统安装 Chrome 或 Chromium，结果保存到指定路径以供日后查看。
    command: "findomain -t {{target}} -s {{screenshot_path|./screenshots}}"

  # === MASS PROCESSING ===
  - title: findomain - 从文件扫描
    desc: |
      从文件读取目标域名列表并对每个执行枚举。
      对涉及多个父域名的大规模评估非常高效，工具会按顺序或根据配置的线程限制处理每个域名，确保文件每行一个域名。
    command: "findomain -f {{input_file|domains.txt}}"

  - title: findomain - 从标准输入读取
    desc: |
      通过标准输入（stdin）接受目标域名。
      允许你将其他工具的输出直接管道传递给 findomain 进行处理，非常适合自动化脚本和复杂的侦察管道，使 findomain 能作为更大安全工具集中的模块化组件运行。
    command: "cat {{input_file}} | findomain --stdin"
