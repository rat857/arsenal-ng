tool: proxify
tags: [network, proxy, security, pentest, enumeration, debugging, web]

actions:
# === BASIC USAGE & NETWORK CONFIGURATION ===

 - title: proxify - 启动默认代理
   desc: |
     使用默认设置启动 proxify 工具。
     它默认在 8888 端口监听 HTTP 流量，在 10080 端口监听 SOCKS5 流量。
     这是开始拦截本地流量进行分析的最快方式。
     确保你的浏览器或应用程序已配置为使用这些端口作为代理。
   command: "proxify"

 - title: proxify - 自定义监听地址
   desc: |
     将工具配置为在特定 IP 地址和端口上同时监听 HTTP 和 SOCKS 流量。
     当默认端口已被其他服务占用，或需要在特定网络接口上暴露代理时很有用。
     务必确认所选端口已通过本地防火墙，以防止连接问题。
   command: "proxify -http-addr {{listen_ip_port|127.0.0.1:8081}} -sa {{socks_ip_port|127.0.0.1:10081}}"

 - title: proxify - DNS 服务器与映射
   desc: |
     启动本地 DNS 服务器并应用自定义的域名到 IP 映射。
     此功能允许你将特定域名的流量重定向到目标 IP，而无需修改系统 hosts 文件。
     它在渗透测试中测试虚拟主机或绕过基于 DNS 的负载均衡器时非常有效。
   command: "proxify -da {{dns_addr|127.0.0.1:53}} -dm {{mapping|example.com:1.2.3.4}}"

# === INTERCEPTION & LOGGING ===

 - title: proxify - 将原始流量记录到目录
   desc: |
     将所有原始 HTTP 请求和响应捕获并存储到指定的输出目录。
     每个请求和响应对会保存为单独的文件，便于 grep 历史流量。
     这对于需要保留证据或稍后进行深度手工分析的长期行动至关重要。
   command: "proxify -sr -o {{output_directory|proxify_logs}}"

 - title: proxify - 结构化输出日志
   desc: |
     将拦截的流量元数据以 JSONL 或 YAML 格式保存到单个结构化文件中。
     这非常适合将代理输出导入其他工具或自定义脚本进行自动化分析。
     你可以指定格式和文件名，以高效地组织你的侦察数据。
   command: "proxify -o {{output_file|logs.jsonl}} -of {{format|jsonl}}"

 - title: proxify - 仅转储请求
   desc: |
     过滤输出，只记录 HTTP 请求而忽略响应。
     当你只关心被访问的出站载荷、头和端点时使用。
     当服务器响应很大或重复时，这可以显著减小日志文件的大小。
   command: "proxify -dump-req -o {{output_file|requests.jsonl}}"

# === UPSTREAM PROXYING & CHAINING ===

 - title: proxify - 链接到上游 HTTP 代理
   desc: |
     将所有拦截的流量转发到诸如 Burp Suite 或 ZAP 等上游 HTTP 代理。
     这允许你在将流量传递给基于 GUI 的拦截器之前，使用 Proxify 进行初步过滤或修改。
     当你同时需要 CLI 和 GUI 代理的功能时，这是复杂工作流中的常见设置。
   command: "proxify -http-proxy {{upstream_url|http://127.0.0.1:8080}}"

 - title: proxify - 链接到上游 SOCKS5 代理
   desc: |
     通过上游 SOCKS5 代理（如 TOR 网络或 SSH 隧道）路由所有流量。
     这对于匿名化你的源 IP 或通过枢纽点访问内部资源特别有用。
     可以提供多个上游代理，为每个请求轮换出口 IP 地址。
   command: "proxify -socks5-proxy {{upstream_socks|127.0.0.1:9050}}"

# === FILTERING & MANIPULATION ===

 - title: proxify - 使用 DSL 过滤请求
   desc: |
     应用领域特定语言（DSL）过滤器，只捕获特定类型的请求。
     这使你能够忽略噪声并专注于相关流量，例如正文或头中包含特定关键字的请求。
     DSL 过滤对于现代 Web 应用的有针对性调试极为强大。
   command: "proxify -req-fd {{dsl_filter|'contains(request, \"api/v1\")'}}"

 - title: proxify - 在请求中匹配和替换
   desc: |
     使用 DSL 规则在请求中即时自动查找和替换字符串。
     这对于注入自定义头、修改 User-Agent 或全局更改参数值很有用。
     使用正则表达式时要小心，以免意外破坏应用程序的逻辑或身份验证令牌。
   command: "proxify -req-mrd {{match_replace_rule|'replace(request, \"User-Agent\", \"Security-Scanner\")'}}"

 - title: proxify - 响应匹配和替换
   desc: |
     根据指定的 DSL 条件，在服务器响应到达客户端之前进行修改。
     可用于绕过客户端控制、禁用 CSP 等安全头，或向 HTML 正文注入调试脚本。
     这是高级 Web 利用和测试客户端漏洞的关键技术。
   command: "proxify -resp-mrd {{match_replace_rule|'replace(response, \"<head>\", \"<head><script>alert(1)</script>\")'}}"

# === ADVANCED CONFIGURATION ===

 - title: proxify - TLS 透传
   desc: |
     指定应绕过代理且不终止 TLS 的域名。
     用于使用证书固定的域名，或你不想干扰加密流的服务。
     它可以防止浏览器对特定受信任端点出现「你的连接不是私密连接」的错误。
   command: "proxify -pt {{domain_regex|'(.*\\.)?google\\.com.*'}}"

 - title: proxify - 访问控制列表
   desc: |
     将代理使用限制在特定的允许 IP 地址或 CIDR 范围列表内。
     在远程服务器上运行 Proxify 时，这是防止未经授权用户使用你的代理的关键安全措施。
     任何从未列入允许列表的 IP 尝试连接都将被拒绝访问。
   command: "proxify -allow {{allowed_ips|192.168.1.0/24,10.0.0.5}}"