tool: windapsearch
tags: [active-directory, ldap, enumeration, pentest, security, network, discovery]

actions:
  # === BASIC ENUMERATION ===
  - title: windapsearch - 检查域功能级别
    desc: |
      枚举目标 Active Directory 环境的域功能级别。这通常可以通过匿名绑定完成，并首次窥探域的历史和特性。
      它有助于根据功能级别确定哪些现代 AD 攻击可能适用。
    command: "windapsearch --dc-ip {{dc_ip}} --functionality"

  - title: windapsearch - 列出所有域用户
    desc: |
      对 Active Directory 域中的所有用户对象执行完整枚举。这是构建有效用户名列表用于密码喷洒的基础侦察步骤。
      需要有效的域账户或允许匿名 LDAP 绑定的环境。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} -U"

  - title: windapsearch - 列出所有域组
    desc: |
      获取域中所有安全组和分发组的完整列表。有助于测绘组织结构并识别可能拥有敏感权限的组。
      分析师用它查找基础枚举期间可能被忽视的非标准组。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} -G"

  - title: windapsearch - 列出所有计算机对象
    desc: |
      查询 LDAP 以查找 Active Directory 域中注册的所有计算机对象。此命令对于识别可作为横向移动目标的工作站和服务器至关重要。
      它有助于可视化网络拓扑并识别 SQL 或 Exchange 等高价值服务器。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} -C"

  # === PRIVILEGE & ACCESS ENUMERATION ===
  - title: windapsearch - 递归查找域管理员成员
    desc: |
      专门针对 Domain Admins 组并递归列出其所有成员。递归在此至关重要，因为它能找到嵌套在 Domain Admins 内的其他组的成员用户。
      这识别了域中权限最高的用户，使其成为凭据窃取的首要目标。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} --da"

  - title: windapsearch - 枚举特权用户
    desc: |
      查找 Active Directory 林中拥有高级权限的所有用户。此命令对各管理组执行嵌套成员的递归查询。
      它是识别标准 Domain Admins 组之外“王国钥匙”的全面方式。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} -PU"

  - title: windapsearch - 搜索管理员对象（受保护 ACL）
    desc: |
      枚举所有具有受保护访问控制列表（ACL）的对象。在 AD 中 adminCount=1 的对象受 AdminSDHolder 进程保护，通常表示管理账户。
      这有助于识别可能不在标准管理组但仍拥有提升权限的账户。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} --admin-objects"

  - title: windapsearch - 组成员查询
    desc: |
      列出特定用户定义的 Active Directory 组的所有成员。当你发现一个有趣的组名（如 IT_Admins 或 Finance_Access）并想查看其成员时很有用。
      将占位符替换为你要调查的确切组名。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} -m {{group_name}}"

  # === VULNERABILITY & MISCONFIGURATION DISCOVERY ===
  - title: windapsearch - 识别可 Kerberoast 的用户
    desc: |
      枚举所有设置了服务主体名称（SPN）的用户对象。这些账户容易受到 Kerberoasting 攻击，攻击者可以请求服务票据并尝试离线破解密码。
      这是 AD 环境中提权最常见且有效的方法之一。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} --user-spns"

  - title: windapsearch - 具有无约束委派的用户
    desc: |
      识别配置了无约束委派的用户账户。当具有无约束委派的用户被攻陷时，攻击者可以冒充任何向该服务认证的用户。
      这是重大安全风险，也是较旧 AD 环境安全审计中的常见发现。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} --unconstrained-users"

  - title: windapsearch - 具有无约束委派的计算机
    desc: |
      列出域中允许执行无约束委派的计算机对象。攻陷此类机器允许攻击者收割任何连接它的用户的 TGT（例如通过 Printer Bug）。
      这在现代 AD 利用链中常用于从域用户提升到域管理员。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} --unconstrained-computers"

  - title: windapsearch - 列出组策略对象（GPO）
    desc: |
      枚举 Active Directory 中定义的所有组策略对象（GPO）。GPO 控制整个域的安全配置，可能包含脚本或注册表设置等敏感信息。
      了解 GPO 有助于攻击者识别安全策略如何执行以及何处可能被绕过。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} --gpos"

  # === ADVANCED QUERIES & OUTPUT ===
  - title: windapsearch - 自定义 LDAP 过滤器
    desc: |
      对目标域控制器执行完全自定义的 LDAP 查询。这允许高度特定的搜索，如查找具有特定 Account Control 标志或自定义属性的用户。
      用户必须提供有效的 LDAP 过滤器字符串以确保查询正确执行。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} --custom \"{{ldap_filter|(objectClass=user)}}\""

  - title: windapsearch - 使用自定义属性搜索
    desc: |
      执行用户搜索，仅返回特定 LDAP 属性。默认情况下 LDAP 返回许多字段；这会将其缩小到 lastLogon 或 badPwdCount 等特定数据。
      这对于收集有针对性的情报而无需筛选大量冗余数据很有用。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} -U --attrs {{attributes|sAMAccountName,description,memberOf}}"

  - title: windapsearch - 对象模糊搜索
    desc: |
      在目录中执行模糊搜索，查找匹配特定术语的所有条目。当你只知道名称或服务的一部分但不确定其确切 DN 或对象类别时很有帮助。
      它扫描多个字段以找到与搜索词最相关的匹配。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} -s {{search_term}}"

  - title: windapsearch - 将全部属性转储到文件
    desc: |
      转储所有用户的每一个可用 LDAP 属性，并将输出保存到目录。--full 参数确保不遗漏任何数据，这对深度离线分析至关重要。
      输出以 TSV 格式保存，便于导入电子表格或其他分析工具。
    command: "windapsearch --dc-ip {{dc_ip}} -u {{username}} -p {{password}} -U --full -o {{output_dir|results}}"