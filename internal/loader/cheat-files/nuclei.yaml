tool: nuclei
tags: [vulnerability-scanner, security, pentest, automation, network, web, reconnaissance]

actions:
  # === TARGETING & BASIC SCANS ===
  - title: nuclei - 扫描单个目标
    desc: |
      对单个目标 URL 或主机运行标准漏洞扫描。此命令使用默认模板目录识别错误配置和漏洞。
      这是对特定 Web 应用进行快速安全评估的最常见入口。
    command: "nuclei -u {{target}}"

  - title: nuclei - 扫描目标列表
    desc: |
      对以行分隔文本文件提供的多个目标执行模板。适合大规模基础设施扫描或漏洞赏金自动化。
      确保文件包含有效的 URL 或 IP 地址以避免解析错误。
    command: "nuclei -l {{targets_file|hosts.txt}}"

  - title: nuclei - 带技术识别的自动扫描
    desc: |
      利用基于 Wappalyzer 的技术检测，自动将相关模板映射到目标。此模式只运行与识别出的技术栈（如 WordPress、Nginx）匹配的模板，从而减少扫描时间。
      对于无需手动指定模板标签的高效扫描，强烈推荐。
    command: "nuclei -u {{target}} -as"

  # === TEMPLATE FILTERING & SELECTION ===
  - title: nuclei - 按特定标签扫描
    desc: |
      过滤并只运行匹配 cve、exposure 或 default-login 等特定标签的模板。这允许在寻找特定类别漏洞时进行精准扫描。
      可以提供多个以逗号分隔的标签以扩大范围。
    command: "nuclei -u {{target}} -tags {{tags|cve,config,exposure}}"

  - title: nuclei - 按严重程度扫描
    desc: |
      运行按严重程度（如 critical、high 或 medium）过滤的模板。在时间紧迫的测试中，这非常有用，可优先处理影响最大的发现。
      用它忽略可能会弄乱报告的信息级或低严重程度发现。
    command: "nuclei -u {{target}} -severity {{severity|critical,high}}"

  - title: nuclei - 仅运行新模板
    desc: |
      只执行 nuclei-templates 仓库最新版本中新增的模板。这是跟上最新 1-day 漏洞和零日披露的绝佳方式。
      它确保你在检查最新威胁，而无需重新扫描旧漏洞。
    command: "nuclei -u {{target}} -nt"

  - title: nuclei - 运行特定模板目录
    desc: |
      通过指向特定模板文件夹来针对特定类别的漏洞。例如，你可以指向 http/cves/ 只检查已知 CVE。
      这有助于将扫描聚焦于特定协议或漏洞类型。
    command: "nuclei -u {{target}} -t {{template_path|http/vulnerabilities/}}"

  # === ADVANCED SCANNING MODES ===
  - title: nuclei - 无头浏览器扫描
    desc: |
      启用需要无头浏览器渲染 JavaScript 密集型应用的模板。这对标准 HTTP 请求不足的现代单页应用（SPA）是必要的。
      注意这需要更多系统资源，可能比标准扫描更慢。
    command: "nuclei -u {{target}} -headless"

  - title: nuclei - DAST / 模糊测试模式
    desc: |
      启用聚焦于参数模糊测试的动态应用安全测试（DAST）模板。此模式尝试通过操纵输入字段发现 XSS、SQLi 和 SSRF 等漏洞。
      请谨慎使用，因为它可能具有侵入性并产生大量流量。
    command: "nuclei -u {{target}} -dast"

  - title: nuclei - 被动扫描
    desc: |
      启用被动 HTTP 响应处理模式，不为每个模板发送新请求。它分析初始请求收到的响应以识别漏洞或暴露。
      这比主动扫描安静得多且侵入性更小，适合隐蔽侦察。
    command: "nuclei -u {{target}} -passive"

  # === PERFORMANCE & EVASION ===
  - title: nuclei - 速率限制与并发
    desc: |
      通过设置每秒最大请求数来控制扫描速度。调整速率限制对于避免触发 WAF 阻断或压垮脆弱的遗留服务至关重要。
      rl 设置每秒请求数，而 c 设置并行运行的模板数。
    command: "nuclei -u {{target}} -rl {{rate|50}} -c {{concurrency|25}}"

  - title: nuclei - 自定义 Header 和 Cookie
    desc: |
      向 Nuclei 发送的每个请求注入自定义 HTTP header 或认证 Cookie。这对扫描需要活动会话的应用受保护区域至关重要。
      将 header 格式化为 Header-Name: value，多个 header 使用多个标志。
    command: "nuclei -u {{target}} -H \"{{header|Cookie: session=12345}}\""

  - title: nuclei - 代理集成
    desc: |
      将所有出站流量经由指定的 HTTP 或 SOCKS5 代理转发。可用于将流量隧道到 Burp Suite 进行深入分析，或掩盖扫描器的 IP 地址。
      也可用于通过跳板主机到达内部目标。
    command: "nuclei -u {{target}} -proxy {{proxy_url|http://127.0.0.1:8080}}"

  # === OSINT & EXTERNAL ENGINES ===
  - title: nuclei - Uncover 引擎（Shodan/Censys）
    desc: |
      与 Uncover 集成，直接从 Shodan、Censys 或 Fofa 等搜索引擎拉取目标。这允许你根据查询扫描整个互联网以寻找特定模式或漏洞。
      你必须在环境或配置文件中配置相应的 API 密钥。
    command: "nuclei -uc -uq \"{{query|app:'Apache}}\" -ue {{engine|shodan}}"

  # === REPORTING & OUTPUT ===
  - title: nuclei - 导出结果为 JSON
    desc: |
      将扫描发现保存为 JSON 格式，便于与其他工具或自定义脚本集成。JSON 输出包含每个发现的详细元数据，若启用还包括请求/响应对。
      这是自动化流水线和数据处理的首选格式。
    command: "nuclei -u {{target}} -je {{output_file|results.json}}"

  - title: nuclei - 导出结果为 Markdown
    desc: |
      生成按漏洞类型组织的 Markdown 格式人类可读报告。适合为客户和利益相关者快速创建文档或报告。
      输出目录将包含针对不同发现的单独文件。
    command: "nuclei -u {{target}} -me {{output_dir|nuclei_report}}"

  - title: nuclei - 仅显示发现的静默模式
    desc: |
      抑制所有横幅和进度信息，只显示实际发现的漏洞。当将 Nuclei 输出管道到 notify 或 grep 等其他命令行工具时很有用。
      它保持终端干净，只聚焦于可操作的数据。
    command: "nuclei -u {{target}} -silent"

  # === MAINTENANCE ===
  - title: nuclei - 更新模板和工具
    desc: |
      将 Nuclei 引擎和社区提供的模板更新到最新版本。定期更新至关重要，因为社区每周都会添加数十个新的漏洞模板。
      经常运行以确保你的扫描能力保持最新。
    command: "nuclei -ut && nuclei -version"