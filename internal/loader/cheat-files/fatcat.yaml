tool: fatcat
tags: [forensics, filesystem, security, recovery, pentest, disk-analysis]

actions:
  # === INFORMATION & EXPLORATION ===
  - title: fatcat - 显示磁盘信息
    desc: |
      显示所提供镜像中 FAT 文件系统的一般信息。
      此命令通常是调查的第一步，用于识别 FAT 类型（FAT12、FAT16 或 FAT32）并验证引导扇区完整性，会显示扇区大小、簇大小和 FAT 表数量等详细信息。
    command: "fatcat {{image}} -i"

  - title: fatcat - 列出文件和目录
    desc: |
      列出磁盘镜像内特定目录路径的内容。
      如果未指定路径，通常默认根目录，对映射文件结构并识别值得进一步分析的有趣文件非常有用。
    command: "fatcat {{image}} -l {{path|/}}"

  - title: fatcat - 列出特定簇中的文件
    desc: |
      列出磁盘上特定簇号内发现的所有条目。
      当你怀疑某目录位于特定位置但未链接到标准树中时，使用这种底层操作，它绕过目录路径逻辑直接读取簇的原始条目数据。
    command: "fatcat {{image}} -L {{cluster}}"

  - title: fatcat - 列出已删除文件
    desc: |
      列出目录内容，同时特别包含被标记为已删除的条目。
      FAT 系统通过更改文件名的第一个字符来标记删除，但数据往往仍然存在，此命令帮助取证调查人员识别用户试图隐藏或删除的潜在证据。
    command: "fatcat {{image}} -l {{path|/}} -d"

  # === EXTRACTION & RECOVERY ===
  - title: fatcat - 提取所有文件
    desc: |
      将磁盘镜像的完整内容提取到指定的本地目录。
      -d 标志确保在提取过程中也尝试恢复已删除的文件，注意如果已删除文件的簇被较新数据覆盖，恢复的文件可能会损坏。
    command: "fatcat {{image}} -x {{output_directory}} -d"

  - title: fatcat - 读取特定文件
    desc: |
      读取单个文件的内容并输出到标准输出。
      你可以将此输出重定向到本地机器上的文件，从而在不提取整个磁盘的情况下提取特定证据，对定位已知配置文件或日志非常高效。
    command: "fatcat {{image}} -r {{path}} > {{output_file}}"

  - title: fatcat - 从簇读取原始数据
    desc: |
      直接从特定簇读取指定大小的原始数据。
      当文件系统元数据严重损坏时，这对手动取证重建至关重要，无论 FAT 表怎么说，都可从磁盘镜像中提取原始字节。
    command: "fatcat {{image}} -R {{cluster}} -s {{size|512}}"

  # === FAT TABLE ANALYSIS ===
  - title: fatcat - 比较 FAT 表
    desc: |
      分析并比较主 FAT 表和次 FAT 表之间的差异。
      标准 FAT 文件系统保留两份分配表，若它们不同，则表明存在损坏或人为篡改，此命令对验证分区的结构完整性至关重要。
    command: "fatcat {{image}} -2"

  - title: fatcat - 搜索孤立文件
    desc: |
      搜索未链接到根目录结构的孤立文件和目录。
      孤立文件通常由不当卸载或对目录条目的故意操作造成，这是发现标准文件列表中不出现的隐藏数据的强大取证功能。
    command: "fatcat {{image}} -o"

  - title: fatcat - 备份 FAT 表
    desc: |
      将 FAT 表备份到单独的文件。
      在执行任何写入操作或修改条目表之前都应这样做以避免永久数据丢失，-t 标志可指定备份哪张表（0 表示两张、1 表示第一张、2 表示第二张）。
    command: "fatcat {{image}} -b {{backup_file}} -t {{table|0}}"

  # === FILESYSTEM HACKING (WRITING) ===
  - title: fatcat - 修改目录项起始簇（有风险）
    desc: |
      手动更改特定文件或目录条目的起始簇。
      这是一条直接修改磁盘镜像的修改命令，使用不当可能导致损坏，在高级取证中用于手动将文件名指向磁盘上的不同数据区域。
    command: "fatcat {{image}} -e {{path}} -c {{new_cluster}}"

  - title: fatcat - 修改文件大小（有风险）
    desc: |
      手动设置目录结构中文件条目的大小。
      当文件元数据报告的大小错误、导致底层数据无法完整提取时使用，警告：此命令会写入磁盘镜像，操作前请确保已有备份。
    command: "fatcat {{image}} -e {{path}} -s {{new_size}}"

  - title: fatcat - 修复可达目录
    desc: |
      尝试自动修复可达但逻辑上不一致的目录结构。
      可修复目录链接损坏的某些类型的文件系统损坏，此命令会修改镜像，仅应在手动分析并备份 FAT 后使用。
    command: "fatcat {{image}} -f"
