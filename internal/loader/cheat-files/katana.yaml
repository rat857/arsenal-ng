tool: katana
tags: [web, scanner, reconnaissance, crawler, pentest, security, automation]

actions:
  # === BASIC CRAWLING ===
  - title: katana - 基础爬取
    desc: |
      对单个目标 URL 执行标准爬取。默认只跟踪同一范围内的链接，以发现端点和资产。
      这是侦察初期阶段梳理 Web 应用结构最常见的入口，返回通过简单 HTML 解析发现的 URL 列表。
    command: "katana -u {{target_url}}"

  - title: katana - 基于列表的爬取
    desc: |
      爬取文本文件中提供的多个目标。这对跨多个域名或子域名的大规模侦察非常高效。
      列表中的每个 URL 都会按默认或指定配置处理，非常适合从 subfinder 等工具传入活动子域名列表的自动化流水线。
    command: "katana -list {{target_list_file}}"

  - title: katana - 指定深度爬取
    desc: |
      设置爬虫从起点跟踪链接的最大深度。更高的深度值能带来更彻底的发现，但会显著增加执行时间和资源占用。
      当默认深度（通常为 3）不足以应对目录结构复杂的应用时使用。
    command: "katana -u {{target_url}} -d {{depth|5}}"

  # === ADVANCED DISCOVERY ===
  - title: katana - JavaScript 端点提取
    desc: |
      启用对 JavaScript 文件中发现的端点进行解析和爬取。这对现代单页应用（SPA）至关重要，因为许多路由和 API 端点定义在客户端代码中。
      启用此选项有助于发现 HTML 源码中未直接链接的隐藏功能。
    command: "katana -u {{target_url}} -jc"

  - title: katana - 深度 JavaScript 解析（jsluice）
    desc: |
      使用 jsluice 库对 JavaScript 文件进行更深入、更准确的解析。虽然更耗内存，但在从复杂 JS 包中提取 URL 和密钥方面效果更佳。
      对 React 或 Angular 等现代 Web 框架做深度人工评估时推荐使用。
    command: "katana -u {{target_url}} -jsl"

  - title: katana - 爬取已知文件
    desc: |
      专门指示爬虫查找并解析 robots.txt 和 sitemap.xml 等常见文件。这些文件通常包含指向 Web 应用敏感或隐藏区域的显式路径。
      通常需要至少 3 的深度，以确保引擎正确发现并处理这些文件。
    command: "katana -u {{target_url}} -kf {{file_type|all}}"

  # === HEADLESS CRAWLING ===
  - title: katana - 无头混合爬取
    desc: |
      使用无头浏览器爬取目标，允许执行动态 JavaScript。此模式对于捕获仅在运行时生成的元素、请求和路由至关重要。
      注意无头模式比标准 Go 爬虫消耗明显更多的 CPU 和内存。
    command: "katana -u {{target_url}} -hl"

  - title: katana - 无头模式并提取 XHR
    desc: |
      以无头模式运行爬虫，并专门提取 XHR（XMLHttpRequest）和 Fetch 请求。这对识别前端用于与后端通信的内部 API 端点至关重要。
      结果最好以 JSONL 格式查看，以了解每个 XHR 请求关联的 HTTP 方法。
    command: "katana -u {{target_url}} -hl -xhr -j"

  # === SCOPE AND FILTERING ===
  - title: katana - 使用正则限定范围的爬取
    desc: |
      限制爬虫只跟踪匹配特定正则表达式的 URL。可防止爬虫偏离目标进入外部第三方服务或社交媒体链接。
      这是保持在渗透测试法律和技术边界内的关键功能。
    command: "katana -u {{target_url}} -cs {{regex_pattern}}"

  - title: katana - 按扩展名过滤输出
    desc: |
      过滤最终输出，只显示与所提供扩展名匹配的文件。用于快速识别配置文件、脚本或备份等特定文件类型（如 php、js、txt）。
      或者可用 -ef 排除 css、png 或 jpg 等常见的噪音扩展名。
    command: "katana -u {{target_url}} -em {{extensions|js,php,aspx,json}}"

  # === PERFORMANCE AND OUTPUT ===
  - title: katana - 限速爬取
    desc: |
      通过设置每秒最大请求数来控制爬取速度。降低速率限制对于避免压垮小型服务器或触发 WAF 和账户锁定非常重要。
      始终根据目标环境的稳定性和敏感度调整此值。
    command: "katana -u {{target_url}} -rl {{rate_limit|10}}"

  - title: katana - 将输出保存为 JSONL
    desc: |
      将爬取结果写入 JSON Lines（JSONL）格式文件。该格式为每个发现的 URL 包含丰富元数据，如来源链接、请求方法和状态码。
      JSONL 是将 Katana 结果集成到其他工具或自定义分析脚本的首选格式。
    command: "katana -u {{target_url}} -j -o {{output_file|results.jsonl}}"

  - title: katana - 自动填充表单
    desc: |
      启用一项实验性功能，尝试在爬取过程中自动填充并提交表单。这有助于爬虫到达隐藏在输入框或搜索栏后面的站点区域。
      请谨慎使用，因为可能导致对目标应用产生无意的数据提交或状态更改。
    command: "katana -u {{target_url}} -aff"

  - title: katana - 技术识别
    desc: |
      为爬取的端点启用技术识别。有助于识别底层技术栈，如 Web 服务器、框架和 CMS 版本。
      它为发现过程添加了有价值的上下文，帮助测试人员优先确定特定的利用向量。
    command: "katana -u {{target_url}} -td"