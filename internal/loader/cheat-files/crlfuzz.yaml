tool: crlfuzz
tags: [web-security, crlf-injection, scanner, pentest, reconnaissance, bug-bounty, vulnerability-scanner]

actions:
  # === BASIC TARGETING ===
  - title: crlfuzz - 单 URL 基本扫描
    desc: |
      对单个指定 URL 执行针对 CRLF 注入漏洞的定向扫描。
      工具会向请求头注入各种载荷，以检测服务器是否易受 HTTP 响应拆分攻击。
    command: "crlfuzz -u {{url}}"

  - title: crlfuzz - 从列表扫描 URL
    desc: |
      从文本文件读取多个目标 URL，并对每个条目执行自动化模糊测试。
      当你拥有子域名列表时，对大规模侦察和漏洞赏金狩猎非常高效，文件应每行一个 URL。
    command: "crlfuzz -l {{file_path}}"

  - title: crlfuzz - 从标准输入扫描（stdin）
    desc: |
      使工具能够直接从管道中其他工具的输出接收 URL。
      未提供输入标志时，crlfuzz 会等待 stdin 数据，非常适合与 subfinder 或 httpx 等工具串联。
    command: "crlfuzz {{options}}"

  # === REQUEST CONFIGURATION ===
  - title: crlfuzz - 指定 HTTP 请求方法
    desc: |
      允许你定义特定的 HTTP 方法（如 POST、PUT 或 DELETE），而非默认的 GET 方法。
      CRLF 漏洞通常可通过以不同方式处理请求头或数据的特定方法触发，测试 REST API 时尤其有用。
    command: "crlfuzz -u {{url}} -X {{method|POST}}"

  - title: crlfuzz - 携带请求体数据扫描
    desc: |
      在请求体中发送自定义数据，这通常是 POST、PATCH 或 DELETE 方法所必需的。
      可测试需要特定参数才能到达请求头处理逻辑的端点，数据格式需符合目标服务器预期（如 JSON 或表单编码）。
    command: "crlfuzz -u {{url}} -X {{method|POST}} -d {{data}}"

  - title: crlfuzz - 传入自定义请求头
    desc: |
      在发出的请求中包含自定义 HTTP 请求头，如专用的 User-Agent 或 Authorization 令牌。
      对扫描需要会话 Cookie 或 Bearer 令牌的应用认证区域至关重要，也可用于模拟特定客户端环境。
    command: "crlfuzz -u {{url}} -H \"{{header_name}}: {{header_value}}\""

  # === PERFORMANCE & PROXY ===
  - title: crlfuzz - 设置并发级别
    desc: |
      调整同时运行的并发模糊测试任务数量，以优化扫描速度。
      默认并发为 25，可在稳健的服务器上提高以加快速度，或降低以避免压垮目标。
    command: "crlfuzz -l {{file_path}} -c {{concurrency|50}}"

  - title: crlfuzz - 通过代理转发流量
    desc: |
      将所有模糊测试流量经由指定代理服务器（如 Burp Suite 或 OWASP ZAP）转发。
      这样你可以手动检查发送的载荷和从服务器收到的响应，代理字符串需包含协议，如 http://127.0.0.1:8080。
    command: "crlfuzz -u {{url}} -x {{proxy_url|http://127.0.0.1:8080}}"

  # === OUTPUT & LOGGING ===
  - title: crlfuzz - 静默模式（仅输出易受攻击目标）
    desc: |
      启用静默模式，除发现易受攻击的 URL 外抑制所有标准输出。
      在将结果管道传递给其他工具或仅将可操作发现保存到日志时极为有用，可在大规模自动化扫描中显著减少终端噪声。
    command: "crlfuzz -l {{file_path}} -s"

  - title: crlfuzz - 详细模式调试
    desc: |
      启用详细输出，显示详细的错误消息和进度信息。
      当工具行为异常或需要排查连接问题时使用，可提供请求在模糊测试过程中为何失败的更多上下文。
    command: "crlfuzz -l {{file_path}} -v"

  - title: crlfuzz - 保存结果到文件
    desc: |
      自动将模糊测试过程的输出保存到指定文本文件。
      建议在长时间扫描时使用，以确保不会因终端缓冲区限制而丢失任何发现，输出文件将包含所发现漏洞的详细信息。
    command: "crlfuzz -l {{file_path}} -o {{output_file}}"
