tool: corsy
tags: [web, security, pentest, reconnaissance, vulnerability-scanner, cors]

actions:
# === BASIC SCANNING ===
 - title: corsy - 基本 URL 扫描
   desc: |
     对单个目标 URL 执行标准的 CORS 错误配置扫描。
     该命令会启动多种绕过测试，如 Null 源、反引号及未转义点号绕过，URL 需包含协议（http/https）以保证结果准确。
   command: "corsy -u {{url}}"

 - title: corsy - 从文件扫描 URL
   desc: |
     从指定文本文件读取 URL 列表，批量扫描多个目标。
     适用于批量扫描侦察阶段发现的子域名或端点，输入文件每行一个 URL 且需包含协议。
   command: "corsy -i {{input_file}}"

 - title: corsy - 从标准输入扫描
   desc: |
     支持通过标准输入（stdin）传入 URL 进行扫描。
     在与 subfinder 或 waybackurls 等发现工具的管道输出配合时非常高效，可无缝集成到自动化漏洞赏金或渗透测试流程中。
   command: "cat {{url_list}} | corsy"

# === OUTPUT AND REPORTING ===
 - title: corsy - 导出结果为 JSON
   desc: |
     将 CORS 扫描结果保存为 JSON 格式文件，便于后续分析。
     JSON 输出适合用于文档记录，或将数据接入其他自定义脚本和数据库。
   command: "corsy -i {{input_file}} -o {{output_file|results.json}}"

 - title: corsy - 静默模式扫描
   desc: |
     运行时抑制描述、严重级别和利用提示等非必要输出。
     输出更干净，仅聚焦于存在漏洞的发现，适合自动化日志记录。
   command: "corsy -u {{url}} -q"

# === PERFORMANCE AND EVASION ===
 - title: corsy - 多线程扫描
   desc: |
     通过指定并发线程数来提高扫描速度。
     增加线程数可大幅缩短大文件的扫描时间，但过高可能导致目标服务器封禁你的 IP 或触发速率限制。
   command: "corsy -u {{url}} -t {{thread_count|20}}"

 - title: corsy - 请求延迟
   desc: |
     在工具发送的每个 HTTP 请求之间引入指定秒数的延迟。
     这是绕过速率限制机制或 Web 应用防火墙（WAF）的关键设置，使扫描行为更接近人工交互。
   command: "corsy -u {{url}} -d {{delay_seconds|2}}"

# === ADVANCED CONFIGURATION ===
 - title: corsy - 携带自定义请求头扫描
   desc: |
     为每个请求发送自定义 HTTP 请求头，如 User-Agent 或会话 Cookie。
     对测试需认证的端点或模拟特定浏览器行为必不可少，可在请求头字符串中用换行符提供多个请求头。
   command: "corsy -u {{url}} --headers \"{{headers|Cookie: session=123}}\""
