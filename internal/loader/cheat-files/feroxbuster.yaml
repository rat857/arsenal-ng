tool: feroxbuster
tags: [web, scanner, security, pentest, enumeration, discovery, fuzzing]

actions:
  # === BASIC USAGE ===
  - title: feroxbuster - 基本目录扫描
    desc: |
      对目标 URL 执行基本的递归目录发现扫描。
      使用默认字典和设置查找未链接的内容和目录，这是 Web 侦察中识别隐藏路径的标准起点。
    command: "feroxbuster -u {{url}}"

  - title: feroxbuster - 使用特定扩展名扫描
    desc: |
      扫描时为字典中的每个条目追加文件扩展名列表。
      对查找特定的服务器端脚本、配置文件或备份至关重要，可用逗号分隔或重复多个标志提供多个扩展名。
    command: "feroxbuster -u {{url}} -x {{extensions|php,html,txt,bak}}"

  - title: feroxbuster - 使用自定义字典
    desc: |
      指定用于暴力破解过程的自定义字典文件。
      SecLists 等高质量字典可提高找到敏感端点的几率，如果未指定，feroxbuster 使用内置默认字典或配置文件中定义的字典。
    command: "feroxbuster -u {{url}} -w {{wordlist_path|/usr/share/wordlists/dirbuster/directory-list-2.3-medium.txt}}"

  # === PERFORMANCE & RECURSION ===
  - title: feroxbuster - 非递归扫描
    desc: |
      禁用默认的递归行为，仅扫描提供的基准 URL。
      当你想快速审计单个目录而不深入子文件夹时非常有用，可显著减少总扫描时间和发送到服务器的请求数量。
    command: "feroxbuster -u {{url}} --no-recursion"

  - title: feroxbuster - 高速扫描
    desc: |
      增加并发线程数以加速发现进程。
      默认线程数为 50，增加可加快扫描但可能压垮目标服务器，使用时请谨慎，可能触发速率限制或 Web 应用防火墙（WAF）。
    command: "feroxbuster -u {{url}} -t {{threads|100}}"

  - title: feroxbuster - 速率限制
    desc: |
      限制每秒发送的请求总数，以防止压垮目标。
      扫描脆弱的遗留系统或具有严格监控的环境时至关重要，设置速率限制有助于保持在自动化封禁机制的监控范围之外。
    command: "feroxbuster -u {{url}} --rate-limit {{requests_per_second|10}}"

  # === FILTERING RESPONSES ===
  - title: feroxbuster - 按状态码过滤
    desc: |
      从输出结果中排除特定的 HTTP 状态码。
      可用于隐藏 404（未找到）或 403（禁止）等常见但不相关的响应，可提供逗号分隔的状态码列表在扫描期间忽略。
    command: "feroxbuster -u {{url}} -C {{filter_codes|403,401,500}}"

  - title: feroxbuster - 按响应大小过滤
    desc: |
      过滤掉具有特定字节响应体大小的响应。
      对绕过返回 200 OK 状态但内容相同的软 404 页面极为有用，可先识别无用响应的大小，再用此标志将其隐藏。
    command: "feroxbuster -u {{url}} -S {{size_bytes}}"

  - title: feroxbuster - 过滤相似页面（软 404）
    desc: |
      过滤掉与给定 URL 响应动态相似的页面。
      这是处理返回 200 状态码的自定义错误页面的最有效方式，feroxbuster 会获取提供的 URL 并利用其结构忽略相似结果。
    command: "feroxbuster -u {{url}} --filter-similar-to {{example_url}}"

  # === AUTHENTICATION & HEADERS ===
  - title: feroxbuster - 带 Cookie 的认证扫描
    desc: |
      随每个请求发送特定会话 Cookie 以扫描应用的受保护区域。
      可发现隐藏的管理面板或用户专属目录，格式应为包含 Cookie 名称及其值的字符串。
    command: "feroxbuster -u {{url}} -b {{cookie_string|session=abc123xyz}}"

  - title: feroxbuster - 自定义请求头和 User-Agent
    desc: |
      为所有发出的请求设置自定义 HTTP 请求头或特定的 User-Agent。
      API 扫描（如 Authorization 令牌）或绕过 WAF 时通常需要自定义请求头，使用真实的 User-Agent 有助于混入合法流量。
    command: "feroxbuster -u {{url}} -H \"{{header_name|Authorization}}: {{header_value}}\" -a \"{{user_agent}}\""

  # === PROXY & INTERCEPTION ===
  - title: feroxbuster - 通过 Burp Suite 代理
    desc: |
      将所有流量经由指定代理（通常是 Burp Suite 或 OWASP ZAP）转发。
      --burp 标志是快捷方式，将代理设为 http://127.0.0.1:8080 并禁用 TLS 验证，可让你详细手动检查工具发现的有趣请求。
    command: "feroxbuster -u {{url}} --burp"

  - title: feroxbuster - 特定状态码的代理回放
    desc: |
      仅将特定的成功响应（如 200 或 302）发送到次级代理。
      可防止 404 错误塞满你的 Burp Suite 历史记录，同时仍能捕获有效发现，--replay-codes 标志定义应转发哪些状态码。
    command: "feroxbuster -u {{url}} --replay-proxy {{proxy_url|http://127.0.0.1:8080}} --replay-codes {{codes|200,302}} --insecure"

  # === ADVANCED & AUTOMATION ===
  - title: feroxbuster - 智能/彻底发现
    desc: |
      启用彻底模式，一次激活多项高级发现功能。
      此模式会自动从响应中收集新词、查找备份并发现扩展名，更具攻击性且更耗时，但能提供更深层的枚举。
    command: "feroxbuster -u {{url}} --thorough"

  - title: feroxbuster - 恢复暂停的扫描
    desc: |
      使用 feroxbuster 生成的状态文件恢复之前中断的扫描。
      状态文件在执行期间自动创建并保存在当前目录，对于因网络问题或人工干预而停止的长时间扫描非常有用，只需将命令指向 .state 文件即可精确续扫。
    command: "feroxbuster --resume-from {{state_file}}"

  - title: feroxbuster - 从标准输入读取目标
    desc: |
      从标准输入读取 URL 列表并并行处理。
      非常适合管道传递 subfinder、assetfinder 或 httpx 等工具的结果，--stdin 标志告诉工具忽略 -u 要求而改从管道读取。
    command: "cat {{targets_file}} | feroxbuster --stdin"

  - title: feroxbuster - 保存输出到文件
    desc: |
      将扫描结果写入指定的输出文件以供日后报告或分析。
      也可结合 --json 标志以机器可读格式保存输出，保存结果对渗透测试或审计期间的文档记录至关重要，输出包含状态码、响应大小和发现的 URL。
    command: "feroxbuster -u {{url}} -o {{output_file|results.txt}}"
