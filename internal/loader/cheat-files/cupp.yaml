tool: cupp
tags: [passwords, wordlist, social-engineering, pentest, brute-force, enumeration]

actions:
  # === CORE PROFILING ===
  - title: cupp - 交互式密码画像
    desc: |
      启动交互式会话，根据目标的特定信息生成个性化字典。
      工具会提示输入目标的姓名、昵称、生日、伴侣信息甚至宠物名，是社工驱动的密码攻击中最有效的用法。
    command: "cupp -i"

  - title: cupp - 改进现有字典
    desc: |
      使用现有字典或词典文件作为种子，生成新的密码变体。
      当你已有与目标相关的关键词列表，并想对其应用常见密码复杂度模式时，此选项非常有用。
    command: "cupp -w {{input_file|dictionary.txt}}"

  # === DATABASE AND REPOSITORY ===
  - title: cupp - 解析 Alecto 默认凭据
    desc: |
      直接从 Alecto 数据库集成中解析默认用户名和密码。
      Alecto 数据库合并并增强了来自 Phenoelit 和 CIRT 项目的纯净数据库，可用于识别网络设备、IoT 设备或遗留系统的默认厂商凭据。
    command: "cupp -a"

  - title: cupp - 下载字典仓库
    desc: |
      直接从官方 CUPP 仓库下载一批大型字典。
      这些列表按类别整理，可用于通用暴力破解或作为进一步画像的基础，此操作需要有效的互联网连接。
    command: "cupp -l"

  # === MISCELLANEOUS ===
  - title: cupp - 显示帮助菜单
    desc: |
      显示包含所有可用命令行参数和选项的帮助菜单。
      这是验证已安装版本并查看各标志正确语法的最快方式。
    command: "cupp -h"

  - title: cupp - 显示版本信息
    desc: |
      显示系统中已安装的 CUPP 工具当前版本。
      检查版本对于确保与不同 Python 环境和功能的兼容性很重要，此命令无侵入性且不执行任何画像或网络活动。
    command: "cupp -v"
