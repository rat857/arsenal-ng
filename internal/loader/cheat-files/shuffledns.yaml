tool: shuffledns
tags: [dns, enumeration, subdomains, pentest, recon, security, massdns]

# === RESOLVING AND BRUTEFORCING ===

actions:
 - title: shuffledns - 从列表解析子域名
   desc: |
     使用特定的解析器文件解析预定义的子域名列表，以验证它们当前是否存在。
     当你从被动来源获得大量潜在子域名并需要过滤掉不活跃的时很有用。
     使用可靠且更新的解析器列表对准确性和性能至关重要。
     请注意，高频率的速率限制可能导致某些 DNS 提供商临时封禁你的 IP。
   command: "shuffledns -d {{domain}} -list {{subdomain_list}} -r {{resolvers_file}} -mode resolve"

 - title: shuffledns - 子域名暴力破解
   desc: |
     通过将目标域名与本地词表文件组合来执行主动子域名发现。
     该工具生成组合并使用 massdns 进行高速解析，以实现高效能。
     此方法对于发现未收录在公共数据库中的隐藏子域名非常有效。
     始终使用可信的解析器列表，以尽量减少暴力破解过程中的误报。
   command: "shuffledns -d {{domain}} -w {{wordlist_file}} -r {{resolvers_file|resolvers.txt}} -mode bruteforce"

 - title: shuffledns - 从 subfinder 管道输入
   desc: |
     将 subfinder 的结果直接管道给 shuffledns，实现无缝的被动到主动子域名验证。
     此工作流允许你在单条命令行字符串中结合被动发现结果与主动验证。
     这是执行全面且快速的子域名枚举的行业标准方法。
     确保你的解析器文件配置正确，以处理传入的数据流。
   command: "subfinder -d {{domain}} -silent | shuffledns -d {{domain}} -r {{resolvers_file}} -mode resolve"

# === PERFORMANCE AND FILTERING ===

 - title: shuffledns - 使用可信解析器解析
   desc: |
     使用单独的可信解析器列表来验证从通用解析器获得的结果，以提高准确性。
     这提供了多层验证过程，有助于消除不可靠 DNS 服务器引入的误报。
     在处理可能返回「垃圾」数据或被劫持记录的 DNS 提供商时特别有用。
     此功能需要一个包含已知良好解析器的额外文件，例如 Google（8.8.8.8）或 Cloudflare（1.1.1.1）。
   command: "shuffledns -d {{domain}} -list {{subdomain_list}} -r {{resolvers_file}} -tr {{trusted_resolvers_file}} -mode resolve"

 - title: shuffledns - 带速率限制的高速解析
   desc: |
     调整并发 massdns 解析的数量，在执行速度与系统稳定性之间取得平衡。
     默认值为 10000，如果网络带宽允许，你可以增加它以获得更快的速度。
     将此值设置过高可能导致本地网络拥塞或高丢包率，从而产生不准确的结果。
     以极高并发设置运行时，监控你的 CPU 和网络接口使用情况。
   command: "shuffledns -d {{domain}} -list {{subdomain_list}} -r {{resolvers_file}} -mode resolve -t {{rate_limit|20000}}"

 - title: shuffledns - 使用严格通配符过滤解析
   desc: |
     启用严格的通配符检查，以过滤掉由 catch-all DNS 记录引起的误报结果。
     这对于将所有不存在的子域名映射到特定着陆页或 IP 地址的域名至关重要。
     该工具会对发现的子域名执行额外检查，以确保它们是唯一且真正有效的。
     使用此标志可能会因额外的验证步骤而略微增加总执行时间。
   command: "shuffledns -d {{domain}} -list {{subdomain_list}} -r {{resolvers_file}} -mode resolve -sw"

# === OUTPUT AND INTEGRATION ===

 - title: shuffledns - 将输出保存为 JSON
   desc: |
     以 NDJSON 格式保存 DNS 枚举结果，便于其他自动化安全工具解析。
     此格式比简单的文本列表包含更多元数据，非常适合集成到自定义脚本中。
     强烈建议用于构建自动化安全流水线和长期数据分析。
     使用 -o 标志指定 JSON 结果的目标文件路径。
   command: "shuffledns -d {{domain}} -list {{subdomain_list}} -r {{resolvers_file}} -mode resolve -j -o {{output_file|results.json}}"

 - title: shuffledns - 用于脚本的静默输出
   desc: |
     以静默模式运行工具，仅输出发现并验证的子域名。
     此模式非常适合在 bash 流水线中与其他命令行工具干净地集成。
     它会移除横幅和详细日志，提供干净的字符串列表作为最终输出。
     当结果需要传递给 httpx 等其他工具时，这是首选使用方式。
   command: "shuffledns -d {{domain}} -list {{subdomain_list}} -r {{resolvers_file}} -mode resolve -silent"