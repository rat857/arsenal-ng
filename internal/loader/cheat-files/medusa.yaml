tool: medusa
tags: [network, security, pentest, enumeration, brute-force, authentication]

actions:
  # === BASIC AUTHENTICATION ===
  - title: medusa - 基础认证
    desc: |
      用单个用户名和密码对单个主机执行登录尝试。这是最简单的认证测试形式，用于验证凭据或在手动发现后测试特定账户。
      确保为主机上运行的服务提供正确的模块名（如 ssh、ftp、telnet）。
    command: "medusa -h {{target}} -u {{username}} -p {{password}} -M {{module}}"

  - title: medusa - 密码字典攻击
    desc: |
      使用单个用户名和来自指定文件的密码列表尝试登录目标。这是在渗透测试中恢复遗忘密码或测试弱安全配置的最常见用例。
      大型字典可能显著增加所需时间以及目标系统账户锁定的风险。
    command: "medusa -h {{target}} -u {{username}} -P {{password_list|/usr/share/wordlists/rockyou.txt}} -M {{module}}"

  - title: medusa - 用户名和密码字典攻击
    desc: |
      在单个目标主机上测试多个用户名和多个密码。Medusa 会遍历用户列表，并为每个用户尝试密码列表中的每个密码。
      这种穷举搜索很强大，但会在目标上产生大量流量和日志条目。
    command: "medusa -h {{target}} -U {{user_list}} -P {{password_list}} -M {{module}}"

  # === MULTI-TARGET & COMBO ATTACKS ===
  - title: medusa - 攻击多个主机
    desc: |
      从文本文件读取目标 IP 地址或主机名，在网络上执行并发攻击。这对多个服务器可能共享相似凭据或配置的内部网络评估非常有效。
      使用 -T 标志控制并行处理的主机数以管理资源消耗。
    command: "medusa -H {{host_file}} -u {{username}} -P {{password_list}} -M {{module}}"

  - title: medusa - 组合文件攻击
    desc: |
      使用专门的 combo 文件，其中每行包含以冒号分隔的用户名密码对（user:pass）。当你拥有泄露的凭据对或从其他侦察阶段收集的特定组合时很高效。
      它通过避免单独用户文件和密码文件的大量笛卡尔积来简化流程。
    command: "medusa -h {{target}} -C {{combo_file}} -M {{module}}"

  # === MODULE SPECIFIC EXAMPLES ===
  - title: medusa - SSH 暴力破解
    desc: |
      专门针对主机上的 SSH 服务尝试发现凭据。SSH 是攻击者的高价值目标，因此此模块常用于获取 Linux/Unix 系统的初始访问。
      注意 fail2ban 或类似入侵防御系统（IPS）可能在多次失败尝试后阻止你的 IP。
    command: "medusa -h {{target}} -u {{username|root}} -P {{password_list}} -M ssh"

  - title: medusa - Web 表单 HTTP 认证
    desc: |
      对使用 HTTP basic、digest 或 NTLM 认证的服务执行暴力破解。用于测试路由器、管理 Web 界面或受保护的 Web 目录。
      若服务位于特定子目录，使用 -m 标志向模块传递目录参数。
    command: "medusa -h {{target}} -u {{username|admin}} -P {{password_list}} -M http -m {{web_path|DIR:/admin}}"

  - title: medusa - MSSQL 数据库攻击
    desc: |
      针对 Microsoft SQL Server 实例查找有效的数据库管理员或用户凭据。若启用了 xp_cmdshell，可能导致数据库完全沦陷甚至远程代码执行。
      务必确保你有权限测试数据库实例，因为它可能影响生产性能。
    command: "medusa -h {{target}} -u {{username|sa}} -P {{password_list}} -M mssql"

  # === OPTIMIZATION & ADVANCED OPTIONS ===
  - title: medusa - 检查空密码或与用户名相同的密码
    desc: |
      在尝试字典前自动检查密码是否为空（n）或与用户名相同（s）。许多配置错误的系统或默认安装仍使用这些弱凭据模式。
      这是在安全审计初期快速发现低垂果实的方法。
    command: "medusa -h {{target}} -u {{username}} -e {{check_type|ns}} -M {{module}}"

  - title: medusa - 优化并行扫描
    desc: |
      通过调整并发线程数提高暴力破解速度。-t 标志控制每主机的登录尝试数，而 -T 控制同时扫描的主机数。
      将这些值设置过高可能导致网络拥塞、数据包丢失或目标服务崩溃。
    command: "medusa -h {{target}} -U {{user_file}} -P {{password_list}} -M {{module}} -t {{threads|10}} -T {{host_threads|5}}"

  - title: medusa - 使用自定义端口通过 SSL 扫描
    desc: |
      强制连接使用 SSL/TLS 加密，并指定非标准 TCP 端口。这对 HTTPS（端口 443）、LDAPS（端口 636）或自定义封装的遗留服务等加密服务是必需的。
      使用 -s 标志确保 Medusa 在发送认证数据前尝试 SSL 握手。
    command: "medusa -h {{target}} -u {{username}} -P {{password_list}} -M {{module}} -s -n {{port}}"

  - title: medusa - 发现有效凭据即停止
    desc: |
      发现有效凭据集后立即终止扫描过程。-f 标志停止扫描当前主机，而 -F 停止列表中所有主机的整个审计。
      一旦达到访问目标，这是更隐蔽且更高效的方法。
    command: "medusa -h {{target}} -U {{user_file}} -P {{password_list}} -M {{module}} -f"

  - title: medusa - 恢复之前的扫描
    desc: |
      根据初始运行期间生成的 map 文件恢复之前中断的扫描。这对于因网络问题或时间限制而停止的长时间暴力破解会话非常有用。
      它避免对已检查过的凭据做冗余测试。
    command: "medusa -Z {{map_file_from_previous_scan}}"