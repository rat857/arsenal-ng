tool: kiterunner
tags: [network, web, security, pentest, enumeration, api, reconnaissance, scanner]

actions:
  # === API SCANNING ===
  - title: kr - 基础 API 扫描
    desc: |
      使用 Assetnote 字典对特定主机执行定向 API 扫描。该命令专门利用 .kite 格式的结构化数据来发现 API 端点。
      通过测试各种 HTTP 方法和参数，帮助识别标准目录爆破可能遗漏的隐藏路由。开始侦察前确保你与目标有网络连通性。
    command: "kr scan {{target}} -A={{wordlist_alias|apiroutes-210328}}"

  - title: kr - 高性能多主机扫描
    desc: |
      从文件扫描目标列表，同时控制并发设置以最大化吞吐量。你可以调整最大并行主机数和每主机连接数来优化速度，而不会压垮目标或自己的网络栈。
      对漏洞赏金或大规模内部审计特别有用。注意高并发可能在部分环境导致激进的速率限制或账户锁定。
    command: "kr scan {{targets_file}} -A={{wordlist_alias|apiroutes-210328}} -j {{max_parallel_hosts|50}} -x {{max_connections_per_host|5}}"

  - title: kr - 带深度基线检查的扫描
    desc: |
      以更大的目录深度执行扫描，用于通配符检测和基线检查。增加深度使工具能对子目录执行独立的基线检查，这对使用虚拟路径路由的应用至关重要。
      这提高了结果的准确性，减少复杂环境中的误报。但增加深度会显著增加发送到目标的请求总数。
    command: "kr scan {{target}} -A={{wordlist_alias|apiroutes-210328}} --preflight-depth {{depth|2}}"

  # === BRUTE FORCING ===
  - title: kr - 带扩展名的目录爆破
    desc: |
      使用基于文本的字典和特定文件扩展名执行标准路径爆破。该模式适合发现配置文件备份、脚本或管理面板等常见文件。
      你可以提供多个以逗号分隔的扩展名来扩大扫描覆盖范围。若目标受 WAF 或速率限制器保护，请使用较低的连接数。
    command: "kr brute {{target}} -w {{wordlist_path}} -e {{extensions|php,aspx,json,txt}}"

  - title: kr - dirsearch 兼容模式
    desc: |
      使用包含 %EXT% 占位符的字典运行爆破扫描，模仿 dirsearch 的行为。工具会自动用命令行参数中提供的扩展名替换占位符。
      适合想用 Kiterunner 高性能引擎继续使用现有旧字典的用户，确保针对特定技术栈的专业字典仍然有效。
    command: "kr brute {{target}} -w {{wordlist_path}} -D -e {{extensions|php,html,js}}"

  # === FILTERS AND HEADERS ===
  - title: kr - 带自定义 Header 和过滤器的扫描
    desc: |
      执行扫描时注入自定义 HTTP header，并按内容长度过滤响应。这对使用 X-Forwarded-For 等 header 绕过简单的基于 IP 的过滤，或提供认证 Token 很有用。
      按长度过滤可隐藏返回 200 OK 状态的已知 Not Found 页面，从而清理输出。注意不要忽略可能包含有效但较小的 JSON 响应的长度。
    command: "kr scan {{target}} -H \"{{header_name|Authorization}}: {{header_value}}\" --ignore-length {{length_to_ignore|0-100}}"

  # === WORDLIST MANAGEMENT ===
  - title: kr - 列出可用的 Assetnote 字典
    desc: |
      显示 Assetnote 提供的所有可用字典，可配合内置下载功能使用。输出包含字典别名、文件名、来源以及是否已缓存在本机等信息。
      这有助于为特定技术栈或目标画像选择最相关的数据集，也是跟踪预打包数据集以便快速使用的最佳方式。
    command: "kr wordlist list"

  - title: kr - 转换字典格式
    desc: |
      在 .txt、.json 和 .kite 格式之间转换字典，以获得更好的兼容性和性能。.kite 格式是 Kiterunner 用于加速扫描并大幅减少执行时内存开销的二进制表示。
      在进行大规模扫描前，强烈建议将大型文本字典转换为 .kite。转换复杂 JSON schema 时若遇到错误，请使用 debug 标志。
    command: "kr kb convert {{input_file}} {{output_file}}"

  # === UTILITIES ===
  - title: kr - 重放特定请求
    desc: |
      根据之前 Kiterunner 扫描的输出行重建并重新发送特定请求。这是手动验证发现或以受控方式排查意外响应码的重要功能。
      你还可以指定代理，在 Burp Suite 或 OWASP ZAP 等工具中捕获重放的请求。确保原始扫描所用的 .kite 字典可用，以便准确重建。
    command: "kr kb replay -w {{kite_file}} \"{{response_line}}\" --proxy={{proxy_url|http://localhost:8080}}"