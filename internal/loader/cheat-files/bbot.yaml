tool: bbot
tags: [recon, scanner, pentest, subdomain-enum, web-security, osint, automation]

actions:
  # === BASIC ENUMERATION ===
  - title: bbot - 标准子域枚举
    desc: |
      使用预定义的 subdomain-enum 预设执行完整的子域枚举。
      该命令组合多个模块，为目标识别尽可能多的子域。
      它是基础设施侦察与攻击面测绘最常见的起点。
    command: "bbot -t {{target}} -p subdomain-enum"

  - title: bbot - 被动子域枚举
    desc: |
      仅使用被动来源进行子域发现，而不直接与目标交互。
      它通过要求 passive 标志来过滤模块，确保不向目标基础设施发送数据包。
      当隐蔽性优先或希望避免触发安全告警时使用。
    command: "bbot -t {{target}} -p subdomain-enum -rf passive"

  - title: bbot - 全面 kitchen-sink 扫描
    desc: |
      运行 "kitchen-sink" 预设，包含子域、邮箱、云存储桶、端口扫描与 nuclei。
      这是一次非常密集的扫描，几乎覆盖目标外部暴露的每个方面。
      请注意这会产生大量流量，且可能需要很长时间才能完成。
    command: "bbot -t {{target}} -p kitchen-sink"

  # === WEB & SPIDER OPERATIONS ===
  - title: bbot - Web 蜘蛛爬取
    desc: |
      递归爬取目标 URL，提取邮箱、密钥与其他敏感数据。
      蜘蛛的距离与深度均可配置，以控制爬虫从起点出发的远近。
      这对于识别 Web 应用中的隐藏路径与敏感信息至关重要。
    command: "bbot -t {{url}} -p spider -c web.spider_distance={{distance|2}} web.spider_depth={{depth|2}}"

  - title: bbot - 带截图的子域枚举
    desc: |
      发现子域并自动对发现的任何活跃 Web 服务截图。
      它利用 gowitness 模块捕获 Web 应用的视觉状态。
      这帮助研究人员快速识别有趣的目标或被遗忘的登录页面。
    command: "bbot -t {{target}} -p subdomain-enum -m gowitness -n {{scan_name|screenshot_scan}} -o {{output_path|.}}"

  - title: bbot - 基础非侵入式 Web 扫描
    desc: |
      运行 web-basic 预设，包含 wappalyzer、robots.txt 与其他安全模块。
      它在不做激进探测的情况下，快速概览 Web 技术栈与公开文件。
      它非常适合对目标 Web 服务器的配置与软件进行初始画像。
    command: "bbot -t {{target}} -p subdomain-enum web-basic"

  # === SCOPE & TARGETING ===
  - title: bbot - 严格范围扫描
    desc: |
      将扫描范围严格限制在所提供的目标上，而不包含子域。
      默认情况下 BBOT 会包含子域；此标志阻止它扩展到特定主机之外。
      当你仅被授权测试单个主机、且必须避免附带发现时使用。
    command: "bbot -t {{target}} --strict-scope -p subdomain-enum"

  - title: bbot - 白名单与黑名单扫描
    desc: |
      以某个目标作为种子发起扫描，但将主动交互限制在特定白名单内。
      blacklist 参数确保某些敏感或超出范围的资产永远不会被触及。
      这提供了对扫描边界的细粒度控制，对合规与安全至关重要。
    command: "bbot -t {{target}} --whitelist {{whitelist_cidr}} --blacklist {{blacklist_domain}} -p kitchen-sink"

  - title: bbot - 按正则表达式黑名单
    desc: |
      阻止扫描器与任何匹配特定正则表达式的事件或 URL 交互。
      这常用于避开注销链接（如 RE:signout）或特定的敏感目录。
      需要 RE: 前缀来告诉 BBOT 将该字符串视为正则表达式。
    command: "bbot -t {{target}} --blacklist \"RE:{{regex_pattern|signout}}\""

  # === ADVANCED MODULES & OUTPUT ===
  - title: bbot - 云资源枚举
    desc: |
      启用与云发现相关的所有模块，例如 S3 存储桶与 Azure 租户。
      cloud-enum 标志将这些专门模块分组，用于查找公共云基础设施中的数据泄露。
      它对于查找属于某组织的配置错误的存储桶非常有效。
    command: "bbot -t {{target}} -f cloud-enum"

  - title: bbot - 自定义扫描名与输出目录
    desc: |
      为扫描指定自定义名称，并为所有输出文件指定自定义位置。
      如果重复使用扫描名，BBOT 会将结果追加到现有文件而非覆盖。
      这有助于为不同客户或周期性评估项目组织结果。
    command: "bbot -t {{target}} -p subdomain-enum -n {{name}} -o {{path|./results}}"

  - title: bbot - 增加报告距离
    desc: |
      通过增大报告距离，显示离初始范围更远的事件。
      默认情况下 BBOT 只显示范围内事件；距离 1 将显示一跳之外的资产（如相关 IP）。
      使用它来发现可能未直接链接到目标域的相关基础设施。
    command: "bbot -t {{target}} -p subdomain-enum -c scope.report_distance={{distance|1}}"

  # === MAINTENANCE ===
  - title: bbot - 安装所有模块依赖
    desc: |
      下载并安装每个 BBOT 模块所需的所有外部二进制文件与库。
      它在内部使用 Ansible 确保系统为任何类型的扫描做好充分准备。
      在设置新的渗透测试机器或 VPS 时运行，以避免运行时安装延迟。
    command: "bbot --install-all-deps"

  - title: bbot - 列出所有可用模块与标志
    desc: |
      提供所有已安装模块、其描述与关联标志的完整列表。
      这对于发现新模块或检查特定工具是否可用很有用。
      你也可以用它查看哪些模块归类在 'deadly' 或 'aggressive' 等标志下。
    command: "bbot -l"
