tool: sshuttle
tags: [network, vpn, proxy, ssh, tunneling, security, pentest, pivoting]

actions:
  # === BASIC CONNECTION & ROUTING ===
  - title: sshuttle - 基础子网路由
    desc: |
      通过 SSH 隧道路由特定子网的流量。
      这是无需完整 VPN 设置即可访问内部网络资源的最常见用例。
      需要本地 root 权限来修改 iptables/nftables 并创建透明代理。
    command: "sshuttle -r {{user}}@{{remote_host}} {{subnet|10.0.0.0/24}}"

  - title: sshuttle - 路由所有流量
    desc: |
      通过远程 SSH 服务器转发所有本地流量，充当完整的 VPN。
      这对于绕过本地防火墙或隐藏所有连接的本地 IP 地址很有用。
      请注意，这也会重定向你的互联网流量，具体速度取决于 SSH 连接，可能会很慢。
    command: "sshuttle -r {{user}}@{{remote_host}} 0.0.0.0/0"

  - title: sshuttle - 自动网络路由
    desc: |
      根据远程服务器的路由表自动确定要路由的子网。
      当你不知道目标环境内部网络布局时，这在渗透测试期间极为有用。
      它会查询远程端并为远程主机可达的所有网络设置路由。
    command: "sshuttle -r {{user}}@{{remote_host}} -N"

  # === DNS & HOSTNAME MANAGEMENT ===
  - title: sshuttle - DNS 流量转发
    desc: |
      捕获本地 DNS 请求并将其转发到远程 DNS 服务器。
      这允许你解析只有远程网络知道的内部主机名（如 internal-db.corp.local）。
      对于使用虚拟主机或内部域名的 Web 应用测试至关重要。
    command: "sshuttle --dns -r {{user}}@{{remote_host}} {{subnet|0.0.0.0/0}}"

  - title: sshuttle - 自动更新 hosts 文件
    desc: |
      持续扫描远程主机名并更新本地 /etc/hosts 文件。
      这使你能够自动使用友好名称而不是 IP 地址访问远程服务。
      它通过观察流量并识别与所访问 IP 关联的主机名来工作。
    command: "sshuttle -H -r {{user}}@{{remote_host}} {{subnet}}"

  # === ADVANCED CONFIGURATION ===
  - title: sshuttle - 排除特定子网
    desc: |
      路由流量，同时明确排除特定子网或 IP 地址。
      这对于在隧道传输其他所有流量的同时保持与本地 LAN 或特定管理 IP 的本地连接很有用。
      它防止路由循环并确保本地资源保持直接可访问。
    command: "sshuttle -r {{user}}@{{remote_host}} 0.0.0.0/0 -x {{excluded_subnet|192.168.1.0/24}}"

  - title: sshuttle - 指定远程 Python 路径
    desc: |
      定义远程服务器上 Python 解释器的路径。
      当 Python 不在默认 PATH 中，或环境需要特定版本（如 /usr/bin/python3）时，这是必需的。
      远程服务器必须安装 Python，sshuttle 才能工作，因为它会上传一个小型辅助脚本。
    command: "sshuttle -r {{user}}@{{remote_host}} --python {{python_path|/usr/bin/python3}} {{subnet}}"

  - title: sshuttle - 使用自定义 SSH 命令
    desc: |
      指定用于 SSH 连接的自定义命令。
      这对于传递特定 SSH 选项很有用，例如身份文件、端口号或禁用主机密钥检查。
      当远程 SSH 服务器使用非标准配置时，它提供灵活性。
    command: "sshuttle -e 'ssh -i {{identity_file}} -p {{port|22}}' -r {{user}}@{{remote_host}} {{subnet}}"

  # === OPERATIONAL MODES ===
  - title: sshuttle - 在后台运行（守护进程）
    desc: |
      将 sshuttle 进程作为后台守护进程启动。
      这对于行动期间的持久枢纽非常理想，你不想保持专用终端打开。
      使用 pidfile 选项可在会话结束时轻松跟踪和终止进程。
    command: "sshuttle -D --pidfile {{pid_file|/tmp/sshuttle.pid}} -r {{user}}@{{remote_host}} {{subnet}}"

  - title: sshuttle - 详细调试
    desc: |
      提高输出详细级别以调试连接问题。
      使用多个 v 标志可提供关于内部工作和数据包转发的更详细信息。
      当隧道已连接但流量未按预期流动时很有帮助。
    command: "sshuttle -vv -r {{user}}@{{remote_host}} {{subnet}}"

  - title: sshuttle - 指定 tproxy 方法
    desc: |
      手动指定防火墙劫持方法，如 nft、nat 或 tproxy。
      默认情况下 sshuttle 会尝试猜测最佳方法，但某些 Linux 发行版有时需要手动覆盖。
      当默认方法因内核或防火墙配置限制而失败时，这可以解决问题。
    command: "sshuttle --method {{method|nft}} -r {{user}}@{{remote_host}} {{subnet}}"