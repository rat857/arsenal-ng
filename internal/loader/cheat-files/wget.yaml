tool: wget
tags: [network, download, utility, scraping, file-transfer, automation]

actions:
  # === BASIC FILE OPERATIONS ===
  - title: wget - 基础文件下载
    desc: |
      将单个文件从远程服务器下载到当前目录。这是获取工具、脚本或归档的最常见用例。
      默认情况下本地系统上的文件名将与 URL 中的文件名匹配。
    command: "wget {{url}}"

  - title: wget - 保存为特定文件名
    desc: |
      使用 -O 参数下载文件并在本地以自定义名称保存。当远程 URL 不包含友好文件名或下载到特定目录路径时很有用。
      注意这会覆盖同名现有文件而不发出警告。
    command: "wget -O {{filename|output.txt}} {{url}}"

  - title: wget - 恢复中断的下载
    desc: |
      继续先前中断或停止的下载。Wget 会检查本地文件大小，并使用 Range 请求头从服务器请求剩余字节。
      这对于网络稳定性可能成问题的大文件至关重要。
    command: "wget -c {{url}}"

  - title: wget - 后台下载
    desc: |
      立即在后台启动下载过程。输出重定向到日志文件（默认为 wget-log），以便你可以安全关闭终端会话。
      非常适合在远程服务器上通过 SSH 会话进行长时间下载。
    command: "wget -b {{url}}"

  - title: wget - 从文件下载多个 URL
    desc: |
      从本地文件读取 URL 列表并依次下载。这是处理批量下载而无需在终端中编写手动循环的最高效方式。
      输入文件应每行一个 URL。
    command: "wget -i {{file_path|urls.txt}}"

  # === NETWORK & PERFORMANCE ===
  - title: wget - 限制下载速度
    desc: |
      将下载速度限制在特定速率，防止带宽耗尽。支持 k 表示千字节、m 表示兆字节等后缀（如 500k）。
      在共享网络上使用，确保大型传输期间其他应用保持响应。
    command: "wget --limit-rate={{rate|100k}} {{url}}"

  - title: wget - Spider 模式链接检查
    desc: |
      以 spider 模式运行 wget，检查远程文件是否存在而不下载。它通过检查服务器响应头而非获取内容来验证链接。
      常用于脚本中在执行任务前验证资源的可用性。
    command: "wget --spider {{url}}"

  - title: wget - 设置自定义 User-Agent
    desc: |
      更改发送到服务器的 User-Agent 字符串，模拟特定浏览器。某些服务器会阻止默认 Wget 代理，以防止自动化抓取或机器人活动。
      模拟 Chrome 或 Firefox 等常见浏览器有助于绕过这些基础安全过滤器。
    command: "wget --user-agent={{user_agent|Mozilla/5.0}} {{url}}"

  # === RECURSIVE & MIRRORING ===
  - title: wget - 递归目录下载
    desc: |
      通过跟踪链接下载目录或网站的整个部分。-r 参数启用递归，-np（no-parent）确保工具不会向上进入父目录。
      这常用于离线文档或镜像站点的特定子文件夹。
    command: "wget -r -np {{url}}"

  - title: wget - 完整网站镜像
    desc: |
      使用无限递归和时间戳创建整个网站的本地镜像。此命令是多个选项的快捷方式，包括递归、时间戳和无限深度。
      这是创建网站静态备份供离线查看的最高效方式。
    command: "wget -m {{url}}"

  - title: wget - 镜像并转换链接供离线使用
    desc: |
      下载网站并将链接转换为指向本地文件，供离线浏览。-k 参数更新 HTML/CSS 链接，-p 确保下载图片和脚本等所有必需资源。
      这使下载的副本表现得像本地应用，而非损坏的 Web 结构。
    command: "wget -m -p -E -k {{url}}"

  # === AUTHENTICATION & SECURITY ===
  - title: wget - 基础 HTTP 认证
    desc: |
      为需要 Basic HTTP 认证的网站提供凭据。这允许从受保护目录或内部私有仓库下载。
      请注意命令行中提供的密码可能存储在你的 Shell 历史中。
    command: "wget --user={{username}} --password={{password}} {{url}}"

  - title: wget - 忽略 SSL 证书错误
    desc: |
      连接到 HTTPS 网站时跳过 SSL/TLS 证书验证。这对于具有自签名证书或过期凭据的内部服务器特别有用。
      警告：这会使连接容易受到中间人（MITM）攻击。
    command: "wget --no-check-certificate {{url}}"

  - title: wget - 使用自定义 HTTP 请求头
    desc: |
      在发送到服务器的 HTTP 请求头中包含自定义字符串。这可用于传递 API key、自定义认证令牌或特定的 content-type 要求。
      可以通过为每个特定请求头字符串重复该参数来添加多个请求头。
    command: "wget --header={{header|Authorization: Bearer TOKEN}} {{url}}"

  # === FILE TYPE FILTERING ===
  - title: wget - 下载特定文件类型
    desc: |
      仅下载匹配特定扩展名或扩展名列表的文件。-A（accept）参数接受逗号分隔的文件后缀列表。
      当你只想从目标目录提取 PDF、图片或 ZIP 文件时非常有效。
    command: "wget -r -A {{extensions|pdf,jpg,png}} {{url}}"

  - title: wget - 拒绝特定文件类型
    desc: |
      下载目录中的所有文件，但匹配特定扩展名的除外。-R（reject）参数可防止不需要的文件保存到本机。
      用它来避免递归爬取期间的大型视频文件或多余的日志文件。
    command: "wget -r -R {{extensions|gif,mp4}} {{url}}"