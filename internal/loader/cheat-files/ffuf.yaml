tool: ffuf
tags: [web, scanner, fuzzer, pentest, enumeration, security, reconnaissance]

actions:
  # === DIRECTORY AND FILE ENUMERATION ===
  - title: ffuf - 基本目录发现
    desc: |
      对目标 URL 执行基本的目录暴力破解攻击。
      FUZZ 关键字用作 URL 中注入字典条目的占位符，这是 Web 侦察中查找未链接内容的最常见入口。
    command: "ffuf -u {{url}}/FUZZ -w {{wordlist|/usr/share/wordlists/dirb/common.txt}}"

  - title: ffuf - 带扩展名的文件发现
    desc: |
      通过为每个字典条目追加扩展名列表来搜索特定文件。
      -e 标志接受 .php、.html 或 .txt 等逗号分隔的扩展名列表，查找备份文件（如 .bak、.old）或配置文件时至关重要。
    command: "ffuf -u {{url}}/FUZZ -w {{wordlist}} -e {{extensions|.php,.txt,.html,.bak}}"

  - title: ffuf - 递归目录扫描
    desc: |
      启用递归扫描，自动对最新发现的目录进行模糊测试。
      -recursion 标志允许 ffuf 为每个匹配匹配器的目录启动新的扫描任务，必须用 -recursion-depth 定义最大深度以防止无限循环。
    command: "ffuf -u {{url}}/FUZZ -w {{wordlist}} -recursion -recursion-depth {{depth|2}}"

  # === SUBDOMAIN AND VHOST DISCOVERY ===
  - title: ffuf - 虚拟主机（vhost）模糊测试
    desc: |
      模糊测试 Host 请求头以识别目标 IP 或域名上配置的虚拟主机。
      此技术对查找没有公开 DNS 记录的内部或隐藏子域名至关重要，由于大多数服务器对无效主机返回默认页面，建议结合过滤（如 -fs）去除噪声。
    command: "ffuf -u http://{{target_ip}} -H \"Host: FUZZ.{{domain}}\" -w {{wordlist}}"

  # === PARAMETER AND DATA FUZZING ===
  - title: ffuf - GET 参数模糊测试
    desc: |
      通过模糊测试查询字符串中的参数名来发现隐藏的 GET 参数。
      可用于查找管理标志（如 ?debug=true）或未公开的 API 功能，默认匹配所有响应，因此建议使用自动校准（-ac）过滤掉恒定响应。
    command: "ffuf -u {{url}}/page.php?FUZZ=1 -w {{wordlist}} -ac"

  - title: ffuf - POST 数据模糊测试
    desc: |
      模糊测试 POST 请求体中发送的数据。
      -X 标志指定 HTTP 方法，-d 标志包含带 FUZZ 占位符的数据，常用于暴力破解登录表单、查找隐藏 API 字段或测试 JSON 输入。
    command: "ffuf -u {{url}} -X POST -d \"username=FUZZ&password=password123\" -w {{wordlist}} -H \"Content-Type: application/x-www-form-urlencoded\""

  - title: ffuf - 多字典模糊测试（Clusterbomb）
    desc: |
      使用多个字典同时模糊测试多个位置，采用 clusterbomb 模式。
      在此模式下，ffuf 尝试所有字典的每种组合（笛卡尔积），使用冒号语法为每个字典分配自定义关键字（如 -w list:KEYWORD）。
    command: "ffuf -w {{user_list}}:USER -w {{pass_list}}:PASS -u {{url}} -X POST -d \"user=USER&pass=PASS\" -mode clusterbomb"

  # === FILTERING AND MATCHING ===
  - title: ffuf - 按响应大小和状态码过滤
    desc: |
      过滤掉特定的响应大小和 HTTP 状态码以清理输出。
      -fc 标志过滤状态码（如 404、403），-fs 按响应内容长度过滤，当服务器对未找到或未授权错误返回标准长度页面时，过滤至关重要。
    command: "ffuf -u {{url}}/FUZZ -w {{wordlist}} -fc 404,403 -fs {{size_to_ignore}}"

  - title: ffuf - 自动校准
    desc: |
      根据服务器行为自动校准过滤选项。
      -ac 标志发送少量初始请求以确定不存在页面的标准响应大小和行数，然后自动从最终结果中过滤这些常见模式，对返回 200 OK 自定义错误页的现代 Web 应用强烈推荐。
    command: "ffuf -u {{url}}/FUZZ -w {{wordlist}} -ac"

  # === AUTHENTICATION AND ADVANCED HTTP ===
  - title: ffuf - 带 Cookie 的认证模糊测试
    desc: |
      通过提供会话 Cookie 在维持会话的同时执行模糊测试。
      -b 标志允许你按浏览器请求头中出现的原样传递 Cookie 字符串，对发现仅认证用户可访问的目录或参数必不可少。
    command: "ffuf -u {{url}}/FUZZ -w {{wordlist}} -b \"{{cookie_name}}={{value}}; {{session_id}}=xyz\""

  - title: ffuf - 使用原始请求文件
    desc: |
      从文件导入整个 HTTP 请求，类似 SQLMap 的 -r 标志。
      处理涉及许多请求头、Cookie 和多行 POST 数据的复杂请求时非常有用，从 Burp Suite 等代理保存请求，将目标值替换为 FUZZ，再用 -request 指向 ffuf。
    command: "ffuf -request {{request_file}} -request-proto http -w {{wordlist}}"

  # === OUTPUT AND PROXYING ===
  - title: ffuf - 保存输出到文件
    desc: |
      以结构化格式将扫描结果保存到文件以供日后分析。
      -o 标志定义输出文件名，-of 指定格式（json、md、csv、html 或 all），JSON 输出在将结果管道传递到其他工具或自定义脚本时尤为有用。
    command: "ffuf -u {{url}}/FUZZ -w {{wordlist}} -o {{output_file}}.json -of json"

  - title: ffuf - 通过 Burp Suite 代理
    desc: |
      将所有 ffuf 请求经由 Burp Suite 或 OWASP ZAP 等代理发送。
      这样你可以检查模糊测试流量、使用 Burp 扩展或将请求记录下来，通过代理使用高线程数（-t）时请小心，因为它可能压垮代理应用。
    command: "ffuf -u {{url}}/FUZZ -w {{wordlist}} -x http://127.0.0.1:8080"
