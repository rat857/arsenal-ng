tool: penelope
tags: [network, shell-handler, security, pentest, exploitation, enumeration, reverse-shell]

actions:
# === BASIC LISTENING & PAYLOADS ===
 - title: penelope - 启动默认监听器
   desc: |
     在所有接口上使用默认端口 4444 启动监听器。这是捕获反向 shell 的最常见方式，会自动进行 PTY 升级并记录会话日志。
     它通过自动处理终端大小调整和 shell 稳定性来简化流程。
   command: "penelope"

 - title: penelope - 在指定接口和端口上监听
   desc: |
     在特定网络接口和自定义端口上监听传入连接。
     当你需要将监听器绑定到特定 IP 地址以确保目标能访问你的机器时使用。可以通过逗号分隔来指定多个端口。
   command: "penelope -i {{interface|0.0.0.0}} -p {{port|5555}}"

 - title: penelope - 显示 shell 载荷
   desc: |
     启动监听器并显示针对活动监听器的反向 shell 载荷示例。
     此功能为 Bash、Python 或 Perl 等多种环境提供即用型单行命令。
     在利用阶段快速生成与目标兼容的载荷时非常有用。
   command: "penelope -a"

# === CONNECTION MODES ===
 - title: penelope - 连接 bind shell
   desc: |
     连接到已在特定端口上等待传入连接的目标主机。
     当目标运行 bind shell 且你需要主动发起连接时使用此模式。确保目标防火墙允许指定端口的入站流量。
   command: "penelope -c {{target_ip}} -p {{port|3333}}"

 - title: penelope - 通过 SSH 获取 shell
   desc: |
     通过 SSH 连接到目标，建立受管的 Penelope shell 会话。
     该命令使用现有凭据登录，然后自动将会话升级为受管处理器。
     在已可访问 SSH 的系统上获取稳定、可记录的会话环境的高效方式。
   command: "penelope ssh {{user}}@{{target_ip}}"

 - title: penelope - 通过带自定义选项的 SSH 获取 shell
   desc: |
     在向 SSH 命令传递特定参数的同时建立基于 SSH 的反向 shell。
     使用双短横线分隔符来指定 SSH 特定选项，例如自定义端口或私钥。
     在处理目标上非标准的 SSH 配置时提供了灵活性。
   command: "penelope -i {{interface|eth0}} -p {{local_port|5555}} -- ssh -l {{user}} -p {{remote_ssh_port|2222}} {{target_ip}}"

# === FILE OPERATIONS ===
 - title: penelope - 通过 HTTP 提供文件
   desc: |
     启动内置 HTTP 服务器，与目标共享本地文件或文件夹。
     这使你可以轻松地将枚举脚本、漏洞利用程序或其他工具传输到远程机器。
     默认使用 8000 端口，但可结合 -p 标志更改端口。
   command: "penelope -s {{path|/opt/tools}} -p {{web_port|8000}}"

# === SESSION MANAGEMENT ===
 - title: penelope - 维持活动会话
   desc: |
     自动尝试在每个目标主机上维持指定数量的活动会话。
     此功能对持久化至关重要，因为即使某个 shell 断开，Penelope 也会尝试保持指定数量的 shell 打开。
     有助于在网络不稳定或密集利用期间确保持续访问。
   command: "penelope -m {{session_count|2}}"

 - title: penelope - 从主菜单启动
   desc: |
     直接启动 Penelope 进入主菜单，而不是立即启动监听器。
     这可用于管理现有会话、配置全局设置，或在接收 shell 之前准备多个监听器。
     你可以从这里浏览活动会话和各种实用模块。
   command: "penelope -M"

# === ADVANCED & COMPLIANCE ===
 - title: penelope - 启用 OSCP 安全模式
   desc: |
     以符合 OSCP 考试规定的受限模式运行 shell 处理器。
     此模式会禁用 Meterpreter 或 Traitor 等可能违反认证规则的自动利用模块。
     为学生提供安心保障，同时仍提供高级 PTY 处理和日志记录。
   command: "penelope -O"

 - title: penelope - 禁用会话日志
   desc: |
     启动监听器并完全禁用会话日志记录。
     Penelope 默认会记录交互以便文档记录和审计，但当磁盘空间有限或不需要日志时，此开关很有用。
     注意，这会阻止你回顾该会话的历史命令和输出。
   command: "penelope -L"

 - title: penelope - 单会话模式
   desc: |
     将 Penelope 配置为仅容纳第一个创建的会话，并忽略后续传入的 shell。
     这适用于专注的任务，你不希望终端被多个传入连接打断。
     它确保处理器终止或保持专用于第一个成功的利用。
   command: "penelope -S"