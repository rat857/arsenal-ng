tool: hash-identifier
tags: [security, pentest, hash, identification, cryptography, enumeration, forensics]

actions:
  - title: hash-identifier - 交互模式
    desc: |
      以其主要交互模式启动工具，手动识别哈希。这是使用该工具的标准方式，允许你逐个粘贴哈希并立即获得可能算法的反馈。当你在渗透测试枚举阶段遇到数据库或配置文件中的未知字符串时非常有用。
    command: "hash-identifier"

  # === AUTOMATION AND INPUT REDIRECTION ===

  - title: hash-identifier - 通过管道识别单个哈希
    desc: |
      通过从命令行将字符串直接管道输入工具来识别单个哈希。这种方法适合快速检查，无需手动进入交互环境。工具会像在 HASH: 提示符下输入一样处理管道字符串，并立即显示结果。
    command: "echo {{hash_string}} | hash-identifier"

  - title: hash-identifier - 从文件识别哈希
    desc: |
      从特定文件读取哈希并将其重定向到 hash-identifier 工具。当你已将哈希提取到临时文件并希望避免敏感数据被 shell 历史记录时，这种方法非常有用。请确保文件包含原始哈希字符串，以获得潜在加密签名的准确识别。
    command: "hash-identifier < {{file_path}}"

  # === CRACKING PREPARATION ===

  - title: hash-identifier - 为破解做凭据分析
    desc: |
      使用该工具确定密码恢复工具（如 Hashcat 或 John the Ripper）应使用的格式。正确识别哈希类型（如 MD5 与 NTLM 与 SHA-1）至关重要，因为在破解工具中使用错误模式将导致零匹配。该工具提供“可能的哈希”列表和“最不可能的哈希”列表，帮助你确定破解策略的优先级。
    command: "hash-identifier"
