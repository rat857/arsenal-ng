tool: dig
tags: [network, dns, enumeration, reconnaissance, pentest, troubleshooting]

# === BASIC ENUMERATION ===

actions:
 - title: dig - 基本 A 记录查询
   desc: |
     执行标准 DNS 查询，检索特定域名的 IPv4 地址（A 记录）。
     这是使用系统默认 DNS 设置验证主机名解析到哪个 IP 的主要方式，是初步侦察的基础工具。
   command: "dig {{domain}}"

 - title: dig - 查询指定域名服务器
   desc: |
     直接查询特定的 DNS 服务器，而不是使用本地系统解析器。
     可用于绕过缓存结果，或检查 8.8.8.8 或目标权威服务器等特定服务器是否已更新。
   command: "dig @{{dns_server|8.8.8.8}} {{domain}}"

 - title: dig - 简短响应格式
   desc: |
     仅返回 IP 地址或记录值，不带冗长的头部和元数据。
     此模式非常适合脚本编写，或在需要干净输出以便管道传递给其他工具时使用。
   command: "dig {{domain}} +short"

 - title: dig - 详细多行输出
   desc: |
     以高度可读的展开多行格式显示 DNS 记录。
     在检查 SOA 或 DNSSEC 密钥等包含许多字段的复杂记录时尤其有帮助，便于区分 TTL 值、记录类型和实际数据。
   command: "dig {{domain}} +multiline"

# === RECORD TYPES ===

 - title: dig - 查询邮件交换（MX）记录
   desc: |
     查询域名的 MX 记录，以识别负责接收电子邮件的服务器。
     在安全场景中，这有助于识别第三方邮件提供商或钓鱼模拟的潜在入口点。
   command: "dig {{domain}} MX"

 - title: dig - 查询域名服务器（NS）
   desc: |
     检索特定域名的权威域名服务器。
     了解权威服务器后，你可以将后续查询直接指向该域名的数据源头，这通常是开展组织深度 DNS 枚举的第一步。
   command: "dig {{domain}} NS"

 - title: dig - 查询文本（TXT）记录
   desc: |
     查询 TXT 记录，这些记录常用于 SPF、DKIM 和 DMARC 电子邮件安全策略。
     也常被 Google 或 Microsoft 等服务用于域名所有权验证，安全人员检查这些记录以识别配置错误的邮件策略。
   command: "dig {{domain}} TXT"

 - title: dig - 查询所有记录（ANY）
   desc: |
     尝试在单次查询中检索域名所有可用的 DNS 记录类型。
     请注意，许多现代 DNS 服务器和 CDN（如 Cloudflare）可能会阻止或限制 ANY 查询，以防止 DNS 放大攻击。
   command: "dig {{domain}} ANY"

# === ADVANCED LOOKUPS ===

 - title: dig - 反向 DNS 查询
   desc: |
     执行反向查询，查找与给定 IP 地址关联的域名。
     使用 in-addr.arpa 或 ip6.arpa 区域内的 PTR（指针）记录，对于识别网络扫描中发现的 IP 用途至关重要。
   command: "dig -x {{ip_address}}"

 - title: dig - 跟踪 DNS 委派
   desc: |
     从根服务器一路跟踪 DNS 解析路径直到权威域名服务器。
     这是识别 DNS 解析失败发生在层级中哪个环节的出色诊断工具，可展示引用过程的每一步。
   command: "dig {{domain}} +trace"

 - title: dig - 区域传送（AXFR）
   desc: |
     尝试执行完整区域传送，即请求某个域名的整个 DNS 数据库。
     如果服务器被错误配置为允许未经授权的传送，将泄漏该区域内的所有内部和外部记录。
   command: "dig @{{dns_server}} {{domain}} axfr"

# === PROTOCOL & TROUBLESHOOTING ===

 - title: dig - 通过 TCP 查询
   desc: |
     强制 DNS 查询使用 TCP 而非标准 UDP 协议。
     对于超出 512 字节 UDP 限制的大响应或某些类型的 DNS 检查是必需的，也可用于测试防火墙是否阻止基于 TCP 的 DNS。
   command: "dig {{domain}} +tcp"

 - title: dig - 查询指定端口
   desc: |
     将 DNS 查询定向到非标准端口，而不是默认的 53 端口。
     在测试为安全考虑而迁移的内部 DNS 服务器或端口转发设置时非常有用。
   command: "dig @{{dns_server}} {{domain}} -p {{port|53}}"
