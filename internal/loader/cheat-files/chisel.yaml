tool: chisel
tags: [network, tunneling, pivoting, proxy, security, pentest, port-forwarding, socks]

actions:
  # === SERVER CONFIGURATION ===
  - title: chisel - 基础服务器监听
    desc: |
      在特定端口上启动基础 Chisel 服务器监听。该命令通常
      在攻击者机器上运行，以接收来自受害者的连接。
      它为 SSH-over-HTTP 隧道创建基础设施，但默认不允许反向隧道。
    command: "chisel server --port {{listen_port|8080}}"

  - title: chisel - 带反向隧道的服务器
    desc: |
      启动允许客户端请求反向端口转发的 Chisel 服务器。
      --reverse 标志对大多数渗透测试场景至关重要，在这些场景中
      攻击者需要访问私有网络内部的服务。它使客户端能够建立指向自身网络的隧道。
    command: "chisel server --port {{listen_port|8080}} --reverse"

  - title: chisel - 带认证的服务器
    desc: |
      运行要求所有传入连接提供用户名与密码的 Chisel 服务器。
      当将 Chisel 服务器暴露到公共互联网时，这是一项关键安全措施，
      可防止未授权的跳板访问。凭据格式为 user:pass，可指定多个用户。
    command: "chisel server --port {{listen_port|8080}} --auth {{user:pass}} --reverse"

  # === CLIENT TUNNELING ===
  - title: chisel - 本地端口转发
    desc: |
      连接到 Chisel 服务器，并将客户端机器上的本地端口映射到
      服务器可达的目的地。发送到客户端本地端口的流量将通过 Chisel
      经服务器隧道传输到目标地址。这对于绕过出站防火墙以访问特定服务很有用。
    command: "chisel client {{server_ip}}:{{server_port}} {{local_port}}:{{remote_target}}:{{remote_port}}"

  - title: chisel - 远程端口转发（反向）
    desc: |
      连接到 Chisel 服务器，并将服务器机器上的端口映射回
      客户端可达的目的地。这使攻击者（服务器）能够访问受害者（客户端）
      网络内部的服务。注意服务器必须使用 --reverse 标志启动才能生效。
    command: "chisel client {{server_ip}}:{{server_port}} R:{{server_listen_port}}:{{target_addr}}:{{target_port}}"

  # === SOCKS PROXYING ===
  - title: chisel - 动态 SOCKS 代理
    desc: |
      在客户端机器上设置 SOCKS5 代理，通过 Chisel 服务器隧道传输流量。
      这使客户端能使用任何工具（如浏览器或 proxychains）通过服务器的网络位置路由流量。
      Chisel 内部逻辑中默认使用的 SOCKS 端口为 1080。
    command: "chisel client {{server_ip}}:{{server_port}} {{local_socks_port|1080}}:socks"

  - title: chisel - 反向 SOCKS 代理
    desc: |
      在服务器机器上创建 SOCKS5 代理，通过客户端机器将流量路由到客户端的内部网络。
      这是最常见的跳板技术，使攻击者能到达受感染主机的整个内部子网。
      需要服务器启用 --reverse。
    command: "chisel client {{server_ip}}:{{server_port}} R:{{socks_port|1080}}:socks"

  # === SECURITY AND OPTIMIZATION ===
  - title: chisel - 带指纹的安全客户端
    desc: |
      连接到服务器时验证其 TLS 指纹，以防止中间人（MITM）攻击。
      服务器启动时会显示该指纹。这确保客户端只与
      预期的、已授权的 Chisel 服务器通信。
    command: "chisel client --fingerprint {{fingerprint}} {{server_ip}}:{{server_port}} R:socks"

  - title: chisel - 带压缩的优化隧道
    desc: |
      在隧道流上启用 GZIP 压缩以降低带宽使用。
      在隧道传输大量数据或在慢速网络连接上运行时特别有用。
      它可能略微增加两端 CPU 使用，但通常会带来更好的感知性能。
    command: "chisel client {{server_ip}}:{{server_port}} --compress R:socks"

  - title: chisel - 持久客户端连接
    desc: |
      配置客户端在连接丢失时无限尝试重连。
      --keepalive 标志发送心跳数据包，防止防火墙超时关闭连接。
      这对于在长期任务中维持稳定的立足点至关重要。
    command: "chisel client --keepalive {{interval|30s}} {{server_ip}}:{{server_port}} R:socks"
