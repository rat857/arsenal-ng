tool: tldfinder
tags: [recon, enumeration, osint, security, pentest, infrastructure]

actions:
# === DISCOVERY ACTIONS ===
 - title: tldfinder - 基础 TLD 发现
   desc: |
     对指定域名执行标准发现扫描。该命令是识别与组织关联的私有或内部顶级域名的主要方式。
     它有助于测绘扩展的数字足迹，这些足迹通过标准子域名枚举并不总是可见。
   command: "tldfinder -d {{target_domain}}"

 - title: tldfinder - 全面发现
   desc: |
     使用所有可用数据源查找域名和私有 TLD，确保最大覆盖。虽然此模式比默认扫描慢，但通过查询每个受支持的提供方可提供最彻底的结果。
     在执行深度侦察时使用，因为遗漏单个资产可能造成严重后果。
   command: "tldfinder -d {{target_domain}} -all"

 - title: tldfinder - 自定义发现模式
   desc: |
     更改枚举逻辑，聚焦于 dns、tld 或 domain 等特定发现类型。这使研究人员可以根据初步发现或特定目标基础设施需求调整策略。
     默认模式通常是 dns，而 tld 模式专门用于查找独特后缀。
   command: "tldfinder -d {{target_domain}} -dm {{mode|tld}}"

# === FILTERING AND SOURCES ===
 - title: tldfinder - 按特定数据源过滤
   desc: |
     将发现过程限制在逗号分隔的特定数据源列表。这对于专注于已知对特定地区或目标类型拥有高质量数据的提供方很有用。
     它还有助于避免可能较慢或当前宕机的数据源。
   command: "tldfinder -d {{target_domain}} -s {{sources|censys,whoisxmlapi}}"

 - title: tldfinder - 排除特定数据源
   desc: |
     在枚举过程中跳过指定数据源，以节省时间或避免限速。如果某个数据源持续失败或提供重复数据，排除它可以显著简化发现工作流。
     先用 -ls 参数确认要排除的数据源的确切名称。
   command: "tldfinder -d {{target_domain}} -es {{excluded_sources|dnsrepo}}"

 - title: tldfinder - 匹配特定域名模式
   desc: |
     过滤输出，仅显示匹配特定字符串或文件中列表的域名。当在大量结果中查找特定子品牌或环境（如 dev 或 prod）时很有帮助。
     它只关注任务相关的模式，从而减少手动工作。
   command: "tldfinder -d {{target_domain}} -m {{match_pattern|dev}}"

# === RESOLUTION AND OUTPUT ===
 - title: tldfinder - 解析活跃域名
   desc: |
     尝试解析已发现的域名，确保它们当前活跃。此操作过滤掉历史或失效记录，提供可访问目标的列表，供进一步利用或漏洞扫描。
     注意这会增加网络流量，可能被安全监控检测到。
   command: "tldfinder -d {{target_domain}} -active"

 - title: tldfinder - 包含 IP 地址
   desc: |
     显示扫描过程中发现的活跃域名关联的 IP 地址。此要求需要使用 -active 参数来执行 DNS 解析。
     它提供关于托管环境的即时上下文，并允许按 IP 对资产进行过滤或分组。
   command: "tldfinder -d {{target_domain}} -active -oI"

 - title: tldfinder - 结构化 JSON 输出
   desc: |
     将发现结果导出为 JSON Lines 格式，便于其他工具处理。这是将 tldfinder 集成到自动化 CI/CD 流水线或自定义侦察框架的首选方法。
     如果已配置，它会捕获所有元数据，包括每个已发现域名的来源。
   command: "tldfinder -d {{target_domain}} -oJ -o {{output_file|results.json}}"

# === UTILITIES ===
 - title: tldfinder - 静默模式用于管道
   desc: |
     抑制横幅和所有信息消息，仅输出发现的域名。在将输出直接管道传递给 httpx、nmap 或 subfinder 等工具时必不可少。
     它可以防止非域名字符串在命令行管道中向下传递时引发错误。
   command: "tldfinder -d {{target_domain}} -silent"

 - title: tldfinder - 列出所有可用数据源
   desc: |
     打印工具当前支持的所有数据源的完整列表。这对于验证哪些提供方处于活跃状态以及检查你是否已为付费服务配置必要的 API key 很有用。
     应定期运行以查看工具更新中新增的数据源。
   command: "tldfinder -ls"

 - title: tldfinder - 更新工具
   desc: |
     将 tldfinder 二进制文件更新到官方仓库提供的最新版本。保持工具更新可确保你拥有最新的数据源模块、错误修复和性能改进。
     它可能需要二进制文件所在目录的写权限。
   command: "tldfinder -up"