tool: impacket-smbclient
tags: [network, windows, security, pentest, enumeration, exploitation, authentication, smb]

actions:
  # === AUTHENTICATION METHODS ===
  - title: impacket-smbclient - 基本身份验证
    desc: |
      使用标准用户名和密码连接远程 SMB 共享。
      这是与 Windows 共享交互以列出目录或管理文件的最常见方式。
      该命令会打开一个交互式迷你 shell，支持“ls”“cd”“get”和“put”等操作。
    command: "impacket-smbclient {{domain|.}}/{{username}}:{{password}}@{{target}}"

  - title: impacket-smbclient - 匿名登录
    desc: |
      尝试在不提供密码或使用空会话的情况下连接 SMB 服务。
      这有助于识别配置错误的服务器，这些服务器允许对 IPC$ 或公共备份等敏感共享进行未认证访问。
      请注意，出于安全考虑，许多现代 Windows 系统默认禁用匿名访问。
    command: "impacket-smbclient {{target}} -no-pass"

  - title: impacket-smbclient - 传递哈希身份验证
    desc: |
      使用 NTLM 哈希而非明文密码对目标进行身份验证。
      当你已提取哈希但无法破解时，此技术在后利用场景中至关重要。
      哈希必须以“LMHASH:NTHASH”格式提供，但 LM 部分可以为空（例如“aad3b435b51404eeaad3b435b51404ee:NTHASH”）。
    command: "impacket-smbclient {{domain|.}}/{{username}}@{{target}} -hashes {{lmhash:nthash}}"

  - title: impacket-smbclient - Kerberos 身份验证
    desc: |
      使用 Kerberos 票据而非 NTLM 进行身份验证。
      这要求环境中存在有效的 Kerberos 票据授予票据（TGT，即 KRB5CCNAME）。
      在禁用 NTLM 的 Active Directory 环境中，或为避免产生基于 NTLM 的告警时，它非常有效。
    command: "impacket-smbclient -k -no-pass {{domain}}/{{username}}@{{target}}"

  # === CONNECTION SETTINGS ===
  - title: impacket-smbclient - 指定域控制器 IP
    desc: |
      显式定义用于身份验证的域控制器（DC）IP 地址。
      当目标机器无法解析域名，或你位于不同网段时，这是必需的。
      它确保身份验证请求直接发送到权威 DC。
    command: "impacket-smbclient {{domain}}/{{username}}@{{target}} -dc-ip {{dc_ip}}"

  - title: impacket-smbclient - 在自定义端口上连接
    desc: |
      使用非标准端口而非默认的 445 连接 SMB 服务。
      当目标位于端口转发器、代理或 SSH 隧道之后时很有用。
      指定目的端口以确保客户端到达预期的服务。
    command: "impacket-smbclient {{domain|.}}/{{username}}@{{target}} -port {{port|445}}"

  - title: impacket-smbclient - 将目标 IP 与 NetBIOS 名称分离
    desc: |
      指定一个与目标字符串中 NetBIOS 名称或 FQDN 不同的目标 IP 地址。
      当目标主机名无法通过 DNS 解析，但 SMB 协议需要它才能正常工作时很有用。
      它在保持会话指定目标名称的同时，强制连接到所提供的 IP。
    command: "impacket-smbclient {{domain|.}}/{{username}}@{{hostname}} -target-ip {{target_ip}}"

  # === AUTOMATION & LOGGING ===
  - title: impacket-smbclient - 从文件执行命令
    desc: |
      从本地文本文件读取一系列命令，并在 SMB 会话中自动执行。
      这对于跨多个共享自动化数据窃取或常规枚举任务非常出色。
      它减少了手动交互，并最大程度缩短在交互式 shell 中花费的时间。
    command: "impacket-smbclient {{domain|.}}/{{username}}@{{target}} -inputfile {{commands_file}}"

  - title: impacket-smbclient - 将会话记录到文件
    desc: |
      将 smbclient 会话的所有操作和输出记录到指定的本地文件。
      这对于在渗透测试期间维护审计轨迹或之后分析共享内容至关重要。
      输出文件将包含输入的每条命令以及从服务器收到的每条响应。
    command: "impacket-smbclient {{domain|.}}/{{username}}@{{target}} -outputfile {{log_filename|smb_session.log}}"

  - title: impacket-smbclient - 调试模式和时间戳
    desc: |
      启用详细调试输出并为每条日志添加时间戳。
      这用于排查连接问题或理解协议协商失败。
      调试模式可以更深入地了解底层 Impacket 库与远程 SMB 提供方的交互。
    command: "impacket-smbclient -debug -ts {{domain|.}}/{{username}}@{{target}}"
