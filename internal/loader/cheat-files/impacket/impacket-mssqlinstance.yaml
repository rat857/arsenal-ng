tool: impacket-mssqlinstance
tags: [network, pentest, reconnaissance, mssql, enumeration, impacket, security]

actions:
  # === BASIC ENUMERATION ===

  - title: impacket-mssqlinstance - 基础 MSSQL 实例枚举
    desc: |
      查询远程主机上的 SQL Server Browser 服务，以识别所有正在运行的 MSSQL 实例。
      这是尝试登录前发现非标准端口和实例名称的基础侦察步骤。
      它针对 UDP 端口 1434 检索数据库环境的配置详情。
    command: "impacket-mssqlinstance {{target}}"

  - title: impacket-mssqlinstance - 使用自定义超时枚举
    desc: |
      调整工具等待目标服务器响应的时间。
      在通过高延迟连接、不稳定的 VPN 或拥塞网络扫描目标时尤为有用。
      增大超时可防止脚本在收到 UDP 响应之前过早终止。
    command: "impacket-mssqlinstance -timeout {{timeout_seconds|5}} {{target}}"

  # === ADVANCED TROUBLESHOOTING & LOGGING ===

  - title: impacket-mssqlinstance - 带调试输出的枚举
    desc: |
      以调试模式运行工具，提供连接过程的详细内部信息。
      当目标未返回结果或怀疑防火墙干扰 UDP 流量时使用。
      它会显示原始数据包处理和库级执行细节，这对排查至关重要。
    command: "impacket-mssqlinstance -debug {{target}}"

  - title: impacket-mssqlinstance - 带时间戳的枚举
    desc: |
      为工具生成的每一行输出添加时间戳。
      这是专业渗透测试中维护准确活动审计记录的最佳实践。
      它有助于将扫描活动与目标系统日志或安全监控告警相关联。
    command: "impacket-mssqlinstance -ts {{target}}"

  - title: impacket-mssqlinstance - 带自定义时间的详细日志
    desc: |
      结合时间戳、调试和超时调整，进行全面的诊断扫描。
      此配置非常适合需要最大限度洞察通信流程的复杂环境。
      它确保即使缓慢或异常的响应也能被捕获，并带有详细的时间信息。
    command: "impacket-mssqlinstance -debug -ts -timeout {{timeout_seconds|10}} {{target}}"