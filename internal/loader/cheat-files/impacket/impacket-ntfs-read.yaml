tool: impacket-ntfs-read
tags: [forensics, storage, ntfs, impacket, security, disk-analysis, file-extraction]

actions:
  # === BASIC EXPLORATION ===
  - title: impacket-ntfs-read - 交互式卷浏览
    desc: |
      在只读 shell 中打开 NTFS 卷进行交互式浏览。
      主要用于浏览原始磁盘镜像或物理驱动器上的文件，无需将其挂载到主机操作系统。
      它是极佳的取证分析工具，可防止意外修改访问时间等文件元数据。
    command: "impacket-ntfs-read {{volume}}"

  # === FILE EXTRACTION ===
  - title: impacket-ntfs-read - 提取特定文件
    desc: |
      使用绝对内部路径从 NTFS 卷提取特定文件。
      这是凭据收集中从离线磁盘拉取 SAM 或 SECURITY 等敏感注册表配置单元的常用技术。
      请确保路径以反斜杠开头以表示 NTFS 分区根目录。
    command: "impacket-ntfs-read -extract {{file_path}} {{volume}}"

  - title: impacket-ntfs-read - 提取 SYSTEM 配置单元用于解密
    desc: |
      专门从目标卷提取 Windows SYSTEM 配置单元。
      SYSTEM 配置单元对于获取解密 SAM 或 LSA 密钥所需的启动密钥至关重要。
      处理虚拟机磁盘文件或原始取证克隆时，此命令非常有效。
    command: "impacket-ntfs-read -extract {{file_path}} {{volume}}"

  - title: impacket-ntfs-read - 从卷提取 ntds.dit
    desc: |
      尝试从域控制器的磁盘镜像中提取 Active Directory 数据库文件（ntds.dit）。
      这是离线 NTDS.DIT 转储以提取域哈希的关键步骤。
      注意这需要访问存储数据库的卷，某些环境中该卷可能不是 C: 盘。
    command: "impacket-ntfs-read -extract {{file_path}} {{volume}}"

  # === ADVANCED / TROUBLESHOOTING ===
  - title: impacket-ntfs-read - 用于排查的调试模式
    desc: |
      在与 NTFS 卷交互时启用详细的调试输出。
      当工具无法解析主文件表（MFT）或遇到文件系统损坏时很有用。
      它提供底层 Impacket 库与 NTFS 结构交互的详细信息。
    command: "impacket-ntfs-read -debug {{volume}}"

  - title: impacket-ntfs-read - 带时间戳的日志
    desc: |
      在工具生成的每一行输出前添加时间戳。
      有助于在取证调查或渗透测试期间维护严格计时的审计日志。
      便于将文件访问时间与外部监控系统中记录的其他事件相关联。
    command: "impacket-ntfs-read -ts {{volume}}"

  - title: impacket-ntfs-read - 完整调试与提取
    desc: |
      结合提取和调试标志，排查特定文件访问问题。
      此命令会尝试提取指定文件，同时打印正在处理的所有技术元数据。
      当文件存在但工具无法定位其数据运行或簇时使用。
    command: "impacket-ntfs-read -debug -extract {{file_path}} {{volume}}"