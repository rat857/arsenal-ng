tool: impacket-GetADComputers
tags: [active-directory, pentest, enumeration, security, impacket, reconnaissance]

actions:
  # === AUTHENTICATION METHODS ===
  - title: impacket-GetADComputers - 基础域计算机枚举
    desc: |
      对 Active Directory 执行标准查询，列出域中的所有计算机对象。
      这是内部侦察中梳理网络基础设施的基础步骤。
      它需要有效的域凭据，并连接到域控制器拉取 LDAP 数据，大型环境可能返回大量结果。
    command: "impacket-GetADComputers {{domain}}/{{username}}:{{password}}"

  - title: impacket-GetADComputers - 使用 NTLM 哈希认证
    desc: |
      使用 Pass-the-Hash（PtH）进行身份认证并从域中查询计算机信息。
      当明文密码不可用但已恢复 NTLM 哈希时非常有用。
      哈希必须为 LMHASH:NTHASH 格式；如果 LM 哈希为空，请使用 :NTHASH 格式，此方法可更隐蔽地移动。
    command: "impacket-GetADComputers -hashes {{hash}} {{domain}}/{{username}}"

  - title: impacket-GetADComputers - 使用 Kerberos 身份认证
    desc: |
      使用 Kerberos 票据而非密码或哈希进行身份认证。
      工具会尝试从 KRB5CCNAME 环境变量指向的 ccache 文件获取凭据。
      这是在严格强制 Kerberos 的环境中或执行 Overpass-the-Hash 时的首选方法；若不希望提示输入密码请加 -no-pass。
    command: "impacket-GetADComputers -k -no-pass {{domain}}/{{username}}"

  - title: impacket-GetADComputers - 使用 AES 密钥的 Kerberos 认证
    desc: |
      使用特定的 AES 十六进制密钥（128 或 256 位）进行 Kerberos 身份认证。
      适用于已提取到某用户或计算机账户 AES 密钥的场景。
      在已禁用 NTLM 的环境中，AES 密钥比 NTLM 哈希更可靠；请确保目标参数与该 AES 密钥对应的主体匹配。
    command: "impacket-GetADComputers -aesKey {{hex_key}} {{domain}}/{{username}}"

  # === CONNECTION AND RESOLUTION ===
  - title: impacket-GetADComputers - 指定域控制器 IP
    desc: |
      指定工具通过 IP 地址连接到特定的域控制器。
      当本机无法通过 DNS 解析域的 FQDN 时，这是必需的。
      也适用于在复杂林或多站点环境中定位特定 DC，直接使用 IP 有时可绕过基于 DNS 的安全监控。
    command: "impacket-GetADComputers -dc-ip {{dc_ip}} {{domain}}/{{username}}:{{password}}"

  - title: impacket-GetADComputers - 枚举并解析计算机 IP
    desc: |
      查询计算机对象，并在域控制器上使用 nslookup 尝试解析其 IP 地址。
      这有助于将主机名与实际网络地址对应起来，更清晰地掌握活跃网络布局。
      解析由 DC 在服务端完成，可减少来自源 IP 的 DNS 流量。
    command: "impacket-GetADComputers -resolveIP {{domain}}/{{username}}:{{password}}"

  # === FILTERING AND DEBUGGING ===
  - title: impacket-GetADComputers - 按用户筛选计算机对象
    desc: |
      请求与特定域用户相关联的计算机数据。
      这有助于识别高权限用户通常交互的主工作站或服务器。
      注意此筛选取决于 AD 中“managedBy”等属性的填充情况，是针对特定身份定位高价值资产的方法。
    command: "impacket-GetADComputers -user {{target_user}} {{domain}}/{{username}}:{{password}}"

  - title: impacket-GetADComputers - 启用调试输出和时间戳
    desc: |
      以详细的调试日志运行枚举，并为每一行输出添加时间戳。
      调试输出对于排查连接问题、LDAP 错误或认证失败至关重要。
      时间戳有助于文档记录并在测试期间与服务端日志关联；当标准输出不足以说明查询失败原因时使用。
    command: "impacket-GetADComputers -debug -ts {{domain}}/{{username}}:{{password}}"