tool: impacket-net
tags: [network, pentest, active-directory, enumeration, impacket, security, samr]

actions:
  # === DOMAIN ENUMERATION ===
  - title: impacket-net - 枚举域用户
    desc: |
      列出目标 Active Directory 域中的所有用户账户。
      这是构建密码喷洒目标列表或识别有价值账户的基础侦察步骤。
      它通过 SMB 与 SAMR（远程安全账户管理器）RPC 接口通信，请注意过度枚举可能被安全监控工具记录。
    command: "impacket-net {{domain}}/{{username}}:{{password}}@{{target_ip}} user"

  - title: impacket-net - 枚举域计算机
    desc: |
      获取在域级别注册的所有计算机账户列表。
      识别计算机名称和类型有助于梳理内部网络基础设施并寻找高价值目标。
      此命令特别适合根据命名约定识别潜在的域控制器或 SQL 服务器，需要有效域凭据查询域控制器的 SAM 数据库。
    command: "impacket-net {{domain}}/{{username}}:{{password}}@{{target_ip}} computer"

  - title: impacket-net - 枚举域组
    desc: |
      列出域控制器内注册的所有全局组和安全组。
      了解组结构对于梳理权限层级并找到“Domain Admins”等敏感组至关重要。
      此操作帮助攻击者或审计人员识别 AD 环境中掌握重要权限的组，输出通常包括组名及其关联的 RID（相对标识符）。
    command: "impacket-net {{domain}}/{{username}}:{{password}}@{{target_ip}} group"

  # === LOCAL ENUMERATION ===
  - title: impacket-net - 枚举本地组
    desc: |
      枚举特定目标计算机上定义的本地组（别名）。
      有助于识别谁在工作站或服务器上拥有本地管理员权限或其他特定本地权限。
      通过显示哪些域用户或组映射到本地特权角色，为横向移动规划提供帮助；注意这需要成功连接目标的 SAMR 接口，通常需要管理员或特定 RPC 权限。
    command: "impacket-net {{domain}}/{{username}}:{{password}}@{{target_ip}} localgroup"

  # === AUTHENTICATION VARIANTS ===
  - title: impacket-net - 通过 Pass-the-Hash 枚举
    desc: |
      使用 NTLM 哈希而非明文密码执行枚举。
      在后渗透阶段已提取哈希但无法破解为明文时，此技术至关重要。
      哈希格式必须为 LMHASH:NTHASH；如果只有 NTLM 哈希，请提供空 LM 哈希（32 个零），可获得与标准密码登录相同级别的枚举。
    command: "impacket-net {{domain}}/{{username}}@{{target_ip}} -hashes {{lmhash|00000000000000000000000000000000}}:{{nthash}} user"

  - title: impacket-net - 使用 Kerberos 枚举
    desc: |
      使用 Kerberos 认证而非 NTLM 执行枚举。
      这需要环境中已有有效的 Kerberos 票据（TGT），或指定凭据以便从 KDC 请求。
      在 NTLM 受限或需绕过某些安全控制的环境中通常首选 Kerberos，请使用目标的 FQDN/主机名而非 IP 地址以确保 Kerberos 正常工作。
    command: "impacket-net {{domain}}/{{username}}@{{target_name}} -k -no-pass -dc-ip {{dc_ip}} user"

  # === ADVANCED CONNECTION ===
  - title: impacket-net - 指定目标 IP 和端口
    desc: |
      无论目标字符串如何，强制连接到特定的 IP 地址和端口。
      当本机 DNS 无法解析 NetBIOS 名称或 FQDN 时很有用。
      如果 SMB 服务运行在非标准端口（如经端口转发或隧道）也很有帮助，命令字符串中的目标参数仍代表你要连接的身份。
    command: "impacket-net {{domain}}/{{username}}:{{password}}@{{target_name}} -target-ip {{target_ip}} -port {{port|445}} user"

  - title: impacket-net - 调试模式枚举
    desc: |
      使用 -debug 标志运行枚举工具以提供详细输出。
      对于排查连接问题、RPC 错误或认证失败非常有用。
      它会显示发往目标的底层数据包和 RPC 调用，当工具静默失败或返回“拒绝访问”等意外错误码时使用。
    command: "impacket-net -debug {{domain}}/{{username}}:{{password}}@{{target_ip}} user"