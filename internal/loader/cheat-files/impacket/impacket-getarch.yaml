tool: impacket-getarch
tags: [network, enumeration, smb, impacket, security, pentest, reconnaissance]

actions:
# === BASIC ENUMERATION ===

 - title: impacket-getArch - 基础目标扫描
   desc: |
     识别单个远程目标系统的操作系统架构。
     该工具能高效判断目标是运行 32 位还是 64 位的 Windows。
     在部署漏洞利用程序或特定的后渗透二进制文件之前，了解架构是关键的步骤，它通常通过 SMB 和 RPC 端口收集信息。
   command: "impacket-getArch -target {{target}}"

 - title: impacket-getArch - 从文件扫描多个目标
   desc: |
     对文本文件中指定的目标列表执行架构枚举。
     输入文件每行应包含一个目标 IP 地址或主机名。
     非常适合大规模内部网络扫描以梳理基础设施，也有助于为批量利用或补丁管理分析对系统进行分类。
   command: "impacket-getArch -targets {{targets_file}}"

# === ADVANCED CONFIGURATION ===

 - title: impacket-getArch - 自定义超时扫描
   desc: |
     调整连接目标时的套接字超时时长。
     默认超时为 2 秒，在高延迟或拥塞的网络中可能不够。
     增大该值有助于确保扫描响应缓慢的系统时工具不会过早退出，在遇到连接重置或超时错误时使用。
   command: "impacket-getArch -target {{target}} -timeout {{timeout|5}}"

 - title: impacket-getArch - 带调试输出的扫描
   desc: |
     为整个执行过程启用详细的调试日志。
     可深入了解底层的协议交互和 Impacket 库调用。
     对于排查连接问题或协议级错误非常有用，当目标存活但工具未能返回架构时使用。
   command: "impacket-getArch -target {{target}} -debug"

 - title: impacket-getArch - 带时间戳的扫描
   desc: |
     为工具日志输出中的每一行添加精确的时间戳。
     此功能对于在专业测试期间维护准确的审计记录至关重要。
     便于顾问将自身活动与目标系统日志或网络流量抓包相关联，当输出被重定向到日志文件时建议使用。
   command: "impacket-getArch -target {{target}} -ts"