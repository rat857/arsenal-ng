tool: impacket-dpapi
tags: [windows, security, pentest, decryption, dpapi, impacket, credential-harvesting]

actions:
# === DOMAIN BACKUP KEYS ===

 - title: impacket-dpapi - 导出域备份密钥
   desc: |
     通过 LSA（本地安全机构）RPC 接口从域控制器检索域备份密钥。该密钥是 AD 环境中 DPAPI 解密的“圣杯”，因为它可以解密任何用户的 MasterKey。输出通常保存为 .pvk 文件，之后可用于在不知道用户密码的情况下离线解密 MasterKey。此操作需要域管理员权限或类似权限才能与域控制器的 LSA 通信。
   command: "impacket-dpapi backupkeys --action export --user {{domain_admin}} --password {{password}} --domain {{domain}} --dc-ip {{dc_ip}}"

# === MASTERKEY DECRYPTION ===

 - title: impacket-dpapi - 使用用户密码解密 MasterKey
   desc: |
     使用用户的明文密码及其安全标识符（SID）解密 DPAPI MasterKey 文件。MasterKey 文件通常位于用户配置文件目录下的 AppData\Roaming\Microsoft\Protect\(SID)。成功解密会得到解锁特定凭据、浏览器数据或 WiFi 密码所需的 key。当你成功钓鱼或恢复了用户密码时，这是最常用的方法。
   command: "impacket-dpapi masterkey -file {{masterkey_path}} -sid {{user_sid}} -password {{password}}"

 - title: impacket-dpapi - 使用 NT 哈希解密 MasterKey
   desc: |
     使用用户的 NT 哈希而非明文密码解密 DPAPI MasterKey 文件。在 Pass-the-Hash 场景中，或当你从 SAM 或 NTDS.dit 文件提取了哈希时，这非常有用。你仍必须提供用户的 SID 以正确派生 MasterKey 文件的解密密钥。解密后，工具会显示 GUID 和解密后的密钥以供后续使用。
   command: "impacket-dpapi masterkey -file {{masterkey_path}} -sid {{user_sid}} -hashes :{{nt_hash}}"

 - title: impacket-dpapi - 使用域备份密钥（PVK）解密 MasterKey
   desc: |
     使用先前导出的域备份密钥（.pvk 文件）解密用户的 MasterKey。这种方法很强大，因为它不需要知道用户的密码或 NT 哈希。这是已入侵域控制器的取证调查人员或红队成员的首选方法。MasterKey 是解密存储在凭据或保险库中的实际机密所需的中间密钥。
   command: "impacket-dpapi masterkey -file {{masterkey_path}} -pvk {{pvk_file}}"

# === DECRYPTING SECRETS (CREDENTIALS & VAULTS) ===

 - title: impacket-dpapi - 解密凭据文件
   desc: |
     使用先前解密的 MasterKey 解密 Windows 凭据文件。凭据文件位于 %APPDATA%\Microsoft\Credentials，通常包含映射驱动器或遗留应用的敏感密码。你必须提供从 masterkey 命令获得的已解密 MasterKey（十六进制字符串）。工具会输出解密后的内容，通常包括目标资源、用户名和密码。
   command: "impacket-dpapi credential -file {{cred_file_path}} -masterkey {{decrypted_masterkey}}"

 - title: impacket-dpapi - 解密保险库凭据
   desc: |
     解锁用于存储 Web 凭据（IE/Edge）、Windows 密码和应用机密的 Windows 保险库文件。保险库文件通常位于 %LOCALAPPDATA%\Microsoft\Vault 或 %APPDATA%\Microsoft\Vault。此命令需要与特定保险库条目关联的已解密 MasterKey 才能揭示明文数据。对于恢复已保存的浏览器密码或其他系统级缓存凭据至关重要。
   command: "impacket-dpapi vault -file {{vault_file_path}} -masterkey {{decrypted_masterkey}}"

# === ADVANCED UTILITIES ===

 - title: impacket-dpapi - 处理凭据历史（credhist）
   desc: |
     解密追踪用户密码更改历史的 CREDHIST 文件。当 MasterKey 是用不再是当前的旧密码加密时非常有用。通过处理 CREDHIST 文件，你可以将旧密码链接到较旧 DPAPI 数据块的解密过程。需要用户的 SID 和有效密码（当前或历史）来开始解密链。
   command: "impacket-dpapi credhist -file {{credhist_path}} -sid {{user_sid}} -password {{password}}"

 - title: impacket-dpapi - 解密通用 DPAPI 数据块
   desc: |
     提供 CryptUnprotectData 功能的包装器，用于解密通用的 DPAPI 保护数据块。用于在注册表或第三方应用配置文件中找到的任意数据块。你需要提供用于保护该特定数据块的已解密 MasterKey。它是手动分析依赖 Windows DPAPI 进行安全的自定义应用的通用命令。
   command: "impacket-dpapi unprotect -data {{hex_blob}} -masterkey {{decrypted_masterkey}}"
