tool: impacket-split
tags: [network, forensics, traffic-analysis, pcap, packet-manipulation, impacket, security]

actions:
# === PCAP SESSION ISOLATION ===

 - title: impacket-split - 按 TCP 会话拆分 PCAP
   desc: |
     将大型 PCAP 文件拆分为多个较小的 PCAP 文件，每个文件代表一个唯一的 TCP 会话。
     这是该工具的主要用例，允许分析人员从嘈杂的捕获中隔离特定网络会话。
     它对于专注于单条流量流而免受无关数据包干扰非常有帮助。
     每个结果文件通常根据会话中涉及的源和目标 IP 地址及端口命名。
   command: "impacket-split {{pcap_file}}"

 - title: impacket-split - 取证流量提取
   desc: |
     为取证调查目的执行深度流量隔离。
     当你拥有批量捕获并需要在各个流中识别特定恶意载荷或未授权数据传输时使用此命令。
     通过拆分捕获，你可以更轻松地执行文件雕刻或手动检查协议握手。
     确保在专用目录中运行，因为大型捕获文件可能生成数百或数千个单独的 PCAP 文件。
   command: "impacket-split {{input_capture|traffic.pcap}}"

 - title: impacket-split - 自动化会话分析准备
   desc: |
     通过将整体捕获划分为细粒度的会话文件，为自动化分析准备网络流量。
     这种方法通常用于在将流量输入到处理单个流而非批量数据的其他安全工具之前使用。
     它有助于绕过那些难以处理超大文件或多个来源交错数据包的工具的限制。
     请注意，此工具专门针对 TCP 会话；UDP 等其他协议可能不会以相同的基于会话的方式处理。
   command: "impacket-split {{target_pcap}}"

# === ADVANCED USAGE SCENARIOS ===

 - title: impacket-split - 处理特定路径的 PCAP
   desc: |
     对位于特定目录路径的捕获文件执行拆分过程。
     当处理有组织的证据文件夹或包含大型数据包捕获的外部存储驱动器时，这很有用。
     工具将从提供的路径读取源文件，并在当前工作目录中生成拆分后的会话文件。
     在开始之前，务必确认你在目标文件夹中拥有足够的写权限和磁盘空间。
   command: "impacket-split {{path_to_file|/tmp/capture.pcap}}"
