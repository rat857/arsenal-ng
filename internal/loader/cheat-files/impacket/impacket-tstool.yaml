tool: impacket-tstool
tags: [pentest, security, impacket, terminal-services, rdp, enumeration, exploitation, windows, post-exploitation]

actions:
  # === ENUMERATION ACTIONS ===

  - title: impacket-tstool - 查询会话信息
    desc: |
      显示目标主机上远程桌面服务会话的详细信息。
      此命令对于识别活动、已断开或空闲的用户及其关联会话 ID 至关重要。
      它帮助渗透测试人员确定哪些会话容易受到劫持，或哪些用户当前在系统上处于活动状态。
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} qwinsta"

  - title: impacket-tstool - 列出远程进程
    desc: |
      检索远程 Windows 系统上当前运行的所有进程的完整列表。
      输出包括进程名称和进程 ID（PID），这是终止进程等后续操作所必需的。
      它有助于识别安全代理、监控软件或在不同用户上下文中运行的特定应用程序。
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} tasklist"

  # === SESSION MANAGEMENT ===

  - title: impacket-tstool - 附加到用户会话（劫持）
    desc: |
      将用户会话附加到目标服务器上的另一个远程桌面会话。
      这常用于 RDP 劫持场景，在不知道用户密码的情况下接管现有会话。
      请注意，此操作通常需要高权限（System 或 Admin），并可用于在不同用户桌面之间进行跳转。
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} tscon {{session_id}} --dest {{dest_session_name}}"

  - title: impacket-tstool - 断开会话
    desc: |
      断开特定远程桌面服务会话，但不注销用户。
      用户的应用程序继续运行，但其与桌面的网络连接被切断。
      这可用于强制用户重新身份验证，或清理繁忙服务器上的会话槽。
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} tsdiscon {{session_id}}"

  - title: impacket-tstool - 强制注销会话
    desc: |
      强制特定会话退出远程桌面服务环境。
      与断开连接不同，此操作会终止该特定用户会话内所有正在运行的进程。
      这是一个破坏性操作，如果目标用户有未保存的工作，可能会导致数据丢失。
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} logoff {{session_id}}"

  - title: impacket-tstool - 发送弹出消息
    desc: |
      向目标上的特定用户会话或所有会话发送图形消息框。
      这常用于社会工程，或向已登录用户提供看似官方的警告。
      消息以标准 Windows 对话框形式出现，用户必须确认。
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} msg \"{{message|System maintenance starting soon.}}\""

  # === SYSTEM CONTROL ===

  - title: impacket-tstool - 终止远程进程
    desc: |
      使用其进程 ID（PID）或映像名称终止远程系统上正在运行的任务。
      这可用于禁用安全软件、停止卡住的服务或中断特定用户活动。
      请谨慎，因为终止系统关键进程可能导致操作系统不稳定或立即重启。
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} taskkill /PID {{pid}}"

  - title: impacket-tstool - 远程系统关机
    desc: |
      发起目标机器的远程关机，影响所有已登录用户和会话。
      这是一个高影响命令，会完全关闭远程主机的电源。
      仅在必要时用于后利用或作为受控环境拆除的一部分时使用。
    command: "impacket-tstool {{domain/username:password|administrator}}@{{target}} shutdown"

  # === AUTHENTICATION & CONNECTION OPTIONS ===

  - title: impacket-tstool - 使用 NTLM 哈希进行身份验证
    desc: |
      使用 NTLM 哈希而非明文密码执行终端服务操作。
      这实现了传递哈希（PtH）攻击，当只从内存中恢复出 NTLM 哈希时至关重要。
      哈希格式应为 LMHASH:NTHASH；如果 LM 哈希未知，请使用标准的空 LM 值。
    command: "impacket-tstool -hashes {{hash}} {{domain/username|administrator}}@{{target}} {{action|qwinsta}}"

  - title: impacket-tstool - 使用 Kerberos 进行身份验证
    desc: |
      使用 Kerberos 身份验证而非 NTLM 在远程主机上执行任务。
      这要求环境中存在有效的 Kerberos 票据（TGT/TGS，即 KRB5CCNAME）。
      在禁用 NTLM 的环境中使用 -k 标志很有益，或用于规避针对 NTLM 的检测机制。
    command: "impacket-tstool -k -no-pass {{domain/username|administrator}}@{{target}} -dc-ip {{dc_ip}} {{action|qwinsta}}"

  - title: impacket-tstool - 指定自定义目标 IP 和端口
    desc: |
      使用特定 IP 地址和 SMB 端口连接终端服务管理接口。
      当目标的 NetBIOS 名称无法解析，或 SMB 服务运行在非标准端口时很有用。
      提供 -target-ip 可确保无论 DNS 设置如何，工具都连接到正确的物理机器。
    command: "impacket-tstool -target-ip {{target_ip}} -port {{port|445}} {{domain/username:password|administrator}}@{{target_name}} {{action|qwinsta}}"
