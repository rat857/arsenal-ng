tool: impacket-lookupsid
tags: [pentest, enumeration, security, active-directory, smb, reconnaissance, windows]

actions:
  # === BASIC ENUMERATION ===
  - title: impacket-lookupsid - 匿名 SID 查询
    desc: |
      此命令尝试使用空会话或匿名连接来枚举 SID。
      对较旧的 Windows 系统或 LSA 访问未正确限制的配置不当环境非常有效。
      如果成功，它通过将 RID 转换为对应账户名来揭示有效的用户名和组，无需有效凭据。
    command: "impacket-lookupsid {{username|''}}@{{target}}"

  - title: impacket-lookupsid - 已认证枚举
    desc: |
      使用有效的域或本地凭据执行可靠的 SID 枚举。
      默认情况下，工具会遍历最多 4000 个 RID，以识别与目标关联的用户、组和别名。
      这是内部侦察中梳理目标安全主体结构并发现隐藏账户的关键步骤。
    command: "impacket-lookupsid {{domain}}/{{username}}:{{password}}@{{target}}"

  # === ADVANCED AUTHENTICATION ===
  - title: impacket-lookupsid - Pass-the-Hash 枚举
    desc: |
      利用 Pass-the-Hash（PtH）技术认证并执行 SID 查询，无需明文密码。
      当你通过 LLMNR/NBT-NS 投毒或转储的 SAM 数据库获得 NTLM 哈希时尤为有用。
      如果只有 NT 哈希，请将 LM 哈希设置为标准的 32 个零占位符。
    command: "impacket-lookupsid -hashes {{hash}} {{domain}}/{{username}}@{{target}}"

  - title: impacket-lookupsid - Kerberos 身份认证
    desc: |
      使用 Kerberos 而非 NTLM 进行认证，适用于 NTLM 被禁用的环境或为了保持低调。
      工具会尝试从 KRB5CCNAME 环境变量指定的 ccache 文件中获取凭据。
      请确保系统时间与域控制器同步，并且目标名称以 FQDN 形式提供。
    command: "impacket-lookupsid -k -no-pass {{domain}}/{{username}}@{{target}}"

  # === CUSTOM CONFIGURATION ===
  - title: impacket-lookupsid - 扩展 RID 范围
    desc: |
      允许你指定更高的最大相对标识符（RID）值，以确保不漏掉任何用户或组。
      默认值为 4000，但大型 Active Directory 环境中的账户 RID 值往往更高。
      增大该值会使扫描耗时更长，但能得到更全面的用户列表。
    command: "impacket-lookupsid {{domain}}/{{username}}@{{target}} {{max_rid|10000}}"

  - title: impacket-lookupsid - 指定目标 IP
    desc: |
      当目标的 NetBIOS 名称已知但当前 DNS 设置无法解析时使用此命令。
      -target-ip 标志强制连接到特定 IP 地址，同时保留目标名称用于认证。
      在穿越不同网段或使用 VPN 时尤为有用。
    command: "impacket-lookupsid -target-ip {{ip_address}} {{domain}}/{{username}}@{{target_name}}"

  # === SPECIALIZED ENUMERATION ===
  - title: impacket-lookupsid - 域 SID 枚举
    desc: |
      -domain-sids 标志专门指示工具枚举整个域的 SID。
      如果目标本身不是 DC，这通常需要目标服务器将 LSA 请求转发到主域控制器。
      识别域 SID 是生成 Golden 或 Silver Ticket 等高级攻击的关键前提。
    command: "impacket-lookupsid -domain-sids {{domain}}/{{username}}@{{target}}"

  - title: impacket-lookupsid - 自定义 SMB 端口
    desc: |
      当 SMB 服务运行在非标准端口（如端口转发或隧道场景）时使用此命令。
      指定自定义端口可确保工具连接到正确的服务监听器。
      常用于与隐藏在防火墙或代理重定向器后面的目标交互。
    command: "impacket-lookupsid -port {{port|445}} {{domain}}/{{username}}@{{target}}"