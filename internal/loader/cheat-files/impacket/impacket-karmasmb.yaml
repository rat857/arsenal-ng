tool: impacket-karmaSMB
tags: [smb, pentest, exploitation, impacket, network, reconnaissance]

actions:
  # === BASIC USAGE ===
  - title: impacket-karmaSMB - 基础文件投递
    desc: |
      启动一个 SMB 服务器，无论客户端请求什么文件名，都投递特定本地文件的内容。
      主要用于渗透测试，在客户端尝试访问共享上任意文件时强制其下载恶意载荷或脚本。
      实际上创建了一个“一网打尽”的文件服务器，忽略请求路径而优先提供指定载荷；绑定默认 SMB 端口（445）通常需要主机 root 或管理员权限。
    command: "impacket-karmaSMB {{payload_path}}"

  - title: impacket-karmaSMB - 启用 SMB2 支持
    desc: |
      为 Karma SMB 服务器启用实验性的 SMB2 协议支持。
      出于安全考虑，现代 Windows 环境通常默认禁用 SMBv1，因此与较新目标兼容时需要此标志。
      当目标机器在初始握手中无法建立连接或协商协议版本时使用；此功能在 Impacket 中标记为实验性，应尽可能在目标环境中测试以确保稳定投递。
    command: "impacket-karmaSMB -smb2support {{payload_path}}"

  # === ADVANCED CONFIGURATION ===
  - title: impacket-karmaSMB - 通过扩展名映射投递
    desc: |
      利用配置文件将特定文件扩展名映射到不同的本地文件进行投递。
      可实现更复杂的攻击：对 .exe、.ps1 或 .txt 文件的请求可分别提供不同的定制载荷。
      对于配置文件中未明确定义的扩展名，服务器默认投递位置参数指定的文件；这在模仿真实文件共享结构的同时保持对投递内容的控制非常有效。
    command: "impacket-karmaSMB -config {{config_file|mappings.conf}} {{default_payload}}"

  # === LOGGING AND TROUBLESHOOTING ===
  - title: impacket-karmaSMB - 带时间戳的投递
    desc: |
      为服务器输出的每一行添加时间戳前缀，便于更好地跟踪事件。
      在需要将客户端访问与其他系统日志关联的长期测试或红队行动中尤为有用。
      有助于精确定位目标机器或用户尝试从恶意共享拉取文件的时间，也简化了为最终报告创建事件时间线的过程。
    command: "impacket-karmaSMB -ts {{payload_path}}"

  - title: impacket-karmaSMB - 调试模式
    desc: |
      以调试模式运行 SMB 服务器，提供底层协议交互的详细输出。
      对于排查特定客户端连接失败或载荷未按预期传输的原因至关重要。
      它会显示 SMB 协商、会话建立和树连接阶段的详细信息，怀疑防火墙干扰或协议不兼容导致攻击失败时使用。
    command: "impacket-karmaSMB -debug {{payload_path}}"