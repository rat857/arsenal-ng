tool: impacket-ping6
tags: [network, icmp, ipv6, reconnaissance, scanner, impacket, pentest]

actions:
  # === CONNECTIVITY TESTING ===

  - title: impacket-ping6 - 基本 ICMPv6 回显请求
    desc: |
      从指定的源 IPv6 地址向目标地址发送标准 ICMPv6 回显请求。
      该工具利用 Impacket 库的数据包构造能力来验证两个特定 IPv6 节点之间的连通性。
      当需要显式指定源地址以测试路由或防火墙规则时经常使用。
      请注意，此命令要求两个参数均为有效的 IPv6 地址才能正常工作。
    command: "impacket-ping6 {{src_ipv6}} {{dst_ipv6}}"

  - title: impacket-ping6 - 链路本地地址验证
    desc: |
      使用链路本地（fe80::）地址验证同一本地网段内节点之间的可达性。
      链路本地通信需要显式指定源地址，以确保操作系统选择正确的出站接口。
      这是内部网络评估中识别活动邻居的关键步骤，之后再进行邻居发现或利用。
      执行命令前，请确保本地接口已分配源链路本地地址。
    command: "impacket-ping6 {{src_link_local_ipv6}} {{target_link_local_ipv6}}"

  # === TROUBLESHOOTING ===

  - title: impacket-ping6 - 防火墙和 ACL 测试
    desc: |
      用于测试 IPv6 流量是否能通过中间防火墙或访问控制列表（ACL）。
      通过指定不同的源地址，攻击者或审计人员可以判断哪些 IP 段被允许与目标主机通信。
      这有助于梳理网络在 IPv6 方面的安全状况，而 IPv6 通常比 IPv4 受到的监控更少。
      未收到响应可能表明 ICMPv6 流量被安全设备过滤。
    command: "impacket-ping6 {{authorized_src_ipv6}} {{target_ipv6}}"

  - title: impacket-ping6 - 跨网段可达性测试
    desc: |
      测试不同网段或 VLAN 之间是否正确配置了 IPv6 路由。
      此命令从一个网段的源地址向另一个网段的目标地址发送数据包，以确认网关正在转发 ICMPv6 流量。
      它对于识别组织 IPv6 基础设施中潜在的横向移动路径至关重要。
      务必确认目标主机已配置为响应 ICMPv6 回显请求，因为有些系统默认会丢弃这些请求。
    command: "impacket-ping6 {{src_segment_ipv6}} {{dst_segment_ipv6}}"
