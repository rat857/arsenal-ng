tool: impacket-Get-GPPPassword
tags: [active-directory, windows, pentest, exploitation, credentials, enumeration, impacket]

actions:
  # === REMOTE ENUMERATION ===
  - title: impacket-Get-GPPPassword - 基础域认证
    desc: |
      连接到域控制器，并使用标准凭据在 SYSVOL 共享中自动搜索密码。
      这是查找 Groups.xml 或 ScheduledTasks.xml 等组策略首选项文件中明文密码的最常见起点。
      工具使用 Microsoft 公开的 AES 密钥解密“cpassword”属性，请确保拥有可读取 SYSVOL 共享的有效域用户凭据。
    command: "impacket-Get-GPPPassword {{domain}}/{{username}}:{{password}}@{{target_ip}}"

  - title: impacket-Get-GPPPassword - 通过 NTLM 哈希认证
    desc: |
      使用 NTLM 哈希而非明文密码对目标进行身份认证。
      在横向移动场景中已捕获或转储哈希但没有明文密码时尤为有用。
      哈希格式必须为 LMHASH:NTHASH，其中 LM 部分可以为空（aad3b435b51404eeaad3b435b51404ee），此方法可避免触发基于密码的告警。
    command: "impacket-Get-GPPPassword -hashes {{hash}} {{domain}}/{{username}}@{{target_ip}}"

  - title: impacket-Get-GPPPassword - 指定域控制器和共享
    desc: |
      指定特定的域控制器 IP 和自定义 SMB 共享以搜索 GPP XML 文件。
      SYSVOL 是默认共享，但某些环境可能将配置文件存储在非标准共享中，或因复制延迟而需指定特定 DC。
      此命令可精细控制网络路径和目标，当工具无法自动解析域名或需绕过某些网络限制时使用。
    command: "impacket-Get-GPPPassword -dc-ip {{dc_ip}} -share {{share_name|SYSVOL}} {{domain}}/{{username}}@{{target_ip}}"

  # === OFFLINE / LOCAL ANALYSIS ===
  - title: impacket-Get-GPPPassword - 解析本地 XML 文件
    desc: |
      从已下载到本机的组策略 XML 文件中解密凭据。
      这是最安全的方法，因为在获取文件后不会对域控制器产生额外的 SMB 流量。
      非常适合处理手动枚举时发现的 Groups.xml、Services.xml 或 Datasources.xml 等文件，LOCAL 关键字表示离线模式。
    command: "impacket-Get-GPPPassword -xmlfile {{path_to_xml}} LOCAL"

  - title: impacket-Get-GPPPassword - 搜索特定本地目录
    desc: |
      递归搜索本地目录中所有包含 GPP 密码的 XML 文件。
      当你已克隆了大部分 SYSVOL 共享或备份，并希望一次性找出所有潜在凭据时非常有用。
      工具会解析找到的每个 XML 文件并尝试解密其中的“cpassword”字段，比手动识别更省时。
    command: "impacket-Get-GPPPassword -base-dir {{local_directory_path}} LOCAL"

  # === ADVANCED AUTHENTICATION ===
  - title: impacket-Get-GPPPassword - Kerberos 身份认证
    desc: |
      使用 Kerberos 票据而非 NTLM 对目标环境进行身份认证。
      在 NTLM 认证被禁用或严格监控的加固环境中必不可少。
      命令会尝试使用 KRB5CCNAME 环境变量指向的有效 CCache 文件，-no-pass 标志确保工具完全依赖票据而不提示密码。
    command: "impacket-Get-GPPPassword -k -no-pass -dc-ip {{dc_ip}} {{domain}}/{{username}}@{{target_fqdn}}"

  - title: impacket-Get-GPPPassword - 调试与时间戳日志
    desc: |
      启用详细的调试输出并为每条日志添加时间戳，便于排查和记录。
      在出现连接问题或需要提供详细活动审计记录时很有帮助。
      调试模式会显示底层的 Impacket 库调用，帮助判断问题是网络还是认证相关，时间戳便于与目标系统事件日志关联。
    command: "impacket-Get-GPPPassword -debug -ts {{domain}}/{{username}}:{{password}}@{{target_ip}}"