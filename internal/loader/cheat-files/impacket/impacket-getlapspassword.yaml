tool: impacket-getlapspassword
tags: [pentest, security, active-directory, impacket, enumeration, post-exploitation, laps]

actions:
# === BASIC AUTHENTICATION ===

 - title: impacket-GetLAPSPassword - 基础认证
   desc: |
     使用明文凭据从 Active Directory 环境中提取所有可用的 LAPS 密码。
     该命令向 LDAP 服务器查询存储本地管理员密码的 ms-Mcs-AdmPwd 属性。
     通常在获得初始域凭据后用于提升工作站或服务器上的权限，所用账户必须对计算机对象的 LAPS 属性有读取权限。
   command: "impacket-GetLAPSPassword {{domain}}/{{username}}:{{password}}@{{dc_ip}}"

 - title: impacket-GetLAPSPassword - Pass-the-Hash 认证
   desc: |
     使用 NTLM 哈希而非明文密码对域控制器进行身份认证。
     当用户的 NTLM 哈希已从内存或 SAM 数据库恢复时，这是“Pass-the-Hash”攻击的标准方法。
     哈希格式应为 LMHASH:NTHASH（只有 NT 哈希时使用空 LM 哈希），此方法无需破解原始密码即可复用凭据。
   command: "impacket-GetLAPSPassword -hashes {{lmhash:nthash}} {{domain}}/{{username}}@{{dc_ip}}"

# === FILTERING AND OUTPUT ===

 - title: impacket-GetLAPSPassword - 定位特定计算机
   desc: |
     查询特定计算机名的 LAPS 密码，而不是列出所有可见密码。
     当你只对单个高价值目标感兴趣时，可减少噪声和网络流量。
     大多数情况下计算机名末尾不应带美元符号（$），大型环境中强烈建议使用以避免处理成千上万的计算机对象。
   command: "impacket-GetLAPSPassword -computer {{computer_name}} {{domain}}/{{username}}:{{password}}@{{dc_ip}}"

 - title: impacket-GetLAPSPassword - 将结果保存到文件
   desc: |
     执行 LAPS 密码提取并将输出重定向到指定的本地文件。
     便于保留已发现的本地管理员凭据记录，供测试后续阶段使用。
     工具会以易于阅读或便于其他脚本解析的方式格式化输出，请确保目标目录有写入权限。
   command: "impacket-GetLAPSPassword -o {{output_file|laps_results.txt}} {{domain}}/{{username}}:{{password}}@{{dc_ip}}"

# === ADVANCED CONNECTION & KERBEROS ===

 - title: impacket-GetLAPSPassword - Kerberos 身份认证
   desc: |
     使用 Kerberos 票据而非 NTLM 认证执行 LAPS 查询。
     工具会尝试使用 KRB5CCNAME 环境变量指向的票据。
     适用于 NTLM 被禁用或希望避免在日志中产生 NTLM 告警的环境，需确保目标参数与 Kerberos 票据期望的 SPN/主机名匹配。
   command: "impacket-GetLAPSPassword -k -no-pass {{domain}}/{{username}}@{{dc_hostname}}"

 - title: impacket-GetLAPSPassword - 使用安全 LDAP（LDAPS）
   desc: |
     强制工具通过 SSL 上的 LDAP（LDAPS）连接域控制器。
     较新的 Windows Server 版本（如 Server 2025）或强制 LDAP 签名/加密的环境通常需要此选项。
     如果目标 DC 使用自签名证书，可能会因本地配置而遇到校验问题；使用 LDAPS 可防止查询数据（含密码）以明文传输。
   command: "impacket-GetLAPSPassword -ldaps -dc-ip {{dc_ip}} {{domain}}/{{username}}:{{password}}@{{domain}}"

 - title: impacket-GetLAPSPassword - 指定域控制器主机名
   desc: |
     显式指定域控制器的主机名和 IP 地址以建立连接。
     适用于 DNS 解析异常或需在多 DC 环境中定位特定 DC 的情况。
     同时提供 -dc-ip 和 -dc-host 可确保工具准确路由 LDAP 请求，也有助于规避 Kerberos SPN 校验问题。
   command: "impacket-GetLAPSPassword -dc-ip {{dc_ip}} -dc-host {{dc_hostname}} {{domain}}/{{username}}:{{password}}@{{domain}}"

# === DEBUGGING ===

 - title: impacket-GetLAPSPassword - 带时间戳的调试模式
   desc: |
     启用调试日志运行工具，并为每一行输出添加时间戳。
     这对于排查连接问题、权限错误或协议不匹配至关重要。
     详细输出会显示实际发送的 LDAP 查询和收到的原始响应，当你怀疑存在密码但标准输出未显示时使用。
   command: "impacket-GetLAPSPassword -debug -ts {{domain}}/{{username}}:{{password}}@{{dc_ip}}"