tool: qsreplace
tags: [web, bug-bounty, reconnaissance, scanning, security, pentest, automation]

actions:
# === BASIC REPLACEMENT ===

 - title: qsreplace - 替换所有查询值
   desc: |
     将 URL 列表中所有查询字符串参数值替换为指定的载荷或字符串。
     这是同时在数百个 URL 上测试跨站脚本（XSS）或 Open Redirect 等漏洞的基础技术。
     该工具会自动过滤输入，确保只处理主机、路径和参数键的唯一组合，从而避免对同一端点进行冗余测试。
   command: "qsreplace {{payload|'\" language=\"javascript\">alert(1)//'}} < {{url_list}}"

 - title: qsreplace - 用占位符替换以进行模糊测试
   desc: |
     将所有参数值替换为诸如 FUZZ 或 PAYLOAD 之类的静态占位符。
     这在为 ffuf、nuclei 或自定义 bash 循环等其他工具准备目标列表时非常有用。
     它确保模糊测试器准确知道在哪里注入其词表，同时保持原始 URL 结构。
   command: "qsreplace {{placeholder|FUZZ}} < {{url_list}}"

# === ADVANCED MODES ===

 - title: qsreplace - 追加到现有值
   desc: |
     将用户提供的字符串追加到现有查询参数值的末尾，而不是覆盖它们。
     当目标应用期望特定数据类型或格式（如 ID 或电子邮件）来处理请求，但你仍想在末尾注入载荷时，此模式很有用。
     使用 -a 标志可在 SQL 注入或参数污染测试等场景中启用此行为。
   command: "qsreplace -a {{suffix|' AND 1=1'}} < {{url_list}}"

 - title: qsreplace - 唯一的 URL 和参数组合
   desc: |
     过滤 URL 列表，只显示主机、路径和参数键的唯一组合，而不更改任何值。
     这本质上是一条「去杂」命令，有助于清理 waybackurls 或 gau 等发现工具生成的大型列表。
     这是侦察流水线中的「必用」步骤，通过移除仅参数顺序或具体值不同的重复项，减少发送到目标服务器的请求数量。
   command: "qsreplace -a < {{url_list}}"

# === PIPELINE EXAMPLES ===

 - title: qsreplace - 过滤并用 curl 测试
   desc: |
     将 qsreplace 集成到 shell 流水线中，对发现的端点进行实时测试。
     该命令首先用金丝雀字符串替换所有查询值，然后使用 xargs 配合 curl 发送请求以检查回显或错误。
     在大型列表上使用时要谨慎，因为它可能产生大量流量，并可能触发速率限制或账户锁定。
   command: "qsreplace {{canary|REFLECTED_HERE}} < {{url_list}} | xargs -I {} curl -s -L {} | grep {{canary|REFLECTED_HERE}}"