tool: xfreerdp
tags: [network, remote-desktop, rdp, security, pentest, exploitation, authentication]

actions:
  # === BASIC AUTHENTICATION & CONNECTION ===
  - title: xfreerdp - 使用凭据的基础连接
    desc: |
      使用标准用户名和密码认证连接到远程 Windows 机器。这是访问 RDP 服务器的主要方法。
      确保目标端口（默认 3389）可通过网络访问。
    command: "xfreerdp /v:{{target_ip}} /u:{{username}} /p:{{password}}"

  - title: xfreerdp - 带域的连接
    desc: |
      发起连接时特别包含 Active Directory 域。登录企业网络中的机器时需要。
      如果未指定域，认证可能失败或默认使用本地账户。
    command: "xfreerdp /v:{{target_ip}} /d:{{domain}} /u:{{username}} /p:{{password}}"

  - title: xfreerdp - 忽略证书验证
    desc: |
      连接到目标时抑制证书警告和验证。强烈建议渗透测试人员在处理自签名证书或实验环境时使用。
      它可以防止连接因“不受信任的 CA”错误而中止。
    command: "xfreerdp /v:{{target_ip}} /u:{{username}} /p:{{password}} /cert:ignore"

  # === ADVANCED AUTHENTICATION (PENTESTING) ===
  - title: xfreerdp - 哈希传递（PTH）
    desc: |
      使用 NTLM 哈希而非明文密码向远程系统认证。该技术是后渗透场景中的常用手段，即用户的哈希已从内存或 SAM 中提取。
      目标必须支持 Restricted Admin 模式或已启用特定注册表设置。
    command: "xfreerdp /v:{{target_ip}} /u:{{username}} /pth:{{ntlm_hash}} /cert:ignore"

  - title: xfreerdp - 受限管理模式
    desc: |
      为 RDP 会话启用 Restricted Admin 模式。这可以防止向远程服务器传输可重用凭据，从而保护客户端。
      在现代 Windows 系统上成功进行哈希传递攻击通常需要它。
    command: "xfreerdp /v:{{target_ip}} /u:{{username}} /p:{{password}} +restricted-admin /cert:ignore"

  - title: xfreerdp - 强制 NLA 安全
    desc: |
      强制连接使用网络级认证（NLA）。NLA 是一种更安全的方法，要求用户在建立完整 RDP 会话前先进行认证。
      如果服务器严格要求 NLA 且协商自动失败，请使用此参数。
    command: "xfreerdp /v:{{target_ip}} /u:{{username}} /p:{{password}} /sec:nla /cert:ignore"

  # === RESOURCE REDIRECTION & FILE OPERATIONS ===
  - title: xfreerdp - 映射本地驱动器用于文件传输
    desc: |
      将客户端机器上的本地目录作为网络共享映射到远程 RDP 会话。这是在攻击者和受害者之间传输文件、工具或脚本的最高效方式。
      该文件夹将出现在远程 Windows 机器的“此电脑”中。
    command: "xfreerdp /v:{{target_ip}} /u:{{username}} /p:{{password}} /drive:{{share_name|myshare}},{{local_path|/tmp}} /cert:ignore"

  - title: xfreerdp - 启用剪贴板和声音
    desc: |
      同时启用剪贴板同步和音频重定向。这允许通过剪贴板在主机和客户机之间复制文本或文件。
      如果你需要监控目标上的系统警报或多媒体，声音重定向会很有用。
    command: "xfreerdp /v:{{target_ip}} /u:{{username}} /p:{{password}} +clipboard /sound:sys:alsa /cert:ignore"

  - title: xfreerdp - 智能卡重定向
    desc: |
      将本地智能卡读卡器重定向到远程会话。这通常用于高安全环境中的多因素认证。
      使用此参数前确保本地 pcscd 服务正在运行。
    command: "xfreerdp /v:{{target_ip}} /u:{{username}} /p:{{password}} /smartcard:{{device_name}} /cert:ignore"

  # === DISPLAY & USER EXPERIENCE ===
  - title: xfreerdp - 带动态分辨率的全屏模式
    desc: |
      以全屏模式启动 RDP 会话并启用动态分辨率。动态分辨率允许远程桌面在你改变窗口大小时自动调整大小。
      会话期间使用 Ctrl+Alt+Enter 组合键切换全屏模式。
    command: "xfreerdp /v:{{target_ip}} /u:{{username}} /p:{{password}} /f +dynamic-resolution /cert:ignore"

  - title: xfreerdp - 特定分辨率和智能缩放
    desc: |
      设置固定窗口分辨率并启用智能缩放。智能缩放会缩放远程桌面显示以适配窗口大小，而不改变远程分辨率。
      在访问低分辨率目标时使用高分辨率显示器会很有用。
    command: "xfreerdp /v:{{target_ip}} /u:{{username}} /p:{{password}} /w:{{width|1280}} /h:{{height|720}} /smart-sizing /cert:ignore"

  # === NETWORK & GATEWAY ===
  - title: xfreerdp - 通过 RDP 网关连接
    desc: |
      通过中间 RDP 网关连接到目标机器。网关通常用于通过 HTTPS 从互联网提供对内部 RDP 服务器的访问。
      你必须为网关和最终目标服务器都提供凭据。
    command: "xfreerdp /v:{{target_ip}} /u:{{username}} /p:{{password}} /g:{{gateway_address}} /gu:{{gateway_user}} /gp:{{gateway_password}} /cert:ignore"

  - title: xfreerdp - 防止会话锁定
    desc: |
      尝试防止远程会话因不活动而锁定。它按指定间隔注入虚假鼠标移动事件以保持会话活跃。
      在监控长时间运行任务或等待后台进程时很有帮助。
    command: "xfreerdp /v:{{target_ip}} /u:{{username}} /p:{{password}} /prevent-session-lock:{{interval_sec|60}} /cert:ignore"