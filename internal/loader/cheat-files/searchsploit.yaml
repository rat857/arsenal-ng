tool: searchsploit
tags: [security, exploitation, pentest, vulnerability, exploit-db, reconnaissance, enumeration]

actions:
  # === SEARCHING OPERATIONS ===
  - title: searchsploit - 基础漏洞利用搜索
    desc: |
      使用一个或多个关键字在本地 Exploit-DB 数据库中搜索漏洞利用和 shellcode。
      这是为目标服务查找公开概念验证代码的最常见起点。
      默认情况下，该工具对标题和文件路径执行不区分大小写的搜索。
    command: "searchsploit {{search_terms}}"

  - title: searchsploit - 仅按标题搜索
    desc: |
      执行仅限于漏洞利用标题的搜索，忽略文件路径。
      在搜索诸如 2.0 之类的版本号时，这对于减少误报非常有用。
      文件夹名称通常包含数字，如果启用路径搜索会混杂结果。
    command: "searchsploit -t {{search_term}}"

  - title: searchsploit - 精确标题匹配
    desc: |
      对漏洞利用标题执行精确且顺序敏感的匹配。
      当你已知某个漏洞或软件的具体名称，并希望避免相似但无关的结果时使用。
      例如，使用此标志搜索 WordPress 4.1 不会返回 WordPress Core 4.1。
    command: "searchsploit -e {{exact_title}}"

  - title: searchsploit - 使用 CVE 编号搜索
    desc: |
      在数据库中搜索与特定通用漏洞披露（CVE）ID 相关的漏洞利用。
      在运行 Nessus 或 OpenVAS 等提供 CVE 编号的漏洞扫描器之后，这非常有效。
      它直接将已识别的漏洞与仓库中可用的利用脚本关联起来。
    command: "searchsploit --cve {{cve_id|2021-44228}}"

  - title: searchsploit - 区分大小写搜索
    desc: |
      执行搜索词字母大小写有影响的搜索。
      标准搜索不区分大小写，但特定软件名称可能需要区分大小写以过滤结果。
      当常见词是特定产品名称的一部分时，这有助于缩小结果范围。
    command: "searchsploit -c {{search_term}}"

  - title: searchsploit - 排除特定词条
    desc: |
      通过定义要排除的词条，从搜索输出中过滤掉不需要的结果。
      你可以在引号内使用管道符号链接多个排除词条。
      在查找功能性远程漏洞利用时，这对于移除拒绝服务（DoS）利用或 PoC 文件很有用。
    command: "searchsploit {{search_term}} --exclude={{exclude_pattern|'(PoC)|/dos/'}}"

  # === FILE & CONTENT OPERATIONS ===
  - title: searchsploit - 将漏洞利用镜像到当前目录
    desc: |
      将特定漏洞利用文件从本地仓库直接复制到当前工作目录。
      这消除了手动浏览文件系统查找脚本位置的需要。
      镜像后，你可以轻松修改、编译或执行该漏洞利用以用于你的行动。
    command: "searchsploit -m {{edb_id}}"

  - title: searchsploit - 查看漏洞利用内容
    desc: |
      使用系统默认分页器（通常是 less）打开漏洞利用的源代码。
      这使你能够快速检查漏洞利用的要求、使用说明和潜在风险。
      在执行前务必检查漏洞利用代码，确保它不包含恶意载荷或破坏性行为。
    command: "searchsploit -x {{edb_id}}"

  - title: searchsploit - 显示漏洞利用路径并复制到剪贴板
    desc: |
      显示本地系统上漏洞利用文件的完整绝对路径。
      在受支持的系统上，此命令还尝试将文件路径复制到剪贴板以便粘贴。
      当你需要将路径提供给其他工具或手动编译器时很有用。
    command: "searchsploit -p {{edb_id}}"

  # === OUTPUT FORMATTING ===
  - title: searchsploit - 以 JSON 显示结果
    desc: |
      以 JSON 格式生成搜索结果，而不是标准表格视图。
      这对于自动化脚本或需要将数据管道传给 jq 等其他工具时至关重要。
      JSON 输出提供每个漏洞利用条目的详细元数据，包括 ID、标题和平台。
    command: "searchsploit -j {{search_term}}"

  - title: searchsploit - 显示 Exploit-DB URL
    desc: |
      为每个搜索结果显示 Exploit-DB 网站的完整 Web URL，而不是本地文件路径。
      当你在没有完整数据库的机器上工作或需要与同事分享链接时，这很有帮助。
      它允许快速访问每个漏洞利用的在线文档和评论部分。
    command: "searchsploit -w {{search_term}}"

  # === AUTOMATION & MAINTENANCE ===
  - title: searchsploit - 分析 Nmap XML 输出
    desc: |
      读取 Nmap XML 扫描文件，并自动为所有检测到的服务版本搜索漏洞利用。
      这显著加快了从扫描阶段过渡到渗透测试利用阶段的速度。
      它会将 Nmap 服务检测识别出的版本字符串与本地漏洞利用数据库进行比对。
    command: "searchsploit --nmap {{nmap_xml_file}}"

  - title: searchsploit - 更新漏洞利用数据库
    desc: |
      将本地 exploit-database 仓库更新到最新可用版本。
      此命令从中央 Git 仓库或包管理器获取新的漏洞利用和 shellcode。
      定期更新对于确保你拥有新发现漏洞的最新公开利用至关重要。
    command: "searchsploit -u"