tool: ligolo-proxy
tags: [pivoting, network, tunneling, proxy, pentest, security]

# === LISTENER CONFIGURATION ===

actions:
  - title: ligolo-proxy - 基础监听器
    desc: |
      使用默认端口在所有可用接口上启动基础代理监听器。这是 Ligolo-ng 服务器接受远程 agent 传入连接的标准起点。
      默认情况下，它会在 certs 目录中查找证书文件以建立 TLS 连接。
    command: "ligolo-proxy -laddr {{listening_address|0.0.0.0:11601}}"

  - title: ligolo-proxy - 自签名证书模式
    desc: |
      自动生成并使用会话的自签名 TLS 证书。当你没有现成证书或公共域名时，用于快速部署很有用。
      尽管缺少受信任的 CA，它仍能确保 agent 与代理之间的通信保持加密。
    command: "ligolo-proxy -selfcert -selfcert-domain {{domain|ligolo}}"

  - title: ligolo-proxy - 自定义证书文件
    desc: |
      使用指定的 TLS 证书和私钥文件路径启动代理。当你购买了证书或使用内部证书颁发机构生成证书时使用。
      确保运行代理的用户对指定文件路径有读取权限。
    command: "ligolo-proxy -certfile {{cert_path|certs/cert.pem}} -keyfile {{key_path|certs/key.pem}}"

# === ADVANCED MODES ===

  - title: "ligolo-proxy - 自动化 Let's Encrypt（autocert）"
    desc: |
      通过 Let's Encrypt 自动请求和管理 TLS 证书。此模式要求端口 80 可从互联网访问以完成 ACME 挑战。
      适合面向公网服务器的长期部署，在这些场景下有效证书更利于隐蔽性或兼容性。
    command: "ligolo-proxy -autocert -allow-domains {{domains|example.com}}"

  - title: ligolo-proxy - WebSocket 监听器
    desc: |
      配置代理使用 WebSocket 传输层进行监听。在地址前加上 https:// 可启用加密的 WebSocket 通信，有助于绕过某些限制性防火墙或负载均衡器。
      这是通过只允许 Web 协议的环境隧道传输流量的强大功能。
    command: "ligolo-proxy -laddr {{websocket_address|https://0.0.0.0:443}}"

# === OPERATIONAL MODES ===

  - title: ligolo-proxy - 守护进程模式
    desc: |
      在后台以守护进程方式运行代理服务器，无需交互式命令行界面。适合在跳板机上持久安装，且无需与代理 shell 交互。
      注意启动后需要通过标准 OS 工具（如 kill 或 systemctl）管理进程。
    command: "ligolo-proxy -daemon -laddr {{listening_address|0.0.0.0:11601}}"

  - title: ligolo-proxy - 详细日志
    desc: |
      以启用详细输出的方式启动代理，提供关于连接和错误的更多信息。强烈推荐用于排查 agent 与代理之间的初始连接问题。
      它会显示传入 agent 注册的元数据以及可能的 TLS 握手失败。
    command: "ligolo-proxy -v"

  - title: ligolo-proxy - 跳过横幅
    desc: |
      启动代理服务器时不显示启动时的 ASCII 艺术横幅。当将输出记录到文件或在干净的终端环境中运行时很有用。
      它不影响代理本身的功能，只影响启动时的视觉反馈。
    command: "ligolo-proxy -nobanner"

# === PROFILING AND CONFIG ===

  - title: ligolo-proxy - 自定义配置文件
    desc: |
      指定一个配置文件来加载设置，而不是通过命令行参数传递。这允许更复杂或可复用的配置，可以纳入版本控制或方便共享。
      配置文件格式必须符合工具要求的预期结构。
    command: "ligolo-proxy -config {{config_file|config.yaml}}"

  - title: ligolo-proxy - 性能分析
    desc: |
      将 CPU profile 写入指定文件以进行性能分析。通常由开发者或高级用户用于诊断代理的高 CPU 使用率或瓶颈。
      生成的文件可用 pprof 等标准 Go 分析工具进行分析。
    command: "ligolo-proxy -cpuprofile {{profile_name|cpu.prof}}"