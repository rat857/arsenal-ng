tool: gaia
tags: [recon, web, urls, parameters, automation, discovery]

actions:
  # === BASIC USAGE ===
  - title: gaia - 默认设置快速爬取
    desc: |
      使用所有默认收集器（gau、arjun、linkfinder、uro 和 AI 推理）对单个目标 URL 运行 Gaia。
      这是为新目标枚举端点、参数和有趣资产的快速方式。
    command: "gaia --url {{url}}"

  - title: gaia - 从标准输入处理 URL
    desc: |
      从文件或管道向 Gaia 提供多个 URL。
      在串联侦察工具或重新处理历史 URL 列表时非常有用。
    command: "cat {{urls_file}} | gaia --stdin"

  # === FOCUS & SPEED ===
  - title: gaia - 仅参数（不启用重型收集器）
    desc: |
      专注于带参数的端点，跳过历史 URL 收集和 JS 发现以减少噪声和运行时间。
      禁用 gau、arjun 和 linkfinder，同时保持规范化启用。
    command: "gaia --url {{url}} --only-params --no-gau --no-arjun --no-linkfinder"

  - title: gaia - 显示静态资源并规范化 URL
    desc: |
      在结果中包含 JS、CSS 和图片等静态资源，同时保持规范化的 URL 输出。
      便于映射外部依赖或发现暴露的资源路径。
    command: "gaia --url {{url}} --show-assets"

  # === OUTPUT CONTROL ===
  - title: gaia - 限制结果数并自动安装依赖
    desc: |
      限制收集的 URL 数量，并让 Gaia 自动安装任何缺失的辅助工具。
      有助于防止输出失控，同时保持工具链就绪。
    command: "gaia --url {{url}} --max-urls {{max_urls|500}} --auto-install"

  - title: gaia - 输出结构化报告到文件
    desc: |
      将发现导出为所选格式（console、md 或 json）并保存到磁盘以供日后查看。
      可与其他过滤器结合以生成可复现的侦察报告。
    command: "gaia --url {{url}} --format {{format|json}} --output {{output|gaia-report.json}}"

  - title: gaia - 禁用 AI 推理以获得严格结果
    desc: |
      当你需要确定性的、仅工具的输出时，关闭 Gaia 的 AI 推理层。
      保持历史 URL 收集、参数发现和 JS 解析启用。
    command: "gaia --url {{url}} --no-ai"
