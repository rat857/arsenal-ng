tool: spiderfoot
tags: [osint, reconnaissance, footprinting, information-gathering, pentest, security]

actions:
  # === BASIC SCANNING & USE CASES ===
  - title: spiderfoot - 被动 OSINT 扫描
    desc: |
      执行被动扫描以在不直接与目标交互的情况下收集情报。
      此模式非常适合隐蔽侦察，因为它只查询第三方数据库、搜索引擎和公共记录。
      当你希望避免出现在目标的 Web 服务器或安全日志中时使用。
    command: "sf.py -s {{target}} -u passive"

  - title: spiderfoot - 足迹扫描
    desc: |
      运行足迹扫描以了解目标暴露在互联网上的内容。
      此用例侧重于识别与目标关联的子域名、IP 地址和 Web 技术。
      这是一种平衡的方法，提供目标数字足迹的广泛概览。
    command: "sf.py -s {{target}} -u footprint"

  - title: spiderfoot - 调查扫描
    desc: |
      执行调查扫描，通常当你拥有特定的入侵指标或可疑目标时使用。
      此模式比被动扫描更深入，并尝试寻找数据点之间更深层的联系。
      请注意，这可能涉及更多可能被目标检测到的活动模块。
    command: "sf.py -s {{target}} -u investigate"

  - title: spiderfoot - 全模块扫描
    desc: |
      使用 SpiderFoot 库中每个可用模块运行全面扫描。
      这是最「嘈杂」且最耗时的扫描类型，因为它触发所有主动和被动检查。
      仅当你拥有明确许可且需要所有可能关联的完整数据转储时才建议使用。
    command: "sf.py -s {{target}} -u all"

  # === MODULE & DATA FILTERING ===
  - title: spiderfoot - 列出可用模块
    desc: |
      显示你的 SpiderFoot 环境中当前安装的所有模块的完整列表。
      这有助于你识别哪些模块需要 API 密钥，哪些可以开箱即用。
      查看此列表对于排查缺失数据或配置自定义扫描至关重要。
    command: "sf.py -M"

  - title: spiderfoot - 运行特定模块
    desc: |
      仅使用一组特定的逗号分隔模块执行扫描。
      当你只需要来自特定来源（如 Shodan、HaveIBeenPwned 或 GitHub）的数据时，这非常高效。
      它显著减少扫描时间并避免不必要的 API 额度消耗。
    command: "sf.py -s {{target}} -m {{modules|s3bucket,google_maps,github}}"

  - title: spiderfoot - 收集特定事件类型
    desc: |
      发起针对特定数据类型的扫描，无论使用何种模块。
      例如，你可以仅请求 EMAILADDR 或 PHONE_NUMBER 以过滤掉基础设施数据。
      SpiderFoot 会自动启用生成这些特定事件类型所需的模块。
    command: "sf.py -s {{target}} -t {{event_types|EMAILADDR,BITCOIN_ADDRESS}}"

  - title: spiderfoot - 严格模式扫描
    desc: |
      启用严格模式，确保只使用能够直接消费目标类型的模块。
      这可以防止工具扩展到可能无关的次级或三级数据类型。
      它有助于保持扫描专注，并防止「蛛网式」扩展变得难以管理。
    command: "sf.py -s {{target}} -x"

  # === OUTPUT & FORMATTING ===
  - title: spiderfoot - 将结果导出为 CSV
    desc: |
      运行扫描并将结果直接导出到 CSV 文件以供外部分析。
      这对于将 OSINT 数据导入电子表格或其他报告工具很有用。
      如果默认逗号不适合你的数据处理流水线，你可以定义自定义分隔符。
    command: "sf.py -s {{target}} -u passive -o csv > {{output_file|results.csv}}"

  - title: spiderfoot - 带源数据的 JSON 输出
    desc: |
      以 JSON 格式生成扫描结果，同时包含原始源数据字段。
      JSON 输出非常适合自动化并将 SpiderFoot 结果集成到其他安全平台（SOAR/SIEM）。
      包含源数据允许你验证每个发现背后的证据。
    command: "sf.py -s {{target}} -u footprint -o json -r"

  # === SERVER & INTERFACE ===
  - title: spiderfoot - 启动 Web 界面
    desc: |
      在特定 IP 地址和端口上启动 SpiderFoot 的基于 Web 的 GUI。
      Web 界面提供更直观的体验，包括节点图和便捷的 API 密钥配置。
      默认监听在 127.0.0.1:5001，但你可以更改以允许远程访问（确保防火墙规则就绪）。
    command: "sf.py -l {{ip_address|127.0.0.1}}:{{port|5001}}"

  # === ADVANCED OPERATIONS ===
  - title: spiderfoot - 关联扫描结果
    desc: |
      对现有扫描 ID 应用关联规则，以识别有意义的模式或高风险发现。
      关联通过突出诸如「在 DNS 记录中发现恶意 IP」之类的联系来过滤噪声。
      你必须拥有之前已完成或正在运行的扫描的扫描 ID 才能使用此功能。
    command: "sf.py -C {{scan_id}}"

  - title: spiderfoot - 限制并发线程
    desc: |
      手动设置扫描期间可并发运行的模块最大数量。
      减少线程数可以防止你的 IP 被第三方服务限速。
      如果你有高性能机器和稳定的网络连接，增加线程数可以加快扫描速度。
    command: "sf.py -s {{target}} -u all -max-threads {{thread_count|10}}"