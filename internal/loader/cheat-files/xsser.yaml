tool: xsser
tags: [web, security, pentest, xss, exploitation, scanner, automation]

actions:
  # === BASIC AUDIT & RECONNAISSANCE ===
  - title: xsser - 基础 URL 扫描
    desc: |
      对特定目标 URL 执行简单审计。此命令是检查单个页面是否易受常见 XSS 向量攻击的标准起点。
      它使用默认设置探测目标，无需复杂配置。
    command: "xsser -u \"{{url}}\""

  - title: xsser - 带爬取的扫描
    desc: |
      爬取目标网站以发现并审计多个链接。爬取深度可以控制，以限制安全测试的范围。
      这对于自动测绘整个 Web 应用的攻击面非常有效。
    command: "xsser -u \"{{url}}\" -c {{depth|5}}"

  - title: xsser - 使用 Dork 查找目标
    desc: |
      使用搜索引擎 dork 基于特定查询查找潜在目标。默认情况下它使用 DuckDuckGo，但可以配置为使用其他引擎。
      研究人员常用它在互联网上查找特定软件的易受攻击实例。
    command: "xsser -d \"{{dork|index.php?id=}}\" --De {{engine|google}}"

  # === INJECTION METHODS ===
  - title: xsser - GET 参数注入
    desc: |
      使用 XSS 关键字作为占位符，针对特定 GET 参数进行 XSS 注入。工具将 XSS 替换为其内部 payload 以测试反射。
      当你已识别 URL 查询字符串中的特定输入字段时使用。
    command: "xsser -u \"{{url}}\" -g \"{{path}}?{{param}}=XSS\""

  - title: xsser - POST 数据注入
    desc: |
      通过 POST 数据而非 URL 发送 XSS payload。这对于测试不使用 GET 的表单、登录字段和其他数据提交点至关重要。
      确保数据字符串符合预期的 application/x-www-form-urlencoded 格式。
    command: "xsser -u \"{{url}}\" -p \"{{param1}}=value&{{param2}}=XSS\""

  # === ADVANCED TECHNIQUES ===
  - title: xsser - Cookie 和请求头注入
    desc: |
      测试 Cookie、User-Agent 和 Referer 等 HTTP 请求头中的 XSS 漏洞。这些是常被忽视的注入点，可能导致管理仪表盘中的存储型或反射型 XSS。
      该命令同时启用多种特殊技术，进行广泛的请求头审计。
    command: "xsser -u \"{{url}}\" --Coo --Xsa --Xsr"

  - title: xsser - 基于 DOM 的 XSS 测试
    desc: |
      专注于发现文档对象模型（DOM）型 XSS 漏洞。它分析客户端脚本如何处理来自 URL 片段或其他来源的输入。
      DOM XSS 至关重要，因为许多情况下 payload 永远不会到达服务器端日志。
    command: "xsser -u \"{{url}}\" --Dom"

  # === EVASION & BYPASSING ===
  - title: xsser - 使用特定规则绕过 WAF
    desc: |
      尝试使用预定义规则集绕过特定 Web 应用防火墙（WAF）。可用选项包括 Modsec、Imperva、Barracuda 等。
      当目标受已知安全解决方案保护且拦截标准 XSS payload 时使用。
    command: "xsser -u \"{{url}}\" --auto --{{waf_type|Modsec}}"

  - title: xsser - 编码和混淆绕过
    desc: |
      对 payload 应用十六进制、十进制或 String.FromCharCode() 等各种编码技术。混淆有助于规避简单的基于签名的检测系统和输入过滤器。
      组合多种编码可以提高对抗复杂过滤器的成功率。
    command: "xsser -u \"{{url}}\" --auto --Str --Hex --Une"

  # === SPECIAL FEATURES ===
  - title: xsser - 生成恶意图片（IMX）
    desc: |
      创建嵌入 XSS 代码的图片文件，测试图片处理库中的漏洞。此技术用于利用“图片 XSS”，即站点将元数据或恶意字节序列渲染为代码。
      生成的文件应上传到目标进行测试。
    command: "xsser --imx {{output_file|path/to/image.png}}"

  - title: xsser - 拒绝服务（DoS）攻击
    desc: |
      尝试通过 XSS 执行客户端或服务器端拒绝服务。这通常涉及注入消耗受害者浏览器或服务器过多资源的脚本。
      使用时需极其谨慎，因为它可能影响目标服务的可用性。
    command: "xsser -u \"{{url}}\" --Dos"

  # === REPORTING & OUTPUT ===
  - title: xsser - 导出结果为 XML
    desc: |
      将审计发现保存到结构化 XML 文件，供进一步分析或集成。这对于专业报告或向其他安全工具提供数据很有用。
      报告包含注入的 payload 和易受攻击参数的详细信息。
    command: "xsser -u \"{{url}}\" --auto --xml {{filename|report.xml}}"

  - title: xsser - 启动 GUI 模式
    desc: |
      启动 XSSer 的图形用户界面。这对于偏好可视化查看攻击配置和结果的用户很有帮助。
      它需要桌面环境和已安装必要的 GTK 库。
    command: "xsser --gtk"