tool: ldeep
tags: [active-directory, ldap, enumeration, pentest, security, authentication]

actions:
  # === AUTHENTICATION & IDENTITY ===
  - title: ldeep - 验证当前身份
    desc: |
      验证当前对 LDAP 服务器认证的用户身份。用于在运行更密集的命令前确认提供的凭据或 Kerberos 票据有效。
      它会返回认证账户的可分辨名称（DN）和 SID。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} whoami"

  - title: ldeep - 使用 NTLM 哈希认证
    desc: |
      使用 NTLM 哈希而非明文密码进行认证来执行 LDAP 枚举。这种称为 Pass-the-Hash 的技术在用户密码未知但已恢复其哈希时至关重要。
      哈希必须以 LM:NT 或仅 NT 格式提供。
    command: "ldeep ldap -u {{username}} -H {{ntlm_hash}} -d {{domain}} -s {{ldap_server}} users"

  - title: ldeep - 使用 Kerberos 认证
    desc: |
      使用 Kerberos 认证查询 LDAP 服务器。这要求环境中存在有效的 Kerberos 票据（TGT），通常由 KRB5CCNAME 变量指向。
      此方法更隐蔽，因为它避免通过网络发送密码或哈希。
    command: "ldeep ldap -k -d {{domain}} -s {{ldap_server}} users"

  # === ENUMERATION ===
  - title: ldeep - 全面域信息导出
    desc: |
      单次运行即可收集并存储各种 Active Directory 信息。该命令收集用户、组、计算机、GPO、组织单位和信任关系。
      结果会保存到指定输出目录，以便使用缓存模式进行离线分析。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} all {{output_path|./backup}}"

  - title: ldeep - 列出域用户
    desc: |
      获取 Active Directory 域内所有用户的列表。这是侦察中识别密码喷洒或社会工程潜在目标的基本步骤。
      默认返回基本用户属性，也可使用详细标志获取更多细节。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} users"

  - title: ldeep - 枚举组成员关系
    desc: |
      列出特定账户所属的所有组。这有助于理解分配给特定用户或计算机的权限和访问级别。
      当你已攻陷某账户并想查看它可访问哪些资源时使用。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} memberships {{target_account}}"

  - title: ldeep - 列出组成员
    desc: |
      获取属于特定 Active Directory 组的所有成员列表。通过审计 Domain Admins 或 Enterprise Admins 等组来识别高权限用户特别有用。
      它清晰展示了哪些账户继承目标组的权限。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} membersof {{group_name|Domain Admins}}"

  - title: ldeep - 发现约束与非约束委派
    desc: |
      搜索配置了任何形式 Kerberos 委派的账户。委派设置（非约束、约束或基于资源的约束委派）是权限提升的主要目标。
      此命令识别可能允许攻击者冒充其他用户的错误配置。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} delegations"

  - title: ldeep - 提取 LAPS 密码
    desc: |
      获取域计算机的本地管理员密码解决方案（LAPS）密码。此命令仅在认证用户具有读取 ms-MCS-AdmPwd 属性所需权限时有效。
      在内部渗透测试中，这是获取工作站和服务器本地管理访问权的高价值操作。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} laps"

  - title: ldeep - 列出域信任
    desc: |
      枚举当前域与其他域或林之间的信任关系。理解信任关系对于跨域或跨林横向移动至关重要。
      输出详细说明信任方向和类型，识别通往其他环境的潜在路径。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} trusts"

  - title: ldeep - 提取 BitLocker 恢复密钥
    desc: |
      查询 Active Directory 中存储在计算机对象里的 BitLocker 恢复密码。访问这些密钥需要域内的特定管理权限。
      这对取证或访问已加入域的机器上的加密驱动器很有用。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} bitlockerkeys"

  - title: ldeep - 列出 FSMO 角色
    desc: |
      识别域中灵活单主机操作（FSMO）角色持有者。这告诉你哪些域控负责模式更新或密码更改等特定关键任务。
      例如识别 PDC Emulator 对某些高级 AD 攻击至关重要。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} fsmo"

  # === MODIFICATION & EXPLOITATION ===
  - title: ldeep - 解锁用户账户
    desc: |
      尝试解锁因登录失败次数过多而被锁定的用户账户。此操作需要对目标用户对象具有管理权限或特定的委派权限。
      在操作期间用于恢复对被意外锁定的已攻陷账户的访问。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} unlock {{target_user}}"

  - title: ldeep - 将用户添加到组
    desc: |
      将指定用户添加到目标 Active Directory 组。若你对 LDAP 目录有管理控制权，这是提升权限的直接方式。
      请谨慎操作，因为这会在 Windows 安全事件日志中留下显著痕迹。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} add_to_group {{target_user}} {{target_group}}"

  - title: ldeep - 修改用户密码
    desc: |
      直接通过 LDAP 更改特定用户账户的密码。这通常需要 Reset Password 权限或对用户对象的完整管理权限。
      通常用作持久化的最后手段或重新获得账户控制权。
    command: "ldeep ldap -u {{username}} -p {{password}} -d {{domain}} -s {{ldap_server}} modify_password {{target_user}} {{new_password}}"

  # === CACHE MODE ===
  - title: ldeep - 查询离线缓存
    desc: |
      从本地文件系统查询之前用 all 命令保存的数据。这让你无需再对目标域控产生流量即可执行枚举和分析。
      这是保持低调并在断开连接的环境中工作的绝佳方式。
    command: "ldeep cache -d {{backup_directory}} -p {{project_name}} users"