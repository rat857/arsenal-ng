tool: graphw00f
tags: [graphql, security, pentest, fingerprinting, enumeration, reconnaissance, web, discovery]

actions:
  # === Information and Setup ===
  - title: graphw00f - 列出支持的技术
    desc: |
      显示 graphw00f 能够检测的所有 GraphQL 技术和引擎。此命令用于验证某个特定后端引擎是否在工具的检测数据库中。在开始测试前运行它，以了解工具指纹识别能力的范围。
    command: "graphw00f -l"

  # === Discovery and Fingerprinting ===
  - title: graphw00f - 检测 GraphQL 端点
    desc: |
      执行发现扫描，在指定目标 URL 上查找 GraphQL 端点。此模式遍历常见路径以定位 GraphQL API 的托管位置。当你已知目标使用 GraphQL 但不知道确切 URI 时，这是首要步骤。
    command: "graphw00f -d -t {{url}}"

  - title: graphw00f - 指纹识别 GraphQL 引擎
    desc: |
      识别正在使用的具体 GraphQL 引擎实现（如 Apollo、Graphene、Hasura）。指纹识别帮助安全研究人员发现该引擎特有的已知漏洞或错误配置。输出通常包含指向所检测技术攻击面矩阵的链接。
    command: "graphw00f -f -t {{target_url}}"

  - title: graphw00f - 检测与指纹识别组合执行
    desc: |
      在单次命令执行中同时进行发现和指纹识别。这会先搜索 GraphQL 端点，找到后立即尝试识别底层技术。这是对新目标开始 GraphQL 评估最有效的方式。
    command: "graphw00f -d -f -t {{url}}"

  # === Advanced Scanning Options ===
  - title: graphw00f - 使用自定义字典检测
    desc: |
      使用自定义字典而非内置默认列表来搜索 GraphQL 端点。在处理非标准命名约定或高度自定义的环境时特别有用。提供有针对性的字典可显著提高复杂基础设施中发现端点的几率。
    command: "graphw00f -d -t {{url}} -w {{wordlist_path}}"

  - title: graphw00f - 带认证的指纹识别
    desc: |
      在指纹识别或检测过程中发送自定义 HTTP 请求头，如 Authorization 令牌。许多 GraphQL 端点受认证保护，没有正确凭据时会返回 401 或 403 错误。请确保请求头以 Key: Value 对的形式正确格式化，以便服务器接受请求。
    command: "graphw00f -f -t {{target_url}} -H \"{{header_name|Authorization}}: {{header_value}}\""

  - title: graphw00f - 通过代理扫描
    desc: |
      通过指定的 HTTP 或 HTTPS 代理转发 graphw00f 的所有出站流量。通常用于将流量导入 Burp Suite 以进一步手动分析，或隐藏来源 IP。请确保代理 URL 正确包含协议、主机和端口。
    command: "graphw00f -f -t {{target_url}} -p {{proxy_url|http://127.0.0.1:8080}}"

  - title: graphw00f - 导出结果为 CSV
    desc: |
      将指纹识别或发现过程的输出保存到 CSV 文件中以便报告。这便于与其他工具集成，或在渗透测试期间保留发现记录。输出文件将包含目标详情，以及识别出的 GraphQL 引擎（如果成功）。
    command: "graphw00f -f -t {{target_url}} -o {{output_file|results.csv}}"

  # === Connection Tuning ===
  - title: graphw00f - 设置自定义超时和 User-Agent
    desc: |
      调整网络超时设置，并为请求使用自定义 User-Agent 字符串。对于响应缓慢的服务器或高延迟网络连接，增加超时会有所帮助。修改 User-Agent 有助于绕过拦截默认工具签名的简单 WAF 规则。
    command: "graphw00f -f -t {{target_url}} -T {{timeout_seconds|10}} -u \"{{user_agent|Mozilla/5.0}}\""

  - title: graphw00f - 禁用重定向跟随
    desc: |
      在扫描过程中阻止工具跟随 HTTP 3xx 重定向。当你想分析特定 URL 的精确响应，而不被重定向到登录页或不同域名时，这非常有用。它在具有复杂路由的环境中为侦察阶段提供更多控制。
    command: "graphw00f -f -r -t {{target_url}}"
