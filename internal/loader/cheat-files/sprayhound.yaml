tool: sprayhound
tags: [active-directory, pentest, security, password-spraying, enumeration, exploitation, bloodhound]

actions:
# === BASIC SPRAYING ===
 - title: sprayhound - 使用用户列表的基础喷洒
   desc: |
     使用单个密码对用户列表执行基础密码喷洒。
     此命令连接到指定的域控制器，在尝试喷洒之前检查账户的有效性。
     它是在 Active Directory 环境中识别大型用户群弱密码的标准方式。
     确保你与域控制器的 LDAP 服务有网络连接。
   command: "sprayhound -U {{userfile}} -p {{password}} -dc {{domain_controller}} -d {{domain}}"

 - title: sprayhound - 以小写用户名作为密码喷洒
   desc: |
     尝试使用每个用户自己的小写用户名作为密码登录。
     这是一种常见的配置弱点，用户或管理员将初始密码设置为用户名。
     该工具会自动遍历提供的用户列表并转换字符串。
     在渗透测试的初始访问阶段，此方法通常有效。
   command: "sprayhound -U {{userfile}} --lower -dc {{domain_controller}} -d {{domain}}"

 - title: sprayhound - 以大写用户名作为密码喷洒
   desc: |
     尝试使用每个用户自己的大写用户名作为密码登录。
     与小写攻击类似，它针对糟糕的密码卫生和默认凭据模式。
     它有助于识别可能由自动化脚本使用简单转换创建的账户。
     当标准密码列表无法产生结果时使用。
   command: "sprayhound -U {{userfile}} --upper -dc {{domain_controller}} -d {{domain}}"

# === SAFETY AND LOCKOUT PREVENTION ===
 - title: sprayhound - 带锁定保护阈值的喷洒
   desc: |
     通过定义安全阈值执行喷洒，确保账户不被锁定。
     该工具查询 LDAP 以检查当前的 badPasswordCount，并在剩余尝试次数低于阈值时停止。
     默认情况下，它防止锁定账户，比传统喷洒工具安全得多。
     这对于避免账户锁定是首要要求的隐蔽操作至关重要。
   command: "sprayhound -U {{userfile}} -p {{password}} -t {{threshold|2}} -dc {{domain_controller}} -d {{domain}}"

 - title: sprayhound - 在风险账户上强制喷洒
   desc: |
     启用不安全模式，即使对接近锁定阈值的账户也尝试登录。
     这应极其谨慎使用，因为它显著增加锁定生产账户的风险。
     此处添加 --force 标志以绕过交互式确认提示，实现全自动执行。
     只有在你明确获准在行动期间承担账户锁定风险时才使用。
   command: "sprayhound -U {{userfile}} -p {{password}} --unsafe --force -dc {{domain_controller}} -d {{domain}}"

# === LDAP CONFIGURATION ===
 - title: sprayhound - 使用认证 LDAP 和 SSL 喷洒
   desc: |
     使用特定 LDAP 凭据并通过 SSL 加密通信执行喷洒。
     使用认证的 LDAP 会话允许工具更准确地获取账户元数据和锁定策略。
     -lssl 标志确保 LDAP 流量封装在 TLS（LDAPS）中，这通常是加固的域控制器所要求的。
     当目标环境中禁用匿名 LDAP 绑定时，此方法是必需的。
   command: "sprayhound -U {{userfile}} -p {{password}} -dc {{domain_controller}} -d {{domain}} -lu {{ldap_user}} -lp {{ldap_pass}} -lssl"

 - title: sprayhound - 使用自定义 LDAP 端口和分页大小喷洒
   desc: |
     为非标准配置或大型用户集的环境指定自定义 LDAP 端口和分页大小。
     如果域包含数千个对象，增加 LDAP 分页大小可以加快用户的初始枚举。
     在针对全局编录服务器（端口 3268）或特定 LDAP 实例时很有用。
     确保提供的端口可通过任何中间防火墙访问。
   command: "sprayhound -U {{userfile}} -p {{password}} -dc {{domain_controller}} -lP {{ldap_port|389}} -lpage {{page_size|500}}"

# === NEO4J / BLOODHOUND INTEGRATION ===
 - title: sprayhound - 更新 Neo4j/BloodHound 数据库
   desc: |
     连接到 Neo4j 实例，自动将成功破解的账户标记为 BloodHound 中的 owned。
     这可在 BloodHound 界面中立即直观呈现攻击的影响。
     它自动化数据录入过程，让你专注于路径分析和横向移动。
     该命令需要 Neo4j 主机、端口和凭据来建立连接。
   command: "sprayhound -U {{userfile}} -p {{password}} -dc {{domain_controller}} -nh {{neo4j_host|127.0.0.1}} -nP {{neo4j_port|7687}} -nu {{neo4j_user|neo4j}} -np {{neo4j_pass|neo4j}}"

# === UTILITY ===
 - title: sprayhound - 用于排查问题的详细输出
   desc: |
     以更高的详细级别运行喷洒操作，以调试连接问题或 LDAP 查询。
     -v 或 -vv 标志提供工具在过程每一步所做操作的详细日志。
     如果你遇到 Connection Refused 错误或意外的 LDAP 行为，强烈建议使用。
     它有助于验证工具是否正确解析用户列表和域控制器响应。
   command: "sprayhound -U {{userfile}} -p {{password}} -dc {{domain_controller}} -d {{domain}} -vv"