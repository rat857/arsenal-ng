tool: urlfinder
tags: [recon, reconnaissance, web, discovery, enumeration, urls, pentest]

actions:
  # === BASIC USAGE ===
  - title: urlfinder - 基础域名枚举
    desc: |
      对特定目标域名执行基础 URL 发现。这是侦察中最常见的起点，用于构建端点列表供进一步安全测试。
      它查询各种来源以查找可能仍然活跃或包含敏感数据的已归档或已索引链接。
    command: "urlfinder -d {{domain}}"

  - title: urlfinder - 基于列表的枚举
    desc: |
      同时枚举存储在文本文件中的多个域名的 URL。在对具有多个根域名或子域名的大型攻击面执行侦察时非常高效。
      确保输入文件每行一个域名，以避免解析错误。
    command: "urlfinder -list {{input_file|domains.txt}}"

  # === SOURCE MANAGEMENT ===
  - title: urlfinder - 使用所有数据源的穷尽发现
    desc: |
      使用每个可用数据源查找 URL，显著提高发现的彻底性。虽然这是最全面的模式，但可能比默认配置慢。
      建议在深度侦察阶段使用，此时识别每个可能的端点至关重要。
    command: "urlfinder -d {{domain}} -all"

  - title: urlfinder - 按特定数据源过滤
    desc: |
      将 URL 发现过程限制在 AlienVault 或 CommonCrawl 等特定提供方。通过忽略较慢的数据源或专注于已知对目标覆盖更好的提供方，有助于减少执行时间。
      你可以使用 -ls 参数查看所有可用数据源名称的列表。
    command: "urlfinder -d {{domain}} -s {{sources|alienvault,commoncrawl}}"

  - title: urlfinder - 排除特定数据源
    desc: |
      在发现过程中排除特定提供方。如果某个数据源提供冗余数据或出现高延迟拖慢工具，这会很有用。
      它允许更精简的搜索，同时不失去其他默认数据源的好处。
    command: "urlfinder -d {{domain}} -es {{exclude_sources|waybackarchive}}"

  # === FILTERING AND SCOPE ===
  - title: urlfinder - 基于模式的匹配
    desc: |
      过滤结果，仅包含匹配特定关键字或模式的 URL。例如你可能想隔离与管理接口或购物车相关的 URL。
      可以提供逗号分隔的列表或通过文件提供多个模式。
    command: "urlfinder -d {{domain}} -m {{match_pattern|admin,login,api}}"

  - title: urlfinder - 排除特定模式
    desc: |
      过滤掉匹配特定不需要模式或文件扩展名的 URL。这有助于从结果中移除 CSS 文件、图片或法律政策等噪声。
      使用此参数有助于使输出聚焦于功能性应用端点。
    command: "urlfinder -d {{domain}} -f {{filter_pattern|png,jpg,css,privacy}}"

  - title: urlfinder - 基于字段的作用域限定
    desc: |
      基于域名（dn）、根域名（rdn）或完全限定域名（fqdn）定义发现范围。默认情况下工具使用 rdn 以覆盖子域名，但改为 fqdn 会使搜索更加受限。
      这可以防止工具返回属于可能被链接的外部第三方服务的 URL。
    command: "urlfinder -d {{domain}} -fs {{scope_field|fqdn}}"

  # === OUTPUT MANAGEMENT ===
  - title: urlfinder - 将结果保存到文件
    desc: |
      将发现的 URL 写入特定输出文件，供记录和进一步分析。保存到文件对于在专业渗透测试期间维护审计轨迹至关重要。
      这可以防止终端会话关闭或输出超出缓冲区时数据丢失。
    command: "urlfinder -d {{domain}} -o {{output_file|results.txt}}"

  - title: urlfinder - 结构化 JSONL 输出
    desc: |
      以 JSON Lines 格式生成输出，其中包含每个 URL 的发现来源等详细元数据。这种结构化格式非常适合程序化处理和集成到自动化漏洞扫描流水线。
      输出文件中的每一行都是一个完整的有效 JSON 对象。
    command: "urlfinder -d {{domain}} -j -o {{output_file|results.jsonl}}"

  # === OPTIMIZATION AND AUTOMATION ===
  - title: urlfinder - 自动化静默模式
    desc: |
      以静默模式运行工具，抑制所有横幅和进度信息，仅输出找到的 URL。这在将输出直接管道传递给 httpx 或 nuclei 等命令行工具时特别有用。
      它确保生成的数据流干净，可立即供其他脚本使用。
    command: "urlfinder -d {{domain}} -silent"

  - title: urlfinder - 设置全局限速
    desc: |
      通过设置每秒允许的最大 HTTP 请求数来控制发现速度。这对于避免触发 Web 应用防火墙（WAF）或达到数据提供方的 API 限速非常重要。
      如果你注意到连接超时或被数据源封禁，请使用保守的值。
    command: "urlfinder -d {{domain}} -rl {{rate_limit|10}}"

  - title: urlfinder - 设置枚举超时
    desc: |
      指定枚举过程允许运行的最长时间（分钟）。这可以防止工具在超大域名或慢速数据源上无限挂起。
      对于时间分配严格的自动化工作流，这是一项关键设置。
    command: "urlfinder -d {{domain}} -max-time {{minutes|5}}"