tool: rustscan
tags: [network, scanner, security, pentest, enumeration, port-scanner, fast-scan]

# === SECTION: Basic Scanning ===
actions:
  - title: rustscan - 基础端口扫描
    desc: |
      对指定目标地址或 CIDR 执行基础端口扫描。
      这是侦察的默认起点，可快速发现开放端口。
      默认情况下，它会扫描全部 65535 个端口，并将发现的开放端口传递给 Nmap 进行默认脚本扫描。
      它速度极快，通常根据网络状况在几秒内完成。
    command: "rustscan -a {{target}}"
    
  - title: rustscan - 从文件扫描多个目标
    desc: |
      扫描换行分隔文件中指定的目标列表。
      这对于需要扫掠多个子网或主机的内部网络渗透测试非常有用。
      它会聚合所有指定地址的开放端口。
      确保你的批量大小和网络容量能够处理此命令产生的大量流量。
    command: "rustscan -a {{file_path|hosts.txt}}"

  - title: rustscan - 扫描前 1000 端口
    desc: |
      仅扫描最常见的前 1000 个端口，而不是全部 65535 个端口范围。
      当你在时间或网络隐蔽性要求方面受到严格限制时使用。
      它大幅缩短扫描时间，同时仍能捕获 HTTP、SSH 和 FTP 等最常用的服务。
      这可在执行完整的穷尽扫描之前提供快速的初步概览。
    command: "rustscan -a {{target}} --top"

# === SECTION: Port Specification & Filtering ===
  - title: rustscan - 指定自定义端口
    desc: |
      针对特定的逗号分隔端口列表扫描目标。
      当你在大范围网络中搜寻特定服务（例如只查找 Web 服务器或数据库实例）时使用。
      它跳过不必要的扫描，优化时间和网络带宽。
      确保逗号分隔的端口号之间没有空格。
    command: "rustscan -a {{target}} -p {{ports|80,443,8080}}"

  - title: rustscan - 扫描特定端口范围
    desc: |
      使用 start-end 格式定义要扫描的特定端口范围。
      当已知应用程序在某个动态端口范围（例如 RPC 服务）内运行时，这很有用。
      它将扫描引擎完全聚焦于所提供的端口子集。
      这比完整的 65535 端口扫掠噪声更小，但比指定单个端口更全面。
    command: "rustscan -a {{target}} -r {{range|1000-5000}}"

  - title: rustscan - 排除特定端口
    desc: |
      在执行过程中排除特定端口不被扫描。
      当已知某些端口会触发 IPS/IDS 告警或导致遗留系统在收到意外探测时崩溃时，这非常有帮助。
      被排除的端口会被 RustScan 引擎和后续 Nmap 阶段完全忽略。
      以逗号分隔列表的形式提供排除项。
    command: "rustscan -a {{target}} -e {{exclude_ports|21,22,3389}}"

# === SECTION: Performance & Tuning ===
  - title: rustscan - 优化批量大小
    desc: |
      调整批量大小以增加或降低扫描速度。
      更大的批量大小允许更多并发连接，在能力强的网络上可大幅加快扫描。
      但是设置过高可能导致端口遗漏，或超出操作系统打开文件限制时使工具崩溃。
      默认值为 4500，根据你的系统进行调整可能获得更好的结果。
    command: "rustscan -a {{target}} -b {{batch_size|10000}}"

  - title: rustscan - 自动配置 ulimit
    desc: |
      在扫描期间自动提高操作系统的打开文件限制（ulimit）。
      端口扫描需要同时打开数千个套接字，这通常超出默认操作系统限制并导致错误。
      使用此标志可确保 RustScan 能合法地打开足够的文件描述符以维持其高速批量处理。
      某些系统上可能需要 root 或 sudo 权限才能修改此限制。
    command: "rustscan -a {{target}} -u {{ulimit|5000}}"

  - title: rustscan - 调整超时和重试次数
    desc: |
      修改连接超时以及在端口被视为关闭之前的重试次数。
      在通过 VPN 或 Tor 等高延迟连接扫描时至关重要，此时默认的 1500 毫秒超时可能过于激进。
      增加超时和重试次数可提高不稳定网络上的准确性，但代价是整体扫描速度。
      将重试次数设为零会自动修正为一。
    command: "rustscan -a {{target}} -t {{timeout|2000}} --tries {{tries|2}}"

# === SECTION: Advanced Execution & Nmap Integration ===
  - title: rustscan - 传递自定义 Nmap 参数
    desc: |
      使用双短横线分隔符将自定义参数直接传递给底层 Nmap 执行。
      在 RustScan 高速完成开放端口识别后，它会动态地将这些确切端口管道传给 Nmap。
      你可以使用它仅在确认的开放端口上运行激进扫描、全面版本检测或特定 NSE 脚本。
      这是最强大的功能，结合了 RustScan 的速度与 Nmap 的彻底性。
    command: "rustscan -a {{target}} -- -A -sC -sV"

  - title: rustscan - 仅输出可 grep 结果
    desc: |
      仅输出发现的开放端口，而不触发默认的 Nmap 执行。
      在将 RustScan 集成到自动化流水线、CI/CD 工作流或自定义 bash 脚本时非常有用。
      它允许你将干净的输出管道传给其他安全工具进行进一步模糊测试或分析。
      输出格式可以使用标准 Linux 文本处理工具轻松解析。
    command: "rustscan -a {{target}} -g"

  - title: rustscan - UDP 扫描模式
    desc: |
      执行 UDP 端口扫描以识别开放的 UDP 服务。
      此模式专门设计用于查找会发回响应的 UDP 端口，而不是严格依赖标准的 ICMP 端口不可达错误。
      UDP 扫描本质上比 TCP 慢且可靠性较低，因此建议与主要 TCP 扫描分开运行。
      它有助于发现 SNMP、DNS 或 TFTP 等隐藏的基础设施服务。
    command: "rustscan -a {{target}} --udp"

  - title: rustscan - 随机扫描顺序
    desc: |
      随机化端口扫描顺序，而不是按顺序处理。
      顺序扫描通常会触发查找线性端口扫掠的基础防火墙或入侵检测系统。
      随机化端口顺序使扫描更具隐蔽性，并有助于在目标网络栈上分散负载。
      默认行为是串行，但对于规避性评估，随机更好。
    command: "rustscan -a {{target}} --scan-order {{scan_order|random}}"
