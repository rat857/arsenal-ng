tool: dalfox
tags: [web, security, pentest, scanner, xss, enumeration, automation]

actions:
  # === BASIC SCANNING ===
  - title: dalfox - 基本 URL 扫描
    desc: |
      对单个目标 URL 执行标准的 XSS 扫描，是检查特定参数是否存在反射型 XSS 漏洞的最常见入口。
      它使用内置载荷生成器自动分析参数并测试各种 XSS 向量。
    command: "dalfox url {{url}}"

  - title: dalfox - 从文件扫描目标
    desc: |
      从文本文件加载目标 URL 列表进行批量处理。
      当你拥有从 subfinder 或 waybackurls 等侦察工具收集到的大量端点列表时，此方式非常理想，可高效地一次扫描多个目标。
    command: "dalfox file {{file_path}}"

  - title: dalfox - 从标准输入管道扫描
    desc: |
      直接从标准输入（stdin）接收目标 URL。
      可无缝集成到自动化命令行管道中，常用于接在输出 URL 列表的工具之后，实现对发现的 Web 资产的即时扫描。
    command: "echo {{url}} | dalfox pipe"

  # === REQUEST CUSTOMIZATION ===
  - title: dalfox - 携带 POST 数据扫描
    desc: |
      测试 POST 请求体中的参数是否存在 XSS 漏洞。
      对测试表单、登录页面以及不通过 URL 参数传递数据的 API 端点至关重要，数据字符串需按真实 HTTP 请求中的格式正确编写。
    command: "dalfox url {{url}} -d {{post_data|'username=admin&id=1'}} -X POST"

  - title: dalfox - 携带自定义 Cookie 和请求头扫描
    desc: |
      添加自定义 HTTP 请求头或 Cookie，以扫描应用的认证或受保护区域。
      对于绕过基于会话的访问控制或在扫描期间提供所需 API 密钥必不可少，可添加多个请求头以满足复杂的认证要求。
    command: "dalfox url {{url}} -C {{cookie|'sessionid=abc123'}} -H {{header|'Authorization: Bearer token'}}"

  - title: dalfox - 代理支持
    desc: |
      将所有扫描流量经由指定代理服务器（如 Burp Suite 或 OWASP ZAP）转发。
      这样你可以拦截、检查并手动操作 Dalfox 生成的请求，在调试或受限网络环境中尤为有用。
    command: "dalfox url {{url}} --proxy {{proxy_url|'http://127.0.0.1:8080'}}"

  # === ADVANCED SCANNING STRATEGIES ===
  - title: dalfox - 盲 XSS 测试
    desc: |
      指定回调 URL 以检测带外（盲）XSS 漏洞。
      工具会注入在触发时尝试向你的监听器（如 Interactsh 或 XSS Hunter）发起外部请求的载荷，是检测管理面板或后台进程等扫描器不可见处 XSS 的唯一方式。
    command: "dalfox url {{url}} -b {{callback_url}}"

  - title: dalfox - WAF 绕过模式
    desc: |
      启用专门的 WAF 绕过技术以绕过安全过滤。
      此模式会自动降低扫描速度、在请求之间增加延迟并使用单个工作线程以避免触发速率限制，同时使用针对安全设备的低噪声载荷变体。
    command: "dalfox url {{url}} --waf-evasion"

  - title: dalfox - 参数挖掘
    desc: |
      使用基于字典和基于 DOM 的挖掘来发现隐藏或未链接的参数。
      隐藏参数在开发中常被忽视，可能是发现 XSS 的宝库，可提供自定义字典以更好地针对特定应用逻辑或框架。
    command: "dalfox url {{url}} --mining-dict -W {{wordlist|'params.txt'}}"

  - title: dalfox - 无头 DOM XSS 验证
    desc: |
      使用无头浏览器执行深度 DOM XSS 测试并验证反射型发现。
      通过确认注入的载荷是否在真实浏览器环境中实际执行，可显著减少误报，但会占用更多系统资源并拖慢整体扫描速度。
    command: "dalfox url {{url}} --deep-domxss --force-headless-verification"

  # === OUTPUT AND AUTOMATION ===
  - title: dalfox - 保存结果到文件
    desc: |
      将漏洞发现导出到文件以供报告或进一步处理。
      Dalfox 支持纯文本和结构化 JSON 等多种输出格式，JSON 在将发现接入其他工具或自定义报告脚本时尤为有用。
    command: "dalfox url {{url}} -o {{output_file|'results.json'}} --format {{format|'json'}}"

  - title: dalfox - 发现漏洞时触发动作
    desc: |
      在发现漏洞时立即执行特定的 shell 命令或脚本。
      可通过 Slack、Discord 或 Telegram webhook 实现实时通知，是漏洞赏金猎人在长时间扫描中希望第一时间获知结果的强大功能。
    command: "dalfox url {{url}} --found-action {{command_to_run|'./notify.sh'}}"

  - title: dalfox - 存储型 XSS 模式
    desc: |
      使用存储型 XSS 模式测试载荷保存在服务器上并在之后执行的漏洞。
      此模式专注于识别在一个请求中注入的载荷是否会在另一个响应中被反射，对测试个人资料、评论等持久化数据存储功能非常有效。
    command: "dalfox sxss {{url}} {{payload_flags}}"
