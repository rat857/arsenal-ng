tool: recon-ng
tags: [reconnaissance, osint, framework, pentest, enumeration, discovery, information-gathering]

actions:
# === WORKSPACE MANAGEMENT ===
 - title: recon-ng - 使用工作区启动
   desc: |
     在特定工作区上下文中启动框架。
     这对于在不同项目和客户之间保持数据组织有序至关重要。
     如果工作区不存在，recon-ng 会在初始化时自动创建它。
     使用工作区可防止不同评估目标之间的数据污染。
   command: "recon-ng -w {{workspace_name|internal_audit}}"

 - title: recon-ng - 列出工作区
   desc: |
     显示 recon-ng 环境中所有现有的工作区。
     这允许用户查看已创建并填充了数据的项目。
     它是一个有助于在不同行动数据集之间导航的管理命令。
     请注意，切换工作区通常在会话开始时或通过交互式 shell 进行。
   command: "recon-ng -C \"workspaces list\""

# === MARKETPLACE & MODULE MANAGEMENT ===
 - title: recon-ng - 搜索市场
   desc: |
     在在线模块仓库中搜索特定关键字，以查找相关的侦察工具。
     自版本 5 起，recon-ng 使用市场系统，模块必须单独发现和安装。
     用它来查找针对 GitHub、Twitter 或 DNS 提供商等特定平台的模块。
   command: "recon-ng -C \"marketplace search {{keyword|dns}}\""

 - title: recon-ng - 安装模块
   desc: |
     从远程市场下载并安装特定模块到本地框架。
     在模块可以加载或在工作流中执行之前，此步骤是必需的。
     确保你有活跃的互联网连接以访问官方模块仓库。
     指定市场搜索命令提供的完整路径。
   command: "recon-ng -C \"marketplace install {{module_path|recon/domains-hosts/brute_hosts}}\""

 - title: recon-ng - 更新所有模块
   desc: |
     将所有已安装的模块更新到市场中的最新版本。
     定期运行可确保你拥有最新的脚本和错误修复以用于侦察任务。
     在开始新的行动前更新被认为是最佳实践，以避免 API 损坏的问题。
   command: "recon-ng -C \"marketplace install all\""

# === DATABASE OPERATIONS ===
 - title: recon-ng - 插入域名
   desc: |
     将目标域名添加到当前工作区数据库。
     这是许多自动化侦察模块的主要种子或起点。
     大多数 recon 模块会查看 domains 表来确定要扫描的目标。
     在插入目标数据之前，应确认你处于正确的工作区中。
   command: "recon-ng -w {{workspace_name}} -C \"db insert domains {{domain_name|example.com}}\""

 - title: recon-ng - 显示数据库表
   desc: |
     显示工作区数据库中特定表的内容。
     用于查看已发现的信息，如主机、联系人、位置或凭据。
     它有助于测试者跟踪进度并查看目前已成功收集到哪些信息。
   command: "recon-ng -w {{workspace_name}} -C \"db show {{table_name|hosts}}\""

# === MODULE EXECUTION & CONFIGURATION ===
 - title: recon-ng - 运行特定模块
   desc: |
     针对当前工作区中存储的数据加载并执行特定模块。
     这是执行 DNS 暴力破解或搜索引擎抓取等自动化侦察任务的核心功能命令。
     模块会根据其内部逻辑自动从数据库提取相关目标。
   command: "recon-ng -w {{workspace_name}} -C \"modules load {{module_path|recon/domains-hosts/google_site_web}} ; run\""

 - title: recon-ng - 设置模块选项
   desc: |
     在模块执行之前配置其特定参数。
     用于定义自定义词表、切换详细输出或设置扫描的源要求。
     这些选项仅应用于当前模块上下文，并持续到模块重新加载或会话结束。
   command: "recon-ng -C \"modules load {{module_path}} ; options set {{option_name|SOURCE}} {{value}} ; run\""

 - title: recon-ng - 添加 API 密钥
   desc: |
     存储 Shodan、Censys 或 FullContact 等外部服务的 API 密钥。
     许多高质量的 OSINT 模块需要这些密钥来与第三方 API 交互并获取数据。
     密钥会全局存储，一旦添加到框架后即可在所有工作区中使用。
   command: "recon-ng -C \"keys add {{key_name|shodan_api}} {{key_value}}\""

# === AUTOMATION & REPORTING ===
 - title: recon-ng - 执行资源文件
   desc: |
     运行存储在纯文本文件中的一系列 recon-ng 命令。
     这对于自动化重复工作流或建立标准化侦察流水线非常有效。
     它可以提供一致的结果，并避免手动输入每条单独的命令而节省时间。
   command: "recon-ng -r {{resource_file|setup.rc}}"

 - title: recon-ng - 生成 HTML 报告
   desc: |
     将工作区数据库中收集的数据导出为结构化的 HTML 报告。
     它提供侦察阶段发现的所有主机、泄露的电子邮件和其他元数据的可读摘要。
     在尝试运行此命令之前，确保已从市场安装 reporting/html 模块。
   command: "recon-ng -w {{workspace_name}} -C \"modules load reporting/html ; options set FILENAME {{output_path|/tmp/report.html}} ; options set CUSTOMER {{customer_name}} ; run\""