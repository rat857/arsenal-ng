tool: changeme
tags: [pentest, security, enumeration, exploitation, authentication, vulnerability-scanner]

actions:
  # === BASIC SCANNING ===
  - title: changeme.py - 基础 HTTP 扫描
    desc: |
      使用默认 HTTP 协议对单个目标执行基础扫描。
      该命令是识别使用默认凭据的基于 Web 的管理接口的主要方式。
      强烈建议用于本地网络或 Web 服务器的初始侦察。
      注意除非指定其他协议，此模式仅检查 HTTP。
    command: "changeme.py {{target}}"

  - title: changeme.py - 扫描所有协议
    desc: |
      启用对所有受支持协议的扫描，包括 HTTP、SSH 及其他。
      通过同时测试多个服务，提供对目标更全面的安全审计。
      当你希望确保没有常见服务留下不安全的默认设置时使用。
      请注意这可能会增加扫描所需的网络流量与时间。
    command: "changeme.py --all {{target}}"

  - title: changeme.py - 按设备类别扫描
    desc: |
      将凭据测试限制在特定设备类别，例如摄像头或路由器。
      通过仅使用与目标设备类型相关的凭据，优化扫描过程。
      当你已通过其他侦察方法识别出设备类型时特别有用。
      常见类别包括 "camera"、"printer" 或 "voip"。
    command: "changeme.py --category {{category|camera}} {{target}}"

  # === ENUMERATION & FINGERPRINTING ===
  - title: changeme.py - 仅指纹识别
    desc: |
      识别目标设备或服务类型，而不尝试任何凭据登录。
      这是一种"安全"模式，有助于绘制网络环境，而没有账户锁定的风险。
      在任务早期阶段使用它，静默收集信息。
      它根据指纹数据库返回工具认为目标是什么的元数据。
    command: "changeme.py --fingerprint {{target}}"

  - title: changeme.py - 转储凭据
    desc: |
      将工具数据库中加载的所有凭据打印到控制台。
      这对于验证工具当前正在检查哪些默认用户名与密码很有用。
      你可以用它人工审计凭据列表，或验证是否覆盖了特定厂商。
      该命令不需要目标，因为它仅显示内部工具数据。
    command: "changeme.py --dump"

  # === TARGETING & INTEGRATION ===
  - title: changeme.py - 通过 Shodan 查询扫描
    desc: |
      根据特定搜索查询直接从 Shodan 获取目标并执行扫描。
      这允许自动识别并测试使用默认凭据的互联网暴露设备。
      你必须使用 --shodan_key 标志提供有效的 Shodan API 密钥才能运行。
      请负责任地使用此功能，因为它会与面向公众的基础设施交互。
    command: "changeme.py --shodan_query \"{{query|netcam}}\" --shodan_key {{api_key}}"

  - title: changeme.py - 指定协议选择
    desc: |
      手动指定要对目标测试哪些协议。
      当你确切知道哪些端口开放、并想避免不必要的连接尝试时很有用。
      协议应以逗号分隔列表提供，例如 "ssh,http"。
      这有助于将工具资源聚焦在最可能的入口点。
    command: "changeme.py --protocols {{protocols|ssh,http}} {{target}}"

  # === PERFORMANCE & OUTPUT ===
  - title: changeme.py - 优化的多线程扫描
    desc: |
      调整并发线程数与连接超时，以加快扫描速度。
      增大线程数可显著加快对大型子网或多个目标的扫描。
      请小心不要将线程数设得过高，否则可能造成网络拥塞或服务不稳定。
      超时值确保工具不会在无响应主机上无限挂起。
    command: "changeme.py --threads {{threads|20}} --timeout {{timeout|5}} {{target}}"

  - title: changeme.py - 将结果导出到文件
    desc: |
      将扫描结果保存到结构化文件格式，以供后续分析或报告。
      工具根据提供的文件扩展名决定格式，支持 JSON、CSV 与 HTML。
      这对于在专业渗透测试期间维护文档至关重要。
      改用 --oa 标志可一次生成全部三种格式。
    command: "changeme.py --output {{filename|results.json}} {{target}}"

  - title: changeme.py - 继续先前的扫描
    desc: |
      继续之前被中断或停止的扫描。
      它使用内部状态避免重新扫描已经处理过的目标。
      强烈建议用于大型网段或慢速连接上的长时间任务。
      请确保在与初始扫描启动时相同的环境中运行命令。
    command: "changeme.py --resume {{target}}"
