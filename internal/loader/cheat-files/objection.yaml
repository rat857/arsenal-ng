tool: objection
tags: [mobile, security, android, ios, pentest, exploration, frida, hooking]

actions:
  # === SETUP AND PATCHING ===

 - title: objection - 修补 Android APK
   desc: |
     使用 Frida gadget 库修补目标 Android APK。此过程通过将 frida-agent 直接嵌入应用，对未 root 的 Android 设备执行运行时分析至关重要。
     该命令会反编译 APK、注入库、修改清单以加载库，然后重新打包。确保你的 PATH 中已安装 apktool 和 jarsigner 等必要依赖。
   command: "objection patchapk --source {{apk_path|base.apk}}"

 - title: objection - 修补 iOS IPA
   desc: |
     使用 FridaGadget dylib 修补 iOS IPA 文件，用于未越狱设备上的插桩。此命令自动完成解包 IPA、注入 dylib 并提供重签名说明的过程。
     这是无法越狱时对 iOS 应用进行黑盒测试的关键步骤。注意应用要在真机上运行需要有效的 mobileprovision 和代码签名身份。
   command: "objection patchipa --source {{ipa_path|app.ipa}} --codesign-signature {{signature_id|ABC123XYZ}}"

 # === SESSION MANAGEMENT ===

 - title: objection - 启动探索会话
   desc: |
     通过连接到 USB 设备上运行的已修补应用来启动新的探索会话。这是进入交互式 REPL 的最常见方式，你可以在其中运行各种运行时命令。
     若应用以特定名称修补，使用 -n 标志指定目标。应用执行通常会在启动时暂停，直到此命令执行。
   command: "objection -n {{gadget_name|Gadget}} start"

 - title: objection - 连接远程设备
   desc: |
     通过网络连接而非默认的 USB 连接到 objection 会话。当移动设备可通过 IP 访问（如通过 Wi-Fi 或在实验环境中）时很有用。
     默认情况下它尝试连接 127.0.0.1:27042，除非提供自定义主机和端口。确保 frida-server 或 gadget 配置为在指定网络接口上监听。
   command: "objection --network --host {{ip_address}} --port {{port|27042}} explore"

 - title: objection - 启动应用
   desc: |
     启动目标应用，而不是附加到已运行的进程。当你需要从第一条指令开始插桩应用时（如绕过早期越狱检测或 SSL pinning 检查），启动是必要的。
     若不想进程等待你手动恢复命令，可添加 --no-pause 标志。
   command: "objection -g {{package_name}} explore --spawn"

 # === FILESYSTEM AND ENVIRONMENT ===

 - title: objection - 列出环境信息
   desc: |
     显示应用的环境变量和重要目录路径。在 iOS 上，这显示应用沙盒内的 Documents、Library 和 Caches 等目录路径。
     在 Android 上，它揭示 files 目录、cache 目录和外部存储路径。这是定位应用存储敏感数据或配置文件位置的基础侦察步骤。
   command: "env"

 - title: objection - 浏览文件系统
   desc: |
     列出应用沙盒当前工作目录中的文件和目录。它提供权限、文件大小和所有权等元数据，类似于标准 Unix 的 ls 命令。
     此命令用于导航应用内部存储并识别值得提取的有趣文件。你可以用 cd 在此命令发现的目录之间移动。
   command: "ls"

 - title: objection - 下载文件
   desc: |
     将文件从移动设备文件系统下载到本地机器进行离线分析。常用于提取 SQLite 数据库、Plist 配置文件或缓存图像。
     第一个参数是设备上的远程文件路径，第二个是本地目标名称。确保你在应用沙盒上下文中对目标文件有读取权限。
   command: "filesystem download {{remote_file}} {{local_destination}}"

 # === IOS SPECIFIC ACTIONS ===

 - title: objection - 读取 iOS Plist
   desc: |
     直接在 REPL 中解析并显示 iOS 属性列表（Plist）文件的内容。iOS 上常用 Plist 存储应用设置、用户偏好，有时还有敏感凭据。
     此命令省去了下载文件并使用外部查看器查看其内容的步骤。它可以自动处理 XML 和二进制 Plist 格式。
   command: "ios plist cat {{plist_file|Info.plist}}"

 - title: objection - 绕过 iOS SSL Pinning
   desc: |
     通过 hook Alamofire 或 AFNetworking 等常见网络库，尝试在 iOS 上禁用 SSL pinning。这是使用 Burp Suite 或 OWASP ZAP 等工具拦截 HTTPS 流量的关键命令。
     它通过在运行时动态修改证书验证方法的返回值来工作。注意若自动脚本失败，自定义 pinning 实现可能需要手动 hook。
   command: "ios sslpinning disable"

 - title: objection - 转储 iOS Keychain
   desc: |
     转储应用可访问的 iOS Keychain 内容。Keychain 是 Apple 设备上密码、密钥和证书的标准安全存储。
     此命令让你看到应用在会话之间持久保存或跨生态系统共享的机密。注意它只显示特定应用授权组可访问的条目。
   command: "ios keychain dump"

 # === ANDROID SPECIFIC ACTIONS ===

 - title: objection - 列出 Android Activity
   desc: |
     枚举 Android 应用清单中声明的所有 Activity。Activity 代表 Android 应用中的不同屏幕或入口点。
     发现未导出或隐藏的 Activity 可能导致发现管理面板或被绕过的认证逻辑。输出提供启动 Intent 或设置 hook 所需的完整类名。
   command: "android hooking list activities"

 - title: objection - 启动 Android Activity
   desc: |
     使用 Android Intent 强制应用启动特定 Activity。可用于访问原本被登录屏幕或复杂工作流锁定的屏幕。
     这是测试 Activity 如何处理意外状态或畸形 Intent 数据的强大技术。使用从 list activities 命令获取的完整类名作为目标。
   command: "android intent launch_activity {{activity_class}}"

 - title: objection - 绕过 Android SSL Pinning
   desc: |
     注入脚本以禁用 Android 上的各种 SSL pinning 实现。它针对 OkHttp3、信任管理器以及多个厂商特定类等常见库。
     这允许测试人员通过本地拦截代理转发应用的网络流量。成功绕过通常要求设备已在其用户存储中安装代理的可信 CA 证书。
   command: "android sslpinning disable"

 # === DATABASE ANALYSIS ===

 - title: objection - 连接 SQLite 数据库
   desc: |
     连接到应用文件系统中的 SQLite 数据库文件。连接后，objection 提供 SQL 命令的子集来探索数据库结构和数据。
     它实际上会下载数据库的临时副本执行查询，对原文件安全。这对审计本地数据存储和查找敏感用户信息非常有效。
   command: "sqlite connect {{database_file|data.sqlite}}"

 - title: objection - 执行 SQLite 查询
   desc: |
     对当前连接的 SQLite 数据库执行原始 SQL 查询。必须先运行 sqlite connect 命令，此功能才在会话中可用。
     用于转储表内容、过滤特定记录或分析数据库 schema。执行写操作时要小心，因为根据会话状态它们可能不会反映回设备。
   command: "sqlite execute query {{sql_query|select * from users;}}"