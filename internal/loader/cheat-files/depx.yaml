tool: depx
tags: [security, supply-chain, audit, malware, pentest, enumeration, dependencies]

actions:
# === INTELLIGENCE FEED & DASHBOARD ===

 - title: depx - 情报仪表盘
   desc: |
     显示近期披露的恶意软件包情报仪表盘。
     该视图提供特定时间窗口内检测到的威胁的概览摘要，默认窗口为最近 3 天，是跟踪 npm、PyPI、Go 等生态供应链攻击的主要方式。
   command: "depx --since {{time_window|3d}}"

 - title: depx - 按生态过滤的订阅流
   desc: |
     查看特定生态系统的恶意软件包过滤列表。
     当你只关心与自身技术栈相关的威胁（如 npm 或 Python）时非常有用，--list 标志将输出简化为每条结果一行便于浏览。
   command: "depx feed -e {{ecosystem|npm}} --list"

# === LOCAL AUDITING ===

 - title: depx - 扫描主目录
   desc: |
     对当前用户的主目录执行广泛审计，检查恶意依赖。
     工具会自动搜索锁文件和项目树（npm、PyPI、Go、Cargo 等），并与本地索引进行比对。
   command: "depx audit"

 - title: depx - 审计特定项目
   desc: |
     扫描特定项目目录或单个 SBOM/锁文件中的已知恶意软件包。
     可指向包含 package-lock.json 的文件夹，或独立的 CycloneDX/SPDX 文件。
   command: "depx audit {{target_path}}"

 - title: depx - 带排除项审计
   desc: |
     扫描项目时忽略已知安全或内部的特定软件包。
     排除文件应包含 ecosystem:package 格式的条目，以避免误报中断你的工作流。
   command: "depx audit {{target_path}} --exclude-pkg {{ignore_file|.depxignore}}"

# === CI/CD & PIPELINE INTEGRATION ===

 - title: depx - CI 门禁审计
   desc: |
     运行依赖审计，一旦发现任何恶意软件包即让构建失败。
     --require-clean 标志确保发现威胁时以非零代码退出，非常适合 CI/CD 管道，配合 JSON 输出可实现自动处理。
   command: "depx audit {{project_path}} --require-clean -j"

 - title: depx - 导出审计报告
   desc: |
     生成 JSON、CSV 和 SARIF 等多种格式的详细安全报告。
     SARIF 导出在将发现接入 GitHub Code Scanning 或其他漏洞管理平台时尤为有用。
   command: "depx audit {{target}} --output {{output_name|report}} --output-format {{format|json,csv}} --sarif-export {{sarif_path|results.sarif}}"

# === GITHUB REPOSITORY AUDITING ===

 - title: depx - 审计 GitHub 仓库
   desc: |
     使用 GitHub Dependency Graph API 扫描公共或私有 GitHub 仓库。
     无需在本地克隆代码即可检查远程项目的恶意依赖，访问私有仓库或避免速率限制需设置 GITHUB_TOKEN 环境变量。
   command: "depx github {{owner_repo|projectdiscovery/depx}}"

 - title: depx - 审计 GitHub 组织
   desc: |
     对特定 GitHub 组织或用户账户下的所有仓库执行批量审计。
     这是安全团队监控整个组织代码库供应链健康状况的关键命令，默认只扫描有限数量的仓库。
   command: "depx github {{org_name}} -n {{limit|100}}"

# === SEARCH & LOOKUP ===

 - title: depx - 搜索恶意软件包
   desc: |
     在本地恶意软件包索引中搜索特定软件包名称或关键词。
     有助于检查你考虑使用的软件包是否有已知的恶意活动历史。
   command: "depx search {{query}}"

 - title: depx - 查询特定软件包
   desc: |
     检查特定软件包名称和生态系统是否被标记为恶意。
     输入格式应为 ecosystem:package_name 以确保查询精确，可立即反馈该软件包在数据库中当前是否被判定为干净或恶意。
   command: "depx {{ecosystem_package|npm:lodash}}"

 - title: depx - 查询安全公告 ID
   desc: |
     通过其 ID（如 MAL ID）检索特定安全公告的详细信息。
     可用于调查威胁的具体情况，如发布日期和恶意代码的性质，需要原始 OSV 记录时可用 --raw 标志。
   command: "depx id {{advisory_id}}"

# === MAINTENANCE ===

 - title: depx - 更新工具与数据库
   desc: |
     将 depx 二进制文件和本地恶意软件包索引更新到最新可用版本。
     定期更新至关重要，因为每天都会发现新的恶意软件包并加入数据库，此命令可确保审计基于最新的威胁情报执行。
   command: "depx update"
