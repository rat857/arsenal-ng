tool: nmapautomator
tags: [network, scanner, pentest, reconnaissance, enumeration, security]

actions:
  # === RECONNAISSANCE & PORT SCANNING ===
  - title: nmapAutomator.sh - 快速端口扫描
    desc: |
      执行快速扫描以识别目标主机上的开放 TCP 端口。这是侦察最常见的起点，通常在 15 秒内完成。
      它旨在在更深入的枚举前快速概览攻击面。
    command: "nmapAutomator.sh --host {{target}} --type Port"

  - title: nmapAutomator.sh - 网络发现
    desc: |
      扫描本地网段以识别所有存活主机。当你在本地网络上并需要梳理可用目标以进行进一步测试时很有用。
      它使用标准主机发现技术，通常约 15 秒完成。
    command: "nmapAutomator.sh --host {{target_ip_range}} --type Network"

  - title: nmapAutomator.sh - 全 65k 端口扫描
    desc: |
      对从 1 到 65535 的整个 TCP 端口范围执行全面扫描。发现开放端口后，会自动在这些特定端口上执行更彻底的服务检测扫描。
      这对发现在非标准或隐藏端口上运行的服务非常有效，快速扫描可能会漏掉它们。
    command: "nmapAutomator.sh --host {{target}} --type Full"

  # === ENUMERATION & VULNERABILITY ANALYSIS ===
  - title: nmapAutomator.sh - 服务脚本扫描
    desc: |
      对所有已识别的开放端口执行 Nmap 默认脚本，收集服务信息。有助于识别软件版本和发现服务中的潜在错误配置。
      此扫描比简单端口检查提供更多深度，通常约需 5 分钟。
    command: "nmapAutomator.sh --host {{target}} --type Script"

  - title: nmapAutomator.sh - UDP 端口扫描
    desc: |
      对目标机器执行开放 UDP 服务扫描。注意此操作需要 sudo 或 root 权限来构造必要的原始数据包。
      UDP 扫描对于发现 DNS、SNMP 或 TFTP 等不使用 TCP 的服务至关重要。
    command: "sudo nmapAutomator.sh --host {{target}} --type UDP"

  - title: nmapAutomator.sh - 漏洞扫描
    desc: |
      运行专门的 Nmap 漏洞脚本，并对发现的服务检查已知 CVE。这是无需手动搜索即可自动识别可利用弱点的关键步骤。
      扫描时长在 5 到 15 分钟之间，取决于服务的复杂度。
    command: "nmapAutomator.sh --host {{target}} --type Vulns"

  - title: nmapAutomator.sh - 建议性侦察
    desc: |
      分析目标的开放端口并建议特定的手动侦察命令。分析后，脚本会提示用户自动执行这些建议的工具以进一步枚举。
      这是通过为正确服务使用正确工具（如对 Web 用 gobuster）来精简工作流程的绝佳方式。
    command: "nmapAutomator.sh --host {{target}} --type Recon"

  # === ADVANCED USAGE & AUTOMATION ===
  - title: nmapAutomator.sh - 全面一体化扫描
    desc: |
      顺序执行每种可用扫描类型，形成目标的完整画像。这包括网络、端口、脚本、全端口、UDP 和漏洞扫描，一次性完成。
      虽然是最彻底的选项，但可能需要长达 30 分钟才能完成。
    command: "nmapAutomator.sh --host {{target}} --type All"

  - title: nmapAutomator.sh - 使用自定义 DNS 和输出扫描
    desc: |
      运行特定扫描类型，同时定义自定义 DNS 服务器和专用输出目录。当目标位于分段网络中或需要为特定项目整理结果时很有用。
      定义输出目录可确保所有日志和 Nmap 文件都被系统性保存。
    command: "nmapAutomator.sh --host {{target}} --type {{scan_type|Recon}} --dns {{dns_server|1.1.1.1}} --output {{output_dir|./results}}"

  - title: nmapAutomator.sh - 远程模式扫描
    desc: |
      以远程模式执行工具，该模式针对跨不同网段的扫描进行了优化。这可以帮助绕过某些本地网络限制或时序问题。
      开始此扫描前确保你与远程主机或网关有稳定的连接。
    command: "nmapAutomator.sh --host {{target}} --type {{scan_type|Basic}} --remote {{remote_mode|yes}}"