tool: arping
tags: [network, scanner, security, pentest, enumeration, discovery, arp]

actions:
# === BASIC USAGE ===
 - title: arping - 基础 ARP ping
   desc: |
     向本地网络上的特定目标 IP 地址发送 ARP 请求。
     即使 ICMP（标准 ping）被阻止，这对于验证主机是否存活并获取其 MAC 地址也很有用。
     注意该工具需要 root 权限才能发送原始数据包，且仅在本地广播域内有效。
   command: "arping -i {{interface|eth0}} {{target_ip}}"

 - title: arping - 指定次数 ping
   desc: |
     在向目标发送指定数量的数据包后停止 arping 进程。
     这可防止命令无限运行，适用于脚本集成或快速连通性检查。
     达到指定次数后，工具会提供已发送与已接收数据包的汇总。
   command: "arping -c {{count|4}} -i {{interface|eth0}} {{target_ip}}"

 - title: arping - 基于超时的 ping
   desc: |
     无论发送了多少数据包，都以秒为单位指定工具退出前的超时时间。
     这在自动化环境中很有用，因为挂起的命令可能阻塞其他进程。
     它确保侦察阶段不超过预定义的时间窗口。
   command: "arping -w {{seconds|5}} -i {{interface|eth0}} {{target_ip}}"

# === ENUMERATION & DETECTION ===
 - title: arping - 重复 IP 检测
   desc: |
     检测网络上是否有多个 MAC 地址对同一 IP 地址作出响应。
     这是识别 IP 地址冲突或潜在 ARP 欺骗攻击的关键检查。
     如果有多个 MAC 地址响应该请求，命令将以错误码退出。
   command: "arping -d -i {{interface|eth0}} {{target_ip}}"

 - title: arping - 声音提示发现
   desc: |
     启用声音提示，每当从目标收到成功回复时发出蜂鸣声。
     当你无法持续查看终端时，这对于硬件排障特别有帮助。
     也可以使用 -e 标志仅在无回复时蜂鸣，以检测间歇性连通问题。
   command: "arping -a -i {{interface|eth0}} {{target_ip}}"

 - title: arping - 用于脚本的原始输出
   desc: |
     仅以原始格式显示每个回复的 MAC 地址或 IP 地址。
     这种精简输出非常适合管道到其他工具或保存到列表以供进一步枚举。
     它移除所有人类可读的元数据，仅保留必要的寻址信息。
   command: "arping -r -i {{interface|eth0}} {{target_ip}}"

# === ADVANCED NETWORKING ===
 - title: arping - 从未配置接口 ping
   desc: |
     使用源 IP 地址 0.0.0.0 发送 ARP 请求。
     这通常用于本地接口尚未分配 IP 地址时，例如 DHCP 的初始阶段。
     它允许在子网中无需有效 IP 即可进行基本网络发现。
   command: "arping -0 -i {{interface|eth0}} {{target_ip}}"

 - title: arping - 发送主动 ARP
   desc: |
     向网络发送主动 ARP 回复，也称为免费 ARP（Gratuitous ARP）。
     它常用于更新其他主机的 ARP 缓存，例如当 IP 地址迁移到不同 MAC 时。
     使用此命令时务必极其谨慎，因为若指向错误地址可能干扰网络流量。
   command: "arping -U -i {{interface|eth0}} {{source_ip}}"

 - title: arping - 伪造源地址
   desc: |
     使用自定义源 IP 与自定义源 MAC 地址发送 ARP 请求。
     这可用于测试目标或防火墙对线路上不同身份的响应方式。
     如果接口不拥有指定的 MAC，你可能需要使用 -p 标志启用混杂模式。
   command: "arping -S {{source_ip}} -s {{source_mac}} -p -i {{interface|eth0}} {{target_ip}}"

 - title: arping - VLAN 标记 ping
   desc: |
     向目标发送包含特定 802.1Q VLAN 标记的 ARP 请求。
     当网络接口连接到中继端口时，这对于测试跨不同 VLAN 网段的连通性至关重要。
     它有助于验证交换机层面的 VLAN 标记与路由配置是否正确。
   command: "arping -V {{vlan_id|10}} -i {{interface|eth0}} {{target_ip}}"
