tool: sherlock
tags: [osint, reconnaissance, security, social-media, usernames, enumeration, investigation]

actions:
  # === BASIC SEARCH ===
  - title: sherlock - 搜索单个用户名
    desc: |
      在大量社交媒体平台和网站上搜索特定用户名。
      这是 Sherlock 的主要功能，用于映射目标的数字足迹并识别关联账户。
      结果显示在终端中，并自动保存到以用户名命名的文本文件。
    command: "sherlock {{username}}"

  - title: sherlock - 搜索多个用户名
    desc: |
      在一次执行中同时搜索多个不同的用户名。
      在调查可能使用名称变体的个人或调查某个群体时，这非常高效。
      每个用户名的结果会存储在当前目录下各自独立的文本文件中。
    command: "sherlock {{username_1}} {{username_2}} {{username_3}}"

  # === OUTPUT MANAGEMENT ===
  - title: sherlock - 将结果导出为 CSV
    desc: |
      生成包含搜索结果的逗号分隔值（CSV）文件。
      此格式非常适合将发现的数据导入电子表格软件或其他自动化 OSINT 工具以进行进一步分析。
      它提供了一种结构化方式来查看用户名在哪些平台上被找到，在哪些平台上未找到。
    command: "sherlock {{username}} --csv"

  - title: sherlock - 将结果导出为 Excel（XLSX）
    desc: |
      将搜索发现保存为现代 Microsoft Excel（xlsx）格式。
      当你需要易于与非技术利益相关方分享或用于正式文档的格式化报告时使用。
      它将发现的 URL 和站点名称组织成清晰、可读的电子表格结构。
    command: "sherlock {{username}} --xlsx"

  - title: sherlock - 指定输出目录
    desc: |
      将所有生成的输出文件重定向到你选择的特定文件夹。
      在为多个用户执行批量搜索时，这特别有助于保持工作区有序。
      如果指定目录不存在，Sherlock 会在保存结果之前尝试创建它。
    command: "sherlock {{username_list}} --folderoutput {{directory_path}}"

  # === FILTERING AND OPTIMIZATION ===
  - title: sherlock - 将搜索限制到特定站点
    desc: |
      将用户名搜索限制在一个或多个特定平台，而不是整个数据库。
      当你只对 Twitter 或 GitHub 等特定网络感兴趣时，这显著减少执行时间并避免噪声。
      可以通过为每个目标平台重复该标志来指定多个站点。
    command: "sherlock {{username}} --site {{site_name|twitter}}"

  - title: sherlock - 包含 NSFW 站点
    desc: |
      在搜索条件中明确包含成人/NSFW 网站。
      默认情况下 Sherlock 会排除这些站点以保持「安全」输出，但它们对于全面调查可能至关重要。
      当需要完整的数字足迹而不考虑内容类别时，使用此标志。
    command: "sherlock {{username}} --nsfw"

  - title: sherlock - 设置自定义请求超时
    desc: |
      调整 Sherlock 等待每个网站响应的最长时间（以秒为单位）。
      默认为 60 秒，但在慢速网络上增加它可以提供帮助，而减小它可以加快扫描速度但有误报风险。
      在处理速率限制或不稳定连接时，这是一个需要调整的重要参数。
    command: "sherlock {{username}} --timeout {{seconds|20}}"

  # === CONNECTIVITY AND ANONYMITY ===
  - title: sherlock - 通过 Tor 路由流量
    desc: |
      通过 Tor 网络路由所有 Web 请求以掩盖你的 IP 地址。
      这在调查期间提供匿名性，并有助于绕过基于 IP 的速率限制或地域封锁。
      请注意，此命令要正常工作需要 Tor 已安装并在系统上运行。
    command: "sherlock {{username}} --tor"

  - title: sherlock - 每个请求使用唯一 Tor 电路
    desc: |
      强制 Sherlock 为每个站点检查请求新的 Tor 电路（新 IP 地址）。
      这是最高级别的匿名性，对实施严格反爬虫措施的平台极为有效。
      由于反复建立新电路的开销，预计性能会显著变慢。
    command: "sherlock {{username}} --unique-tor"

  - title: sherlock - 通过特定代理路由
    desc: |
      使用特定代理服务器而不是直接连接执行搜索。
      支持的协议通常包括 HTTP、HTTPS 和 SOCKS；这可用于通过特定地理区域或企业网关路由流量。
      确保代理 URL 格式正确（例如 socks5://127.0.0.1:1080）。
    command: "sherlock {{username}} --proxy {{proxy_url}}"

  # === ADVANCED WORKFLOW ===
  - title: sherlock - 自动在浏览器中打开结果
    desc: |
      扫描完成后，自动在默认 Web 浏览器中打开每个发现的个人资料 URL。
      这允许你立即手动验证工具找到的账户。
      对出现在许多站点上的用户名使用时要谨慎，因为它可能同时打开数十个浏览器标签页。
    command: "sherlock {{username}} --browse"

  - title: sherlock - 详细调试输出
    desc: |
      启用详细日志记录，以查看每个请求和指标的内部状态。
      这对于排查特定站点失败的原因或确认代理设置是否按预期工作非常有用。
      它提供枚举过程中响应代码和连接尝试的额外上下文。
    command: "sherlock {{username}} --verbose"